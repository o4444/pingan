<style>

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

<body>
<header><div class="hwrap"><div class="logo" onclick="go('home')">🌱 淨零碳陪考小家教 <span class="tag">iPAS</span></div>
<nav><button data-v="home" onclick="go('home')">練習</button><button data-v="mock" onclick="startMock()">模擬考</button><button data-v="tools" onclick="go('tools')">計算工具</button><button data-v="rec" onclick="go('rec')">學習紀錄</button></nav></div><div class="stripe"></div></header>
<main id="app"></main>
<div class="tutor" id="tutor"><div class="tbub" id="tbub"></div><div class="tcol"><img id="timg" alt="安安老師" title="點我收合／展開"><div class="tsw" role="group" aria-label="選擇老師"><button data-g="f" onclick="setTeacher('f')">女老師</button><button data-g="m" onclick="setTeacher('m')">男老師</button></div></div></div>
<script>
// ===== 淨零碳規劃管理師陪考：題目產生器（純邏輯，無 DOM） =====
const R = (a, b, s = 1) => a + s * Math.floor(Math.random() * (Math.floor((b - a) / s + 1e-9) + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const f = (v, d) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
const fmt = (v, d = 0) => Number(f(v, d)).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const log10 = Math.log10;

const ERR = {
  concept: '觀念／公式錯誤',
  unit: '單位換算錯誤',
  math: '數學運算錯誤',
  law: '法規／標準誤判',
  read: '題意判讀錯誤',
  express: '作答表達錯誤'
};

// 數值選項：正解 + 誘答（各自帶錯誤類型）
function numOptions(ans, dists, dec, unit) {
  const show = v => fmt(v, dec) + ' ' + unit;
  const opts = [{ v: ans, text: show(ans), correct: true }];
  const ok = v => isFinite(v) && v > 0 && opts.every(o => o.text !== show(v) && Math.abs(v - o.v) / Math.max(Math.abs(o.v), 1e-9) > 0.03);
  for (const d of dists) { if (opts.length >= 4) break; if (ok(d.v)) opts.push({ v: d.v, text: show(d.v), correct: false, type: d.type, why: d.why }); }
  const fillers = [1.5, 0.6, 2, 0.8, 1.25, 0.4, 3];
  for (const k of fillers) { if (opts.length >= 4) break; const v = ans * k; if (ok(v)) opts.push({ v, text: show(v), correct: false, type: ERR.math, why: '數值計算或位數處理有誤，請分段重算、每一步都寫下單位。' }); }
  return shuffle(opts);
}
function textOptions(correctText, dists) {
  const opts = [{ text: correctText, correct: true }];
  for (const d of dists) { if (opts.length >= 4) break; if (opts.every(o => o.text !== d.text)) opts.push({ text: d.text, correct: false, type: d.type, why: d.why }); }
  return shuffle(opts);
}

// ---------- 30 秒觀念卡 ----------
const UNIT_TABLE = [
  ['1 公噸（t）', '1,000 kg'], ['1 度電', '1 kWh'], ['1 MWh', '1,000 kWh'], ['kgCO₂e/kWh', '= tCO₂e/MWh'],
  ['kg → t', '÷ 1,000'], ['W → kW', '÷ 1,000'], ['每月 → 每年', '× 12'],
  ['碳（C）→ CO₂', '× 44/12'], ['1 張再生能源憑證（T-REC）', '1,000 度（1 MWh）'], ['1 單位碳權／減量額度', '1 tCO₂e'], ['1 萬元', '10,000 元']
];
const GENERIC_CARD = {
  [ERR.math]: '計算機分段算：先乘除後加減，有百分比先換成小數（5% → 0.05）。每一段寫下中間值和單位，最後才四捨五入。',
  [ERR.read]: '讀題三圈：①圈「求什麼、單位是什麼」（kg 還是 t？每月還是全年？）②圈條件（有無扣起徵門檻、是否高碳洩漏）③刪掉用不到的干擾數據。',
  [ERR.express]: '作答四要素：公式 → 代入（含單位）→ 答案 → 單位。碳排放量一律寫成 CO₂e（二氧化碳當量）。'
};

// ================== 產生器 ==================
const G = {};

// ---- 排放量：燃料燃燒（類別 1） ----
const FUELS = [
  { n: '柴油', u: 'L', ef: 2.61, use: '堆高機與緊急發電機' },
  { n: '車用汽油', u: 'L', ef: 2.26, use: '公務車' },
  { n: '天然氣', u: 'm³', ef: 1.88, use: '鍋爐' },
  { n: '液化石油氣（LPG）', u: 'kg', ef: 3.0, use: '員工餐廳爐具' }
];
G.fuel = () => {
  const fu = pick(FUELS), other = pick(FUELS.filter(x => x !== fu)), M = R(800, 6000, 50);
  const yr = M * 12, E = yr * fu.ef / 1000;
  return {
    unit: 'emit', level: 2, title: '排放量｜燃料燃燒',
    stem: `某工廠${fu.use}每月平均使用${fu.n} ${fmt(M)} ${fu.u}。已知${fu.n}排放係數為 ${fu.ef} kgCO₂e/${fu.u}（已含 CH₄、N₂O），${other.n}為 ${other.ef} kgCO₂e/${other.u}。該廠全年${fu.n}燃燒排放量為多少 tCO₂e？`,
    known: [`每月用量 = ${fmt(M)} ${fu.u} → 全年 = ${fmt(yr)} ${fu.u}`, `EF = ${fu.ef} kgCO₂e/${fu.u}`, `${other.n}係數為干擾數據`, '求：全年排放量（tCO₂e）'],
    formula: { expr: '排放量 = 活動數據 × 排放係數', vars: '活動數據：燃料用量；排放係數：每單位燃料排放（kgCO₂e）', cond: '活動數據與係數的單位要對得上；kg ÷ 1,000 = t。', plain: '用了多少燃料 × 每單位燃料會排多少碳，就是排放量。', mnemonic: '「用量乘係數，公斤除千變公噸」' },
    steps: [`全年用量 = ${fmt(M)} × 12 = ${fmt(yr)} ${fu.u}`, `排放量 = ${fmt(yr)} × ${fu.ef} = ${fmt(yr * fu.ef)} kgCO₂e`, `÷ 1,000 = <b>${fmt(E, 2)} tCO₂e</b>`],
    check: `每月約 ${fmt(M * fu.ef / 1000, 2)} t，乘 12 個月 ✔`,
    answer: E, opts: numOptions(E, [
      { v: M * fu.ef / 1000, type: ERR.read, why: '只算了一個月；題目問的是全年，要 × 12。' },
      { v: yr * other.ef / 1000, type: ERR.read, why: `用了${other.n}的係數；那是干擾數據。` },
      { v: yr * fu.ef / 100, type: ERR.unit, why: 'kg 換 t 要 ÷ 1,000，不是 ÷ 100。' }
    ], 2, 'tCO₂e'),
    card: { [ERR.concept]: '排放係數法是盤查最常用的量化方法：排放量 = 活動數據 × 排放係數（× GWP）。燃料燃燒屬 ISO 14064-1 類別 1（直接排放）。', [ERR.unit]: '係數單位是 kgCO₂e／單位燃料，相乘後得到 kg，要 ÷ 1,000 才是公噸。' }
  };
};

// ---- 排放量：外購電力（類別 2） ----
G.elec = () => {
  const ef = pick([0.474, 0.467, 0.466]), mwh = pick([0, 1]);
  const kwh = R(120, 980, 10) * 1000, E = kwh * ef / 1000;
  const shown = mwh ? `${fmt(kwh / 1000)} MWh` : `${fmt(kwh)} 度`;
  return {
    unit: 'emit', level: 1, title: '排放量｜外購電力',
    stem: `某辦公大樓全年外購電力 ${shown}，電力排碳係數採 ${ef} kgCO₂e/度。依地點基礎法，其外購電力間接排放量為多少 tCO₂e？`,
    known: [mwh ? `用電 = ${fmt(kwh / 1000)} MWh = ${fmt(kwh)} 度` : `用電 = ${fmt(kwh)} 度（kWh）`, `EF = ${ef} kgCO₂e/度 = ${ef} tCO₂e/MWh`, '求：排放量（tCO₂e）'],
    formula: { expr: '排放量 = 用電量 × 電力排碳係數', vars: '用電量：度（kWh）；係數：kgCO₂e/度', cond: '1 度 = 1 kWh；kgCO₂e/kWh 與 tCO₂e/MWh 數值相同。', plain: '用了幾度電 × 每度電排多少碳。', mnemonic: '「度乘係數得公斤，MWh 乘係數直接得公噸」' },
    steps: mwh ? [`${fmt(kwh / 1000)} MWh × ${ef} tCO₂e/MWh = <b>${fmt(E, 2)} tCO₂e</b>`] : [`${fmt(kwh)} 度 × ${ef} = ${fmt(kwh * ef)} kgCO₂e`, `÷ 1,000 = <b>${fmt(E, 2)} tCO₂e</b>`],
    check: '每 1,000 度約排 0.47 t ✔',
    answer: E, opts: numOptions(E, [
      { v: kwh * ef, type: ERR.unit, why: '算出來是 kg，忘了 ÷ 1,000 換成公噸。' },
      { v: kwh * ef / 1e6, type: ERR.unit, why: '多除了一次 1,000；kgCO₂e/kWh 等於 tCO₂e/MWh。' },
      { v: kwh / ef / 1000, type: ERR.concept, why: '係數要「乘」，不是「除」。' }
    ], 2, 'tCO₂e'),
    card: { [ERR.concept]: '外購電力屬 ISO 14064-1 類別 2（輸入能源間接排放）＝ GHG Protocol 範疇二。地點基礎法用電網平均係數；市場基礎法可反映綠電、憑證等契約工具。', [ERR.law]: '經濟部能源署公布 114 年度台電電力排碳係數 0.467 kgCO₂e/度，另有供企業盤查用的產業電力排碳係數 0.466。考題以題目給定值為準。' }
  };
};

// ---- 排放量：冷媒逸散 ----
const REFS = [{ n: 'R-134a', g: 1300 }, { n: 'R-410A', g: 1924 }, { n: 'R-32', g: 677 }, { n: 'R-404A', g: 3943 }];
G.refrig = () => {
  const rf = pick(REFS), n = R(2, 12), q = pick([3.5, 5, 8, 12, 15, 20]), rate = pick([2, 3, 5, 8, 10]);
  const kg = n * q * rate / 100, E = kg * rf.g / 1000;
  return {
    unit: 'emit', level: 3, title: '排放量｜冷媒逸散',
    stem: `某廠有 ${n} 台冰水主機／空調，每台冷媒 ${rf.n} 填充量 ${q} kg，年逸散率以 ${rate}% 估算，${rf.n} 之 GWP 為 ${fmt(rf.g)}。全年冷媒逸散排放量為多少 tCO₂e？`,
    known: [`總填充量 = ${n} × ${q} = ${fmt(n * q, 1)} kg`, `逸散率 = ${rate}% = ${rate / 100}`, `GWP = ${fmt(rf.g)}`, '求：tCO₂e'],
    formula: { expr: '排放量 = 填充量 × 台數 × 逸散率 × GWP', vars: 'GWP：全球暖化潛勢（相對 CO₂ 的倍數）', cond: '百分比先換小數；kg × GWP 得 kgCO₂e，再 ÷ 1,000。', plain: '先算漏掉幾公斤冷媒，再乘 GWP 換成「等於多少公斤 CO₂」。', mnemonic: '「漏多少 × 有多毒（GWP）」' },
    steps: [`逸散量 = ${n} × ${q} × ${rate / 100} = ${f(kg, 3)} kg`, `× GWP ${fmt(rf.g)} = ${fmt(kg * rf.g, 1)} kgCO₂e`, `÷ 1,000 = <b>${fmt(E, 3)} tCO₂e</b>`],
    check: `冷媒 GWP 很高，漏一點點也會有可觀的 CO₂e ✔`,
    answer: E, opts: numOptions(E, [
      { v: kg, type: ERR.concept, why: '只算出漏掉的冷媒公斤數，沒有乘 GWP 換成 CO₂e。' },
      { v: n * q * rate * rf.g / 1000, type: ERR.unit, why: `逸散率 ${rate}% 要換成 ${rate / 100}，不能直接乘 ${rate}。` },
      { v: q * rate / 100 * rf.g / 1000, type: ERR.read, why: `只算了 1 台；題目有 ${n} 台。` },
      { v: kg * rf.g, type: ERR.unit, why: 'kgCO₂e 忘了 ÷ 1,000 換成公噸。' }
    ], 3, 'tCO₂e'),
    card: { [ERR.concept]: '冷媒（HFCs）逸散屬類別 1 的逸散排放。HFCs 是 7 種管制溫室氣體之一，GWP 動輒上千，所以盤查一定要算。' }
  };
};

// ---- 排放量：GWP 換算 ----
G.gwp = () => {
  const gw = pick([{ v: 'AR5', ch4: 28, n2o: 265 }, { v: 'AR6', ch4: 27.9, n2o: 273 }]);
  const c = R(5, 80) / 2, n = R(1, 30) / 10;
  const E = c * gw.ch4 + n * gw.n2o;
  return {
    unit: 'emit', level: 2, title: '排放量｜GWP 換算 CO₂e',
    stem: `某廢水處理場全年排放 CH₄ ${c} 公噸、N₂O ${n} 公噸。若採 IPCC ${gw.v} 之 GWP（CH₄ = ${gw.ch4}、N₂O = ${gw.n2o}），合計為多少 tCO₂e？`,
    known: [`CH₄ = ${c} t，GWP = ${gw.ch4}`, `N₂O = ${n} t，GWP = ${gw.n2o}`, '求：tCO₂e'],
    formula: { expr: 'CO₂e = Σ（各氣體質量 × 該氣體 GWP）', vars: 'GWP：100 年全球暖化潛勢', cond: '各氣體要用自己的 GWP；同一份清冊 GWP 版本要一致。', plain: '把不同氣體都換成「等於多少噸 CO₂」再加總。', mnemonic: '「各乘各的 GWP，再相加」' },
    steps: [`CH₄：${c} × ${gw.ch4} = ${fmt(c * gw.ch4, 1)}`, `N₂O：${n} × ${gw.n2o} = ${fmt(n * gw.n2o, 1)}`, `合計 = <b>${fmt(E, 1)} tCO₂e</b>`],
    check: '換算後一定比原本質量大很多 ✔',
    answer: E, opts: numOptions(E, [
      { v: c * gw.n2o + n * gw.ch4, type: ERR.concept, why: 'CH₄ 與 N₂O 的 GWP 套反了。' },
      { v: c + n, type: ERR.concept, why: '直接把噸數相加，沒乘 GWP，不是 CO₂e。' },
      { v: (c + n) * gw.ch4, type: ERR.concept, why: '兩種氣體都用了 CH₄ 的 GWP。' }
    ], 1, 'tCO₂e'),
    card: { [ERR.concept]: 'GWP 是以 CO₂ = 1 為基準的倍數。常見（AR5）：CH₄ 28、N₂O 265、SF₆ 23,500。不同 AR 版本數值不同，考題以題目給定為準。' }
  };
};

// ---- 排放量：含碳量換算 CO₂ ----
G.carbon = () => {
  const M = R(5, 60) * 100, c = R(55, 80), ox = pick([100, 98, 99]);
  const E = M * c / 100 * ox / 100 * 44 / 12;
  return {
    unit: 'emit', level: 3, title: '排放量｜含碳量換算 CO₂',
    stem: `某廠全年燃燒煤炭 ${fmt(M)} 公噸，煤炭含碳率 ${c}%，碳氧化率 ${ox}%。以質量平衡法估算，全年 CO₂ 排放量為多少公噸？（C = 12、O = 16）`,
    known: [`燃料量 = ${fmt(M)} t`, `含碳率 = ${c}%`, `氧化率 = ${ox}%`, 'CO₂ 分子量 44、C 原子量 12', '求：CO₂（t）'],
    formula: { expr: 'CO₂ = 燃料量 × 含碳率 × 氧化率 × 44/12', vars: '44/12：每 1 t 碳完全燃燒生成 3.67 t CO₂', cond: '百分比換成小數；氧化率 100% 時可省略。', plain: '先算有多少碳被燒掉，碳變成 CO₂ 會「變重」3.67 倍（多了兩個氧）。', mnemonic: '「碳變二氧化碳，乘四十四除十二」' },
    steps: [`含碳量 = ${fmt(M)} × ${c / 100} = ${fmt(M * c / 100, 1)} t C`, `被氧化的碳 = × ${ox / 100} = ${fmt(M * c / 100 * ox / 100, 1)} t C`, `CO₂ = × 44/12 = <b>${fmt(E, 1)} t</b>`],
    check: 'CO₂ 質量應大於碳的質量（約 3.67 倍）✔',
    answer: E, opts: numOptions(E, [
      { v: M * c / 100 * ox / 100, type: ERR.concept, why: '只算到碳的質量，忘了 × 44/12 換成 CO₂。' },
      { v: M * c / 100 * ox / 100 * 12 / 44, type: ERR.concept, why: '比例放反：碳變 CO₂ 要 × 44/12，不是 × 12/44。' },
      { v: M * ox / 100 * 44 / 12, type: ERR.read, why: '漏乘含碳率，把整批煤當成純碳。' }
    ], 1, 't'),
    card: { [ERR.concept]: '三種量化方法：排放係數法（最常用）、質量平衡法（依碳含量推算）、直接監測法（連續監測煙道）。C + O₂ → CO₂，12 → 44。' }
  };
};

// ---- 碳定價：碳費 ----
G.fee = () => {
  const E = R(30, 300) * 1000, cs = pick(['gen', 'pref', 'hcl']);
  const K = 25000, rate = pick([50, 100]);
  let fee, desc, steps, dists;
  const toW = v => v / 10000;
  if (cs === 'gen') {
    fee = (E - K) * 300; desc = '未提出自主減量計畫，適用一般費率 300 元/tCO₂e';
    steps = [`收費排放量 = ${fmt(E)} − 25,000 = ${fmt(E - K)} t`, `碳費 = ${fmt(E - K)} × 300 = ${fmt(fee)} 元 = <b>${fmt(toW(fee), 1)} 萬元</b>`];
    dists = [{ v: toW(E * 300), type: ERR.law, why: '忘了扣除起徵門檻 K 值 2.5 萬公噸。' }, { v: toW((E - K) * 100), type: ERR.law, why: '誤用優惠費率；未提自主減量計畫只能適用一般費率 300 元。' }, { v: toW((E - K) * 300 * 0.2), type: ERR.law, why: '排放量調整係數 0.2 只給高碳洩漏風險且自主減量計畫獲核定者。' }];
  } else if (cs === 'pref') {
    fee = (E - K) * rate; desc = `非高碳洩漏風險事業，自主減量計畫經核定，適用優惠費率 ${rate} 元/tCO₂e`;
    steps = [`收費排放量 = ${fmt(E)} − 25,000 = ${fmt(E - K)} t`, `碳費 = ${fmt(E - K)} × ${rate} = ${fmt(fee)} 元 = <b>${fmt(toW(fee), 1)} 萬元</b>`];
    dists = [{ v: toW(E * rate), type: ERR.law, why: '非高碳洩漏風險事業仍可扣除 K 值 2.5 萬公噸。' }, { v: toW((E - K) * 300), type: ERR.read, why: `題目說自主減量計畫已核定，適用優惠費率 ${rate} 元，不是 300 元。` }, { v: toW((E - K) * rate * 0.2), type: ERR.law, why: '非高碳洩漏風險事業不適用排放量調整係數 0.2。' }];
  } else {
    fee = E * 0.2 * rate; desc = `屬高碳洩漏風險事業，自主減量計畫經核定，適用優惠費率 ${rate} 元/tCO₂e，排放量調整係數 0.2`;
    steps = [`高碳洩漏＋自主減量：收費排放量 = 排放量 × 調整係數（不扣 K 值）`, `= ${fmt(E)} × 0.2 = ${fmt(E * 0.2)} t`, `碳費 = ${fmt(E * 0.2)} × ${rate} = ${fmt(fee)} 元 = <b>${fmt(toW(fee), 1)} 萬元</b>`];
    dists = [{ v: toW((E - K) * 0.2 * rate), type: ERR.law, why: '高碳洩漏風險事業適用調整係數時，不再扣除 K 值。' }, { v: toW(E * rate), type: ERR.law, why: '漏乘排放量調整係數 0.2。' }, { v: toW(E * 0.2 * 300), type: ERR.read, why: `自主減量計畫已核定，費率用 ${rate} 元，不是 300 元。` }];
  }
  return {
    unit: 'price', level: 3, title: '碳定價｜碳費計算',
    stem: `某製造業工廠年溫室氣體排放量 ${fmt(E)} tCO₂e（已扣除可抵減部分），${desc}。依碳費收費辦法，應繳碳費約多少萬元？（起徵門檻 K 值 2.5 萬公噸）`,
    known: [`排放量 = ${fmt(E)} t`, desc, 'K 值 = 25,000 t', '求：碳費（萬元）'],
    formula: { expr: '碳費 = 收費排放量 × 徵收費率', vars: '一般：收費排放量 = 排放量 − K；高碳洩漏＋自主減量：= 排放量 × 調整係數', cond: '一般費率 300 元；優惠費率 A 50 元、B 100 元；調整係數初期 0.2。', plain: '先判斷是哪一種身分，決定「扣不扣 K 值、乘不乘 0.2、用哪個費率」，再相乘。', mnemonic: '「一般扣 K 乘 300，高洩漏乘 0.2 不扣 K」' },
    steps,
    check: '1 萬元 = 10,000 元；先算出元再換萬元 ✔',
    answer: toW(fee), opts: numOptions(toW(fee), dists, 1, '萬元'),
    card: { [ERR.law]: '碳費收費辦法：收費對象為年排放量 2.5 萬公噸 CO₂e 以上的電力、燃氣供應業及製造業。一般：(排放量 − 2.5 萬) × 300；非高碳洩漏＋自主減量：(排放量 − 2.5 萬) × 優惠費率（50 或 100）；高碳洩漏＋自主減量：排放量 × 0.2 × 優惠費率。（以環境部最新公告為準）' }
  };
};

// ---- 碳定價：碳中和所需碳權 ----
G.offset = () => {
  const s1 = R(8, 60) * 100, s2 = R(10, 90) * 100, p = pick([10, 15, 20, 25, 30]);
  const tot = s1 + s2, need = tot * (1 - p / 100);
  return {
    unit: 'price', level: 2, title: '碳定價｜碳中和抵銷量',
    stem: `某公司盤查範疇一 ${fmt(s1)} tCO₂e、範疇二 ${fmt(s2)} tCO₂e。今年透過節能與綠電使範疇一、二合計再減少 ${p}%，剩餘排放擬以碳權抵銷宣告範疇一、二碳中和。至少需註銷多少單位碳權？（1 單位 = 1 tCO₂e）`,
    known: [`範疇一 + 二 = ${fmt(tot)} t`, `減量 ${p}% → 剩 ${100 - p}%`, '求：碳權單位數'],
    formula: { expr: '所需碳權 = 剩餘排放量 = (範疇一 + 範疇二) × (1 − 減量率)', vars: '1 單位碳權 = 1 tCO₂e', cond: '先減量，再抵銷剩下的；碳權要註銷（除役）才算數。', plain: '能自己減的先減，減不掉的才用碳權補。', mnemonic: '「先減後抵，抵的是剩下的」' },
    steps: [`合計 = ${fmt(s1)} + ${fmt(s2)} = ${fmt(tot)} t`, `剩餘 = ${fmt(tot)} × ${(1 - p / 100).toFixed(2)} = <b>${fmt(need)} 單位</b>`],
    check: `所需碳權應小於原排放量 ${fmt(tot)} t ✔`,
    answer: need, opts: numOptions(need, [
      { v: tot, type: ERR.read, why: '沒扣掉已經減量的部分。' },
      { v: tot * p / 100, type: ERR.concept, why: '算成「減掉的量」；要抵銷的是剩下的排放。' },
      { v: s1 * (1 - p / 100), type: ERR.read, why: '只算了範疇一；題目宣告範疇一、二碳中和。' }
    ], 0, '單位'),
    card: { [ERR.concept]: '碳中和（ISO 14068-1）允許以碳權抵銷剩餘排放；淨零則強調先深度減量，剩餘排放以「移除」中和。兩者不同。' }
  };
};

// ---- 碳定價：市場基礎法（再生能源憑證） ----
G.trec = () => {
  const ef = pick([0.474, 0.467, 0.466]), mwh = R(500, 5000, 50), n = R(1, Math.floor(mwh / 100)) * 50;
  const E = (mwh - n) * ef, loc = mwh * ef;
  return {
    unit: 'price', level: 3, title: '碳定價｜市場基礎法與憑證',
    stem: `某廠全年用電 ${fmt(mwh)} MWh，另購入並註銷國家再生能源憑證（T-REC）${fmt(n)} 張。若剩餘電力以 ${ef} kgCO₂e/度 計算，市場基礎法之範疇二排放量為多少 tCO₂e？`,
    known: [`用電 = ${fmt(mwh)} MWh`, `T-REC ${fmt(n)} 張 = ${fmt(n)} MWh（1 張 = 1,000 度）`, `EF = ${ef} tCO₂e/MWh`, '求：市場基礎法排放量'],
    formula: { expr: '市場基礎法 = (總用電 − 憑證電量) × 係數', vars: '1 張 T-REC = 1,000 度 = 1 MWh', cond: '地點基礎法不扣憑證；兩種方法應雙軌揭露。', plain: '有憑證證明是綠電的部分算零排放，其他照係數算。', mnemonic: '「一張憑證一千度，市場法先扣再乘」' },
    steps: [`憑證電量 = ${fmt(n)} × 1 MWh = ${fmt(n)} MWh`, `剩餘電力 = ${fmt(mwh)} − ${fmt(n)} = ${fmt(mwh - n)} MWh`, `排放 = ${fmt(mwh - n)} × ${ef} = <b>${fmt(E, 1)} tCO₂e</b>`, `（地點基礎法 = ${fmt(loc, 1)} tCO₂e）`],
    check: '市場基礎法結果應小於地點基礎法 ✔',
    answer: E, opts: numOptions(E, [
      { v: loc, type: ERR.concept, why: '這是地點基礎法結果；市場基礎法要扣除憑證電量。' },
      { v: (mwh - n / 1000) * ef, type: ERR.unit, why: '把 1 張憑證當成 1 度；1 張 T-REC = 1,000 度。' },
      { v: n * ef, type: ERR.read, why: '算成憑證那部分的排放；應計算未被憑證涵蓋的用電。' },
      { v: (mwh - n) * ef * 1000, type: ERR.unit, why: 'MWh × kgCO₂e/度 直接得到公噸，不用再 × 1,000。' },
      { v: (mwh - n) / ef, type: ERR.concept, why: '係數要「乘」，不是「除」。' }
    ], 1, 'tCO₂e'),
    card: { [ERR.concept]: 'GHG Protocol 範疇二指引要求雙軌揭露：地點基礎（location-based，電網平均係數）與市場基礎（market-based，反映綠電契約、憑證）。', [ERR.unit]: '國家再生能源憑證 1 張代表 1,000 度（1 MWh）再生能源電力。' }
  };
};

// ---- 減量：碳密集度 ----
G.intensity = () => {
  const P1 = R(20, 80) * 1000, I1 = R(300, 900) / 1000, P2 = Math.round(P1 * R(105, 140) / 100 / 100) * 100;
  const I2 = I1 * R(75, 95) / 100, E1 = P1 * I1, E2 = P2 * I2;
  const drop = (E1 / P1 - E2 / P2) / (E1 / P1) * 100;
  return {
    unit: 'target', level: 3, title: '減量｜碳密集度變化',
    stem: `某工廠 去年排放 ${fmt(E1)} tCO₂e、產量 ${fmt(P1)} 噸；今年排放 ${fmt(E2)} tCO₂e、產量 ${fmt(P2)} 噸。今年「每噸產品碳排放（碳密集度）」較去年下降多少 %？`,
    known: [`去年：E = ${fmt(E1)}、P = ${fmt(P1)}`, `今年：E = ${fmt(E2)}、P = ${fmt(P2)}`, '求：碳密集度下降率（%）'],
    formula: { expr: '下降率 = (I去年 − I今年) ÷ I去年 × 100%，I = 排放量 ÷ 產量', vars: 'I：碳密集度（tCO₂e/噸產品）', cond: '分母用「基準（去年）」；密集度是相對值，不是總量。', plain: '總排放可能因產量變大而上升，但每噸產品排得更少，就是效率變好。', mnemonic: '「先除產量，再比基準」' },
    steps: [`I去年 = ${fmt(E1)} ÷ ${fmt(P1)} = ${f(E1 / P1, 4)}`, `I今年 = ${fmt(E2)} ÷ ${fmt(P2)} = ${f(E2 / P2, 4)}`, `下降率 = (${f(E1 / P1, 4)} − ${f(E2 / P2, 4)}) ÷ ${f(E1 / P1, 4)} = <b>${f(drop, 1)} %</b>`],
    check: E2 > E1 ? '總排放量上升，但密集度下降，兩者可以同時成立 ✔' : '密集度下降率應落在 0～100% ✔',
    answer: drop, opts: numOptions(drop, [
      { v: Math.abs(E1 - E2) / E1 * 100, type: ERR.concept, why: '比的是總排放量；題目問的是每噸產品的碳密集度。' },
      { v: (E1 / P1 - E2 / P2) / (E2 / P2) * 100, type: ERR.math, why: '分母要用基準年（去年）的密集度。' },
      { v: (P2 - P1) / P1 * 100, type: ERR.read, why: '這是產量成長率，不是密集度變化。' }
    ], 1, '%'),

// ---- 減量：SBTi 線性減量目標 ----
G.target = () => {
  const E0 = R(20, 200) * 500, by = pick([2020, 2021, 2022, 2023]), n = pick([7, 8, 9, 10]), ty = by + n, r = pick([4.2, 4.2, 2.5]);

  return {
    unit: 'target', level: 2, title: '減量｜科學基礎減量目標',
    stem: `某企業以 ${by} 年為基準年，範疇一、二排放 ${fmt(E0)} tCO₂e。若依 ${r === 4.2 ? '1.5°C 路徑' : '遠低於 2°C 路徑'}採「每年線性減量 ${r}%（相對基準年）」設定 ${ty} 年目標，${ty} 年排放量應不高於多少 tCO₂e？`,
    known: [`E基準 = ${fmt(E0)} t`, `年數 = ${ty} − ${by} = ${n} 年`, `線性減量率 = ${r}%／年`, '求：目標年排放量'],
    formula: { expr: 'E目標 = E基準 × (1 − 年減量率 × 年數)', vars: '線性：每年減的量都是基準年的固定百分比', cond: '線性減量不是複利；年數 = 目標年 − 基準年。', plain: '每年都減「基準年的 4.2%」，n 年就減 4.2% × n。', mnemonic: '「線性乘年數，不是連乘」' },
    steps: [`總減量率 = ${r}% × ${n} = ${f(r * n, 1)}%`, `E目標 = ${fmt(E0)} × (1 − ${f(r * n / 100, 3)}) = <b>${fmt(Et)} tCO₂e</b>`],
    check: `目標值應低於基準年 ${fmt(E0)} t ✔`,
    answer: Et, opts: numOptions(Et, [
      { v: E0 * Math.pow(1 - r / 100, n), type: ERR.concept, why: '用了複利（逐年連乘）；題目指定線性減量。' },
      { v: E0 * r / 100 * n, type: ERR.read, why: '這是「要減掉的量」，題目問的是目標年剩下的排放量。' },
      { v: E0 * (1 - r / 100 * (n + 1)), type: ERR.math, why: `年數算錯：${ty} − ${by} = ${n}，不用再加 1。` }
    ], 0, 'tCO₂e'),
    card: { [ERR.concept]: 'SBTi 近期目標：1.5°C 路徑範疇一、二每年至少線性減量 4.2%；目標年距提交日 5～10 年。長期淨零目標多數產業需在 2050 年前減量 90% 以上。' }
  };
};

// ---- 減量：距離目標還差多少 ----
G.gap = () => {
  const E0 = R(40, 200) * 1000, cut = R(5, 18), x = pick([25, 28, 30, 35, 38]);
  const Ec = E0 * (1 - cut / 100), need = Ec - E0 * (1 - x / 100);
  return {
    unit: 'target', level: 2, title: '減量｜目標缺口',
    stem: `某集團基準年排放 ${fmt(E0)} tCO₂e，目前年排放 ${fmt(Ec)} tCO₂e。若目標為「較基準年減少 ${x}%」，還需要再減少多少 tCO₂e？`,
    known: [`E基準 = ${fmt(E0)} t`, `E目前 = ${fmt(Ec)} t`, `目標 = 基準 × (1 − ${x}%)`, '求：尚需減量'],
    formula: { expr: '缺口 = E目前 − E基準 × (1 − 目標減量率)', vars: '目標減量率以「基準年」為分母', cond: '減量百分比一定是相對基準年，不是相對今年。', plain: '先算出目標年允許排多少，再和現在比。', mnemonic: '「目標看基準，缺口看現在」' },
    steps: [`目標排放 = ${fmt(E0)} × ${(1 - x / 100).toFixed(2)} = ${fmt(E0 * (1 - x / 100))} t`, `缺口 = ${fmt(Ec)} − ${fmt(E0 * (1 - x / 100))} = <b>${fmt(need)} tCO₂e</b>`],
    check: `已減 ${cut}%，目標 ${x}%，還差約 ${x - cut}% 的基準量 ✔`,
    answer: need, opts: numOptions(need, [
      { v: E0 * x / 100, type: ERR.read, why: '這是相對基準年的總減量，沒扣掉已經減的部分。' },
      { v: Ec * x / 100, type: ERR.concept, why: '目標百分比要乘基準年排放，不是乘目前排放。' },
      { v: Ec - Ec * (1 - x / 100) - (E0 - Ec), type: ERR.math, why: '把基準換成目前排放量，再扣已減量，混用了兩個基準。' }
    ], 0, 'tCO₂e'),
    card: { [ERR.law]: '我國 NDC：淨排放較 2005 年減少 2030 年 28±2%、2032 年 32±2%、2035 年 38±2%；2050 淨零已入法（氣候變遷因應法）。' }
  };
};

// ---- 節能：照明汰換 ----
G.led = () => {
  const n = R(50, 600, 10), w1 = pick([28, 36, 40, 58]), w2 = pick([12, 14, 16, 18, 20]), h = pick([8, 10, 12, 16, 24]), d = pick([250, 300, 330, 365]), ef = pick([0.474, 0.467, 0.466]);

    unit: 'target', level: 3, title: '節能｜照明汰換減碳量',
    stem: `某倉庫將 ${n} 盞 ${w1} W 燈具汰換為 ${w2} W LED，每天點燈 ${h} 小時、全年 ${d} 天。電力排碳係數 ${ef} kgCO₂e/度，每年可減少多少 tCO₂e？`,
    known: [`每盞節省 = ${w1} − ${w2} = ${w1 - w2} W`, `${n} 盞、${h} hr/天、${d} 天/年`, `EF = ${ef} kgCO₂e/度`, '求：年減碳量（t）'],
    formula: { expr: '減碳量 = 盞數 × 功率差(kW) × 時數 × 天數 × 係數', vars: '功率差：W ÷ 1,000 = kW；kW × hr = 度', cond: '先換 kW 才能得到「度」。', plain: '省下來的功率 × 開燈時間 = 省下的電，再乘排碳係數。', mnemonic: '「瓦除千變瓩，瓩乘時變度」' },
    steps: [`節電 = ${n} × ${w1 - w2} ÷ 1,000 × ${h} × ${d} = ${fmt(kwh)} 度`, `減碳 = ${fmt(kwh)} × ${ef} = ${fmt(kwh * ef)} kg = <b>${fmt(E, 2)} tCO₂e</b>`],
    check: '節電量（度）× 約 0.47 ÷ 1,000 ✔',
    answer: E, opts: numOptions(E, [
      { v: n * w2 / 1000 * h * d * ef / 1000, type: ERR.concept, why: '用了新燈功率；省下的是「新舊功率差」。' },
      { v: n * (w1 - w2) * h * d * ef / 1000, type: ERR.unit, why: 'W 沒有 ÷ 1,000 換成 kW，答案大了一千倍。' },
      { v: n * (w1 - w2) / 1000 * h * ef / 1000, type: ERR.read, why: `只算了一天；全年要 × ${d} 天。` }
    ], 2, 'tCO₂e'),
    card: { [ERR.unit]: '1 kW 用 1 小時 = 1 kWh = 1 度。功率單位 W 要先 ÷ 1,000。' }
  };
};

// ---- 節能：高效率馬達回收年限 ----
G.motor = () => {
  const P = pick([15, 22, 30, 37, 45, 55, 75]), e1 = pick([86, 88, 89, 90]), e2 = e1 + pick([3, 4, 5, 6]), h = pick([4000, 5000, 6000, 7200, 8000]), pr = pick([3.5, 4, 4.5, 5]);
  const kwh = P * h * (100 / e1 - 100 / e2), money = kwh * pr, cost = Math.round(money * R(15, 40) / 10 / 1000) * 1000, pb = cost / money;
  return {
    unit: 'target', level: 4, title: '節能｜高效率馬達回收年限',
    stem: `一台輸出 ${P} kW 的馬達效率 ${e1}%，汰換為效率 ${e2}% 的高效率馬達，年運轉 ${fmt(h)} 小時（輸出相同），電價 ${pr} 元/度，新馬達含安裝 ${fmt(cost)} 元。簡單回收年限約為幾年？`,
    known: [`輸出 P = ${P} kW`, `η舊 = ${e1}%、η新 = ${e2}%`, `運轉 ${fmt(h)} hr/年、電價 ${pr} 元/度`, `投資 = ${fmt(cost)} 元`, '求：回收年限'],
    formula: { expr: '節電 = P × h × (1/η舊 − 1/η新)；回收年限 = 投資 ÷ 年節省電費', vars: 'P：輸出功率；η：效率（小數）', cond: '輸入功率 = 輸出 ÷ 效率；不能直接用效率差相乘。', plain: '效率越高，同樣輸出吃的電越少；省下的電費多久能把投資賺回來。', mnemonic: '「輸出除效率是耗電，投資除年省是年限」' },
    steps: [`舊耗電 = ${P} ÷ ${e1 / 100} = ${f(P / (e1 / 100), 2)} kW；新耗電 = ${P} ÷ ${e2 / 100} = ${f(P / (e2 / 100), 2)} kW`, `年節電 = (${f(P / (e1 / 100), 2)} − ${f(P / (e2 / 100), 2)}) × ${fmt(h)} = ${fmt(kwh)} 度`, `年省電費 = ${fmt(kwh)} × ${pr} = ${fmt(money)} 元`, `回收年限 = ${fmt(cost)} ÷ ${fmt(money)} = <b>${f(pb, 2)} 年</b>`],
    check: '高效率馬達回收年限通常數年內 ✔',
    answer: pb, opts: numOptions(pb, [
      { v: cost / (P * h * (e2 - e1) / 100 * pr), type: ERR.concept, why: '用「輸出 × 效率差」算節電；應比較輸入功率 P/η 的差。' },
      { v: cost / kwh, type: ERR.unit, why: '用節電度數當成省下的錢，漏乘電價。' },
      { v: money / cost, type: ERR.concept, why: '比值放反：回收年限 = 投資 ÷ 每年節省。' }
    ], 2, '年'),
    card: { [ERR.concept]: '輸入功率 = 輸出功率 ÷ 效率。效率從 88% 提升到 93%，同樣輸出下耗電減少 (1/0.88 − 1/0.93)，約 6%。' }
  };
};

// ---- 產品碳足跡：每件產品 ----
G.pcf = () => {
  const N = pick([500, 1000, 2000, 2500, 4000]), m = R(2, 20) * 100, efm = pick([1.8, 2.1, 2.5, 6.8, 8.2]), kwh = R(5, 40) * 100, ef = 0.466, km = R(50, 400, 10), tkef = pick([0.12, 0.15, 0.2]);
  const mt = m / 1000, mat = m * efm, el = kwh * ef, tr = mt * km * tkef, tot = mat + el + tr, per = tot / N;
  return {
    unit: 'pcf', level: 4, title: '碳足跡｜每件產品碳足跡',
    stem: `某產品採「搖籃到大門」計算。一批次生產 ${fmt(N)} 件，使用原料 ${fmt(m)} kg（係數 ${efm} kgCO₂e/kg），原料由貨車運送 ${km} km（係數 ${tkef} kgCO₂e/延噸公里），生產用電 ${fmt(kwh)} 度（${ef} kgCO₂e/度）。每件產品碳足跡為多少 kgCO₂e？`,
    known: [`原料 = ${fmt(m)} kg = ${mt} t`, `運輸 = ${mt} t × ${km} km`, `用電 = ${fmt(kwh)} 度`, `功能單位：每 1 件`, '求：kgCO₂e/件'],
    formula: { expr: '每件碳足跡 = (原料 + 運輸 + 用電) ÷ 件數', vars: '延噸公里 = 貨重（t）× 距離（km）', cond: '貨重要用公噸；搖籃到大門不含使用與廢棄階段。', plain: '把整批次各階段的碳排加總，再平均到每一件（功能單位）。', mnemonic: '「階段加總，再除件數」' },
    steps: [`原料 = ${fmt(m)} × ${efm} = ${fmt(mat, 1)} kg`, `運輸 = ${mt} t × ${km} km × ${tkef} = ${fmt(tr, 2)} kg`, `用電 = ${fmt(kwh)} × ${ef} = ${fmt(el, 1)} kg`, `合計 = ${fmt(tot, 1)} kg ÷ ${fmt(N)} 件 = <b>${f(per, 3)} kgCO₂e/件</b>`],
    check: '數值應以「每件」表示，比整批次小很多 ✔',
    answer: per, opts: numOptions(per, [
      { v: tot, type: ERR.read, why: '這是整批次的總量；功能單位是「每件」，要 ÷ 件數。' },
      { v: (mat + el + m * km * tkef) / N, type: ERR.unit, why: '延噸公里要用公噸，原料 kg 要先 ÷ 1,000。' },
      { v: (mat + el) / N, type: ERR.read, why: '漏算原料運輸；搖籃到大門包含原料運到工廠的運輸。' },
      { v: (mat + tr) / N, type: ERR.read, why: '漏算生產用電；製造階段用電也在搖籃到大門範圍內。' },
      { v: (mat / 1000 + el + tr) / N, type: ERR.unit, why: '原料係數單位是 kgCO₂e/kg，原料量直接用 kg 相乘，不必換公噸。' }
    ], 3, 'kgCO₂e'),
    card: { [ERR.concept]: 'ISO 14067 產品碳足跡：先定義功能單位與系統邊界（搖籃到大門／搖籃到墳墓），依產品類別規則（PCR）計算各生命週期階段排放。' }
  };
};

// ---- 盤查：排放源占比 ----

    steps: [`總排放 = ${fmt(c1)} + ${fmt(c2)} + ${fmt(c3)} + ${fmt(c4)} = ${fmt(tot)}`, `占比 = ${fmt(v)} ÷ ${fmt(tot)} = <b>${f(s, 1)} %</b>`, `與門檻 ${th}% 比較 → ${s >= th ? '達顯著性門檻，應量化' : '未達門檻，可依程序說明排除理由'}`],

    card: { [ERR.concept]: 'ISO 14064-1:2018 要求組織自訂顯著性準則（例如規模、影響程度、取得數據難易度），鑑別哪些間接排放（類別 3～6）需要量化。' }
  };
};

  { q: '我國 NDC 3.0 設定 2035 年的減量目標為？', a: '淨排放較 2005 年減少 38±2%', d: [['淨排放較 2005 年減少 28±2%', ERR.law, '28±2% 是 2030 年目標。'], ['淨排放較 2020 年減少 38±2%', ERR.law, '我國基準年是 2005 年。'], ['淨排放較 2005 年減少 50%', ERR.law, '50% 是舊《溫管法》的 2050 年目標。']], ex: 'NDC 3.0：2030 年 28±2%、2032 年 32±2%、2035 年 38±2%（均較 2005 年）。' },
  { q: '我國碳費的收費對象為？', a: '年排放量 2.5 萬公噸 CO₂e 以上之電力、燃氣供應業及製造業', d: [['所有上市櫃公司', ERR.law, '收費對象依排放量與行業別，不是依上市櫃身分。'], ['年排放量 1 萬公噸以上之所有行業', ERR.law, 'K 值未來可能分階段下修，但目前門檻是 2.5 萬公噸，且限特定行業。'], ['年用電量 5,000 萬度以上之用戶', ERR.concept, '碳費依溫室氣體排放量計算，不是用電量。']], ex: '碳費收費辦法：年排放量達 2.5 萬公噸 CO₂e 以上之電力、燃氣供應業及製造業；每年 5 月底前依前一年排放量繳費。' },
  { q: '我國碳費的一般費率為每公噸 CO₂e 多少元？', a: '300 元', d: [['50 元', ERR.law, '50 元是優惠費率 A（須自主減量計畫核定）。'], ['100 元', ERR.law, '100 元是優惠費率 B。'], ['1,500 元', ERR.law, '這不是我國現行費率。']], ex: '費率審議會決議：一般費率 300 元；自主減量計畫核定者適用優惠費率 A 50 元或 B 100 元。（以環境部最新公告為準）' },
  { q: '高碳洩漏風險事業之自主減量計畫獲核定後，初期適用的排放量調整係數為？', a: '0.2', d: [['0.5', ERR.law, '不是現行數值。'], ['0.4', ERR.law, '0.4 是規劃中的第二期係數。'], ['0.6', ERR.law, '0.6 是規劃中的第三期係數。']], ex: '排放量調整係數：第一期 0.2，後續分階段調整為 0.4、0.6。' },
  { q: '下列關於「碳中和」與「淨零」的敘述，何者正確？', a: '淨零強調先深度減量，剩餘排放以碳移除（碳匯、負碳技術）平衡', d: [['碳中和與淨零意義完全相同', ERR.concept, '兩者在減量要求與抵銷方式上不同。'], ['淨零可以完全靠購買碳權達成', ERR.concept, '淨零（如 SBTi）要求先減量約 90%，剩餘以移除中和。'], ['碳中和只計算範疇三', ERR.concept, '碳中和宣告需界定標的與範圍，不限範疇三。']], ex: '碳中和：一定期間內排放與抵銷相等，可使用碳權（ISO 14068-1）；淨零：以深度減量為主，剩餘排放以移除平衡。' },
  { q: '「碳洩漏」是指？', a: '因各地碳管制強度不同，生產活動轉移到管制較寬鬆地區，使全球排放未真正減少', d: [['冷媒從設備中逸散到大氣', ERR.read, '這是逸散排放，不是碳洩漏。'], ['二氧化碳從地下封存場址滲出', ERR.read, '這是封存洩漏風險，與碳定價的碳洩漏不同。'], ['企業低報排放量', ERR.concept, '低報是數據品質或違規問題。']], ex: '碳洩漏是碳定價政策的主要顧慮；歐盟以 CBAM、我國以高碳洩漏風險係數因應。' },
  { q: '歐盟碳邊境調整機制（CBAM）首波涵蓋的產品，下列何者「不屬之」？', a: '紡織品', d: [['水泥', ERR.law, '水泥屬 CBAM 首波產品。'], ['鋼鐵', ERR.law, '鋼鐵屬 CBAM 首波產品。'], ['鋁', ERR.law, '鋁屬 CBAM 首波產品。']], ex: 'CBAM 首波：水泥、鋼鐵、鋁、肥料、電力、氫。' },
  { q: 'TCFD（氣候相關財務揭露）建議的四大核心要素為？', a: '治理、策略、風險管理、指標與目標', d: [['環境、社會、治理、經濟', ERR.concept, '這是 ESG 面向。'], ['規劃、執行、檢查、行動', ERR.concept, '這是 PDCA 管理循環。'], ['減緩、調適、移除、抵銷', ERR.concept, '這是氣候行動手段。']], ex: 'TCFD 四大核心：治理、策略、風險管理、指標與目標；後續由 ISSB 的 IFRS S2 承接。' },
  { q: '因碳費開徵導致營運成本上升，屬於哪一類氣候相關風險？', a: '轉型風險（政策與法規）', d: [['實體風險（立即性）', ERR.concept, '立即性實體風險是颱風、洪水等極端事件。'], ['實體風險（長期性）', ERR.concept, '長期性實體風險是海平面上升、均溫上升等。'], ['氣候相關機會（資源效率）', ERR.concept, '成本上升是風險，不是機會。']], ex: '轉型風險：政策法規、技術、市場、聲譽；實體風險：立即性（極端天氣）、長期性（氣候模式改變）。' },
  { q: '發布氣候變遷「評估報告」（如 AR6）的組織為？', a: '政府間氣候變遷專門委員會（IPCC）', d: [['聯合國氣候變化綱要公約（UNFCCC）', ERR.concept, 'UNFCCC 是公約，締約方大會稱 COP。'], ['國際能源總署（IEA）', ERR.concept, 'IEA 發布能源展望與淨零路徑報告。'], ['國際標準化組織（ISO）', ERR.concept, 'ISO 制定 ISO 14064 等標準。']], ex: 'IPCC 評估氣候科學並發布評估報告（AR）；GWP 值也引用自 IPCC 報告。' },
  { q: '國家再生能源憑證（T-REC）1 張代表多少再生能源電量？', a: '1,000 度（1 MWh）', d: [['1 度', ERR.unit, '1 張是 1,000 度。'], ['100 度', ERR.unit, '1 張是 1,000 度。'], ['1 公噸 CO₂e 減量', ERR.concept, '以公噸 CO₂e 計的是碳權（減量額度），不是再生能源憑證。']], ex: '再生能源憑證證明「綠電屬性」，以 1,000 度為 1 張；碳權則證明「減量」，以 1 tCO₂e 為單位。' },
  { q: 'SBTi 1.5°C 路徑下，範疇一、二近期目標的最低年減量率為？', a: '每年線性減量 4.2%', d: [['每年減量 1%', ERR.law, '遠低於 1.5°C 路徑要求。'], ['每年線性減量 2.5%', ERR.law, '2.5% 是「遠低於 2°C」路徑的舊標準。'], ['每年減量 10%', ERR.law, '不是 SBTi 的最低要求。']], ex: 'SBTi：1.5°C 路徑範疇一、二絕對減量每年至少 4.2%（線性）。' },
  { q: '依氣候變遷因應法，事業自願執行減量專案並經審查通過，可取得？', a: '減量額度', d: [['排放配額', ERR.concept, '配額是總量管制與交易制度（ETS）的工具。'], ['再生能源憑證', ERR.concept, '憑證證明綠電屬性，由標準檢驗局核發。'], ['碳足跡標籤', ERR.concept, '碳足跡標籤是產品碳足跡制度。']], ex: '氣候法第 25 條自願減量：取得減量額度，可用於抵換、抵減碳費（上限 10%）或交易。' },
  { q: '能源管理系統的國際標準為？', a: 'ISO 50001', d: [['ISO 14001', ERR.law, 'ISO 14001 是環境管理系統。'], ['ISO 45001', ERR.law, 'ISO 45001 是職業安全衛生管理系統。'], ['ISO 14064-1', ERR.law, 'ISO 14064-1 是組織溫室氣體盤查。']], ex: 'ISO 50001 以 PDCA 建立能源基線、能源績效指標（EnPI）持續改善。' },
  { q: '下列何者屬於「碳移除」技術？', a: '直接空氣捕捉並地質封存（DACCS）', d: [['燃煤改燃氣', ERR.concept, '燃料轉換是減量，不是移除。'], ['LED 照明汰換', ERR.concept, '節能屬減量。'], ['購買再生能源憑證', ERR.concept, '憑證影響市場基礎法範疇二計算，不會移除大氣中的 CO₂。']], ex: '移除：把大氣中的 CO₂ 拿掉，如植林、DACCS、BECCS；減量：少排一點。淨零的剩餘排放須以移除平衡。' },
  { q: '溫室氣體減量額度可抵減碳費之收費排放量，國內減量額度上限為？', a: '10%', d: [['5%', ERR.law, '5% 是經認可之國外減量額度上限。'], ['20%', ERR.law, '不是現行規定。'], ['不設上限', ERR.law, '有上限規定。']], ex: '碳費配套：國內減量額度可扣減收費排放量上限 10%；經認可之國外減量額度上限 5%（限非高碳洩漏風險事業）。' }

  { q: '員工通勤產生的排放，依 ISO 14064-1:2018 屬於？', a: '類別 3（運輸）', d: [['類別 1', ERR.concept, '員工自有車輛不在組織控制下，不屬直接排放。'], ['類別 2', ERR.concept, '類別 2 是輸入能源。'], ['類別 4', ERR.concept, '類別 4 是組織購買的產品與服務。']], ex: '類別 3 運輸：上下游貨物運輸、員工通勤、商務差旅、客戶與訪客運輸。' },

  { q: '化糞池產生的 CH₄、滅火器的 CO₂ 釋放、冷媒補充，屬於哪一種排放？', a: '類別 1 的逸散排放', d: [['類別 1 的固定燃燒', ERR.concept, '沒有燃燒行為。'], ['類別 2 的輸入能源', ERR.concept, '與輸入能源無關。'], ['類別 6 的其他間接排放', ERR.concept, '這些排放源在組織邊界內，屬直接排放。']], ex: '逸散排放：非刻意釋放，如冷媒、化糞池 CH₄、滅火器、SF₆ 開關設備。' },
  { q: '購買原物料在上游生產階段的排放，屬於 ISO 14064-1:2018 的？', a: '類別 4（組織使用之產品）', d: [['類別 3', ERR.concept, '原料的運輸才是類別 3。'], ['類別 5', ERR.concept, '類別 5 是組織售出產品的使用與廢棄。'], ['類別 1', ERR.concept, '上游供應商的排放不是自己的直接排放。']], ex: '類別 4：購買的商品與服務、資本財、廢棄物處理、租用資產等。' },
  { q: '組織售出的產品在消費者使用階段的排放，屬於？', a: '類別 5（使用組織產品）', d: [['類別 4', ERR.concept, '類別 4 是組織「購買／使用」的產品。'], ['類別 2', ERR.concept, '類別 2 是組織自己的輸入能源。'], ['類別 6', ERR.concept, '類別 6 是無法歸入其他類別者。']], ex: '類別 5：售出產品的使用、下游租賃資產、產品廢棄處理、投資等。' },
  { q: 'GHG Protocol 範疇三共分為幾類？', a: '15 類（上游 8 類、下游 7 類）', d: [['6 類', ERR.law, '6 類是 ISO 14064-1:2018 的類別數。'], ['12 類', ERR.law, '12 是淨零路徑關鍵戰略數。'], ['7 類', ERR.law, '7 是管制溫室氣體種類數。']], ex: '範疇三 15 類：1 購買商品與服務 … 6 商務旅行、7 員工通勤 … 11 售出產品使用、12 產品廢棄 … 15 投資。' },
  { q: '設定組織邊界的方法為？', a: '控制權法（營運控制或財務控制）或股權比例法', d: [['地點基礎法或市場基礎法', ERR.concept, '這是範疇二電力排放的計算方法。'], ['排放係數法或質量平衡法', ERR.concept, '這是量化方法。'], ['搖籃到大門或搖籃到墳墓', ERR.concept, '這是產品碳足跡的系統邊界。']], ex: '組織邊界：決定「哪些據點算我的」；報告邊界：決定「要算哪些排放源與類別」。' },
  { q: '溫室氣體盤查的一般程序順序為？', a: '設定組織邊界 → 設定報告邊界並鑑別排放源 → 量化 → 報告與查證', d: [['量化 → 設定組織邊界 → 鑑別排放源 → 報告', ERR.concept, '邊界沒設定前無法量化。'], ['查證 → 量化 → 設定邊界 → 報告', ERR.concept, '查證在盤查報告完成後進行。'], ['鑑別排放源 → 設定組織邊界 → 報告 → 量化', ERR.concept, '先有組織邊界，才鑑別邊界內的排放源。']], ex: '程序：邊界設定 → 排放源鑑別 → 活動數據蒐集 → 選擇係數並量化 → 建立清冊 → 報告書 → 內部／外部查證。' },
  { q: '下列何種情況通常需要「重新計算基準年」排放量？', a: '併購或出售據點，造成排放量顯著變化', d: [['當年產量下降使排放減少', ERR.concept, '有機成長或衰退不需重算基準年。'], ['盤查負責人更換', ERR.read, '人員異動不影響基準年。'], ['電價調漲', ERR.read, '與基準年排放量無關。']], ex: '基準年重新計算：組織結構變化（併購、分割、外包移轉）、量化方法改變或發現重大錯誤，且超過顯著性門檻時。' },
  { q: '生質燃料燃燒產生的 CO₂（生質排放），依 ISO 14064-1:2018 應如何處理？', a: '單獨量化並另行揭露', d: [['直接計入類別 1 總量', ERR.law, '生質 CO₂ 應與化石來源分開揭露。'], ['完全不需量化', ERR.law, '仍需量化並揭露。'], ['計入類別 2', ERR.concept, '與輸入能源無關。']], ex: '生質 CO₂ 排放與移除須分開報告；生質燃料燃燒產生的 CH₄、N₂O 仍計入排放。' },
  { q: '專案層級減量量化（碳抵換專案）適用的標準為？', a: 'ISO 14064-2', d: [['ISO 14064-1', ERR.law, '14064-1 是組織層級盤查。'], ['ISO 14064-3', ERR.law, '14064-3 是查證與確證。'], ['ISO 14067', ERR.law, '14067 是產品碳足跡。']], ex: 'ISO 14064-1 組織、14064-2 專案、14064-3 查證確證、14067 產品碳足跡、14068-1 碳中和。' },
  { q: '溫室氣體聲明的查證與確證，依據的標準為？', a: 'ISO 14064-3', d: [['ISO 14064-2', ERR.law, '14064-2 是專案量化。'], ['ISO 14068-1', ERR.law, '14068-1 是碳中和。'], ['ISO 50001', ERR.law, '50001 是能源管理系統。']], ex: '查證可分「合理保證」與「有限保證」兩種保證等級。' },
  { q: '查證的「合理保證」與「有限保證」相比，下列何者正確？', a: '合理保證等級較高，查證程序與證據蒐集較廣泛', d: [['有限保證等級較高', ERR.concept, '合理保證高於有限保證。'], ['兩者查證程序完全相同', ERR.concept, '查證深度與證據量不同。'], ['合理保證不需現場查核', ERR.concept, '合理保證通常需較完整的現場查核。']], ex: '合理保證：以正面意見表達「依標準公正表達」；有限保證：以負面意見表達「未發現重大不符」。' },
  { q: 'ISO 14064-1 的盤查原則，下列何者「不屬之」？', a: '獲利性', d: [['透明性', ERR.law, '透明性是盤查原則之一。'], ['一致性', ERR.law, '一致性是盤查原則之一。'], ['完整性', ERR.law, '完整性是盤查原則之一。']], ex: '五大原則：相關性、完整性、一致性、準確性、透明性。' },
  { q: '盤查最常用的量化方法為何？', a: '排放係數法：活動數據 × 排放係數 × GWP', d: [['直接監測法：所有排放源都要裝連續監測', ERR.concept, '直接監測法成本高，只用於大型煙道等。'], ['質量平衡法：適用所有服務業', ERR.concept, '質量平衡法多用於製程含碳物料。'], ['問卷估算法', ERR.concept, '不是標準量化方法。']], ex: '量化方法：排放係數法、質量平衡法、直接監測法。' },
  { q: '活動數據品質由高到低，下列何者品質最高？', a: '經定期校正之連續量測儀表數據', d: [['依採購發票推估', ERR.concept, '發票數據可用，但不如校正過的儀表準確。'], ['依設備額定功率與經驗工時估算', ERR.concept, '估算值不確定性較高。'], ['參考同業平均值', ERR.concept, '同業平均代表性最低。']], ex: '數據品質：自動連續量測（校正）＞定期量測＞自行推估。提升活動數據準確度是降低不確定性最有效的方法。' },
  { q: '產品碳足跡中「功能單位」的意義是？', a: '量化產品功能的基準單位，作為比較與計算的基礎', d: [['產品的售價單位', ERR.concept, '與價格無關。'], ['工廠的組織邊界', ERR.concept, '組織邊界是組織盤查用語。'], ['碳足跡標籤的有效期間', ERR.concept, '與標籤效期無關。']], ex: '例：「每 1 瓶 600 mL 飲料」「每 1 kWh 電力」。所有排放都換算到功能單位。' },
  { q: '「搖籃到大門（cradle-to-gate）」的系統邊界涵蓋？', a: '原料取得、運輸到工廠、製造至產品出廠', d: [['從原料取得到使用及廢棄', ERR.concept, '那是搖籃到墳墓。'], ['只計算工廠內製造階段', ERR.concept, '那是大門到大門（gate-to-gate）。'], ['只計算產品使用階段', ERR.concept, '使用階段不在搖籃到大門範圍內。']], ex: '搖籃到墳墓（cradle-to-grave）＝全生命週期；搖籃到大門常用於 B2B 中間產品。' },
  { q: '計算產品碳足跡時，同類產品共同遵循的計算規則文件稱為？', a: '產品類別規則（PCR）', d: [['環境產品宣告（EPD）', ERR.concept, 'EPD 是依 PCR 產出的宣告文件。'], ['盤查報告書', ERR.concept, '盤查報告書是組織盤查文件。'], ['自主減量計畫', ERR.concept, '這是碳費制度文件。']], ex: 'PCR 規範功能單位、系統邊界、分配原則與數據要求，使同類產品可比較。' },
  { q: '生命週期評估（ISO 14040/14044）的四個階段依序為？', a: '目標與範疇界定 → 盤查分析 → 衝擊評估 → 詮釋', d: [['盤查分析 → 目標界定 → 詮釋 → 衝擊評估', ERR.concept, '應先界定目標與範疇。'], ['邊界設定 → 量化 → 報告 → 查證', ERR.concept, '這是組織盤查程序。'], ['規劃 → 執行 → 檢查 → 行動', ERR.concept, '這是 PDCA。']], ex: 'LCA 四階段：Goal & Scope → LCI → LCIA → Interpretation。' },
  { q: '廢棄物委外清運處理所產生的排放，依 ISO 14064-1:2018 屬於？', a: '類別 4', d: [['類別 1', ERR.concept, '委外處理不在組織控制範圍。'], ['類別 5', ERR.concept, '類別 5 是售出產品的廢棄。'], ['類別 2', ERR.concept, '與輸入能源無關。']], ex: '組織自身營運產生的廢棄物處理屬類別 4；售出產品報廢處理屬類別 5。' },
  { q: '查證時常用來判斷錯誤是否「重大」的實質性門檻，通常設為總排放量的？', a: '5%', d: [['0.5%', ERR.law, '一般不設這麼嚴。'], ['20%', ERR.law, '過於寬鬆。'], ['50%', ERR.law, '過於寬鬆。']], ex: '實質性（重大性）門檻常見為總排放量 5%：誤差或遺漏累計超過即屬重大不符。' },
  { q: '廠內緊急發電機使用柴油的排放屬於？', a: '類別 1 固定燃燒', d: [['類別 1 移動燃燒', ERR.concept, '發電機固定設置，屬固定燃燒；堆高機、車輛才是移動燃燒。'], ['類別 2 輸入能源', ERR.concept, '自己燃燒燃料發電是直接排放。'], ['類別 6 其他', ERR.concept, '這是明確的直接排放源。']], ex: '固定燃燒：鍋爐、發電機、爐具；移動燃燒：公務車、堆高機。' },
  { q: '廠區植林增加的碳吸存，在盤查中屬於？', a: '溫室氣體移除', d: [['溫室氣體排放', ERR.concept, '吸收 CO₂ 是移除。'], ['減量額度', ERR.concept, '需另依專案程序申請才可能取得額度。'], ['範疇二', ERR.concept, '與外購能源無關。']], ex: 'ISO 14064-1 類別 1 包含「直接排放與移除」；移除應與排放分開報告。' }
];
const CONCEPTS = CON_A.concat(CON_B);
function conQ(list, unit, title) {
  const c = pick(list);
  return {
    unit, level: 0, title, stem: c.q, isCon: true,
    known: ['觀念題：先判斷題目在問哪一個制度、標準或定義'],
    formula: { expr: '—', vars: '—', cond: '—', plain: c.ex, mnemonic: '先講結論，再記住出處' },
    steps: [c.ex], check: '制度數值請以環境部、經濟部與 iPAS 最新公告為準 ✔',
    answer: null, opts: textOptions(c.a, c.d.map(x => ({ text: x[0], type: x[1], why: x[2] }))),
    card: { [ERR.law]: c.ex, [ERR.concept]: c.ex, [ERR.unit]: c.ex, [ERR.read]: c.ex }
  };
}
G.conA = () => conQ(CON_A, 'conA', '觀念｜淨零政策與基礎概論');
G.conB = () => conQ(CON_B, 'conB', '觀念｜盤查規範與程序');

const UNITS = {
  conA: { name: '淨零基礎概論', icon: '🌏', gens: ['conA'], con: CON_A.length },
  conB: { name: '盤查規範與程序', icon: '📋', gens: ['conB'], con: CON_B.length },
  emit: { name: '排放量計算', icon: '🏭', gens: ['fuel', 'elec', 'refrig', 'gwp', 'carbon'] },
  price: { name: '碳費與碳權', icon: '💰', gens: ['fee', 'offset', 'trec'] },
  target: { name: '減量目標與節能', icon: '📉', gens: ['intensity', 'target', 'gap', 'led', 'motor'] },
  pcf: { name: '碳足跡與占比', icon: '👣', gens: ['pcf', 'share'] }
};

function makeQuestion(genKey) { const q = G[genKey](); q.gen = genKey; return q; }

if (typeof module !== 'undefined') module.exports = { G, UNITS, ERR, makeQuestion, UNIT_TABLE, GENERIC_CARD, CONCEPTS };

const KEY = 'nz_tutor_v1';

let S = load();
function blank() { return { units: {}, gens: {}, errs: {}, variant: { n: 0, c: 0 }, total: { n: 0, c: 0 }, drill: { n: 0, c: 0 } }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.units) { s.drill = s.drill || { n: 0, c: 0 }; return s; } } catch (e) { } return blank(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function rec(q, ok, type, flags) {
  flags = flags || {};
  const u = S.units[q.unit] = S.units[q.unit] || { n: 0, c: 0 }; u.n++; if (ok) u.c++;
  const g = S.gens[q.gen] = S.gens[q.gen] || { n: 0, c: 0, w: 0, st: 0, t: q.title, et: {} };
  g.n++; g.t = q.title; g.et = g.et || {};
  if (ok) { g.c++; g.st = (g.st || 0) + 1; } else { g.w = (g.w || 0) + 1; g.st = 0; if (type) g.et[type] = (g.et[type] || 0) + 1; }
  S.total.n++; if (ok) S.total.c++;
  if (!ok && type) S.errs[type] = (S.errs[type] || 0) + 1;
  if (flags.variant) { S.variant.n++; if (ok) S.variant.c++; }
  if (flags.drill) { S.drill.n++; if (ok) S.drill.c++; }
  save();
}
const $ = s => document.querySelector(s);
const L = 'ABCD';

for (const g of Object.keys(G)) { const set = new Set(); for (let i = 0; i < 12; i++) G[g]().opts.forEach(o => o.type && set.add(o.type)); TYPEMAP[g] = set; }
const ALLGENS = Object.values(UNITS).flatMap(u => u.gens);
const genTitle = g => (S.gens[g] && S.gens[g].t) || G[g]().title;

let tutorMin = false;

function say(pose, html, acts) {
  const t = $('#tutor'), img = $('#timg'); t.classList.remove('cxon');
  if (IMG[pose] && img.dataset.p !== pose) { img.src = IMG[pose]; img.dataset.p = pose; }
  $('#tbub').innerHTML = `<button class="x" onclick="tutorToggle()" aria-label="收合">×</button><b class="nm">安安老師</b>${html}${acts && acts.length ? `<div class="act">${acts.map(a => `<button onclick="${a[1]}">${a[0]}</button>`).join('')}</div>` : ''}`;
  $('#tbub').style.animation = 'none'; void $('#tbub').offsetWidth; $('#tbub').style.animation = '';

}
function setTeacher(g) {

}
setTimeout(() => document.querySelectorAll('.tsw button').forEach(b => b.classList.toggle('on', b.dataset.g === tGender)), 0);

function setNav(v) { document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function go(v) { mock = null; drill = null; if (v === 'home') home(); else if (v === 'rec') records(); else if (v === 'tools') { toolsView(); return; } window.scrollTo(0, 0); }
function pct(o) { return o && o.n ? Math.round(o.c / o.n * 100) : null; }

function weakGens() {
  return Object.entries(S.gens).filter(([k, g]) => G[k] && g.w > 0 && (g.st || 0) < 2)

  return `<details class="cxbox" open><summary>🧮 考試用計算機 <small>（${CX.deg ? 'DEG 度' : 'RAD 弧度'}）</small></summary>
  <div class="cxwrap"><div class="cxhist" id="cxh">${CX.hist || '&nbsp;'}</div>
  <input id="cx" class="cxin" type="text" autocomplete="off" spellcheck="false" ${CX_TOUCH ? 'inputmode="none" readonly' : ''} placeholder="例：3550*0.466 或 1000*0.7*44/12" onfocus="cxAway()" onkeydown="if(event.key==='Enter'){event.preventDefault();cxKey('=')}">
  <div class="cxout" id="cxo">= 0</div>
  <div class="cxkeys">${K.flat().map(k => `<button type="button" class="cxk${'=AC⌫'.includes(k) ? ' cxs' : /[\d.]/.test(k) ? ' cxn' : ''}" onclick="cxKey('${k}')">${lab[k] || k}</button>`).join('')}</div>
  <div class="cxfoot"><button type="button" class="cxk" style="width:auto;padding:4px 10px" onclick="CX.deg=!CX.deg;this.closest('details').querySelector('summary small').textContent='（'+(CX.deg?'DEG 度':'RAD 弧度')+'）';this.textContent=CX.deg?'切換成 RAD':'切換成 DEG'">${CX.deg ? '切換成 RAD' : '切換成 DEG'}</button><small>${CX_TOUCH ? '用上方按鍵輸入（不會跳出手機鍵盤）' : '可直接用鍵盤輸入，Enter 計算'}；log＝常用對數、ln＝自然對數</small></div></div></details>`;
}
function cxKey(k) {
  const el = document.getElementById('cx'); if (!el) return;
  cxAway();
  if (k === 'AC') { el.value = ''; document.getElementById('cxo').textContent = '= 0'; return; }
  if (k === '⌫') { el.value = el.value.slice(0, -1); return; }
  if (k === '=') {
    if (!el.value.trim()) return;
    try { const v = cxEval(el.value); CX.ans = v; CX.hist = el.value + ' ='; document.getElementById('cxh').textContent = CX.hist; document.getElementById('cxo').textContent = '= ' + cxFmt(v); el.value = ''; el.placeholder = 'Ans = ' + cxFmt(v); }
    catch (e) { document.getElementById('cxo').textContent = '算式有誤，請檢查括號或運算符號'; }
    return;
  }
  el.value += k;
  if (!CX_TOUCH) el.focus({ preventScroll: true });
}

// ---------- 計算工具（v5） ----------
const LINKS = [
  ['iPAS 淨零碳規劃管理師', 'https://ipd.nat.gov.tw/ipas/certification/NZ/exam-info', '經濟部產業人才能力鑑定：簡章、評鑑主題、學習指引'],
  ['環境部氣候變遷署', 'https://www.cca.gov.tw/', '碳費、自願減量、盤查登錄最新公告'],
  ['經濟部能源署', 'https://www.moeaea.gov.tw/', '電力排碳係數、節能技術與能源統計'],
  ['氣候變遷因應法', 'https://law.moj.gov.tw/Law/LawSearchResult.aspx?ty=ONEBAR&kw=%E6%B0%A3%E5%80%99%E8%AE%8A%E9%81%B7%E5%9B%A0%E6%87%89%E6%B3%95', '全國法規資料庫（含碳費收費辦法等子法）'],
  ['溫室氣體排放量資訊平台', 'https://ghgregistry.moenv.gov.tw/', '排放係數、盤查表單與登錄資訊'],
  ['產品碳足跡資訊網', 'https://cfp-calculate.tw/', '碳足跡係數資料庫、PCR 與標籤']
];
const num = (id, d) => { const el = document.getElementById(id); const v = el ? parseFloat(el.value) : NaN; return isFinite(v) ? v : d; };
const sel = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const R2 = (v, d = 2) => isFinite(v) ? (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const ok = (b, y, n) => `<b style="color:${b ? 'var(--ok)' : 'var(--ng)'}">${b ? y : n}</b>`;
const TOOLS = {
  emit: { name: '排放量（活動數據 × 係數 × GWP）', f: [['ad', '活動數據（燃料量、冷媒逸散量…）', '', 12000], ['ef', '排放係數', 'kgCO₂e／單位', 2.61], ['gw', 'GWP（已是 CO₂e 係數填 1）', '', 1], ['per', '活動數據期間', '', 'y', [['y', '全年'], ['m', '每月（自動 × 12）']]]],
    run() { const ad = num('ad', 0) * (sel('per') === 'm' ? 12 : 1), ef = num('ef', 0), gw = num('gw', 1), kg = ad * ef * gw;
      return `${sel('per') === 'm' ? `全年活動數據 = ${R2(ad, 0)}<br>` : ''}排放量 = ${R2(ad, 2)} × ${ef} × ${gw} = ${R2(kg, 1)} kgCO₂e = <b>${R2(kg / 1000, 3)} tCO₂e</b><br><small>係數單位要和活動數據對上；kg ÷ 1,000 = t。</small>`; } },
  elec: { name: '外購電力（地點／市場基礎法）', f: [['kwh', '全年用電', '度（kWh）', 500000], ['rec', '註銷再生能源憑證', '張', 100], ['ef', '電力排碳係數', 'kgCO₂e/度', 0.466]],
    run() { const k = num('kwh', 0), r = num('rec', 0), ef = num('ef', 0), loc = k * ef / 1000, mk = Math.max(0, k - r * 1000) * ef / 1000;
      return `地點基礎法 = ${R2(k, 0)} × ${ef} ÷ 1,000 = <b>${R2(loc, 2)} tCO₂e</b><br>市場基礎法 = (${R2(k, 0)} − ${R2(r, 0)} × 1,000) × ${ef} ÷ 1,000 = <b>${R2(mk, 2)} tCO₂e</b><br><small>1 張 T-REC = 1,000 度。市場基礎法剩餘電力實務上應採剩餘電力係數，此處以輸入係數估算。114 年度台電係數 0.467、產業電力排碳係數 0.466 kgCO₂e/度。</small>`; } },
  fee: { name: '碳費試算', f: [['E', '年排放量', 'tCO₂e', 80000], ['cs', '身分', '', 'gen', [['gen', '一般（未提自主減量計畫）'], ['pref', '非高碳洩漏＋自主減量核定'], ['hcl', '高碳洩漏＋自主減量核定']]], ['rt', '優惠費率', '', '100', [['100', 'B：100 元'], ['50', 'A：50 元']]], ['cr', '可抵減之國內減量額度', 'tCO₂e', 0]],
    run() { const E = num('E', 0), cs = sel('cs'), rt = cs === 'gen' ? 300 : Number(sel('rt')), K = 25000;
      if (E < K) return ok(true, '年排放量未達 2.5 萬公噸，非碳費收費對象。', '');
      let q = cs === 'hcl' ? E * 0.2 : E - K; const cap = q * 0.1, cr = Math.min(num('cr', 0), cap); q -= cr;
      return `收費排放量 = ${cs === 'hcl' ? `${R2(E, 0)} × 0.2` : `${R2(E, 0)} − 25,000`}${cr ? ` − 減量額度 ${R2(cr, 0)}（上限 10%）` : ''} = ${R2(q, 0)} t<br>碳費 = ${R2(q, 0)} × ${rt} 元 = <b>${R2(q * rt, 0)} 元</b>（約 ${R2(q * rt / 10000, 1)} 萬元）<br><small>一般費率 300 元；優惠費率 A 50、B 100 元；高碳洩漏風險事業調整係數初期 0.2、不扣 K 值。以環境部最新公告為準。</small>`; } },
  c2co2: { name: '含碳量 → CO₂（質量平衡）', f: [['m', '燃料或物料量', 't', 1000], ['c', '含碳率', '%', 70], ['ox', '氧化率', '%', 100]],
    run() { const m = num('m', 0), c = num('c', 0) / 100, ox = num('ox', 100) / 100, C = m * c * ox; return `被氧化的碳 = ${R2(m, 1)} × ${c} × ${ox} = ${R2(C, 2)} t C<br>CO₂ = ${R2(C, 2)} × 44/12 = <b>${R2(C * 44 / 12, 2)} t</b>`; } },
  target: { name: '減量目標（線性／複利）', f: [['E0', '基準年排放', 'tCO₂e', 50000], ['r', '年減量率', '%', 4.2], ['n', '年數（目標年 − 基準年）', '年', 10]],
    run() { const E0 = num('E0', 0), r = num('r', 0) / 100, n = num('n', 0), lin = E0 * (1 - r * n), cmp = E0 * Math.pow(1 - r, n);
      return `線性（SBTi 常用）：${R2(E0, 0)} × (1 − ${R2(r * n * 100, 1)}%) = <b>${R2(lin, 0)} tCO₂e</b><br>複利（逐年連乘）：${R2(E0, 0)} × (1 − ${r})^${n} = ${R2(cmp, 0)} tCO₂e<br><small>SBTi 1.5°C 路徑：範疇一、二每年至少線性減量 4.2%。</small>`; } },
  led: { name: '照明汰換節電減碳', f: [['n', '燈具數', '盞', 200], ['w1', '舊燈功率', 'W', 40], ['w2', '新燈功率', 'W', 18], ['h', '每天點燈', '小時', 12], ['d', '每年天數', '天', 300], ['ef', '電力排碳係數', 'kgCO₂e/度', 0.466]],
    run() { const k = num('n', 0) * (num('w1', 0) - num('w2', 0)) / 1000 * num('h', 0) * num('d', 0), ef = num('ef', 0); return `年節電 = <b>${R2(k, 0)} 度</b><br>年減碳 = ${R2(k, 0)} × ${ef} ÷ 1,000 = <b>${R2(k * ef / 1000, 2)} tCO₂e</b>`; } },
  motor: { name: '高效率馬達回收年限', f: [['P', '輸出功率', 'kW', 30], ['e1', '舊效率', '%', 88], ['e2', '新效率', '%', 93], ['h', '年運轉', '小時', 6000], ['pr', '電價', '元/度', 4], ['c', '投資金額', '元', 150000], ['ef', '電力排碳係數', 'kgCO₂e/度', 0.466]],
    run() { const P = num('P', 0), e1 = num('e1', 1) / 100, e2 = num('e2', 1) / 100, h = num('h', 0), k = P * h * (1 / e1 - 1 / e2), m = k * num('pr', 0), c = num('c', 0);
      return `年節電 = ${P} × ${R2(h, 0)} × (1/${e1} − 1/${e2}) = <b>${R2(k, 0)} 度</b><br>年省電費 = <b>${R2(m, 0)} 元</b>，年減碳 ${R2(k * num('ef', 0) / 1000, 2)} tCO₂e<br>簡單回收年限 = ${R2(c, 0)} ÷ ${R2(m, 0)} = <b>${m > 0 ? R2(c / m, 2) : '—'} 年</b>`; } }
};
let curTool = 'emit';
function toolsHtml() {
  const t = TOOLS[curTool];
  const fields = t.f.map(([id, lab, u, d, opts]) => opts
    ? `<label style="display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)">${lab}<select id="${id}" onchange="calcRun()" style="font:inherit;padding:8px;border:2px solid var(--line);border-radius:8px;background:#fff">${opts.map(o => `<option value="${o[0]}"${o[0] === d ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></label>`
    : `<label style="display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)">${lab}${u ? `（${u}）` : ''}<input id="${id}" type="number" step="any" inputmode="decimal" value="${d}" oninput="calcRun()" style="font:inherit;padding:8px;border:2px solid var(--line);border-radius:8px"></label>`).join('');
  return `<div class="panel" id="tools"><h2>🧮 計算工具</h2><p style="margin:0 0 10px;color:var(--mute);font-size:14px">輸入現場或題目的數字，馬上算出結果。結果僅供學習與初步評估，正式判定請以法規及專業評估為準。</p>
  <label style="display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2);margin-bottom:12px">選擇工具<select onchange="curTool=this.value;$('#tools').outerHTML=toolsHtml();calcRun()" style="font:inherit;font-weight:700;padding:10px;border:2px solid var(--ink);border-radius:10px;background:#fff">${Object.entries(TOOLS).map(([k, v]) => `<option value="${k}"${k === curTool ? ' selected' : ''}>${v.name}</option>`).join('')}</select></label>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">${fields}</div>
  <div id="calcOut" class="card30" style="margin-top:12px;line-height:1.8"></div>
  <h2 style="margin-top:20px">📎 官方資料</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px">${LINKS.map(l => `<a href="${l[1]}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:var(--ink);background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:10px 12px"><b>${l[0]}</b><br><small style="color:var(--mute)">${l[2]}</small></a>`).join('')}</div></div>`;
}
function calcRun() { const o = document.getElementById('calcOut'); if (!o) return; try { o.innerHTML = TOOLS[curTool].run(); } catch (e) { o.innerHTML = '請確認輸入的數字。'; } }
function toolsView() { mock = null; drill = null; setNav('tools'); $('#app').innerHTML = `<h1>計算工具</h1><p class="sub">練習題算完想驗證，或工作上想快速估算碳排、碳費，都可以用這裡。</p>` + toolsHtml() + sponsor() + foot(); calcRun(); window.scrollTo(0, 0); say('present', '選一個工具、輸入數字就會即時算出來。下面有 iPAS、環境部和能源署的官方連結，制度數值以最新公告為準。'); }

// ---------- 學習紀錄 ----------
let confirmReset = false;
function records() {
  setNav('rec'); const t = S.total, v = S.variant, d = S.drill;
  let h = `<h1>學習紀錄</h1><p class="sub">紀錄只存在這台裝置的瀏覽器裡，換手機或清除瀏覽資料就會歸零。</p>
  <div class="stat"><div><b>${t.n}</b><small>總作答題數</small></div><div><b>${pct(t) ?? '—'}${t.n ? '%' : ''}</b><small>整體正確率</small></div><div><b>${pct(v) ?? '—'}${v.n ? '%' : ''}</b><small>變形題正確率（${v.n} 題）</small></div><div><b>${pct(d) ?? '—'}${d.n ? '%' : ''}</b><small>特訓正確率（${d.n} 題）</small></div></div>`;
  h += `<div class="panel"><h2>各單元掌握度</h2>${Object.entries(UNITS).map(([k, u]) => { const p = pct(S.units[k]); return `<div class="lrow"><span>${u.icon} ${u.name}</span><div class="bar"><i style="width:${p || 0}%;background:${p === null ? '#ccc' : p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--hi)' : 'var(--ng)'}"></i></div><span>${p === null ? '未練習' : p + '%'}</span></div>`; }).join('')}</div>`;
  const es = Object.entries(S.errs).sort((a, b) => b[1] - a[1]);
  h += `<div class="panel"><h2>常犯錯誤類型</h2>${es.length ? es.map(([k, n]) => `<div class="lrow" style="grid-template-columns:130px 1fr 56px 74px"><span>${k}</span><div class="bar"><i style="width:${n / es[0][1] * 100}%;background:var(--ng)"></i></div><span>${n} 次</span><button class="btn ghost" style="padding:3px 8px;font-size:13px" onclick="startDrillType('${k}')">特訓</button></div>`).join('') : '<p>還沒有錯誤紀錄。</p>'}</div>`;
  const gs = Object.entries(S.gens).filter(([k]) => G[k]).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n);
  if (gs.length) h += `<div class="panel"><h2>各考點明細</h2>${gs.map(([k, g]) => `<div class="lrow"><span style="font-size:13px">${(g.st || 0) >= 2 ? '✔ ' : g.w ? '⏳ ' : ''}${g.t}</span><div class="bar"><i style="width:${g.c / g.n * 100}%"></i></div><span>${g.c}/${g.n}</span></div>`).join('')}<p style="font-size:13px;color:var(--mute)">✔ 連續答對 2 次（精熟）　⏳ 有錯誤紀錄、尚未精熟</p><div class="row">${weakGens().length ? `<button class="btn yel" onclick="startDrill()">🎯 錯題特訓（${weakGens().length} 個考點）</button>` : ''}</div></div>`;
  h += `<div class="panel"><button class="btn ghost" onclick="confirmReset=true;records()">清除所有紀錄</button>${confirmReset ? `<div class="confirm">確定要清除嗎？清除後無法復原。<div class="row"><button class="btn" style="border-color:var(--ng);color:var(--ng)" onclick="S=blank();save();confirmReset=false;records()">確定清除</button><button class="btn ghost" onclick="confirmReset=false;records()">取消</button></div></div>` : ''}</div>` + sponsor() + foot();
  $('#app').innerHTML = h;
  const te = topErr();
  say('present', t.n ? `你已經練了 <b>${t.n}</b> 題，正確率 ${pct(t)}%。${te ? `最該加強的是「<b>${te[0]}</b>」。` : ''}` : '還沒有紀錄喔，先去練幾題吧！', te ? [['🎯 針對特訓', `startDrillType('${te[0]}')`]] : []);
}
function foot() { return `<div class="foot">題目由程式依公式隨機產生，作為練習用途，並非 iPAS 官方題庫；碳費費率、電力係數等制度數值請以<a href="https://www.cca.gov.tw/" target="_blank" rel="noopener">環境部氣候變遷署</a>、<a href="https://www.moeaea.gov.tw/" target="_blank" rel="noopener">經濟部能源署</a>最新公告為準。考試資訊：<a href="https://ipd.nat.gov.tw/ipas/certification/NZ/exam-info" target="_blank" rel="noopener">iPAS 淨零碳規劃管理師</a>。快捷鍵：作答時可按 1–4 或 A–D。　<a href="${SPONSOR}" target="_blank" rel="noopener noreferrer sponsored">☕ 贊助作者</a></div>`; }

document.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input,select,textarea')) return;
  const m = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()]; if (m === undefined || !cur) return;
  if (mock && cur.chosen == null) mockAns(m); else if (!mock && document.querySelector('.opt:not(:disabled)')) answer(m);
});
home();

</script>
