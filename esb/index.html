<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="就業服務乙級免費陪考網頁（中文／English／Filipino／Bahasa Indonesia／Tiếng Việt／ไทย）：就保、勞基、身障定額等計算題隨機出題，法規觀念題含複選，答錯會診斷錯因並針對弱點特訓。">

<title>就服乙級 AI 陪考小家教</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--ink2:#3d4a66;--mute:#6b7690;--line:#e3e6ee;--bg:#f6f4ee;--card:#fff;--hi:#f2b705;--hi2:#fff4cc;--ok:#1f8a4c;--okbg:#e6f5ec;--ng:#c0392b;--ngbg:#fdecea;--blue:#2459c7;--bluebg:#eaf0fc}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.hwrap{max-width:880px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;cursor:pointer}
.logo .tag{background:var(--hi);color:var(--ink);font-size:12px;padding:2px 8px;border-radius:4px;font-weight:900}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:transparent;border:0;color:#c9d1e3;font:inherit;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on,nav button:hover{background:#ffffff1a;color:#fff}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--hi) 0 14px,var(--ink) 14px 28px)}
#fb{scroll-margin-top:80px}
main{max-width:880px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:26px;margin:4px 0 6px;font-weight:900}
h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font:inherit;color:inherit}
.ucard:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 18px #14213d14}
.ucard .ic{font-size:26px}
.ucard b{display:block;font-size:17px;margin:4px 0}
.ucard small{color:var(--mute)}
.bar{height:6px;background:#eef0f5;border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
.ucard.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.ucard.dark small{color:#c9d1e3}
.ucard.yel{background:var(--hi2);border-color:#f0d980}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bd{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef0f5;color:var(--ink2)}
.bd.lv{background:var(--ink);color:#fff}
.bd.var{background:var(--hi);color:var(--ink)}
.stem{font-size:18px;font-weight:500;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);transition:.12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:#eef0f5;display:grid;place-items:center;font-weight:900}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}.opt.ng .k{background:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.opt .num{font-family:"JetBrains Mono",monospace}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}
.btn.yel{background:var(--hi);border-color:var(--hi)}
.btn.ghost{border-color:var(--line)}
.btn:hover{filter:brightness(.95)}
.hint{margin-top:12px;background:var(--bluebg);border-radius:10px;padding:10px 14px;color:var(--blue);font-size:15px}
.verdict{border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;margin-bottom:14px}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.ng{background:var(--ngbg);color:var(--ng)}
.stage{border-left:4px solid var(--ink);padding:2px 0 2px 14px;margin:18px 0}
.stage h3{margin:0 0 8px;font-size:15px;letter-spacing:.03em;color:var(--ink2)}
.stage h3 span{background:var(--ink);color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px;font-size:12px}
.etype{display:inline-block;background:var(--ng);color:#fff;font-weight:700;padding:2px 10px;border-radius:6px;margin-bottom:6px}
.etype.okt{background:var(--ok)}
.sc{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.sc b.t{display:block;color:var(--ink2);font-size:14px;margin-bottom:4px}
.sc ul{margin:0;padding-left:20px}
.formula{font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:17px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;margin:6px 0;overflow-x:auto}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:3px 0;font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:15px}
.warn{background:var(--hi2);color:#8a5a00;padding:1px 6px;border-radius:4px;font-weight:700}
.card30{background:var(--hi2);border:2px dashed #e0b400;border-radius:12px;padding:14px 16px}
.card30 h4{margin:0 0 6px}
table.ut{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.ut td{border-bottom:1px solid #f0d980;padding:4px 6px}
.prog{height:8px;background:#e8e4d8;border-radius:4px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--hi)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{font-size:28px;font-weight:900;display:block}
.stat small{color:var(--mute)}
.lrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.lrow .bar{margin:0;height:10px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv summary{cursor:pointer;font-weight:500}
.foot{color:var(--mute);font-size:13px;margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--blue)}
.confirm{background:var(--ngbg);border-radius:10px;padding:12px;margin-top:10px}
@media(max-width:560px){.stem{font-size:16px}.lrow{grid-template-columns:96px 1fr 56px}h1{font-size:22px}}

/* v2 安安老師導引（v3.1 預設小尺寸，一進站即出現） */
.tutor{position:fixed;right:10px;bottom:0;z-index:20;display:flex;align-items:flex-end;pointer-events:none}
.tutor img{height:230px;width:auto;display:block;filter:drop-shadow(0 6px 14px #14213d40);pointer-events:auto;cursor:pointer}
.tcol{display:flex;flex-direction:column;align-items:center}
.tsw{pointer-events:auto;display:flex;gap:2px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px;margin:2px 0 6px;box-shadow:0 2px 8px #14213d30}
.tsw button{font:inherit;font-size:12px;font-weight:700;border:0;background:transparent;color:var(--ink2);border-radius:999px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.tsw button.on{background:var(--ink);color:#fff}
.tbub{pointer-events:auto;max-width:270px;background:#fff;border:2px solid var(--ink);border-radius:14px 14px 4px 14px;padding:10px 12px 8px;margin:0 -4px 140px 0;box-shadow:0 8px 22px #14213d26;font-size:14.5px;line-height:1.55;position:relative;animation:pop .25s ease}
.tbub b.nm{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.tbub .x{position:absolute;top:3px;right:7px;border:0;background:none;font-size:15px;color:var(--mute);cursor:pointer}
.tbub .act{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.tbub .act button{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--ink);background:var(--hi);border-radius:8px;padding:3px 9px;cursor:pointer}
.tutor.min .tbub{display:none}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
main{padding-bottom:250px}
@media(max-width:700px){.tutor{right:4px}.tutor img{height:140px}.tsw button{font-size:11px;padding:2px 7px}.tbub{max-width:min(230px,60vw);margin-bottom:84px;font-size:13.5px;padding:8px 10px 6px}main{padding-bottom:170px}}
.spon{background:linear-gradient(135deg,var(--hi2),#fff);border:2px solid #f0d980;border-radius:14px;padding:16px 18px;margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.spon p{margin:0;flex:1;min-width:200px}
.spon a{background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:10px}
.bd.dr{background:#7a3cd6;color:#fff}
.bd.mul{background:var(--blue);color:#fff}
.opt.pick{border-color:var(--blue);background:var(--bluebg)}.opt.pick .k{background:var(--blue);color:#fff}
.opt.ok.miss{border-style:dashed}
.lsel{display:flex;align-items:center;gap:4px;color:#c9d1e3;font-size:14px}.lsel select{font:inherit;font-size:14px;font-weight:700;background:#ffffff1a;color:#fff;border:1px solid #ffffff40;border-radius:6px;padding:4px 6px;max-width:150px}.lsel option{color:#14213d}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* v6 考試用計算機 */
.tutor.cxon img{opacity:.3;pointer-events:none}
.cxbox{margin-top:14px;border:2px solid var(--ink);border-radius:12px;background:#f3f5fa}
.cxbox summary{cursor:pointer;font-weight:700;padding:10px 14px;list-style:none}
.cxbox summary::-webkit-details-marker{display:none}
.cxbox summary small{color:var(--mute);font-weight:500}
.cxwrap{padding:0 12px 12px}
.cxhist{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--mute);text-align:right;min-height:18px;overflow-x:auto;white-space:nowrap}
.cxin{width:100%;box-sizing:border-box;font-family:"JetBrains Mono",monospace;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff;text-align:right}
.cxout{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;text-align:right;padding:6px 4px;color:var(--ink);overflow-x:auto;white-space:nowrap}
.cxkeys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cxk{font:inherit;font-weight:700;font-size:16px;min-height:44px;border:1px solid #c9cfdc;border-radius:8px;background:#e6e9f1;color:var(--ink);cursor:pointer}
.cxk.cxn{background:#fff}
.cxk.cxs{background:var(--ink);color:#fff;border-color:var(--ink)}
.cxk:active{transform:translateY(1px)}
.cxfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><div class="logo" onclick="go('home')">🤝 <span id="logoT">就服乙級陪考小家教</span> <span class="tag">BETA</span></div>
<nav><button data-v="home" onclick="go('home')">練習</button><button data-v="mock" onclick="startMock()">模擬考</button><button data-v="tools" onclick="go('tools')">計算工具</button><button data-v="rec" onclick="go('rec')">學習紀錄</button></nav><div id="lsw"></div></div><div class="stripe"></div></header>
<main id="app"></main>
<div class="tutor" id="tutor"><div class="tbub" id="tbub"></div><div class="tcol"><img id="timg" alt="安安老師" title="點我收合／展開"><div class="tsw" id="tsw" role="group" aria-label="選擇老師"><button data-g="f" onclick="setTeacher('f')">👩‍🏫 女老師</button><button data-g="m" onclick="setTeacher('m')">👨‍🏫 男老師</button></div></div></div>
<script>
// ===== 就服乙級陪考：多語題目產生器（純邏輯，無 DOM） =====
const STR = {};
// [zh, en, fil, id, vi, th]
Object.assign(STR, {
// ---- units of measure ----
"u.yuan": ["元", "NTD", "NTD", "NTD", "Đài tệ", "NTD"],
"u.day": ["日", "days", "araw", "hari", "ngày", "วัน"],
"u.ppl": ["人", "people", "tao", "orang", "người", "คน"],
"u.mon": ["個月", "months", "buwan", "bulan", "tháng", "เดือน"],
"u.times": ["倍", "×", "×", "×", "lần", "เท่า"],
"u.hr": ["小時", "hours", "oras", "jam", "giờ", "ชั่วโมง"],
"u.yr": ["年", "years", "taon", "tahun", "năm", "ปี"],

// ---- error types ----
"e.law": ["法定數字記錯", "Wrong legal figure", "Maling numero ng batas", "Angka hukum keliru", "Nhớ sai con số luật định", "จำตัวเลขตามกฎหมายผิด"],
"e.concept": ["觀念／定義混淆", "Concept/definition mix-up", "Nalitong konsepto/kahulugan", "Konsep/definisi tertukar", "Nhầm khái niệm/định nghĩa", "สับสนแนวคิด/นิยาม"],
"e.scope": ["適用對象或範圍誤判", "Wrong scope or target group", "Maling saklaw o grupo", "Salah sasaran atau cakupan", "Sai đối tượng hoặc phạm vi", "ตีความขอบเขต/กลุ่มเป้าหมายผิด"],
"e.base": ["計算基準誤用", "Wrong calculation base", "Maling batayan ng kalkulasyon", "Dasar perhitungan keliru", "Dùng sai cơ sở tính", "ใช้ฐานการคำนวณผิด"],
"e.math": ["計算錯誤", "Calculation error", "Mali sa kalkulasyon", "Salah hitung", "Tính toán sai", "คำนวณผิด"],
"e.read": ["題意判讀錯誤", "Misread the question", "Mali ang pagbasa sa tanong", "Salah membaca soal", "Đọc sai đề", "อ่านโจทย์ผิด"],
"e.miss": ["複選漏選或多選", "Missed/extra choice (multi-select)", "Kulang/sobrang pili (multi-select)", "Kurang/lebih pilih (pilihan ganda)", "Chọn thiếu/thừa (nhiều đáp án)", "เลือกขาด/เกิน (หลายคำตอบ)"],
"e.mathWhy": ["數字計算有誤，請把公式分段寫出來，每一步都寫單位再驗算。", "Arithmetic slip. Write the formula step by step with units and check again.", "May mali sa pagkalkula. Isulat ang formula nang hakbang-hakbang na may unit at suriin muli.", "Ada salah hitung. Tulis rumus langkah demi langkah beserta satuannya lalu periksa lagi.", "Tính nhầm. Hãy viết công thức từng bước kèm đơn vị rồi kiểm tra lại.", "คำนวณพลาด ให้เขียนสูตรทีละขั้นพร้อมหน่วย แล้วตรวจอีกครั้ง"],

// ---- generic cards ----
"gc.math": ["計算機分段算：先寫公式 → 代入數字 → 每一步寫單位。金額題最後才四捨五入，人數題注意「小數點以下不計」。", "Use the calculator in steps: formula → numbers → units at each step. Round money only at the end; for head counts, drop decimals.", "Hakbang-hakbang sa calculator: formula → numero → unit sa bawat hakbang. I-round ang pera sa dulo lamang; sa bilang ng tao, alisin ang decimal.", "Hitung bertahap: rumus → angka → satuan di tiap langkah. Bulatkan uang di akhir saja; untuk jumlah orang, buang desimal.", "Bấm máy từng bước: công thức → thay số → ghi đơn vị mỗi bước. Tiền chỉ làm tròn ở cuối; số người thì bỏ phần thập phân.", "กดเครื่องคิดเลขทีละขั้น: สูตร → แทนตัวเลข → ใส่หน่วยทุกขั้น ปัดเศษเงินตอนท้ายเท่านั้น จำนวนคนให้ตัดทศนิยมทิ้ง"],
"gc.read": ["讀題三圈：①圈「求什麼」（每月？總額？人數？）②圈條件（年齡、扶養人數、年資、平日或休息日）③刪掉用不到的數字。", "Read in three passes: ① what is asked (monthly? total? people?) ② the conditions (age, dependents, seniority, workday or rest day) ③ cross out unused numbers.", "Basahin nang tatlong beses: ① ano ang tinatanong (buwanan? kabuuan? tao?) ② mga kondisyon (edad, dependent, tagal ng serbisyo, araw ng trabaho o pahinga) ③ alisin ang hindi kailangang numero.", "Baca tiga kali: ① apa yang ditanya (bulanan? total? orang?) ② syaratnya (usia, tanggungan, masa kerja, hari kerja atau libur) ③ coret angka yang tidak dipakai.", "Đọc đề ba lượt: ① hỏi gì (mỗi tháng? tổng? số người?) ② điều kiện (tuổi, người phụ thuộc, thâm niên, ngày làm hay ngày nghỉ) ③ gạch số không dùng.", "อ่านโจทย์ 3 รอบ: ① ถามอะไร (รายเดือน? รวม? จำนวนคน?) ② เงื่อนไข (อายุ ผู้อยู่ในอุปการะ อายุงาน วันทำงานหรือวันหยุด) ③ ขีดฆ่าตัวเลขที่ไม่ใช้"],
"gc.miss": ["複選題要全對才給分：每個選項獨立判斷「對／錯」，不要因為已經選了兩個就停。題目有「下列何者正確」通常不只一個。", "Multi-select scores only if fully correct: judge each option on its own; don't stop after picking two.", "Sa multi-select, kailangang tama lahat: suriin ang bawat opsyon nang hiwalay; huwag tumigil pagkatapos pumili ng dalawa.", "Pilihan ganda hanya dinilai jika benar semua: nilai tiap opsi sendiri-sendiri; jangan berhenti setelah memilih dua.", "Câu nhiều đáp án phải đúng hết mới có điểm: xét từng lựa chọn riêng; đừng dừng lại khi đã chọn hai.", "ข้อหลายคำตอบต้องถูกทั้งหมดจึงได้คะแนน: พิจารณาทีละตัวเลือก อย่าหยุดเพียงเพราะเลือกไปสองข้อแล้ว"],

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// 錯誤類型：內部用代碼，顯示時翻譯
const ERR = { law: 'law', concept: 'concept', scope: 'scope', base: 'base', math: 'math', read: 'read', miss: 'miss' };
const ERR_ZH = { '法定數字記錯': 'law', '觀念／定義混淆': 'concept', '適用對象或範圍誤判': 'scope', '計算基準誤用': 'base', '計算錯誤': 'math', '題意判讀錯誤': 'read', '複選漏選或多選': 'miss' };
const errName = c => L('e.' + c);

function numOptions(ans, dists, dec, unit, ints) {
  const tx = v => fm(v, dec) + ' ' + unit;
  const opts = [{ v: ans, text: tx(ans), correct: true }];
  const ok = v => isFinite(v) && v >= 0 && opts.every(o => o.text !== tx(v) && (ints ? Math.round(v) !== Math.round(o.v) : Math.abs(v - o.v) / Math.max(Math.abs(o.v), 1e-9) > 0.02));
  for (const d of dists) { if (opts.length >= 4) break; if (ok(d.v)) opts.push({ v: d.v, text: tx(d.v), correct: false, type: d.type, why: d.why }); }
  const fillers = ints ? [1, 2, -1, 3, -2, 4] : [1.5, 0.6, 2, 0.8, 1.25, 0.4, 3];
  for (const k of fillers) { if (opts.length >= 4) break; const v = ints ? ans + k : ans * k; if (ok(v)) opts.push({ v, text: tx(v), correct: false, type: ERR.math, why: L('e.mathWhy') }); }
  return shuffle(opts);
}
function textOptions(correctText, dists) {
  const opts = [{ text: correctText, correct: true }];
  for (const d of dists) { if (opts.length >= 4) break; if (opts.every(o => o.text !== d.text)) opts.push({ text: d.text, correct: false, type: d.type, why: d.why }); }
  return shuffle(opts);
}
function numTable() { const r = []; for (let i = 1; i <= 12; i++) r.push([L('nt.' + i + 'a'), L('nt.' + i + 'b')]); return r; }
function genericCard(t) { return { math: L('gc.math'), read: L('gc.read'), miss: L('gc.miss'), scope: L('gc.scope') }[t]; }

    { q: '依性別平等工作法，受僱者妊娠期間，雇主應給予產檢假幾日？', a: '7 日', d: [['5 日', ERR.law, '已修法為 7 日。'], ['3 日', ERR.law, '是 7 日。'], ['10 日', ERR.law, '是 7 日。']], ex: '性別平等工作法第 15 條：受僱者妊娠期間，雇主應給予產檢假 7 日；配偶陪產檢及陪產假 7 日。' },
    { q: '關於生理假，下列敘述哪些正確？（複選）', m: [['女性受僱者每月得請生理假 1 日', true], ['全年請假日數未逾 3 日者，不併入病假計算', true], ['不併入病假之生理假，薪資減半發給', true], ['生理假一律併入病假計算', false, ERR.law, '全年 3 日內不併入病假。']], ex: '性別平等工作法第 14 條：每月得請生理假 1 日，全年未逾 3 日不併入病假，其餘併入病假；併入及不併入病假之生理假薪資，減半發給。' },
    { q: '子女未滿 2 歲須受僱者親自哺（集）乳者，雇主除規定之休息時間外，應每日另給哺（集）乳時間幾次、每次多久？', a: '2 次，每次 30 分鐘', d: [['1 次，60 分鐘', ERR.law, '是每日 2 次、每次 30 分鐘。'], ['2 次，每次 15 分鐘', ERR.law, '每次 30 分鐘。'], ['3 次，每次 20 分鐘', ERR.law, '是每日 2 次、每次 30 分鐘。']], ex: '性別平等工作法第 18 條：每日另給哺（集）乳時間 60 分鐘（可分 2 次、每次 30 分鐘），視為工作時間；延長工時達 1 小時以上者，另給 30 分鐘。' },
    { q: '受僱者任職滿 6 個月後，於每一子女滿 3 歲前得申請育嬰留職停薪，期間至該子女滿 3 歲止，但不得逾多久？', a: '2 年', d: [['1 年', ERR.law, '是 2 年。'], ['3 年', ERR.read, '3 歲是子女年齡上限，留停期間最長 2 年。'], ['6 個月', ERR.scope, '6 個月是就保育嬰留停津貼的最長發給期間。']], ex: '性別平等工作法第 16 條：育嬰留職停薪期間至該子女滿 3 歲止，但不得逾 2 年。' },
    { q: '依性別平等工作法第 23 條，僱用受僱者多少人以上之雇主，應提供托兒設施或適當之托兒措施？', a: '100 人以上', d: [['250 人以上', ERR.law, '舊法是 250 人，已修正為 100 人。'], ['30 人以上', ERR.law, '是 100 人。'], ['50 人以上', ERR.law, '是 100 人。']], ex: '性別平等工作法第 23 條：僱用受僱者 100 人以上之雇主，應提供哺（集）乳室與托兒設施或適當之托兒措施。' },
    { q: '依勞工退休金條例，雇主每月負擔之勞工退休金提繳率，不得低於勞工每月工資的多少？', a: '6%', d: [['2%', ERR.law, '是 6%。'], ['4%', ERR.law, '是 6%。'], ['15%', ERR.law, '舊制勞工退休準備金提撥率是 2%～15%，別搞混。']], ex: '勞工退休金條例第 14 條：雇主應為勞工按月提繳退休金，提繳率不得低於勞工每月工資 6%；勞工得在 6% 範圍內自願提繳。' },
    { q: '家庭照顧假全年以幾日為限，並併入事假計算？', a: '7 日', d: [['3 日', ERR.law, '是 7 日。'], ['14 日', ERR.law, '是 7 日。'], ['5 日', ERR.law, '是 7 日。']], ex: '性別平等工作法第 20 條：家庭照顧假其請假日數併入事假計算，全年以 7 日為限。' },
    { q: '依勞資爭議處理法，下列何種勞資爭議「不得」罷工？', a: '權利事項之勞資爭議', d: [['調整事項之勞資爭議', ERR.concept, '調整事項經調解不成立，工會可依法罷工。'], ['工資調整之爭議', ERR.concept, '屬調整事項。'], ['團體協約內容協商之爭議', ERR.concept, '屬調整事項。']], ex: '勞資爭議處理法第 53 條：勞資爭議非經調解不成立，不得罷工；權利事項之勞資爭議，不得罷工。權利事項：依法令、團體協約、勞動契約之權利義務爭議；調整事項：勞動條件主張繼續維持或變更之爭議。' },
    { q: '依勞工職業災害保險及保護法，受僱於登記有案事業單位之勞工，投保規定為何？', a: '不論僱用人數，一律強制加保', d: [['僱用 5 人以上才強制加保', ERR.scope, '5 人以上是勞保的強制門檻；職災保險不論人數。'], ['勞工自願選擇是否加保', ERR.concept, '屬強制加保。'], ['僅限製造業強制加保', ERR.scope, '不限行業。']], ex: '災保法第 6 條：年滿 15 歲以上受僱於領有執業證照、依法已辦理登記、設有稅籍或經中央主管機關依法核發聘僱許可之雇主之勞工，應以雇主為投保單位，參加本保險。不論僱用人數。' }
  ],
  equity: [
    { q: '私立學校、團體及民營事業機構，依身心障礙者權益保障法負有定額進用義務之標準為何？', a: '員工總人數 67 人以上，不得低於 1%，且不得少於 1 人', d: [['員工總人數 34 人以上，不得低於 3%', ERR.scope, '這是公部門標準。'], ['員工總人數 100 人以上，不得低於 1%', ERR.law, '100 人是舊法門檻。'], ['員工總人數 50 人以上，不得低於 2%', ERR.law, '無此規定。']], ex: '身心障礙者權益保障法第 38 條第 2 項：私立學校、團體及民營事業機構員工總人數在 67 人以上者，進用身心障礙者人數不得低於 1%，且不得少於 1 人。' },
    { q: '依身心障礙者權益保障法，進用重度以上身心障礙者，每進用 1 人以幾人核計？', a: '2 人', d: [['1.5 人', ERR.law, '是 2 人。'], ['3 人', ERR.law, '是 2 人。'], ['1 人', ERR.law, '重度以上加倍核計。']], ex: '身心障礙者權益保障法第 38 條：進用重度以上之身心障礙者，每進用 1 人以 2 人核計。' },
    { q: '定額進用之員工總人數及進用身心障礙者人數，以何時參加勞保、公保之人數為準？', a: '每月 1 日', d: [['每月最後一日', ERR.law, '是每月 1 日。'], ['每月 15 日', ERR.law, '是每月 1 日。'], ['每年度平均人數', ERR.concept, '按月計算，以每月 1 日為準。']], ex: '身心障礙者權益保障法第 38 條第 3 項：員工總人數及進用人數之計算，以每月 1 日參加勞保、公保人數為準。' },
    { q: '進用身心障礙者未達法定標準者，差額補助費如何計算？', a: '差額人數乘以每月基本工資', d: [['差額人數乘以平均月投保薪資', ERR.base, '基準是每月基本工資。'], ['差額人數乘以每月基本工資再乘以 12', ERR.read, '按月繳納，不是一次繳一年。'], ['依員工總人數固定繳納', ERR.concept, '依差額人數計算。']], ex: '身心障礙者權益保障法第 43 條第 2 項：差額補助費依差額人數乘以每月基本工資計算，應於每月 10 日前繳納。' },
    { q: '從事部分工時之身心障礙員工，月領薪資達按月計酬基本工資二分之一以上者，如何計入進用人數？', a: '進用 2 人得以 1 人計入', d: [['進用 1 人即以 1 人計入', ERR.law, '部分工時須 2 人折算 1 人。'], ['一律不得計入', ERR.concept, '達基本工資 1/2 以上可以折算計入。'], ['進用 3 人以 1 人計入', ERR.law, '是 2 人以 1 人計。']], ex: '身心障礙者權益保障法第 38 條第 4 項：月領薪資未達基本工資者不計入；但部分工時月領薪資達基本工資 1/2 以上者，進用 2 人得以 1 人計入。' },
    { q: '依原住民族工作權保障法第 4 條，各級政府機關僱用約僱人員、駐衛警察、技工、工友、清潔工等之總額，每滿多少人應有原住民 1 人？', a: '100 人', d: [['50 人', ERR.law, '是每滿 100 人。'], ['67 人', ERR.scope, '67 人是私部門身障定額進用門檻。'], ['34 人', ERR.scope, '34 人是公部門身障定額進用門檻。']], ex: '原住民族工作權保障法第 4 條：各級政府機關、公立學校及公營事業機構（澎湖、金門、連江縣除外）僱用上述人員之總額，每滿 100 人應有原住民 1 人。' }
  ],
  market: [
    { q: '依主計總處人力資源調查，「失業者」必須同時具備哪些條件？（複選）', m: [['無工作', true], ['隨時可以工作', true], ['正在找工作或已找工作在等待結果', true], ['正在領取失業給付', false, ERR.scope, '有沒有領失業給付，與統計上的失業定義無關。']], ex: '失業者：年滿 15 歲，同時具有無工作、隨時可以工作、正在找工作或已找工作在等待結果之條件者；另包括等待恢復工作者及已找到職業而未開始工作亦無報酬者。' },
    { q: '「勞動力」是指下列何者？', a: '就業者 + 失業者', d: [['15 歲以上民間人口', ERR.base, '還要扣除非勞動力。'], ['就業者 + 非勞動力', ERR.concept, '非勞動力不屬於勞動力。'], ['就業者', ERR.concept, '失業者也算勞動力。']], ex: '勞動力 = 就業者 + 失業者；15 歲以上民間人口 = 勞動力 + 非勞動力。' },
    { q: '因產業結構改變，求職者技能與職缺需求不符所造成的失業，稱為？', a: '結構性失業', d: [['摩擦性失業', ERR.concept, '摩擦性是轉換工作時因資訊不足造成的短期失業。'], ['循環性失業', ERR.concept, '循環性是景氣衰退造成。'], ['季節性失業', ERR.concept, '季節性是產業淡旺季造成。']], ex: '結構性失業：產業結構或技術改變，勞工技能、地區與職缺不配合；對策為職業訓練、轉業輔導。' },
    { q: '勞工轉換工作期間，因勞動市場資訊不完全、需要時間尋職而產生的短期失業，稱為？', a: '摩擦性失業', d: [['結構性失業', ERR.concept, '結構性是技能與職缺不符。'], ['循環性失業', ERR.concept, '循環性是景氣造成。'], ['隱藏性失業', ERR.concept, '隱藏性是名義上有工作但生產力低。']], ex: '摩擦性失業：資訊不完全造成的短期失業；對策為加強就業資訊與媒合服務。' },
    { q: '下列哪些屬於「非勞動力」？（複選）', m: [['求學及準備升學者', true], ['料理家務者', true], ['高齡、身心障礙而未找工作者', true], ['已找工作正在等待結果者', false, ERR.concept, '屬失業者，算在勞動力裡。']], ex: '非勞動力：15 歲以上民間人口中，不屬於就業者或失業者，例如求學、料理家務、高齡、身心障礙、想工作而未找工作等。' },
    { q: '求供倍數大於 1，代表什麼意義？', a: '求才人數多於求職人數，工作機會相對較多', d: [['求職人數多於求才人數', ERR.base, '分子是求才、分母是求職，大於 1 表示求才較多。'], ['失業率高於 1%', ERR.concept, '求供倍數與失業率是不同指標。'], ['勞動力參與率上升', ERR.concept, '無直接關係。']], ex: '求供倍數 = 求才人數 ÷ 求職人數；大於 1 表示職缺多於求職者。' },
    { q: '我國人力資源調查統計之對象，為年滿幾歲以上之民間人口？', a: '15 歲', d: [['16 歲', ERR.law, '是 15 歲。'], ['18 歲', ERR.law, '是 15 歲。'], ['20 歲', ERR.law, '是 15 歲。']], ex: '人力資源調查以年滿 15 歲以上民間人口為對象（不含現役軍人及監管人口）。' }
  ],
  recruit: [
    { q: '職務分析的產出中，「工作規範」主要記載什麼？', a: '任職者應具備的知識、技能、能力等資格條件', d: [['工作的職責、內容與工作條件', ERR.concept, '這是「工作說明書」。'], ['薪資與福利制度', ERR.concept, '非工作規範內容。'], ['組織架構與部門編制', ERR.concept, '非工作規範內容。']], ex: '工作說明書（Job Description）寫「這份工作做什麼」；工作規範（Job Specification）寫「什麼樣的人能做」。' },
    { q: '行為事例面談常用的 STAR 原則，依序代表？', a: '情境、任務、行動、結果', d: [['優勢、威脅、行動、回饋', ERR.concept, '混到 SWOT 的概念。'], ['標準、目標、態度、評分', ERR.concept, '非 STAR。'], ['情境、思考、態度、回應', ERR.concept, '非 STAR。']], ex: 'STAR：Situation（情境）、Task（任務）、Action（行動）、Result（結果），用過去行為預測未來表現。' },
    { q: '面試官因應徵者畢業於名校，就認定其各方面能力都很優秀，屬於何種評估偏誤？', a: '月暈效應', d: [['對比效應', ERR.concept, '對比效應是受前一位應徵者表現影響。'], ['趨中傾向', ERR.concept, '趨中傾向是評分集中在中間。'], ['近因效應', ERR.concept, '近因效應是被最後的印象影響。']], ex: '月暈效應（Halo Effect）：因某一突出特質而影響對整體的評價；可用結構式面談與多位評分者降低。' },
    { q: '評鑑中心法（Assessment Center）常用的演練有哪些？（複選）', m: [['公文籃演練', true], ['無領導者小組討論', true], ['角色扮演', true], ['電話向前雇主查詢', false, ERR.concept, '屬背景查核（推薦查核），不是評鑑中心演練。']], ex: '評鑑中心法以多種情境模擬（公文籃、無領導者小組討論、角色扮演、簡報等），由多位受訓評審觀察評分。' },
    { q: '下列何者是「內部招募」的優點？', a: '激勵員工士氣，且員工熟悉組織文化', d: [['能引進新觀念，避免近親繁殖', ERR.concept, '這是外部招募的優點。'], ['可選擇的人才範圍較廣', ERR.concept, '這是外部招募的優點。'], ['不會造成未獲選員工不滿', ERR.concept, '內部招募反而可能造成未獲選者不滿。']], ex: '內部招募：激勵士氣、成本低、適應快；缺點為人才來源有限、近親繁殖、未獲選者不滿。' },
    { q: '甄選測驗的分數與錄取者日後工作績效具有高度相關，表示該測驗具有良好的？', a: '預測效度（效標關聯效度）', d: [['內容效度', ERR.concept, '內容效度是題目能否代表工作內容。'], ['再測信度', ERR.concept, '信度是穩定性，不是預測力。'], ['表面效度', ERR.concept, '表面效度是看起來是否相關。']], ex: '效標關聯效度分為同時效度與預測效度；預測效度以日後工作績效為效標。' },
    { q: '結構式面談的主要特點為何？', a: '依事先設計的問題與評分標準進行，信效度較高', d: [['由面試官自由發問，彈性最大', ERR.concept, '這是非結構式面談。'], ['只看履歷不需面談', ERR.concept, '非面談方法。'], ['以壓力情境觀察應徵者反應', ERR.concept, '這是壓力面談。']], ex: '結構式面談：所有應徵者回答相同問題、使用相同評分標準，可降低偏誤、提高信效度。' }
  ],
  career: [

 { q: "Điều nào KHÔNG được liệt kê tại Điều 5 khoản 1 Luật Dịch vụ việc làm là căn cứ phân biệt đối xử bị cấm?", a: "Trình độ học vấn", d: [["Cung hoàng đạo", "Cung hoàng đạo và nhóm máu đều được liệt kê."], ["Ngoại hình", "Ngoại hình và ngũ quan được liệt kê."], ["Từng là thành viên công đoàn", "Tư cách công đoàn trước đây được liệt kê."]], ex: "Điều 5(1) liệt kê: chủng tộc, giai cấp, ngôn ngữ, tư tưởng, tôn giáo, đảng phái, quê quán, nơi sinh, giới tính, xu hướng tính dục, tuổi, hôn nhân, ngoại hình, ngũ quan, khuyết tật, cung hoàng đạo, nhóm máu hoặc từng là thành viên công đoàn. Không có học vấn." },
 { q: "Chủ sử dụng vi phạm Điều 5 khoản 1 (phân biệt đối xử) bị phạt bao nhiêu?", a: "300.000 đến 1.500.000 Đài tệ", d: [["150.000 đến 750.000 Đài tệ", "Đó là mức phạt chứa chấp/thuê người nước ngoài trái phép (Điều 63)."], ["60.000 đến 300.000 Đài tệ", "Sai mức."], ["30.000 đến 150.000 Đài tệ", "Sai mức."]], ex: "Điều 65: vi phạm Điều 5(1) bị phạt 300.000–1.500.000 Đài tệ, công bố tên và buộc khắc phục." },
 { q: "Khi tuyển dụng, nếu lương thường xuyên của vị trí dưới mức nào thì phải công khai khoảng lương?", a: "40.000 Đài tệ", d: [["30.000 Đài tệ", "Mức là 40.000."], ["50.000 Đài tệ", "Mức là 40.000."], ["Lương tối thiểu tháng", "Không phải lương tối thiểu."]], ex: "Điều 5(2)(6): cấm không công khai khoảng lương với vị trí có lương thường xuyên dưới 40.000 Đài tệ." },
 { q: "Khi cho thôi việc, chủ phải thông báo cho cơ quan địa phương và cơ quan dịch vụ việc làm công bao nhiêu ngày trước khi người lao động nghỉ?", a: "10 ngày trước", d: [["3 ngày trước", "3 ngày (sau khi nghỉ) áp dụng cho thiên tai, sự cố."], ["30 ngày trước", "30 ngày là thời hạn báo trước khi làm từ 3 năm."], ["60 ngày trước", "60 ngày là kế hoạch sa thải hàng loạt."]], ex: "Điều 33: thông báo 10 ngày trước khi nghỉ; thiên tai, sự cố thì trong 3 ngày sau khi nghỉ." },
 { q: "Theo Luật Bảo vệ người lao động khi sa thải hàng loạt, kế hoạch sa thải phải gửi cơ quan và niêm yết trước bao nhiêu ngày?", a: "60 ngày trước", d: [["30 ngày trước", "Là 60 ngày."], ["10 ngày trước", "10 ngày là thông báo cho thôi việc thông thường."], ["90 ngày trước", "Là 60 ngày."]], ex: "Điều 4: gửi và niêm yết kế hoạch sa thải 60 ngày trước khi phát sinh tình huống sa thải hàng loạt." },
 { q: "Đối tượng nào KHÔNG thuộc nhóm đặc biệt tại Điều 24 Luật Dịch vụ việc làm?", a: "Sinh viên đại học mới tốt nghiệp", d: [["Phụ nữ quay lại thị trường lao động", "Thuộc nhóm Điều 24."], ["Người được bảo hộ sau khi mãn hạn tù", "Thuộc nhóm Điều 24."], ["Nạn nhân bạo lực gia đình", "Thuộc nhóm Điều 24."]], ex: "Điều 24: trụ cột duy nhất của gia đình, trung niên/cao tuổi, người khuyết tật, người bản địa, hộ nghèo/cận nghèo có khả năng lao động, thất nghiệp dài hạn, phụ nữ quay lại làm việc, nạn nhân bạo lực gia đình, người mãn hạn tù…" },
 { q: "Giấy phép của cơ sở dịch vụ việc làm tư nhân có hiệu lực bao lâu?", a: "2 năm", d: [["1 năm", "2 năm."], ["3 năm", "3 năm là thời hạn tối đa giấy phép lao động nước ngoài."], ["5 năm", "2 năm."]], ex: "Theo quy định, giấy phép có hiệu lực 2 năm và phải gia hạn trước khi hết hạn." },
 { q: "Theo Điều 5 khoản 2, chủ KHÔNG được làm gì khi tuyển dụng hoặc sử dụng lao động? (Chọn tất cả)", m: [["Đăng quảng cáo sai sự thật"], ["Giữ thẻ căn cước của người xin việc trái ý họ"], ["Giữ tài sản hoặc thu tiền đặt cọc"], ["Yêu cầu bản sao chứng chỉ liên quan công việc", "Cần cho công việc, không bị cấm."]], ex: "Điều 5(2) cấm: quảng cáo sai; giữ giấy tờ hoặc đòi dữ liệu riêng tư không cần thiết; giữ tài sản/đặt cọc; giao việc trái thuần phong mỹ tục; khai sai khi thuê người nước ngoài; không công khai khoảng lương dưới 40.000." },
 { q: "Theo Điều 6 Luật Bảo vệ dữ liệu cá nhân, dữ liệu nào thuộc loại đặc biệt? (Chọn tất cả)", m: [["Hồ sơ bệnh án"], ["Thông tin di truyền"], ["Tiền án tiền sự"], ["Địa chỉ email", "Đây là dữ liệu cá nhân thông thường."]], ex: "Điều 6: bệnh án, điều trị, di truyền, đời sống tình dục, khám sức khỏe và tiền án về nguyên tắc không được thu thập, xử lý, sử dụng." },
 { q: "Theo Luật Thúc đẩy việc làm cho người trung niên và cao tuổi, câu nào đúng? (Chọn tất cả)", m: [["Trung niên là từ 45 đến 65 tuổi"], ["Cao tuổi là trên 65 tuổi"], ["Chủ không được đối xử khác biệt vì tuổi"], ["Người cao tuổi không được áp dụng luật này", "Người cao tuổi là đối tượng được bảo vệ."]], ex: "Điều 3: trung niên (45–65), cao tuổi (trên 65); cấm phân biệt vì tuổi." }
],
mig: [
 { q: "Lao động nước ngoài thuộc Điều 46(1)(8)–(10) (như sản xuất, chăm sóc tại gia), mỗi giấy phép tối đa bao lâu?", a: "3 năm", d: [["2 năm", "3 năm."], ["5 năm", "3 năm."], ["1 năm", "3 năm."]], ex: "Điều 52: giấy phép tối đa 3 năm." },
 { q: "Tổng thời gian làm việc tối đa tại Đài Loan của lao động nước ngoài thuộc Điều 46(1)(8)–(11) là bao lâu?", a: "12 năm", d: [["9 năm", "Đã nâng lên 12 năm."], ["6 năm", "12 năm."], ["Không giới hạn", "Lao động chuyên môn (mục 1–7) mới gia hạn không giới hạn tổng."]], ex: "Điều 52: tối đa 12 năm; người chăm sóc tại gia đạt điều kiện đào tạo/kỹ năng tối đa 14 năm." },
 { q: "Nếu lao động nước ngoài bỏ việc mất liên lạc 3 ngày liên tiếp, chủ phải thông báo bằng văn bản trong bao nhiêu ngày?", a: "Trong 3 ngày", d: [["Trong 7 ngày", "3 ngày."], ["Trong 10 ngày", "3 ngày."], ["Trong 30 ngày", "3 ngày."]], ex: "Điều 56: mất liên lạc 3 ngày hoặc chấm dứt hợp đồng, phải báo bằng văn bản cho cơ quan lao động, di trú và cảnh sát trong 3 ngày." },
 { q: "Lần đầu vi phạm chứa chấp người nước ngoài làm việc trái phép (Điều 44) bị phạt bao nhiêu?", a: "150.000 đến 750.000 Đài tệ", d: [["300.000 đến 1.500.000 Đài tệ", "Đó là phân biệt đối xử (Điều 65)."], ["60.000 đến 300.000 Đài tệ", "Sai mức."], ["30.000 đến 150.000 Đài tệ", "Sai mức."]], ex: "Điều 63: phạt 150.000–750.000; tái phạm trong 5 năm: tù đến 3 năm và/hoặc phạt đến 1,2 triệu Đài tệ." },
 { q: "Lao động nước ngoài thuộc Điều 46(1)(8)–(11) phải khám sức khỏe khi nào? (Chọn tất cả)", m: [["Trong 3 ngày sau khi nhập cảnh"], ["Trong 30 ngày trước/sau khi làm đủ 6 tháng"], ["Trong 30 ngày trước/sau khi làm đủ 18 tháng"], ["Trong 30 ngày trước/sau khi làm đủ 12 tháng", "Khám định kỳ vào tháng 6, 18 và 30."]], ex: "Trong 3 ngày sau nhập cảnh, và 30 ngày trước hoặc sau khi làm đủ 6, 18, 30 tháng." },
 { q: "Theo Điều 47, chủ phải làm gì trước khi xin tuyển lao động nước ngoài?", a: "Tuyển trong nước trước với điều kiện hợp lý; chỉ xin phần còn thiếu", d: [["Được hội nghị lao động – quản lý đồng ý rồi tuyển ngay", "Không thay được việc tuyển trong nước."], ["Nộp phí ổn định việc làm là khỏi tuyển trong nước", "Phí nộp sau khi tuyển, không miễn tuyển trong nước."], ["Tuyển thẳng qua công ty môi giới", "Vẫn phải tuyển trong nước."]], ex: "Điều 47: phải tuyển trong nước trước và ưu tiên người trong nước; chỉ phần thiếu mới được thuê lao động nước ngoài." },
 { q: "Theo Điều 55, chủ thuê lao động nước ngoài thuộc Điều 46(1)(8)–(10) phải nộp khoản gì vào Quỹ ổn định việc làm?", a: "Phí ổn định việc làm", d: [["Phí chênh lệch hạn ngạch", "Đó là khi không đủ hạn ngạch khuyết tật."], ["Phí bảo hiểm việc làm", "Đó là phí bảo hiểm."], ["Phí đào tạo nghề", "Không có ở Điều 55."]], ex: "Điều 55: chủ thuê lao động nước ngoài mục 8–10 nộp phí ổn định việc làm." }
],
ei: [
 { q: "Bảo hiểm việc làm áp dụng cho người lao động bao nhiêu tuổi?", a: "15 đến 65 tuổi", d: [["16 đến 60", "15–65."], ["15 đến 60", "Giới hạn trên là 65."], ["18 đến 65", "Giới hạn dưới là 15."]], ex: "Điều 5: người lao động 15–65 tuổi phải được chủ đóng bảo hiểm." },
 { q: "Để hưởng trợ cấp thất nghiệp, cần đóng bảo hiểm bao lâu trong 3 năm trước khi mất việc không tự nguyện?", a: "Ít nhất 1 năm", d: [["Ít nhất 6 tháng", "1 năm."], ["Ít nhất 2 năm", "1 năm."], ["Ít nhất 3 năm", "3 năm là khoảng thời gian xét, không phải yêu cầu."]], ex: "Điều 11: đủ 1 năm bảo hiểm trong 3 năm trước khi nghỉ, có khả năng và muốn làm việc, đăng ký tìm việc và 14 ngày không được giới thiệu việc/đào tạo." },
 { q: "Sau khi đăng ký tìm việc, bao nhiêu ngày không được giới thiệu việc làm/đào tạo thì đủ điều kiện hưởng trợ cấp thất nghiệp?", a: "14 ngày", d: [["7 ngày", "14 ngày."], ["10 ngày", "14 ngày."], ["30 ngày", "14 ngày."]], ex: "Điều 11(1)(1): 14 ngày kể từ khi đăng ký mà không được giới thiệu việc làm hay đào tạo." },
 { q: "Với người lao động có chủ, phí bảo hiểm việc làm được chia thế nào?", a: "Người lao động 20%, chủ 70%, nhà nước 10%", d: [["Người lao động 30%, chủ 60%, nhà nước 10%", "Sai tỷ lệ."], ["Người lao động 10%, chủ 80%, nhà nước 10%", "Sai tỷ lệ."], ["Chủ trả toàn bộ", "Đó là bảo hiểm tai nạn lao động."]], ex: "Người lao động 20%, chủ 70%, nhà nước 10%." },
 { q: "Nếu chủ không đóng bảo hiểm việc làm cho người lao động, bị phạt gấp bao nhiêu lần phí theo Điều 38?", a: "10 lần", d: [["2 lần", "10 lần."], ["4 lần", "10 lần."], ["5 lần", "10 lần."]], ex: "Điều 38(1): phạt gấp 10 lần phí bảo hiểm lẽ ra phải đóng." },
 { q: "Trợ cấp sinh hoạt khi học nghề toàn thời gian được nhận tối đa bao lâu?", a: "6 tháng (không kéo dài theo tuổi hay khuyết tật)", d: [["9 tháng (từ 45 tuổi)", "9 tháng là của trợ cấp thất nghiệp."], ["12 tháng", "Tối đa 6 tháng."], ["3 tháng", "Tối đa 6 tháng."]], ex: "Điều 19: 60% lương bình quân đóng BH mỗi tháng, tối đa 6 tháng." },
 { q: "Những khoản nào là chế độ của Luật Bảo hiểm việc làm? (Chọn tất cả)", m: [["Trợ cấp thất nghiệp"], ["Trợ cấp nghỉ nuôi con"], ["Trợ cấp sinh hoạt học nghề"], ["Trợ cấp hưu trí tuổi già", "Đó là bảo hiểm lao động, không phải bảo hiểm việc làm."]], ex: "Điều 10: trợ cấp thất nghiệp, thưởng sớm có việc, trợ cấp học nghề, trợ cấp nghỉ nuôi con, và hỗ trợ phí bảo hiểm y tế cho người thất nghiệp và người phụ thuộc." },
 { q: "Người đã hưởng đủ thời gian trợ cấp nếu xin lại trong 2 năm thì được hưởng bao lâu?", a: "Tối đa một nửa thời gian ban đầu", d: [["Đủ thời gian như cũ", "Trong 2 năm chỉ được một nửa."], ["Tối đa một phần ba", "Là một nửa."], ["Không được xin trong 2 năm", "Được, nhưng giảm một nửa."]], ex: "Điều 16(3): trong 2 năm sau khi hưởng đủ, lần sau chỉ được một nửa thời gian ban đầu." },
 { q: "Khi đang hưởng trợ cấp, nếu thu nhập tháng vượt mức nào thì không được hưởng?", a: "Lương tối thiểu tháng (trước đây là 'lương cơ bản')", d: [["Lương bình quân đóng BH", "Mức là lương tối thiểu."], ["80% lương bình quân đóng BH", "80% là trần khấu trừ, không phải ngưỡng dừng."], ["20.000 Đài tệ/tháng", "Không có mức cố định."]], ex: "Điều 17: thu nhập vượt lương tối thiểu → không được hưởng; nếu không, thu nhập + trợ cấp vượt 80% lương đóng BH sẽ bị trừ." }
],
labor: [
 { q: "Theo Điều 32 Luật Tiêu chuẩn lao động, về nguyên tắc làm thêm giờ không quá bao nhiêu giờ mỗi tháng?", a: "46 giờ", d: [["54 giờ", "54 giờ là trần linh hoạt khi công đoàn/hội nghị đồng ý (tối đa 138 giờ/3 tháng)."], ["40 giờ", "40 giờ là giờ làm chuẩn mỗi tuần."], ["138 giờ", "138 là tổng 3 tháng theo quy định linh hoạt."]], ex: "Điều 32: giờ chuẩn + làm thêm ≤ 12 giờ/ngày; làm thêm ≤ 46 giờ/tháng, hoặc ≤ 54/tháng và ≤ 138/3 tháng khi được đồng ý." },
 { q: "Khi sinh con, người lao động nữ được nghỉ thai sản bao lâu?", a: "8 tuần", d: [["6 tuần", "8 tuần."], ["10 tuần", "8 tuần."], ["4 tuần", "4 tuần là sảy thai khi mang thai từ 3 tháng."]], ex: "Luật Bình đẳng giới trong việc làm Điều 15: sinh con 8 tuần; sảy thai từ 3 tháng 4 tuần." },
 { q: "Trong thời gian mang thai, được nghỉ khám thai bao nhiêu ngày?", a: "7 ngày", d: [["5 ngày", "Đã tăng lên 7 ngày."], ["3 ngày", "7 ngày."], ["10 ngày", "7 ngày."]], ex: "Điều 15: nghỉ khám thai 7 ngày; người phối ngẫu được 7 ngày đi khám thai cùng và nghỉ khi vợ sinh." },
 { q: "Câu nào đúng về nghỉ hành kinh? (Chọn tất cả)", m: [["Lao động nữ được nghỉ 1 ngày mỗi tháng"], ["Tối đa 3 ngày mỗi năm không tính vào nghỉ ốm"], ["Ngày nghỉ hành kinh không tính vào nghỉ ốm được trả nửa lương"], ["Nghỉ hành kinh luôn tính vào nghỉ ốm", "Tối đa 3 ngày/năm không tính."]], ex: "Điều 14: mỗi tháng 1 ngày; tối đa 3 ngày/năm không tính nghỉ ốm; đều được trả nửa lương." },
 { q: "Với con dưới 2 tuổi cần bú mẹ, chủ phải cho thêm thời gian cho con bú mỗi ngày bao nhiêu?", a: "2 lần, mỗi lần 30 phút", d: [["1 lần, 60 phút", "2 lần mỗi ngày, mỗi lần 30 phút."], ["2 lần, mỗi lần 15 phút", "Mỗi lần 30 phút."], ["3 lần, mỗi lần 20 phút", "2 lần mỗi ngày, mỗi lần 30 phút."]], ex: "Điều 18: 60 phút mỗi ngày (có thể 2 × 30 phút), tính là giờ làm; làm thêm từ 1 giờ được thêm 30 phút." },
 { q: "Nghỉ nuôi con không lương được đến khi con tròn 3 tuổi, nhưng tối đa bao lâu?", a: "2 năm", d: [["1 năm", "2 năm."], ["3 năm", "3 là giới hạn tuổi của con; nghỉ tối đa 2 năm."], ["6 tháng", "6 tháng là thời gian tối đa nhận trợ cấp từ BHVL."]], ex: "Điều 16: đến khi con tròn 3 tuổi nhưng không quá 2 năm." },
 { q: "Theo Điều 23, chủ có từ bao nhiêu lao động phải có cơ sở hoặc biện pháp giữ trẻ?", a: "Từ 100 người", d: [["Từ 250 người", "Luật cũ là 250; nay là 100."], ["Từ 30 người", "100."], ["Từ 50 người", "100."]], ex: "Điều 23: chủ có từ 100 lao động phải có phòng cho con bú và cơ sở/biện pháp giữ trẻ." },
 { q: "Theo Luật Hưu trí lao động, mức đóng hằng tháng của chủ không thấp hơn bao nhiêu phần trăm lương?", a: "6%", d: [["2%", "6%."], ["4%", "6%."], ["15%", "2%–15% là tỷ lệ dự phòng chế độ cũ."]], ex: "Điều 14: chủ đóng ít nhất 6% lương tháng; người lao động có thể tự đóng thêm đến 6%." },
 { q: "Nghỉ chăm sóc gia đình tối đa bao nhiêu ngày mỗi năm (tính vào nghỉ việc riêng)?", a: "7 ngày", d: [["3 ngày", "7 ngày."], ["14 ngày", "7 ngày."], ["5 ngày", "7 ngày."]], ex: "Điều 20: tính vào nghỉ việc riêng, tối đa 7 ngày/năm." },
 { q: "Theo Luật Giải quyết tranh chấp lao động, loại tranh chấp nào KHÔNG được đình công?", a: "Tranh chấp về quyền", d: [["Tranh chấp về lợi ích (điều chỉnh)", "Công đoàn có thể đình công sau khi hòa giải không thành."], ["Tranh chấp tăng lương", "Thuộc tranh chấp điều chỉnh."], ["Tranh chấp thương lượng thỏa ước tập thể", "Thuộc tranh chấp điều chỉnh."]], ex: "Điều 53: chưa hòa giải không thành thì không được đình công; tranh chấp về quyền (theo luật/hợp đồng hiện hành) không được đình công." },
 { q: "Theo Luật Bảo hiểm tai nạn lao động, người lao động ở doanh nghiệp đã đăng ký được tham gia bảo hiểm thế nào?", a: "Bắt buộc với tất cả, không kể số lao động", d: [["Chỉ bắt buộc khi có từ 5 lao động", "5 người là ngưỡng của bảo hiểm lao động."], ["Tự nguyện", "Bắt buộc."], ["Chỉ bắt buộc ngành sản xuất", "Mọi ngành."]], ex: "Điều 6: người lao động từ 15 tuổi của chủ đã đăng ký phải được tham gia, không kể quy mô." }
],
equity: [
 { q: "Hạn ngạch tuyển người khuyết tật với trường tư, tổ chức và doanh nghiệp tư là gì?", a: "Từ 67 nhân viên: ít nhất 1%, và tối thiểu 1 người", d: [["Từ 34 nhân viên: ít nhất 3%", "Đó là quy định khu vực công."], ["Từ 100 nhân viên: ít nhất 1%", "100 là ngưỡng cũ."], ["Từ 50 nhân viên: ít nhất 2%", "Không có quy định này."]], ex: "Điều 38(2): đơn vị tư có từ 67 nhân viên phải tuyển người khuyết tật ≥ 1% và tối thiểu 1 người." },
 { q: "Mỗi người khuyết tật nặng được tuyển tính là bao nhiêu người?", a: "2", d: [["1,5", "2."], ["3", "2."], ["1", "Khuyết tật nặng tính gấp đôi."]], ex: "Điều 38: mỗi người khuyết tật nặng trở lên tính là 2." },
 { q: "Số nhân viên tính hạn ngạch dựa vào ngày nào?", a: "Ngày 1 hằng tháng", d: [["Ngày cuối tháng", "Ngày 1."], ["Ngày 15", "Ngày 1."], ["Bình quân năm", "Tính theo tháng, ngày 1."]], ex: "Điều 38(3): theo số người tham gia BH lao động/công chức vào ngày 1 hằng tháng." },
 { q: "Nếu không đủ hạn ngạch, phí chênh lệch tính thế nào?", a: "Số người thiếu × lương cơ bản tháng", d: [["Số thiếu × lương BQ đóng BH", "Cơ sở là lương cơ bản."], ["Số thiếu × lương cơ bản × 12", "Nộp hằng tháng."], ["Số tiền cố định theo quy mô", "Tùy số người thiếu."]], ex: "Điều 43(2): số người thiếu × lương cơ bản tháng, nộp trước ngày 10 hằng tháng." },
 { q: "Nhân viên khuyết tật bán thời gian có lương từ một nửa lương cơ bản trở lên được tính thế nào?", a: "2 người tính là 1", d: [["Mỗi người tính 1", "Bán thời gian: 2 tính 1."], ["Không được tính", "Được tính nếu ≥ ½ lương cơ bản."], ["3 người tính 1", "2 tính 1."]], ex: "Điều 38(4): lương dưới mức cơ bản không tính, nhưng bán thời gian ≥ ½ thì 2 người tính 1." },
 { q: "Theo Điều 4 Luật Bảo vệ quyền làm việc của người bản địa, cơ quan nhà nước phải có 1 người bản địa trên mỗi bao nhiêu nhân viên hợp đồng, bảo vệ, tạp vụ…?", a: "Mỗi 100 người", d: [["Mỗi 50 người", "Mỗi 100."], ["Mỗi 67 người", "67 là ngưỡng hạn ngạch khuyết tật khu vực tư."], ["Mỗi 34 người", "34 là ngưỡng hạn ngạch khuyết tật khu vực công."]], ex: "Điều 4: 1 người bản địa trên mỗi 100 nhân viên loại này (trừ Bành Hồ, Kim Môn, Liên Giang)." }
],
market: [
 { q: "Trong điều tra nhân lực, 'người thất nghiệp' phải đáp ứng điều kiện nào? (Chọn tất cả)", m: [["Không có việc làm"], ["Sẵn sàng làm việc"], ["Đang tìm việc hoặc chờ kết quả"], ["Đang nhận trợ cấp thất nghiệp", "Nhận trợ cấp không liên quan định nghĩa thống kê."]], ex: "Thất nghiệp: từ 15 tuổi, không có việc, sẵn sàng làm việc, đang tìm việc hoặc chờ kết quả." },
 { q: "'Lực lượng lao động' là gì?", a: "Người có việc + người thất nghiệp", d: [["Toàn bộ dân số từ 15 tuổi", "Phải trừ người ngoài lực lượng lao động."], ["Người có việc + người ngoài LLLĐ", "Họ không thuộc LLLĐ."], ["Chỉ người có việc", "Người thất nghiệp cũng thuộc LLLĐ."]], ex: "LLLĐ = có việc + thất nghiệp; dân số 15+ = LLLĐ + ngoài LLLĐ." },
 { q: "Thất nghiệp do thay đổi cơ cấu ngành khiến kỹ năng không phù hợp việc mới gọi là?", a: "Thất nghiệp cơ cấu", d: [["Thất nghiệp tạm thời", "Tạm thời là ngắn hạn do thiếu thông tin khi đổi việc."], ["Thất nghiệp chu kỳ", "Chu kỳ do suy thoái kinh tế."], ["Thất nghiệp thời vụ", "Thời vụ theo mùa cao điểm/thấp điểm."]], ex: "Thất nghiệp cơ cấu: lệch kỹ năng/địa điểm sau thay đổi cơ cấu, công nghệ; giải quyết bằng đào tạo, chuyển nghề." },
 { q: "Thất nghiệp ngắn hạn khi chuyển việc do thông tin thị trường không đầy đủ gọi là?", a: "Thất nghiệp tạm thời (ma sát)", d: [["Thất nghiệp cơ cấu", "Cơ cấu là lệch kỹ năng."], ["Thất nghiệp chu kỳ", "Chu kỳ do kinh tế."], ["Thất nghiệp trá hình", "Trá hình là có việc nhưng năng suất thấp."]], ex: "Thất nghiệp tạm thời: ngắn hạn do thiếu thông tin; giải quyết bằng thông tin và kết nối việc làm tốt hơn." },
 { q: "Những người nào thuộc 'ngoài lực lượng lao động'? (Chọn tất cả)", m: [["Học sinh và người ôn thi"], ["Người làm nội trợ"], ["Người cao tuổi, khuyết tật không tìm việc"], ["Người đang chờ kết quả xin việc", "Họ là người thất nghiệp, thuộc LLLĐ."]], ex: "Ngoài LLLĐ: người từ 15 tuổi không có việc cũng không thất nghiệp—học sinh, nội trợ, người già, khuyết tật…" },
 { q: "Tỷ lệ việc làm trên người tìm việc lớn hơn 1 nghĩa là gì?", a: "Chỗ tuyển nhiều hơn người tìm việc—việc làm tương đối nhiều", d: [["Người tìm việc nhiều hơn chỗ tuyển", "Chỗ tuyển ở tử số; lớn hơn 1 là chỗ tuyển nhiều hơn."], ["Thất nghiệp trên 1%", "Chỉ số khác."], ["Tỷ lệ tham gia tăng", "Không liên quan trực tiếp."]], ex: "Tỷ lệ = chỗ tuyển ÷ người tìm việc; lớn hơn 1 là việc nhiều hơn người." },
 { q: "Điều tra nhân lực của Đài Loan áp dụng cho dân thường từ bao nhiêu tuổi?", a: "15", d: [["16", "15."], ["18", "15."], ["20", "15."]], ex: "Áp dụng cho dân thường từ 15 tuổi (không gồm quân nhân và người bị giam giữ)." }
],
recruit: [
 { q: "Trong phân tích công việc, 'tiêu chuẩn công việc' chủ yếu ghi gì?", a: "Kiến thức, kỹ năng, năng lực người làm cần có", d: [["Nhiệm vụ, nội dung và điều kiện làm việc", "Đó là bản mô tả công việc."], ["Lương và phúc lợi", "Không thuộc tiêu chuẩn công việc."], ["Sơ đồ tổ chức", "Không thuộc tiêu chuẩn công việc."]], ex: "Mô tả công việc = làm gì; tiêu chuẩn công việc = người thế nào làm được." },
 { q: "Trong phỏng vấn hành vi, STAR nghĩa là gì?", a: "Tình huống, nhiệm vụ, hành động, kết quả", d: [["Điểm mạnh, mối đe dọa, hành động, phản hồi", "Nhầm với SWOT."], ["Tiêu chuẩn, mục tiêu, thái độ, chấm điểm", "Không phải STAR."], ["Tình huống, suy nghĩ, thái độ, phản hồi", "Không phải STAR."]], ex: "STAR: Situation, Task, Action, Result—hành vi quá khứ dự báo hiệu quả tương lai." },
 { q: "Người phỏng vấn cho rằng ứng viên giỏi mọi mặt vì tốt nghiệp trường danh tiếng. Đây là thiên lệch gì?", a: "Hiệu ứng hào quang", d: [["Hiệu ứng tương phản", "Tương phản là bị ứng viên trước ảnh hưởng."], ["Xu hướng trung bình", "Chấm mọi người ở mức giữa."], ["Hiệu ứng gần đây", "Bị ấn tượng cuối cùng chi phối."]], ex: "Hiệu ứng hào quang: một đặc điểm nổi bật chi phối toàn bộ đánh giá; giảm bằng phỏng vấn có cấu trúc và nhiều người chấm." },
 { q: "Trung tâm đánh giá (assessment center) thường dùng bài tập nào? (Chọn tất cả)", m: [["Bài tập hộp thư (in-basket)"], ["Thảo luận nhóm không người dẫn dắt"], ["Đóng vai"], ["Gọi điện cho chủ cũ", "Đó là kiểm tra tham chiếu, không phải bài tập của trung tâm đánh giá."]], ex: "Trung tâm đánh giá dùng mô phỏng (in-basket, thảo luận nhóm, đóng vai, thuyết trình) do nhiều người đánh giá đã qua đào tạo chấm điểm." },
 { q: "Đâu là ưu điểm của tuyển dụng nội bộ?", a: "Tạo động lực cho nhân viên, người đã quen văn hóa tổ chức", d: [["Mang ý tưởng mới, tránh 'đồng huyết'", "Đó là ưu điểm tuyển dụng bên ngoài."], ["Nguồn ứng viên rộng hơn", "Đó là tuyển bên ngoài."], ["Không ai bị hụt hẫng", "Người không được chọn có thể không vui."]], ex: "Nội bộ: tạo động lực, rẻ, thích nghi nhanh; nhược điểm: nguồn hạn chế, đồng huyết, người không được chọn bất mãn." },
 { q: "Nếu điểm bài kiểm tra tuyển chọn tương quan cao với hiệu quả công việc sau này, bài kiểm tra có tốt về?", a: "Độ hiệu lực dự báo (liên quan tiêu chí)", d: [["Độ hiệu lực nội dung", "Là câu hỏi có đại diện công việc không."], ["Độ tin cậy kiểm tra lại", "Độ tin cậy là tính ổn định, không phải dự báo."], ["Độ hiệu lực bề ngoài", "Là trông có liên quan không."]], ex: "Hiệu lực liên quan tiêu chí gồm đồng thời và dự báo; dự báo dùng hiệu quả công việc tương lai." },
 { q: "Đặc điểm chính của phỏng vấn có cấu trúc là gì?", a: "Câu hỏi và tiêu chí chấm định trước; độ tin cậy và hiệu lực cao hơn", d: [["Hỏi tự do, linh hoạt nhất", "Đó là phỏng vấn không cấu trúc."], ["Chỉ xem hồ sơ", "Không phải phỏng vấn."], ["Quan sát phản ứng dưới áp lực", "Đó là phỏng vấn căng thẳng."]], ex: "Có cấu trúc: mọi ứng viên cùng câu hỏi và cách chấm, giảm thiên lệch." }
],
career: [
 { q: "Trong lý thuyết Holland, kiểu nào thích thuyết phục, lãnh đạo người khác và theo đuổi thành tựu?", a: "Kiểu Doanh nhân (E)", d: [["Kiểu Xã hội (S)", "Kiểu xã hội thích giúp đỡ, giảng dạy."], ["Kiểu Nghiệp vụ (C)", "Kiểu nghiệp vụ thích công việc có quy tắc."], ["Kiểu Nghiên cứu (I)", "Kiểu nghiên cứu thích phân tích."]], ex: "RIASEC của Holland: Kỹ thuật, Nghiên cứu, Nghệ thuật, Xã hội, Doanh nhân, Nghiệp vụ." },
 { q: "Trong lục giác Holland, 'tính nhất quán' cao nghĩa là?", a: "Hai kiểu cao nhất của một người nằm cạnh nhau trên lục giác", d: [["Hai kiểu cao nhất đối diện nhau", "Đối diện là nhất quán thấp nhất."], ["Sáu điểm gần như nhau", "Đó là độ phân hóa thấp."], ["Kiểu người khớp môi trường làm việc", "Đó là sự tương hợp."]], ex: "Khái niệm Holland: nhất quán (kề nhau), phân hóa (chênh lệch điểm), tương hợp (người – môi trường)." },
 { q: "Trong các giai đoạn nghề nghiệp của Super, giai đoạn 'thiết lập' khoảng bao nhiêu tuổi?", a: "25–44", d: [["15–24", "Đó là khám phá."], ["45–64", "Đó là duy trì."], ["0–14", "Đó là phát triển."]], ex: "Super: phát triển (0–14), khám phá (15–24), thiết lập (25–44), duy trì (45–64), suy giảm (65+)." },
 { q: "'Cầu vồng sự nghiệp' của Super chủ yếu thể hiện điều gì?", a: "Một người đóng nhiều vai trò cùng lúc, và mức độ thay đổi theo tuổi", d: [["Tính cách chia sáu kiểu", "Đó là Holland."], ["Ảnh hưởng của sự kiện ngẫu nhiên", "Đó là Krumboltz."], ["Ba bước chọn nghề", "Đó là Parsons."]], ex: "Vai trò: con, học sinh, người giải trí, công dân, người lao động, người nội trợ—mức độ khác nhau theo giai đoạn." },
 { q: "Mức độ nhất quán khi cùng một bài kiểm tra được làm hai lần bởi cùng người gọi là?", a: "Độ tin cậy kiểm tra lại", d: [["Độ tin cậy dạng tương đương", "Dùng hai bài tương đương."], ["Độ tin cậy chia đôi", "Chia một bài làm hai."], ["Độ hiệu lực nội dung", "Hiệu lực là độ chính xác, không phải nhất quán."]], ex: "Độ tin cậy: kiểm tra lại, tương đương, chia đôi, nhất quán nội tại (Cronbach α). Hiệu lực: nội dung, tiêu chí, cấu trúc." },

career: [

function buildDrill(gens, label) {

  for (let r = 0; r < 2; r++) for (const g of base) q.push(g);
  if (q.length < 6) while (q.length < 6 && base.length) q.push(pick(base));

}

}

  const gens = shuffle(cand.slice()).sort((a, b) => sc(b) - sc(a)).slice(0, 5);

// ---------- 考試用計算機 ----------
function cxAway() { const t = document.getElementById('tutor'); if (t) { t.classList.add('min', 'cxon'); clearTimeout(say._t); } }
let CX = { ans: 0, deg: true, hist: '' };
const CX_TOUCH = (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
function cxEval(src) {
  const s = src.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-').replace(/√/g, 'sqrt').replace(/π/g, 'pi').replace(/\s+/g, '');
  const toks = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    const m = /^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/.exec(s.slice(i));
    if (m) { toks.push({ t: 'n', v: parseFloat(m[0].replace('E', 'e')) }); i += m[0].length; continue; }
    const w = /^(sqrt|sin|cos|tan|log|ln|pi|Ans)/.exec(s.slice(i));
    if (w) { const n = w[0]; if (n === 'pi') toks.push({ t: 'n', v: Math.PI }); else if (n === 'Ans') toks.push({ t: 'n', v: CX.ans }); else toks.push({ t: 'f', v: n }); i += n.length; continue; }
    if ('+-*/^()'.includes(c)) { toks.push({ t: c }); i++; continue; }
    throw new Error('bad');
  }
  // 隱含乘法：2π、2(3)、)(、3sin(
  const T = [];
  toks.forEach((k, j) => { const p = T[T.length - 1]; if (p && (p.t === 'n' || p.t === ')') && (k.t === 'n' || k.t === '(' || k.t === 'f')) T.push({ t: '*' }); T.push(k); });
  let depth = 0; T.forEach(k => { if (k.t === '(') depth++; if (k.t === ')') depth--; }); while (depth-- > 0) T.push({ t: ')' });
  let p = 0; const peek = () => T[p], eat = t => { if (!T[p] || T[p].t !== t) throw new Error('bad'); p++; };
  const rad = x => CX.deg ? x * Math.PI / 180 : x;
  const F = { sqrt: Math.sqrt, sin: x => Math.sin(rad(x)), cos: x => Math.cos(rad(x)), tan: x => Math.tan(rad(x)), log: Math.log10, ln: Math.log };
  function expr() { let v = term(); while (peek() && (peek().t === '+' || peek().t === '-')) { const o = T[p++].t; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function term() { let v = unary(); while (peek() && (peek().t === '*' || peek().t === '/')) { const o = T[p++].t; const r = unary(); v = o === '*' ? v * r : v / r; } return v; }
  function unary() { if (peek() && peek().t === '-') { p++; return -unary(); } if (peek() && peek().t === '+') { p++; return unary(); } return power(); }
  function power() { const b = primary(); if (peek() && peek().t === '^') { p++; return Math.pow(b, unary()); } return b; }
  function primary() { const k = peek(); if (!k) throw new Error('bad'); if (k.t === 'n') { p++; return k.v; } if (k.t === 'f') { p++; eat('('); const v = expr(); eat(')'); return F[k.v](v); } if (k.t === '(') { p++; const v = expr(); eat(')'); return v; } throw new Error('bad'); }
  const v = expr(); if (p !== T.length) throw new Error('bad'); return v;
}
function cxFmt(v) { if (!isFinite(v)) return L('cx.e'); if (v === 0) return '0'; const a = Math.abs(v); if (a >= 1e10 || a < 1e-6) return v.toExponential(6).replace('e', ' × 10^'); return String(parseFloat(v.toPrecision(10))); }

function calcBox() {
  const K = [['sin(', 'cos(', 'tan(', 'log(', 'ln('], ['√(', '^', '(', ')', 'π'], ['7', '8', '9', '÷', '⌫'], ['4', '5', '6', '×', 'AC'], ['1', '2', '3', '−', 'Ans'], ['0', '.', 'E', '+', '=']];
  const lab = { 'sin(': 'sin', 'cos(': 'cos', 'tan(': 'tan', 'log(': 'log', 'ln(': 'ln', '√(': '√', '^': 'xʸ', 'E': '×10ⁿ' };
  return `<details class="cxbox" open><summary>${L('cx.title')} <small>（${CX.deg ? 'DEG' : 'RAD'}）</small></summary>
  <div class="cxwrap"><div class="cxhist" id="cxh">${CX.hist || '&nbsp;'}</div>
  <input id="cx" class="cxin" type="text" autocomplete="off" spellcheck="false" ${CX_TOUCH ? 'inputmode="none" readonly' : ''} placeholder="30900*0.6*6" onfocus="cxAway()" onkeydown="if(event.key==='Enter'){event.preventDefault();cxKey('=')}">
  <div class="cxout" id="cxo">= 0</div>
  <div class="cxkeys">${K.flat().map(k => `<button type="button" class="cxk${'=AC⌫'.includes(k) ? ' cxs' : /[\d.]/.test(k) ? ' cxn' : ''}" onclick="cxKey('${k}')">${lab[k] || k}</button>`).join('')}</div>
  <div class="cxfoot"><button type="button" class="cxk" style="width:auto;padding:4px 10px" onclick="CX.deg=!CX.deg;this.closest('details').querySelector('summary small').textContent='（'+(CX.deg?'DEG':'RAD')+'）';this.textContent=CX.deg?'RAD':'DEG'">${CX.deg ? 'RAD' : 'DEG'}</button><small>${CX_TOUCH ? L('cx.tip') : L('cx.tipK')}</small></div></div></details>`;
}
function cxKey(k) {
  const el = document.getElementById('cx'); if (!el) return;
  cxAway();
  if (k === 'AC') { el.value = ''; document.getElementById('cxo').textContent = '= 0'; return; }
  if (k === '⌫') { el.value = el.value.slice(0, -1); return; }
  if (k === '=') {
    if (!el.value.trim()) return;
    try { const v = cxEval(el.value); CX.ans = v; CX.hist = el.value + ' ='; document.getElementById('cxh').textContent = CX.hist; document.getElementById('cxo').textContent = '= ' + cxFmt(v); el.value = ''; el.placeholder = 'Ans = ' + cxFmt(v); }
    catch (e) { document.getElementById('cxo').textContent = L('cx.err'); }
    return;
  }
  el.value += k;
  if (!CX_TOUCH) el.focus({ preventScroll: true });
}

  h += `<div class="panel"><h2>${L('r.errs')}</h2>${es.length ? es.map(([k, n]) => `<div class="lrow" style="grid-template-columns:130px 1fr 56px 74px"><span>${errName(k)}</span><div class="bar"><i style="width:${n / es[0][1] * 100}%;background:var(--ng)"></i></div><span>${L('r.times', { n })}</span><button class="btn ghost" style="padding:3px 8px;font-size:13px" onclick="startDrillType('${k}')">${L('r.drill')}</button></div>`).join('') : `<p>${L('r.noErr')}</p>`}</div>`;
  const gs = Object.entries(S.gens).filter(([k]) => G[k]).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n);
  if (gs.length) h += `<div class="panel"><h2>${L('r.detail')}</h2>${gs.map(([k, g]) => `<div class="lrow"><span style="font-size:13px">${(g.st || 0) >= 2 ? '✔ ' : g.w ? '⏳ ' : ''}${genTitle(k)}</span><div class="bar"><i style="width:${g.c / g.n * 100}%"></i></div><span>${g.c}/${g.n}</span></div>`).join('')}<p style="font-size:13px;color:var(--mute)">${L('r.legend')}</p><div class="row">${weakGens().length ? `<button class="btn yel" onclick="startDrill()">${L('r.drillBtn', { n: weakGens().length })}</button>` : ''}</div></div>`;
  h += `<div class="panel"><button class="btn ghost" onclick="confirmReset=true;records()">${L('r.clear')}</button>${confirmReset ? `<div class="confirm">${L('r.confirm')}<div class="row"><button class="btn" style="border-color:var(--ng);color:var(--ng)" onclick="S=blank();save();confirmReset=false;records()">${L('r.yes')}</button><button class="btn ghost" onclick="confirmReset=false;records()">${L('r.no')}</button></div></div>` : ''}</div>` + sponsor() + foot();
  $('#app').innerHTML = h;
  const te = topErr();
  say('present', t.n ? L('r.say', { n: t.n, p: pct(t), e: te ? L('r.sayE', { t: errName(te[0]) }) : '' }) : L('r.sayNone'), te ? [[L('r.aDrill'), `startDrillType('${te[0]}')`]] : []);
}
function foot() {
  const a = (u, t) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
  return `<div class="foot">${L('ft.text', { law: a('https://law.moj.gov.tw/', L('ft.law')), wda: a('https://www.wda.gov.tw/', L('ft.wda')), sec: a('https://www.wdasec.gov.tw/', L('ft.sec')) })}　<a href="${SPONSOR}" target="_blank" rel="noopener noreferrer sponsored">${L('ft.sp')}</a></div>`;
}

document.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input,select,textarea')) return;
  if (!cur) return;
  if (e.key === 'Enter') { if (cur.multi && cur.chosen == null && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); mock ? mockAns(-1) : answer(-1); } return; }
  const m = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()]; if (m === undefined) return;
  if (mock && cur.chosen == null) mockAns(m); else if (!mock && document.querySelector('.opt:not(:disabled)')) answer(m);
});
chrome();
home();

</script>
</body>
