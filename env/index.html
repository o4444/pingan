<title>環保專責「空水廢毒」AI 陪考小家教</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e3a4a;--ink2:#3d4a66;--mute:#6b7690;--line:#e3e6ee;--bg:#f6f4ee;--card:#fff;--hi:#4cc9b0;--hi2:#e3f7f2;--ok:#1f8a4c;--okbg:#e6f5ec;--ng:#c0392b;--ngbg:#fdecea;--blue:#2459c7;--bluebg:#eaf0fc}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.hwrap{max-width:880px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;cursor:pointer}
.logo .tag{background:var(--hi);color:var(--ink);font-size:12px;padding:2px 8px;border-radius:4px;font-weight:900}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:transparent;border:0;color:#c9d1e3;font:inherit;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on,nav button:hover{background:#ffffff1a;color:#fff}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--hi) 0 14px,var(--ink) 14px 28px)}
#fb{scroll-margin-top:80px}
main{max-width:880px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:26px;margin:4px 0 6px;font-weight:900}
h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font:inherit;color:inherit}
.ucard:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 18px #14213d14}
.ucard .ic{font-size:26px}
.ucard b{display:block;font-size:17px;margin:4px 0}
.ucard small{color:var(--mute)}
.bar{height:6px;background:#eef0f5;border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
.ucard.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.ucard.dark small{color:#c9d1e3}
.ucard.yel{background:var(--hi2);border-color:#9fe0cf}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bd{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef0f5;color:var(--ink2)}
.bd.lv{background:var(--ink);color:#fff}
.bd.var{background:var(--hi);color:var(--ink)}
.stem{font-size:18px;font-weight:500;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);transition:.12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:#eef0f5;display:grid;place-items:center;font-weight:900}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}.opt.ng .k{background:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.opt .num{font-family:"JetBrains Mono",monospace}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}
.btn.yel{background:var(--hi);border-color:var(--hi)}
.btn.ghost{border-color:var(--line)}
.btn:hover{filter:brightness(.95)}
.hint{margin-top:12px;background:var(--bluebg);border-radius:10px;padding:10px 14px;color:var(--blue);font-size:15px}
.verdict{border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;margin-bottom:14px}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.ng{background:var(--ngbg);color:var(--ng)}
.stage{border-left:4px solid var(--ink);padding:2px 0 2px 14px;margin:18px 0}
.stage h3{margin:0 0 8px;font-size:15px;letter-spacing:.03em;color:var(--ink2)}
.stage h3 span{background:var(--ink);color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px;font-size:12px}
.etype{display:inline-block;background:var(--ng);color:#fff;font-weight:700;padding:2px 10px;border-radius:6px;margin-bottom:6px}
.etype.okt{background:var(--ok)}
.sc{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.sc b.t{display:block;color:var(--ink2);font-size:14px;margin-bottom:4px}
.sc ul{margin:0;padding-left:20px}
.formula{font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:17px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;margin:6px 0;overflow-x:auto}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:3px 0;font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:15px}
.warn{background:var(--hi2);color:#0b6b57;padding:1px 6px;border-radius:4px;font-weight:700}
.card30{background:var(--hi2);border:2px dashed #3fb39a;border-radius:12px;padding:14px 16px}
.card30 h4{margin:0 0 6px}
table.ut{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.ut td{border-bottom:1px solid #9fe0cf;padding:4px 6px}
.prog{height:8px;background:#e8e4d8;border-radius:4px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--hi)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{font-size:28px;font-weight:900;display:block}
.stat small{color:var(--mute)}
.lrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.lrow .bar{margin:0;height:10px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv summary{cursor:pointer;font-weight:500}
.foot{color:var(--mute);font-size:13px;margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--blue)}
.confirm{background:var(--ngbg);border-radius:10px;padding:12px;margin-top:10px}
@media(max-width:560px){.stem{font-size:16px}.lrow{grid-template-columns:96px 1fr 56px}h1{font-size:22px}}

/* v2 安安老師導引（v3.1 預設小尺寸，一進站即出現） */
.tutor{position:fixed;right:10px;bottom:0;z-index:20;display:flex;align-items:flex-end;pointer-events:none}
.tutor img{height:230px;width:auto;display:block;filter:drop-shadow(0 6px 14px #14213d40);pointer-events:auto;cursor:pointer}

.tbub{pointer-events:auto;max-width:270px;background:#fff;border:2px solid var(--ink);border-radius:14px 14px 4px 14px;padding:10px 12px 8px;margin:0 -4px 140px 0;box-shadow:0 8px 22px #14213d26;font-size:14.5px;line-height:1.55;position:relative;animation:pop .25s ease}
.tbub b.nm{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.tbub .x{position:absolute;top:3px;right:7px;border:0;background:none;font-size:15px;color:var(--mute);cursor:pointer}
.tbub .act{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.tbub .act button{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--ink);background:var(--hi);border-radius:8px;padding:3px 9px;cursor:pointer}
.tutor.min .tbub{display:none}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
main{padding-bottom:250px}
@media(max-width:700px){.tutor{right:4px}.tutor img{height:140px}.tbub{max-width:min(230px,60vw);margin-bottom:84px;font-size:13.5px;padding:8px 10px 6px}main{padding-bottom:170px}}
.spon{background:linear-gradient(135deg,var(--hi2),#fff);border:2px solid #9fe0cf;border-radius:14px;padding:16px 18px;margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.spon p{margin:0;flex:1;min-width:200px}
.spon a{background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:10px}
.bd.dr{background:#7a3cd6;color:#fff}

/* v6 考試用計算機 */
.tutor.cxon img{opacity:.3;pointer-events:none}
.cxbox{margin-top:14px;border:2px solid var(--ink);border-radius:12px;background:#f3f5fa}
.cxbox summary{cursor:pointer;font-weight:700;padding:10px 14px;list-style:none}
.cxbox summary::-webkit-details-marker{display:none}
.cxbox summary small{color:var(--mute);font-weight:500}
.cxwrap{padding:0 12px 12px}
.cxhist{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--mute);text-align:right;min-height:18px;overflow-x:auto;white-space:nowrap}
.cxin{width:100%;box-sizing:border-box;font-family:"JetBrains Mono",monospace;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff;text-align:right}
.cxout{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;text-align:right;padding:6px 4px;color:var(--ink);overflow-x:auto;white-space:nowrap}
.cxkeys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cxk{font:inherit;font-weight:700;font-size:16px;min-height:44px;border:1px solid #c9cfdc;border-radius:8px;background:#e6e9f1;color:var(--ink);cursor:pointer}
.cxk.cxn{background:#fff}
.cxk.cxs{background:var(--ink);color:#fff;border-color:var(--ink)}
.cxk:active{transform:translateY(1px)}
.cxfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--mute)}
.tcol{display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.tsw{display:flex;gap:2px;margin:2px 0 6px;background:#fff;border:1px solid #cfd8cf;border-radius:999px;padding:2px;box-shadow:0 2px 6px #0002}
.tsw button{border:0;background:transparent;font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;color:#456}
.tsw button.on{background:var(--ink);color:#fff;font-weight:700}
.cert{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.cert button{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.cert button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cert button:hover:not(.on){border-color:var(--ink)}
@media(max-width:560px){.cert{gap:4px}.cert button{padding:5px 9px;font-size:14px}}
</style>
</head>

<div class="tutor" id="tutor"><div class="tbub" id="tbub"></div><div class="tcol"><img id="timg" alt="安安老師" title="點我收合／展開"><div class="tsw" role="group" aria-label="選擇老師"><button data-g="f" onclick="setTeacher('f')">女老師</button><button data-g="m" onclick="setTeacher('m')">男老師</button></div></div></div>
<script>
// ===== 環保專責「空水廢毒」陪考：題目產生器（純邏輯，無 DOM） =====
const R = (a, b, s = 1) => a + s * Math.floor(Math.random() * (Math.floor((b - a) / s + 1e-9) + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const f = (v, d) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
const fmt = (v, d = 0) => Number(f(v, d)).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PI = Math.PI;

const ERR = {
  concept: '觀念／公式錯誤',
  unit: '單位換算錯誤',
  math: '數學運算錯誤',
  law: '法規／標準誤判',
  read: '題意判讀錯誤',
  express: '作答表達錯誤'
};

// 數值選項：正解 + 誘答（各自帶錯誤類型）
function numOptions(ans, dists, dec, unit) {
  const show = v => fmt(v, dec) + (unit ? ' ' + unit : '');
  const opts = [{ v: ans, text: show(ans), correct: true }];
  const ok = v => isFinite(v) && v > 0 && opts.every(o => o.text !== show(v) && Math.abs(v - o.v) / Math.max(Math.abs(o.v), 1e-9) > 0.03);
  for (const d of dists) { if (opts.length >= 4) break; if (ok(d.v)) opts.push({ v: d.v, text: show(d.v), correct: false, type: d.type, why: d.why }); }
  const fillers = [1.5, 0.6, 2, 0.8, 1.25, 0.4, 3];
  for (const k of fillers) { if (opts.length >= 4) break; const v = ans * k; if (ok(v)) opts.push({ v, text: show(v), correct: false, type: ERR.math, why: '數值計算或位數處理有誤，請分段重算、每一步都寫下單位。' }); }
  return shuffle(opts);
}
function textOptions(correctText, dists) {
  const opts = [{ text: correctText, correct: true }];
  for (const d of dists) { if (opts.length >= 4) break; if (opts.every(o => o.text !== d.text)) opts.push({ text: d.text, correct: false, type: d.type, why: d.why }); }
  return shuffle(opts);
}

// ---------- 30 秒觀念卡 ----------
const UNIT_TABLE = [
  ['1 mg/L', '= 1 g/m³（稀薄水溶液約 1 ppm）'], ['kg/d', '= mg/L × m³/d ÷ 1,000'], ['Nm³', '0°C、1 atm 下的體積'],
  ['ppm → mg/Nm³（0°C）', '× 分子量 ÷ 22.4'], ['ppm → mg/m³（25°C）', '× 分子量 ÷ 24.45'], ['°C → K', '+ 273'],
  ['μm → m', '× 10⁻⁶'], ['cm → m', '÷ 100'], ['1 m³', '1,000 L'], ['1 t', '1,000 kg'], ['% → 小數', '÷ 100'], ['每日 → 每年', '× 365'], ['每分鐘 → 每小時', '× 60']
];
const GENERIC_CARD = {
  [ERR.math]: '計算機分段算：先乘除後加減，有百分比先換成小數（5% → 0.05）。每一段寫下中間值和單位，最後才四捨五入。',
  [ERR.read]: '讀題三圈：①圈「求什麼、單位是什麼」（kg/hr 還是 t/yr？濕基還是乾基？）②圈條件（標準狀態、含氧校正、純度）③刪掉用不到的干擾數據。',
  [ERR.express]: '作答四要素：公式 → 代入（含單位）→ 答案 → 單位。濃度要寫清楚是 mg/Nm³、mg/m³ 還是 mg/L。'
};

const G = {};

// =====================================================
// 空：空氣污染防制專責人員
// =====================================================
G.aEff = (o = {}) => {
  const mode = o.mode || pick(['eff', 'out']);
  const e1 = R(60, 90, 5), e2 = pick([90, 92, 95, 97, 98]);
  const p1 = 1 - e1 / 100, p2 = 1 - e2 / 100, tot = (1 - p1 * p2) * 100;
  const dv = pick([['旋風集塵器', '袋式集塵器'], ['重力沉降室', '靜電集塵器'], ['旋風集塵器', '靜電集塵器'], ['旋風集塵器', '文氏洗滌器']]);
  const base = {
    unit: 'airK', level: 2, keep: { mode },
    formula: { expr: '總效率 η = 1 − (1 − η₁)(1 − η₂)', vars: 'η₁、η₂：各段去除效率（小數）', cond: '串聯時「穿透率」相乘，不是效率相加或相乘。', plain: '先算每一段漏掉多少（穿透率），漏掉的比例連乘，剩下的就是總穿透率。', mnemonic: '「效率不能加，穿透率連乘」' },
    card: { [ERR.concept]: '串聯設備：總穿透率 P = P₁ × P₂，總效率 = 1 − P。前段常用旋風集塵器除大顆粒，後段用袋式或靜電集塵器捕集細微粒。' }
  };
  if (mode === 'eff') return Object.assign(base, {
    title: '空污｜串聯除塵總效率',
    stem: `某廠排氣先經${dv[0]}（效率 ${e1}%），再經${dv[1]}（效率 ${e2}%）串聯處理。整套系統的總除塵效率為多少 %？`,
    known: [`η₁ = ${e1}% → 穿透率 P₁ = ${f(p1, 2)}`, `η₂ = ${e2}% → 穿透率 P₂ = ${f(p2, 2)}`, '求：總效率（%）'],
    steps: [`總穿透率 = ${f(p1, 2)} × ${f(p2, 2)} = ${f(p1 * p2, 4)}`, `總效率 = 1 − ${f(p1 * p2, 4)} = <b>${fmt(tot, 2)}%</b>`],
    check: `總效率要比任一單段（${e2}%）高，但不會到 100% ✔`,
    answer: tot, opts: numOptions(tot, [
      { v: (e1 + e2) / 2, type: ERR.concept, why: '串聯效率不是取平均。' },
      { v: e1 * e2 / 100, type: ERR.concept, why: '把兩段「效率」相乘了；要相乘的是穿透率（1 − η）。' },
      { v: e2, type: ERR.read, why: '只算了第二段；第一段已先去除一部分。' }
    ], 2, '%')
  });
  const Cin = R(20, 80) * 100, Cout = Cin * p1 * p2;
  return Object.assign(base, {
    title: '空污｜串聯除塵出口濃度',
    stem: `某排氣入口粒狀物濃度 ${fmt(Cin)} mg/Nm³，先經${dv[0]}（效率 ${e1}%）再經${dv[1]}（效率 ${e2}%）。最終出口濃度為多少 mg/Nm³？`,
    known: [`Cin = ${fmt(Cin)} mg/Nm³`, `P₁ = 1 − ${e1 / 100} = ${f(p1, 2)}`, `P₂ = 1 − ${e2 / 100} = ${f(p2, 2)}`, '求：出口濃度'],
    steps: [`第一段出口 = ${fmt(Cin)} × ${f(p1, 2)} = ${fmt(Cin * p1, 1)} mg/Nm³`, `第二段出口 = ${fmt(Cin * p1, 1)} × ${f(p2, 2)} = <b>${fmt(Cout, 1)} mg/Nm³</b>`],
    check: '出口濃度 = 入口 × 總穿透率，一定遠小於入口 ✔',
    answer: Cout, opts: numOptions(Cout, [
      { v: Cin * p2, type: ERR.read, why: '只算了第二段，漏了第一段的去除。' },
      { v: Cin * (1 - e1 * e2 / 10000), type: ERR.concept, why: '效率相乘當成總效率是錯的；要用穿透率連乘。' },
      { v: Cin * p1, type: ERR.read, why: '只算了第一段。' }
    ], 1, 'mg/Nm³')
  });
};

G.aO2 = () => {
  const os = pick([6, 10, 11]); let om = R(7, 15); if (om === os) om++;
  const C = R(40, 300), Cc = C * (21 - os) / (21 - om);
  return {
    unit: 'airK', level: 2, title: '空污｜排放濃度含氧校正',
    stem: `某燃燒設施煙道實測 NOx 濃度 ${C} ppm（乾基），實測含氧量 ${om}%。依排放標準須以含氧量 ${os}% 校正，校正後濃度為多少 ppm？`,
    known: [`實測濃度 C = ${C} ppm`, `實測含氧 Oₘ = ${om}%`, `標準含氧 Oₛ = ${os}%`, '求：校正後濃度'],
    formula: { expr: 'C校正 = C實測 × (21 − Oₛ) / (21 − Oₘ)', vars: '21：空氣中氧氣約 21%；Oₛ 標準含氧、Oₘ 實測含氧', cond: '分子放「標準」、分母放「實測」；以乾基計。', plain: '多灌空氣會把濃度稀釋，校正就是把濃度換算回規定的含氧條件，防止靠稀釋過關。', mnemonic: '「21 減標準在上，21 減實測在下」' },
    steps: [`(21 − ${os}) / (21 − ${om}) = ${21 - os} / ${21 - om} = ${f((21 - os) / (21 - om), 4)}`, `C校正 = ${C} × ${f((21 - os) / (21 - om), 4)} = <b>${fmt(Cc, 1)} ppm</b>`],
    check: om > os ? '實測含氧高於標準（被稀釋），校正後濃度應變大 ✔' : '實測含氧低於標準，校正後濃度應變小 ✔',
    answer: Cc, opts: numOptions(Cc, [
      { v: C * (21 - om) / (21 - os), type: ERR.concept, why: '分子分母放反了：(21 − 標準) 在上、(21 − 實測) 在下。' },
      { v: C * om / os, type: ERR.concept, why: '不是直接用含氧量比例，要用 21 減掉含氧量。' },
      { v: C, type: ERR.read, why: '題目要求含氧校正，不能直接用實測值。' },
      { v: C * (21 - os) / 21, type: ERR.concept, why: '分母要用 (21 − 實測含氧)，不是 21。' }
    ], 1, 'ppm'),
    card: { [ERR.concept]: '含氧校正防止以稀釋方式符合標準。焚化爐、鍋爐等燃燒設施排放標準多規定校正含氧量，考題以題目給定為準。', [ERR.read]: '看到「以含氧 X% 校正」就一定要做校正；實測值只是起點。' }
  };
};

const AGAS = [{ n: '二氧化硫（SO₂）', m: 64 }, { n: '氮氧化物（以 NO₂ 計）', m: 46 }, { n: '一氧化碳（CO）', m: 28 }, { n: '氯化氫（HCl）', m: 36.5 }, { n: '氨（NH₃）', m: 17 }];
G.aPpm = (o = {}) => {
  const dir = o.dir || pick(['p2m', 'm2p']), g = pick(AGAS);
  const formula = { expr: 'mg/Nm³ = ppm × M ÷ 22.4', vars: 'M：分子量（g/mol）；22.4：0°C、1 atm 每莫耳氣體體積（L）', cond: 'Nm³ 是標準狀態（0°C）→ 用 22.4；作業環境（25°C）才用 24.45。', plain: 'ppm 是體積比，乘上分子量變成質量，再除以 1 莫耳的體積。', mnemonic: '「N 是零度用 22.4，室溫才用 24.45」' };
  const card = { [ERR.concept]: '換算方向：ppm → mg 要「× M ÷ 22.4」；mg → ppm 要「× 22.4 ÷ M」。', [ERR.law]: 'Nm³（Normal）指 0°C、1 atm；空污排放標準多以 mg/Nm³ 表示。勞工作業環境容許濃度則以 25°C 的 24.45 換算。' };
  if (dir === 'p2m') {
    const p = R(20, 500), v = p * g.m / 22.4;
    return { unit: 'airK', level: 1, title: '空污｜ppm 換算 mg/Nm³', keep: { dir }, formula, card,
      stem: `某煙道排氣中${g.n}濃度為 ${p} ppm（標準狀態），換算為多少 mg/Nm³？（分子量 ${g.m}）`,
      known: [`C = ${p} ppm`, `M = ${g.m}`, '標準狀態 0°C、1 atm → 22.4 L/mol', '求：mg/Nm³'],
      steps: [`${p} × ${g.m} ÷ 22.4 = <b>${fmt(v, 1)} mg/Nm³</b>`], check: `分子量 ${g.m} ${g.m > 22.4 ? '大於' : '小於'} 22.4，所以 mg/Nm³ 數值${g.m > 22.4 ? '大於' : '小於'} ppm ✔`,
      answer: v, opts: numOptions(v, [
        { v: p * g.m / 24.45, type: ERR.law, why: '24.45 是 25°C 的莫耳體積；Nm³ 是 0°C，要用 22.4。' },
        { v: p * 22.4 / g.m, type: ERR.concept, why: '換算方向放反了；ppm → mg 是乘分子量。' },
        { v: p * g.m / 22.4 * 1000, type: ERR.unit, why: '多乘了 1,000，單位變成 μg/Nm³。' }
      ], 1, 'mg/Nm³') };
  }
  const m = R(50, 800), v = m * 22.4 / g.m;
  return { unit: 'airK', level: 1, title: '空污｜mg/Nm³ 換算 ppm', keep: { dir }, formula, card,
    stem: `某排放管道${g.n}濃度為 ${m} mg/Nm³，換算為多少 ppm？（分子量 ${g.m}）`,
    known: [`C = ${m} mg/Nm³`, `M = ${g.m}`, '標準狀態 → 22.4 L/mol', '求：ppm'],
    steps: [`${m} × 22.4 ÷ ${g.m} = <b>${fmt(v, 1)} ppm</b>`], check: 'mg → ppm 是「乘 22.4、除分子量」✔',
    answer: v, opts: numOptions(v, [
      { v: m * 24.45 / g.m, type: ERR.law, why: '24.45 是 25°C；Nm³ 是 0°C 標準狀態，用 22.4。' },
      { v: m * g.m / 22.4, type: ERR.concept, why: '方向放反：mg → ppm 要除以分子量。' },
      { v: m / g.m, type: ERR.concept, why: '漏乘莫耳體積 22.4。' }
    ], 1, 'ppm') };
};

G.aRate = (o = {}) => {
  const mode = o.mode || pick(['hr', 'yr']);
  const C = R(20, 200), Q = R(200, 3000, 50), h = pick([6000, 7200, 8000]);
  const kgh = C * Q * 60 / 1e6, tyr = kgh * h / 1000;
  const formula = { expr: '排放量（kg/hr）= C（mg/Nm³）× Q（Nm³/min）× 60 × 10⁻⁶', vars: 'C：排放濃度；Q：乾基標準狀態排氣量', cond: '每分鐘 × 60 = 每小時；mg × 10⁻⁶ = kg。年排放量再 × 年操作時數 ÷ 1,000（t）。', plain: '濃度 × 風量就是每分鐘排出幾毫克，再換成每小時幾公斤。', mnemonic: '「濃度乘風量，乘六十、除百萬」' };
  const card = { [ERR.unit]: 'mg → kg 是 ÷ 1,000,000（10⁶）；kg → t 是 ÷ 1,000；Nm³/min → Nm³/hr 是 × 60。', [ERR.concept]: '許可排放量、空污費都以「濃度 × 排氣量」推估排放量，排氣量必須用乾基標準狀態（Nm³）。' };
  const known = [`C = ${C} mg/Nm³`, `Q = ${fmt(Q)} Nm³/min`, `年操作 ${fmt(h)} 小時`];
  if (mode === 'hr') return { unit: 'airK', level: 2, title: '空污｜排放速率 kg/hr', keep: { mode }, formula, card,
    stem: `某排放管道粒狀物濃度 ${C} mg/Nm³，乾基排氣量 ${fmt(Q)} Nm³/min，年操作 ${fmt(h)} 小時。該管道粒狀物排放速率為多少 kg/hr？`,
    known: known.concat(['年操作時數為干擾數據', '求：kg/hr']),
    steps: [`每小時排氣量 = ${fmt(Q)} × 60 = ${fmt(Q * 60)} Nm³/hr`, `排放速率 = ${C} × ${fmt(Q * 60)} ÷ 10⁶ = <b>${fmt(kgh, 3)} kg/hr</b>`],
    check: '濃度 × 風量 × 60 ÷ 10⁶ ✔',
    answer: kgh, opts: numOptions(kgh, [
      { v: C * Q / 1e6, type: ERR.read, why: '排氣量是每分鐘，要 × 60 才是每小時。' },
      { v: C * Q * 60 / 1e3, type: ERR.unit, why: 'mg 換 kg 要 ÷ 10⁶，不是 ÷ 1,000。' },
      { v: C * Q * 60 * 24 / 1e6, type: ERR.read, why: '多乘了 24，算成每日排放量。' }
    ], 3, 'kg/hr') };
  return { unit: 'airK', level: 3, title: '空污｜年排放量 t/yr', keep: { mode }, formula, card,
    stem: `某排放管道 SOx 濃度 ${C} mg/Nm³，乾基排氣量 ${fmt(Q)} Nm³/min，年操作 ${fmt(h)} 小時。該管道 SOx 年排放量為多少公噸？`,
    known: known.concat(['求：t/yr']),
    steps: [`排放速率 = ${C} × ${fmt(Q)} × 60 ÷ 10⁶ = ${fmt(kgh, 3)} kg/hr`, `年排放量 = ${fmt(kgh, 3)} × ${fmt(h)} ÷ 1,000 = <b>${fmt(tyr, 2)} t/yr</b>`],
    check: '年排放量用「實際操作時數」，不是 8,760 小時 ✔',
    answer: tyr, opts: numOptions(tyr, [
      { v: kgh * h, type: ERR.unit, why: '算出的是 kg，忘了 ÷ 1,000 換成公噸。' },
      { v: C * Q * h / 1e9, type: ERR.read, why: '排氣量是每分鐘，要先 × 60 換成每小時。' },
      { v: kgh * 8760 / 1000, type: ERR.read, why: `用了全年 8,760 小時；題目給的年操作時數是 ${fmt(h)} 小時。` }
    ], 2, 't/yr') };
};

G.aStd = () => {
  const Q = R(300, 2000, 10), T = R(60, 220), w = R(5, 20);
  const v = Q * 273 / (273 + T) * (1 - w / 100);
  return {
    unit: 'airK', level: 3, title: '空污｜實際排氣量換算乾基標準狀態',
    stem: `某煙道實測排氣量 ${fmt(Q)} m³/min，排氣溫度 ${T}°C、壓力 1 atm，水分含量 ${w}%。換算為乾基標準狀態（0°C、1 atm）排氣量為多少 Nm³/min？`,
    known: [`Q實際 = ${fmt(Q)} m³/min`, `T = ${T}°C = ${273 + T} K`, `水分 = ${w}% → 乾基比例 ${f(1 - w / 100, 2)}`, '求：Nm³/min（乾基）'],
    formula: { expr: 'Q乾基標準 = Q實際 × 273/(273 + T) × (P/1 atm) × (1 − 水分)', vars: 'T：排氣溫度（°C）；水分以體積比計', cond: '溫度一定要換成絕對溫度（K）；乾基要扣掉水分。', plain: '熱氣冷卻到 0°C 體積會縮小，再把水蒸氣扣掉，剩下的才是乾的標準氣體。', mnemonic: '「降到零度乘 273 除 (273 + T)，再扣水分」' },
    steps: [`溫度修正 = 273 ÷ ${273 + T} = ${f(273 / (273 + T), 4)}`, `${fmt(Q)} × ${f(273 / (273 + T), 4)} = ${fmt(Q * 273 / (273 + T), 1)} m³/min（濕基標準）`, `× (1 − ${w / 100}) = <b>${fmt(v, 0)} Nm³/min</b>`],
    check: '高溫排氣換算到 0°C、再扣水分，數值一定比實測小 ✔',
    answer: v, opts: numOptions(v, [
      { v: Q * 273 / (273 + T), type: ERR.read, why: '只做溫度修正，沒有扣除水分變成乾基。' },
      { v: Q * 273 / T * (1 - w / 100), type: ERR.unit, why: '溫度沒有加 273 換成絕對溫度。' },
      { v: Q * (273 + T) / 273 * (1 - w / 100), type: ERR.concept, why: '溫度比放反；降溫體積變小，要乘 273/(273 + T)。' },
      { v: Q * 298 / (273 + T) * (1 - w / 100), type: ERR.law, why: '標準狀態（N）是 0°C = 273 K，不是 25°C。' }
    ], 0, 'Nm³/min'),
    card: { [ERR.unit]: '查爾斯定律要用絕對溫度：K = °C + 273。', [ERR.concept]: '理想氣體 PV/T 固定：V₂ = V₁ × (T₂/T₁) × (P₁/P₂)。排放標準、排放量計算都以乾基標準狀態為準。' }
  };
};

G.aSO2 = () => {
  const F = R(500, 3000, 50), S = pick([0.3, 0.5, 0.8, 1.0]), eta = pick([80, 85, 90, 95]);
  const raw = F * S / 100 * 64 / 32, v = raw * (1 - eta / 100);
  return {
    unit: 'airK', level: 3, title: '空污｜燃料含硫量推估 SO₂ 排放',
    stem: `某鍋爐每小時燃燒重油 ${fmt(F)} kg，重油含硫量 ${S}%，假設硫完全轉為 SO₂，排煙脫硫設備效率 ${eta}%。SO₂ 排放量為多少 kg/hr？（S = 32、O = 16）`,
    known: [`燃料 = ${fmt(F)} kg/hr`, `含硫 = ${S}% = ${S / 100}`, 'S → SO₂：32 → 64（× 2）', `脫硫效率 = ${eta}%`, '求：SO₂ kg/hr'],
    formula: { expr: 'SO₂ = 燃料量 × 含硫率 × 64/32 × (1 − η)', vars: '64/32：每 1 kg 硫燃燒生成 2 kg SO₂', cond: '百分比換小數；最後再乘穿透率 (1 − η)。', plain: '先算燒掉多少硫，硫變成 SO₂ 重量變 2 倍，再扣掉脫硫設備去除的部分。', mnemonic: '「硫乘二變 SO₂，再乘 1 減效率」' },
    steps: [`含硫量 = ${fmt(F)} × ${S / 100} = ${fmt(F * S / 100, 2)} kg S/hr`, `生成 SO₂ = × 64/32 = ${fmt(raw, 2)} kg/hr`, `排放 = ${fmt(raw, 2)} × (1 − ${eta / 100}) = <b>${fmt(v, 2)} kg/hr</b>`],
    check: '排放量 = 生成量 × 穿透率，應明顯小於生成量 ✔',
    answer: v, opts: numOptions(v, [
      { v: F * S / 100 * (1 - eta / 100), type: ERR.concept, why: '只算到硫的重量，沒有 × 64/32 換成 SO₂。' },
      { v: raw, type: ERR.read, why: '忘了扣除脫硫設備的去除效率。' },
      { v: F * S / 100 * 32 / 64 * (1 - eta / 100), type: ERR.concept, why: '比例放反；S 變 SO₂ 要 × 64/32。' },
      { v: F * S * 2 * (1 - eta / 100), type: ERR.unit, why: `含硫 ${S}% 要換成 ${S / 100}。` }
    ], 2, 'kg/hr'),
    card: { [ERR.concept]: 'S + O₂ → SO₂（32 → 64）。降低 SO₂：改用低硫燃料、排煙脫硫（濕式石灰石法，副產物為石膏）。' }
  };
};

G.aBag = () => {
  const Q = R(300, 1500, 50), AC = pick([0.8, 1.0, 1.2, 1.5]), D = pick([15, 16, 20]), Lb = pick([3, 4, 5, 6]);
  const a = PI * D / 100 * Lb, A = Q / AC, N = Math.ceil(A / a);
  return {
    unit: 'airK', level: 3, title: '空污｜袋式集塵器濾袋數量',
    stem: `袋式集塵器處理風量 ${fmt(Q)} m³/min，設計氣布比 ${AC} m/min。濾袋直徑 ${D} cm、長 ${Lb} m（以圓柱側面積計），至少需要幾支濾袋？`,
    known: [`Q = ${fmt(Q)} m³/min`, `氣布比 A/C = ${AC} m/min`, `濾袋直徑 ${D} cm = ${D / 100} m，長 ${Lb} m`, '求：濾袋支數（無條件進位）'],
    formula: { expr: '總過濾面積 A = Q ÷ 氣布比；單袋面積 = π × D × L', vars: '氣布比：每 m² 濾布每分鐘處理的氣量（m/min）', cond: '直徑 cm 要換成 m；支數一律無條件進位。', plain: '先算總共需要多大的布，再除以一支濾袋的布面積。', mnemonic: '「風量除氣布比得面積，π D L 是一支」' },
    steps: [`總過濾面積 = ${fmt(Q)} ÷ ${AC} = ${fmt(A, 1)} m²`, `單袋面積 = π × ${D / 100} × ${Lb} = ${f(a, 3)} m²`, `支數 = ${fmt(A, 1)} ÷ ${f(a, 3)} = ${f(A / a, 1)} → <b>${N} 支</b>`],
    check: '支數要進位，否則實際氣布比會超過設計值 ✔',
    answer: N, opts: numOptions(N, [
      { v: Math.ceil(A / (PI * D / 200 * Lb)), type: ERR.read, why: '把直徑當成半徑代入（只用了一半周長），算出來支數變兩倍。' },
      { v: Math.ceil(Q * AC / a), type: ERR.concept, why: '氣布比要「除」；總面積 = 風量 ÷ 氣布比。' },
      { v: Math.ceil(Q / 60 / AC / a), type: ERR.unit, why: '氣布比單位是 m/min，風量不用換成每秒。' },
      { v: Math.ceil(A / (PI * Math.pow(D / 100, 2) / 4 * Lb)), type: ERR.concept, why: '單袋過濾面積是圓柱側面積 π D L，不是濾袋體積。' }
    ], 0, '支'),
    card: { [ERR.concept]: '氣布比越高，濾布負荷越大、壓損上升、易穿透；越低則設備越大越貴。袋式集塵器入口溫度須高於酸露點、低於濾材耐溫上限。' }
  };
};

G.aStokes = () => {
  const d = pick([5, 10, 20, 30, 50]), rp = pick([1200, 1500, 2000, 2500]), mu = 1.8e-5;
  const vt = 9.81 * rp * Math.pow(d * 1e-6, 2) / (18 * mu), v = vt * 100;
  return {
    unit: 'airK', level: 4, title: '空污｜史托克定律沉降速度',
    stem: `粒徑 ${d} μm、密度 ${fmt(rp)} kg/m³ 的粉塵，在空氣（黏度 μ = 1.8 × 10⁻⁵ kg/m·s，空氣密度可忽略）中沉降，依史托克定律其終端沉降速度為多少 cm/s？（g = 9.81 m/s²）`,
    known: [`dₚ = ${d} μm = ${d} × 10⁻⁶ m`, `ρₚ = ${fmt(rp)} kg/m³`, 'μ = 1.8 × 10⁻⁵ kg/m·s', '求：Vt（cm/s）'],
    formula: { expr: 'Vt = g × ρₚ × dₚ² ÷ (18 μ)', vars: 'dₚ：粒徑（m）；ρₚ：粒子密度；μ：氣體黏度', cond: '適用層流區（Re < 1）；粒徑要平方，μm 先換成 m。', plain: '顆粒越大、越重沉得越快，而且和粒徑「平方」成正比；空氣越黏沉得越慢。', mnemonic: '「g 乘密度乘 d 平方，除以 18 μ」' },
    steps: [`dₚ² = (${d} × 10⁻⁶)² = ${(d * d)} × 10⁻¹² m²`, `Vt = 9.81 × ${fmt(rp)} × ${d * d}×10⁻¹² ÷ (18 × 1.8×10⁻⁵) = ${vt.toExponential(3)} m/s`, `× 100 = <b>${fmt(v, 4)} cm/s</b>`],
    check: '粒徑放大 10 倍，沉降速度約放大 100 倍 ✔',
    answer: v, opts: numOptions(v, [
      { v: v * 2, type: ERR.concept, why: '分母是 18μ，不是 9μ。' },
      { v: v / 4, type: ERR.read, why: '把粒徑當成直徑的一半（半徑）代入；史托克式用的是粒徑（直徑）。' },
      { v: vt, type: ERR.unit, why: '算出的是 m/s，題目問 cm/s，要 × 100。' },
      { v: 9.81 * rp * d * 1e-6 / (18 * mu) * 100, type: ERR.concept, why: '粒徑沒有平方。' }
    ], 4, 'cm/s'),
    card: { [ERR.concept]: '沉降室、旋風集塵器都靠重力或離心力分離，對大顆粒有效；細微粒（PM2.5）沉降極慢，要靠袋式、靜電集塵器。' }
  };
};

G.wFM = () => {
  const Q = R(500, 5000, 100), BOD = R(150, 400, 10), X = R(2500, 4000, 100), vr = pick([0.7, 0.75, 0.8]);
  const Xv = Math.round(X * vr / 10) * 10, tgt = R(15, 50) / 100;
  const V = Math.max(200, Math.round(Q * BOD / (tgt * Xv) / 50) * 50), FM = Q * BOD / (V * Xv);
  return {
    unit: 'waterK', level: 2, title: '廢水｜F/M 比（食微比）',

G.wSVI = () => {
  const SV = R(150, 450, 10), X = R(1500, 4000, 100), v = SV * 1000 / X;
  const judge = v > 200 ? '大於 200，污泥膨化' : v >= 50 && v <= 150 ? '介於 50～150，沉降性良好' : v < 50 ? '偏低，膠羽細小、出流可能混濁' : '介於 150～200，沉降性偏差，需注意';
  return {
    unit: 'waterK', level: 1, title: '廢水｜污泥容積指標 SVI',
    stem: `取曝氣槽混合液 1 L 靜置 30 分鐘，污泥沉降體積 SV₃₀ = ${SV} mL/L，MLSS = ${fmt(X)} mg/L。SVI 為多少 mL/g？`,
    known: [`SV₃₀ = ${SV} mL/L`, `MLSS = ${fmt(X)} mg/L = ${X / 1000} g/L`, '求：SVI（mL/g）'],
    formula: { expr: 'SVI = SV₃₀（mL/L）× 1,000 ÷ MLSS（mg/L）', vars: 'SVI：每 1 g 污泥沉降後所占的體積', cond: 'MLSS 要從 mg 換成 g，所以 × 1,000。', plain: '看 1 克污泥沉下來占多少毫升；占越多代表越鬆、越難沉。', mnemonic: '「SV 乘千除 MLSS」' },
    steps: [`SVI = ${SV} × 1,000 ÷ ${fmt(X)} = <b>${fmt(v, 0)} mL/g</b>`, `判讀：${judge}`],
    check: 'SVI 50～150 良好；> 200 通常判定為污泥膨化 ✔',
    answer: v, opts: numOptions(v, [
      { v: SV * 100 / X, type: ERR.unit, why: 'mg 換 g 是 × 1,000，不是 × 100。' },
      { v: SV / X * 1e6, type: ERR.unit, why: '多乘了 1,000；SVI 單位是 mL/g。' },
      { v: X / SV, type: ERR.concept, why: '分子分母放反了。' }
    ], 0, 'mL/g'),
    card: { [ERR.concept]: '污泥膨化（bulking）常見原因：絲狀菌增生（低 DO、低 F/M、缺 N/P、低 pH）。對策：調整 DO 與負荷、補充營養鹽、加氯殺絲狀菌。' }
  };
};

G.wSRT = () => {

G.wRem = (o = {}) => {

    return { unit: 'waterK', level: 1, title: '廢水｜處理去除率', keep: { mode },
      stem: `某廢水處理廠進流 COD ${fmt(Ci)} mg/L，放流 COD ${Co} mg/L。COD 去除率為多少 %？`,
      known: [`Cin = ${fmt(Ci)} mg/L`, `Cout = ${Co} mg/L`, '求：去除率'],
      formula: { expr: '去除率 = (Cin − Cout) ÷ Cin × 100%', vars: 'Cin：進流濃度；Cout：放流濃度', cond: '分母永遠是「進流」。', plain: '去掉的量占原本的幾成。', mnemonic: '「去掉的除原本的」' },
      steps: [`(${fmt(Ci)} − ${Co}) ÷ ${fmt(Ci)} = ${f((Ci - Co) / Ci, 4)}`, `= <b>${fmt(v, 1)}%</b>`], check: '去除率介於 0～100% ✔',
      answer: v, opts: numOptions(v, [{ v: Co / Ci * 100, type: ERR.concept, why: '這是殘留率（穿透率），不是去除率。' }, { v: (Ci - Co) / Co * 100, type: ERR.concept, why: '分母要用進流濃度，不是放流濃度。' }, { v: (Ci - Co) / Ci * 10, type: ERR.math, why: '小數換百分比要 × 100。' }], 1, '%'),
      card: { [ERR.concept]: '去除率 + 殘留率 = 100%。' } };
  }
  const Ci = R(150, 900, 10), Cs = 30, v = (Ci - Cs) / Ci * 100;
  return { unit: 'waterK', level: 2, title: '廢水｜符合放流水標準所需去除率', keep: { mode },
    stem: `某事業廢水進流 BOD ${Ci} mg/L，放流水 BOD 限值為 ${Cs} mg/L。處理設施至少須達多少 % 去除率？`,
    known: [`Cin = ${Ci} mg/L`, `限值 = ${Cs} mg/L`, '求：最低去除率'],
    formula: { expr: '所需去除率 = (Cin − 限值) ÷ Cin × 100%', vars: '限值：放流水標準（題目給定）', cond: '分母是進流濃度。', plain: '要從原本的濃度降到限值，至少得去掉幾成。', mnemonic: '「降到限值，去掉的除原本的」' },
    steps: [`(${Ci} − ${Cs}) ÷ ${Ci} = ${f((Ci - Cs) / Ci, 4)}`, `= <b>${fmt(v, 1)}%</b>`], check: '實務上要保留安全餘裕，設計去除率應高於此值 ✔',
    answer: v, opts: numOptions(v, [{ v: Cs / Ci * 100, type: ERR.concept, why: '這是允許殘留的比例，不是去除率。' }, { v: (Ci - Cs) / Cs * 100, type: ERR.concept, why: '分母應為進流濃度。' }, { v: 100 - Cs, type: ERR.read, why: '不能直接用 100 減濃度值。' }], 1, '%'),
    card: { [ERR.law]: '放流水標準依業別、排放水體、建造時間有不同限值，題目給什麼用什麼；pH 6.0～9.0 為共同規定。' } };
};

const WCHEM = [{ n: '次氯酸鈉溶液', p: 12, use: '消毒' }, { n: '液鹼（NaOH 溶液）', p: 45, use: '中和' }, { n: 'PAC 溶液', p: 10, use: '混凝' }, { n: '硫酸', p: 98, use: '調整 pH' }];

G.wSludge = () => {

    unit: 'waterK', level: 2, title: '廢水｜污泥脫水後體積',
    stem: `每日產生含水率 ${P1}% 的濃縮污泥 ${V1} m³，經脫水機脫水至含水率 ${P2}%。脫水後污泥體積約為多少 m³/d？（假設污泥比重約為 1）`,
    known: [`V₁ = ${V1} m³，含水率 P₁ = ${P1}% → 固體 ${f(100 - P1, 1)}%`, `P₂ = ${P2}% → 固體 ${100 - P2}%`, '求：V₂'],
    formula: { expr: 'V₂ = V₁ × (100 − P₁) ÷ (100 − P₂)', vars: 'P：含水率（%）；100 − P：固體含量', cond: '脫水前後「乾固體量」不變。', plain: '水被擠掉，乾的固體不會變少，所以用固體量守恆來算。', mnemonic: '「固體不變：100 減前、除 100 減後」' },
    steps: [`乾固體 = ${V1} × ${f((100 - P1) / 100, 3)} = ${fmt(V1 * (100 - P1) / 100, 2)} m³（當量）`, `V₂ = ${fmt(V1 * (100 - P1) / 100, 2)} ÷ ${(100 - P2) / 100} = <b>${fmt(v, 2)} m³/d</b>`],
    check: `含水率從 ${P1}% 降到 ${P2}%，體積大幅縮小 ✔`,
    answer: v, opts: numOptions(v, [

      { v: V1 * P2 / P1, type: ERR.concept, why: '要用固體含量（100 − P）算，不是含水率直接相比。' },

    ], 2, 'm³/d'),
    card: { [ERR.concept]: '含水率 99% → 98%，體積就減半！污泥處理流程：濃縮 → 消化（穩定）→ 調理 → 脫水（帶濾、離心、板框）→ 最終處置。' }
  };
};

    steps: [`R = ${fmt(X)} ÷ (${fmt(Xr)} − ${fmt(X)}) = ${f(r, 3)}`, `Qr = ${f(r, 3)} × ${fmt(Q)} = <b>${fmt(v, 0)} m³/d</b>`],
    check: '迴流比一般約 0.25～1.0 ✔',
    answer: v, opts: numOptions(v, [
      { v: X / Xr * Q, type: ERR.concept, why: '分母要用 (Xr − X)，不是 Xr。' },
      { v: (Xr - X) / X * Q, type: ERR.concept, why: '迴流比算式放反了。' },
      { v: Xr / X * Q, type: ERR.concept, why: '不是濃度比；要從質量平衡推導。' }
    ], 0, 'm³/d'),
    card: { [ERR.concept]: '質量平衡：Qr·Xr = (Q + Qr)·X → R = X/(Xr − X)。迴流污泥濃度越高，所需迴流量越少。' }
  };
};

// =====================================================
// 廢：廢棄物清除／處理技術員

G.dMoist = (o = {}) => {
  const mode = o.mode || pick(['dry', 'comb']);
  if (mode === 'dry') { const W = R(10, 100), m1 = pick([40, 45, 50, 55, 60]), m2 = pick([10, 15, 20, 25]), v = W * (100 - m1) / (100 - m2);
    return { unit: 'wasteK', level: 2, title: '廢棄物｜乾燥後重量', keep: { mode },
      stem: `含水率 ${m1}% 的廢棄物 ${W} 公噸，經乾燥至含水率 ${m2}%。乾燥後重量為多少公噸？`,
      known: [`W₁ = ${W} t，含水率 ${m1}% → 乾物 ${100 - m1}%`, `乾燥後含水率 ${m2}% → 乾物 ${100 - m2}%`, '求：W₂'],
      formula: { expr: 'W₂ = W₁ × (100 − m₁) ÷ (100 − m₂)', vars: 'm：含水率（濕基 %）', cond: '乾燥只蒸發水分，乾物重量不變。', plain: '水跑掉、乾物不變，用乾物守恆算新的總重。', mnemonic: '「乾物守恆：100 減前、除 100 減後」' },
      steps: [`乾物 = ${W} × ${(100 - m1) / 100} = ${fmt(W * (100 - m1) / 100, 2)} t`, `W₂ = ${fmt(W * (100 - m1) / 100, 2)} ÷ ${(100 - m2) / 100} = <b>${fmt(v, 2)} t</b>`], check: '乾燥後一定比原本輕，但比純乾物重 ✔',
      answer: v, opts: numOptions(v, [{ v: W * (1 - (m1 - m2) / 100), type: ERR.concept, why: '不能直接扣含水率差，守恆的是乾物量。' }, { v: W * (100 - m2) / (100 - m1), type: ERR.concept, why: '比例放反了，乾燥後應變輕。' }, { v: W * (100 - m1) / 100, type: ERR.read, why: '這是完全乾燥的乾物量；題目還剩含水率 ' + m2 + '%。' }], 2, 't'),
      card: { [ERR.concept]: '濕基含水率 = 水重 ÷ 總重。乾燥、脫水、堆肥前後的重量變化，都用「乾物不變」來算。' } };
  }
  const a = R(35, 60), b = R(8, 25), v = (100 - a - b) / (100 - a) * 100;
  return { unit: 'wasteK', level: 2, title: '廢棄物｜三成分與乾基可燃分', keep: { mode },
    stem: `某垃圾三成分分析（濕基）：水分 ${a}%、灰分 ${b}%，其餘為可燃分。以乾基表示，可燃分為多少 %？`,
    known: [`濕基可燃分 = 100 − ${a} − ${b} = ${100 - a - b}%`, `乾物 = 100 − ${a} = ${100 - a}%`, '求：乾基可燃分'],
    formula: { expr: '乾基 % = 濕基 % ÷ (100 − 水分) × 100', vars: '三成分：水分 + 灰分 + 可燃分 = 100%', cond: '乾基就是把水分拿掉後重新算比例。', plain: '先算可燃分在整包裡占多少，再除以「扣掉水之後」的比例。', mnemonic: '「三成分加起來 100，乾基要除 (100 − 水分)」' },
    steps: [`濕基可燃分 = 100 − ${a} − ${b} = ${100 - a - b}%`, `乾基 = ${100 - a - b} ÷ ${100 - a} × 100 = <b>${fmt(v, 1)}%</b>`], check: '乾基可燃分 + 乾基灰分 = 100% ✔',
    answer: v, opts: numOptions(v, [{ v: 100 - a - b, type: ERR.read, why: '這是濕基可燃分；題目要乾基。' }, { v: 100 - b, type: ERR.concept, why: '灰分也要先換成乾基，不能直接 100 − 灰分。' }, { v: b / (100 - a) * 100, type: ERR.read, why: '這是乾基灰分。' }], 1, '%'),
    card: { [ERR.concept]: '垃圾三成分：水分、灰分、可燃分。可燃分越高、水分越低，越適合焚化。' } };
};

G.dHHV = () => {
  const C = R(35, 55), H = R(5, 8), O = R(12, Math.min(32, 8 * H - 8)), S = pick([0.2, 0.3, 0.5, 1]);
  const v = 81 * C + 342.5 * (H - O / 8) + 22.5 * S;
  return {
    unit: 'wasteK', level: 3, title: '廢棄物｜Dulong 公式高位發熱量',
    stem: `某廢棄物元素分析（重量 %）：C ${C}%、H ${H}%、O ${O}%、S ${S}%。依 Dulong 公式 HHV = 81C + 342.5(H − O/8) + 22.5S（kcal/kg），其高位發熱量約為多少 kcal/kg？`,
    known: [`C = ${C}、H = ${H}、O = ${O}、S = ${S}（直接代百分比數字）`, `H − O/8 = ${H} − ${f(O / 8, 3)} = ${f(H - O / 8, 3)}`, '求：HHV'],
    formula: { expr: 'HHV = 81C + 342.5(H − O/8) + 22.5S', vars: 'C、H、O、S：元素重量百分比（代入數字，不用換小數）', cond: 'O/8 代表已和氫結合成水、不能再放熱的氫。', plain: '碳、氫、硫燒了會放熱；氧會先「綁走」一部分氫，所以要扣掉 O/8。', mnemonic: '「81 碳、342.5 有效氫（H − O/8）、22.5 硫」' },
    steps: [`81 × ${C} = ${fmt(81 * C, 1)}`, `342.5 × ${f(H - O / 8, 3)} = ${fmt(342.5 * (H - O / 8), 1)}`, `22.5 × ${S} = ${fmt(22.5 * S, 1)}`, `合計 = <b>${fmt(v, 0)} kcal/kg</b>`],
    check: '一般都市垃圾高位發熱量約數千 kcal/kg ✔',
    answer: v, opts: numOptions(v, [
      { v: 81 * C + 342.5 * H + 22.5 * S, type: ERR.concept, why: '忘了扣 O/8；氧已結合的氫不能再放熱。' },
      { v: 81 * C + 22.5 * S, type: ERR.concept, why: '漏算氫的發熱量；342.5(H − O/8) 是重要的一項。' },
      { v: 81 * C + 34.25 * (H - O / 8) + 22.5 * S, type: ERR.math, why: '氫的係數是 342.5，位數抄錯。' }
    ], 0, 'kcal/kg'),
    card: { [ERR.concept]: 'Dulong 公式以元素分析估算高位發熱量（HHV）。低位發熱量（LHV）要再扣水蒸氣的潛熱：LHV = HHV − 6(9H + W)。' }
  };
};

G.dLHV = () => {
  const HHV = R(2000, 4500, 50), H = R(3, 7), W = R(30, 55), v = HHV - 6 * (9 * H + W);
  return {
    unit: 'wasteK', level: 2, title: '廢棄物｜低位發熱量',
    stem: `某垃圾高位發熱量 ${fmt(HHV)} kcal/kg，氫含量 ${H}%、水分 ${W}%（濕基）。依 LHV = HHV − 6(9H + W) 計算，低位發熱量為多少 kcal/kg？`,
    known: [`HHV = ${fmt(HHV)} kcal/kg`, `H = ${H}、W = ${W}（代百分比數字）`, '9H：氫燃燒生成的水（每 1 份氫生成 9 份水）', '求：LHV'],
    formula: { expr: 'LHV = HHV − 6(9H + W)', vars: '6 ≈ 600 kcal/kg 水的蒸發潛熱 ÷ 100', cond: 'H、W 直接代百分比數字。', plain: '燒出來的水和原本的水都會變成水蒸氣帶走熱量，所以實際可用的熱比較少。', mnemonic: '「高位減 6 倍（9 氫加水）」' },
    steps: [`9H + W = 9 × ${H} + ${W} = ${9 * H + W}`, `6 × ${9 * H + W} = ${6 * (9 * H + W)}`, `LHV = ${fmt(HHV)} − ${6 * (9 * H + W)} = <b>${fmt(v, 0)} kcal/kg</b>`],
    check: 'LHV 一定小於 HHV ✔',
    answer: v, opts: numOptions(v, [
      { v: HHV - 6 * (H + W), type: ERR.concept, why: '氫燃燒會生成 9 倍重的水，要用 9H。' },
      { v: HHV - 6 * 9 * H, type: ERR.read, why: '漏了廢棄物本身的水分 W。' },
      { v: HHV + 6 * (9 * H + W), type: ERR.concept, why: '水蒸發會吸熱，LHV 要「減」，不是加。' },
      { v: HHV - 6 * (9 * W + H), type: ERR.concept, why: '9 倍是乘在氫（H）上，不是乘在水分（W）上。' }
    ], 0, 'kcal/kg'),
    card: { [ERR.concept]: '焚化爐設計用低位發熱量（LHV）；一般垃圾 LHV 低於約 1,000 kcal/kg 時，常需輔助燃料才能維持燃燒。' }
  };
};

G.dComp = (o = {}) => {
  const mode = o.mode || pick(['ratio', 'red']);
  const r1 = R(100, 250, 10), r2 = R(400, 800, 10);
  if (mode === 'ratio') { const v = r2 / r1;
    return { unit: 'wasteK', level: 1, title: '廢棄物｜壓縮比', keep: { mode },
      stem: `垃圾收集時鬆散密度 ${r1} kg/m³，經壓縮式垃圾車壓縮後密度 ${r2} kg/m³。壓縮比為多少？`,
      known: [`ρ₁ = ${r1} kg/m³`, `ρ₂ = ${r2} kg/m³`, '重量不變 → 體積比 = 密度反比', '求：壓縮比 V₁/V₂'],
      formula: { expr: '壓縮比 = V₁ ÷ V₂ = ρ₂ ÷ ρ₁', vars: 'V₁、ρ₁：壓縮前；V₂、ρ₂：壓縮後', cond: '壓縮前後重量不變。', plain: '原本的體積是壓縮後的幾倍。', mnemonic: '「壓縮比 = 前體積除後體積 = 後密度除前密度」' },
      steps: [`壓縮比 = ${r2} ÷ ${r1} = <b>${fmt(v, 2)}</b>`], check: '壓縮比 > 1 ✔',
      answer: v, opts: numOptions(v, [{ v: r1 / r2, type: ERR.concept, why: '放反了；壓縮比應大於 1。' }, { v: (r2 - r1) / r1, type: ERR.concept, why: '這是密度增加率，不是壓縮比。' }, { v: (1 - r1 / r2) * 10, type: ERR.concept, why: '減容率和壓縮比是不同的指標。' }], 2, '倍'),
      card: { [ERR.concept]: '壓縮比 = V₁/V₂；減容率 = (V₁ − V₂)/V₁ = 1 − 1/壓縮比。' } };
  }
  const v = (1 - r1 / r2) * 100;
  return { unit: 'wasteK', level: 2, title: '廢棄物｜減容率', keep: { mode },
    stem: `垃圾鬆散密度 ${r1} kg/m³，壓縮後密度 ${r2} kg/m³。減容率為多少 %？`,
    known: [`ρ₁ = ${r1}、ρ₂ = ${r2} kg/m³`, `V₂/V₁ = ρ₁/ρ₂ = ${f(r1 / r2, 4)}`, '求：減容率'],
    formula: { expr: '減容率 = (V₁ − V₂) ÷ V₁ × 100% = (1 − ρ₁/ρ₂) × 100%', vars: '重量不變時，體積與密度成反比', cond: '分母是壓縮「前」的體積。', plain: '體積少掉了幾成。', mnemonic: '「1 減前密度除後密度」' },
    steps: [`V₂/V₁ = ${r1} ÷ ${r2} = ${f(r1 / r2, 4)}`, `減容率 = (1 − ${f(r1 / r2, 4)}) × 100 = <b>${fmt(v, 1)}%</b>`], check: '減容率介於 0～100% ✔',
    answer: v, opts: numOptions(v, [{ v: r1 / r2 * 100, type: ERR.read, why: '這是壓縮後剩下的體積比例，不是減少的比例。' }, { v: (r2 - r1) / r1 * 100, type: ERR.concept, why: '分母用錯；減容率以壓縮前體積為基準。' }, { v: (1 - r1 / r2) * 10, type: ERR.math, why: '小數換百分比要 × 100。' }], 1, '%'),
    card: { [ERR.concept]: '焚化的減容率常達 90% 以上、減重率約 70～85%，是焚化的主要優點。' } };
};

G.dMix = () => {
  const fs = pick([[45, 30, 15, 10], [40, 25, 20, 15], [50, 25, 15, 10], [35, 30, 20, 15]]);
  const H = [R(8, 12) * 100, R(35, 42) * 100, R(70, 90) * 100, R(15, 25) * 100];
  const names = ['廚餘', '紙類', '塑膠', '其他'];
  const v = fs.reduce((s, x, i) => s + x * H[i], 0) / 100;
  return {
    unit: 'wasteK', level: 2, title: '廢棄物｜混合垃圾加權發熱量',
    stem: `某垃圾組成（濕基重量比）：${names.map((n, i) => `${n} ${fs[i]}%（${fmt(H[i])} kcal/kg）`).join('、')}。混合垃圾的平均低位發熱量為多少 kcal/kg？`,
    known: names.map((n, i) => `${n}：${fs[i]}% × ${fmt(H[i])}`).concat(['求：加權平均發熱量']),
    formula: { expr: 'H混合 = Σ（重量分率 × 各組成發熱量）', vars: '重量分率：百分比 ÷ 100', cond: '各組成比例加總必須 = 100%。', plain: '依照每種垃圾占的比例，把熱值加權平均。', mnemonic: '「比例乘熱值，加總再除 100」' },
    steps: names.map((n, i) => `${n}：${fs[i] / 100} × ${fmt(H[i])} = ${fmt(fs[i] * H[i] / 100, 0)}`).concat([`合計 = <b>${fmt(v, 0)} kcal/kg</b>`]),
    check: '答案必定介於最低（廚餘）與最高（塑膠）熱值之間 ✔',
    answer: v, opts: numOptions(v, [
      { v: H.reduce((s, x) => s + x, 0) / 4, type: ERR.concept, why: '不能直接取算術平均，要依重量比例加權。' },
      { v: fs.slice(1).reduce((s, x, i) => s + x * H[i + 1], 0) / (100 - fs[0]), type: ERR.read, why: '漏算了廚餘；所有組成都要計入。' },
      { v: fs.reduce((s, x, i) => s + x * H[i], 0) / 10, type: ERR.math, why: '百分比要 ÷ 100。' }
    ], 0, 'kcal/kg'),
    card: { [ERR.concept]: '廚餘含水率高、熱值低；塑膠熱值高但易產生 HCl、戴奧辛前驅物。垃圾分類回收會改變進廠垃圾熱值。' }
  };
};

G.dLand = () => {
  const V = R(20, 80) * 10000, Wd = R(100, 500, 10), rho = pick([0.8, 0.9, 1.0]), c = pick([15, 20, 25]);
  const daily = Wd / rho * (1 + c / 100), v = V / (daily * 365);
  return {
    unit: 'wasteK', level: 3, title: '廢棄物｜掩埋場使用年限',
    stem: `某衛生掩埋場可掩埋容積 ${fmt(V)} m³，每日進場垃圾 ${Wd} 公噸，壓實後密度 ${rho} t/m³，覆土體積為垃圾體積的 ${c}%。可使用多少年？`,
    known: [`垃圾體積 = ${Wd} ÷ ${rho} = ${fmt(Wd / rho, 1)} m³/d`, `含覆土 = × (1 + ${c / 100}) = ${fmt(daily, 1)} m³/d`, `V = ${fmt(V)} m³`, '求：年限'],
    formula: { expr: '年限 = V ÷ [（每日垃圾量 ÷ 密度）× (1 + 覆土比) × 365]', vars: '覆土比：覆土體積 ÷ 垃圾體積', cond: '重量 ÷ 密度 = 體積；覆土也會占用容積。', plain: '每天用掉多少容積（垃圾 + 覆土），再看總容積夠用幾天、換成年。', mnemonic: '「噸除密度變體積，加覆土，乘 365」' },
    steps: [`每日占用 = ${Wd} ÷ ${rho} × ${1 + c / 100} = ${fmt(daily, 1)} m³/d`, `每年 = × 365 = ${fmt(daily * 365, 0)} m³/yr`, `年限 = ${fmt(V)} ÷ ${fmt(daily * 365, 0)} = <b>${fmt(v, 1)} 年</b>`],
    check: '考慮覆土後年限會變短 ✔',
    answer: v, opts: numOptions(v, [
      { v: V / (Wd / rho * 365), type: ERR.read, why: '忘了覆土也會占用掩埋容積。' },
      { v: V / (Wd / rho * (1 - c / 100) * 365), type: ERR.concept, why: '覆土是「增加」占用體積，要乘 (1 + 覆土比)。' },
      { v: V / (Wd * rho * (1 + c / 100) * 365), type: ERR.unit, why: '重量換體積是「除以」密度。' },
      { v: V / (Wd / rho * (1 + c / 100)) / 30, type: ERR.unit, why: '天數換年要 ÷ 365，不是 ÷ 30（那是月）。' }
    ], 1, '年'),
    card: { [ERR.concept]: '衛生掩埋：每日覆土、底部不透水襯墊、滲出水收集處理、沼氣（CH₄、CO₂）收集。' }
  };
};

G.dRed = () => {
  const In = R(300, 1500, 10), ba = R(12, 20), fa = R(2, 5), B = Math.round(In * ba / 100), Fa = Math.round(In * fa / 100 * 10) / 10;
  const v = (1 - (B + Fa) / In) * 100;
  return {
    unit: 'wasteK', level: 1, title: '廢棄物｜焚化減重率',
    stem: `某焚化廠每日處理垃圾 ${fmt(In)} 公噸，產生底渣 ${fmt(B)} 公噸、飛灰 ${fmt(Fa, 1)} 公噸。焚化減重率為多少 %？`,
    known: [`進料 = ${fmt(In)} t/d`, `底渣 + 飛灰 = ${fmt(B)} + ${fmt(Fa, 1)} = ${fmt(B + Fa, 1)} t/d`, '求：減重率'],
    formula: { expr: '減重率 = (1 − 灰渣總量 ÷ 進料量) × 100%', vars: '灰渣總量 = 底渣 + 飛灰', cond: '底渣、飛灰都要算進殘餘物。', plain: '燒完後少掉的重量占原本的幾成。', mnemonic: '「1 減（底渣 + 飛灰）除進料」' },
    steps: [`灰渣率 = ${fmt(B + Fa, 1)} ÷ ${fmt(In)} = ${f((B + Fa) / In, 4)}`, `減重率 = (1 − ${f((B + Fa) / In, 4)}) × 100 = <b>${fmt(v, 1)}%</b>`], check: '焚化減重率約 70～85% ✔',
    answer: v, opts: numOptions(v, [
      { v: (1 - B / In) * 100, type: ERR.read, why: '漏算飛灰；飛灰也是焚化殘餘物。' },
      { v: (B + Fa) / In * 100, type: ERR.concept, why: '這是灰渣產生率，不是減重率。' },
      { v: (1 - Fa / In) * 100, type: ERR.read, why: '漏算底渣。' }
    ], 1, '%'),
    card: { [ERR.concept]: '飛灰含重金屬與戴奧辛，需穩定化／固化後掩埋；底渣經篩分處理後可再利用。' }
  };
};

G.dAir = () => {
  const C = R(30, 50), H = R(4, 7), O = R(15, 30), S = pick([0, 0.3, 0.5]), e = pick([50, 80, 100]);
  const O2 = 32 / 12 * C / 100 + 8 * H / 100 + S / 100 - O / 100, At = O2 / 0.232, v = At * (1 + e / 100);
  return {
    unit: 'wasteK', level: 4, title: '廢棄物｜焚化所需空氣量',
    stem: `某廢棄物元素組成（重量）：C ${C}%、H ${H}%、O ${O}%、S ${S}%。焚化時過剩空氣率 ${e}%，每燃燒 1 kg 廢棄物實際需供給多少 kg 空氣？（空氣中氧重量比 23.2%）`,
    known: [`C = ${C / 100}、H = ${H / 100}、O = ${O / 100}、S = ${S / 100}（kg/kg）`, '需氧：C × 32/12、H × 8、S × 1，再扣除廢棄物本身的 O', `過剩空氣 ${e}% → × ${1 + e / 100}`, '求：實際空氣量（kg/kg）'],

G.dCN = () => {
  const CA = R(40, 48), NA = pick([2.5, 3, 3.5]), CB = R(45, 50), NB = pick([0.1, 0.2, 0.3]);

  const v = (mA * CA + mB * CB) / (mA * NA + mB * NB);
  return {
    unit: 'wasteK', level: 3, title: '廢棄物｜堆肥原料混合 C/N 比',
    stem: `堆肥以廚餘（乾基 C ${CA}%、N ${NA}%）與木屑（乾基 C ${CB}%、N ${NB}%）依乾重 ${mA}：${mB} 混合。混合後 C/N 比約為多少？`,
    known: [`廚餘 C/N = ${f(CA / NA, 1)}、木屑 C/N = ${f(CB / NB, 1)}`, `混合乾重比 ${mA}：${mB}`, '求：混合 C/N'],
    formula: { expr: 'C/N混合 = Σ(m × C%) ÷ Σ(m × N%)', vars: 'm：各原料乾重', cond: '碳和氮要「各自加總」後再相除，不能直接平均 C/N 比。', plain: '把總碳量和總氮量分別算出來，再相除。', mnemonic: '「碳加碳、氮加氮，最後才相除」' },
    steps: [`總碳 = ${mA} × ${CA} + ${mB} × ${CB} = ${mA * CA + mB * CB}`, `總氮 = ${mA} × ${NA} + ${mB} × ${NB} = ${f(mA * NA + mB * NB, 2)}`, `C/N = ${mA * CA + mB * CB} ÷ ${f(mA * NA + mB * NB, 2)} = <b>${fmt(v, 1)}</b>`],
    check: '理想堆肥初始 C/N 約 25～30 ✔',
    answer: v, opts: numOptions(v, [
      { v: (CA / NA + CB / NB) / 2, type: ERR.concept, why: 'C/N 比不能直接平均，要先加總碳與氮。' },
      { v: (mA * CA / NA + mB * CB / NB) / (mA + mB), type: ERR.concept, why: '比值不能加權平均；要分別加總碳與氮。' },
      { v: (CA + CB) / (NA + NB), type: ERR.read, why: `漏了混合比例 ${mA}：${mB}。` }

  };
};

const TCHEM = [{ n: '甲醛', m: 30.03 }, { n: '苯', m: 78.11 }, { n: '甲苯', m: 92.14 }, { n: '氯氣', m: 70.9 }, { n: '氨', m: 17.03 }, { n: '氰化氫', m: 27.03 }];
G.tPpm = (o = {}) => {
  const dir = o.dir || pick(['p2m', 'm2p']), c = pick(TCHEM);
  const formula = { expr: 'mg/m³ = ppm × M ÷ 24.45', vars: 'M：分子量；24.45：25°C、1 atm 每莫耳氣體體積（L）', cond: '作業環境與洩漏偵測多以 25°C 計；Nm³（0°C）才用 22.4。', plain: 'ppm 是體積比，乘分子量變成質量濃度。', mnemonic: '「室溫 24.45，乘 M 變毫克」' };
  const card = { [ERR.law]: '25°C 用 24.45、0°C 用 22.4。偵測警報設定值、容許濃度常以 ppm 表示，換算時注意溫度條件。', [ERR.concept]: 'ppm → mg/m³：× M ÷ 24.45；mg/m³ → ppm：× 24.45 ÷ M。' };
  if (dir === 'p2m') { const p = R(2, 100), v = p * c.m / 24.45;
    return { unit: 'toxicK', level: 1, title: '毒化物｜ppm 換算 mg/m³（25°C）', keep: { dir }, formula, card,
      stem: `運作場所偵測器讀值${c.n} ${p} ppm（25°C、1 atm），換算為多少 mg/m³？（分子量 ${c.m}）`,
      known: [`C = ${p} ppm`, `M = ${c.m}`, '25°C → 24.45 L/mol', '求：mg/m³'],
      steps: [`${p} × ${c.m} ÷ 24.45 = <b>${fmt(v, 2)} mg/m³</b>`], check: '分子量大於 24.45 時，mg/m³ 數值大於 ppm ✔',
      answer: v, opts: numOptions(v, [{ v: p * c.m / 22.4, type: ERR.law, why: '22.4 是 0°C；題目是 25°C，用 24.45。' }, { v: p * 24.45 / c.m, type: ERR.concept, why: '換算方向放反了。' }, { v: p * c.m / 24.45 * 1000, type: ERR.unit, why: '多乘 1,000，變成 μg/m³。' }], 2, 'mg/m³') };
  }
  const m = R(5, 200), v = m * 24.45 / c.m;
  return { unit: 'toxicK', level: 1, title: '毒化物｜mg/m³ 換算 ppm（25°C）', keep: { dir }, formula, card,
    stem: `某${c.n}洩漏後，現場空氣中濃度 ${m} mg/m³（25°C、1 atm），換算為多少 ppm？（分子量 ${c.m}）`,
    known: [`C = ${m} mg/m³`, `M = ${c.m}`, '求：ppm'],
    steps: [`${m} × 24.45 ÷ ${c.m} = <b>${fmt(v, 2)} ppm</b>`], check: 'mg → ppm：乘 24.45、除分子量 ✔',
    answer: v, opts: numOptions(v, [{ v: m * 22.4 / c.m, type: ERR.law, why: '25°C 要用 24.45，不是 22.4。' }, { v: m * c.m / 24.45, type: ERR.concept, why: '方向放反：mg → ppm 要除以分子量。' }, { v: m / c.m, type: ERR.concept, why: '漏乘莫耳體積 24.45。' }], 2, 'ppm') };
};

const TACID = [{ n: '硫酸', c: 98 }, { n: '鹽酸', c: 37 }, { n: '硝酸', c: 68 }, { n: '氫氧化鈉溶液', c: 45 }];
G.tDil = (o = {}) => {

  const known = [`C₁ = ${a.c}%`, `C₂ = ${C2}%`, `V₂ = ${V2} L`];

    known: known.concat(['求：V₁']), steps: [`V₁ = ${C2} × ${V2} ÷ ${a.c} = <b>${fmt(V1, 2)} L</b>`], check: 'V₁ 一定小於 V₂ ✔',
    answer: V1, opts: numOptions(V1, [{ v: a.c * V2 / C2, type: ERR.concept, why: '濃度比放反了；取的原液應比總量少。' }, { v: V2 * C2 / 100, type: ERR.read, why: `漏了原液濃度 ${a.c}%（原液不是 100%）。` }, { v: W, type: ERR.read, why: '這是加水量，題目問的是原液量。' }], 2, 'L') };
  return { unit: 'toxicK', level: 2, title: '毒化物｜稀釋配製（加水量）', keep: { mode }, formula, card: Object.assign({ [ERR.law]: '稀釋濃酸務必「酸加入水」，緩慢加入並攪拌，穿戴防護具；切勿將水倒入濃硫酸。' }, card),
    stem: `欲將 ${a.c}% ${a.n}稀釋配製成 ${C2}% 溶液 ${V2} L，需加水多少 L？（以 C₁V₁ = C₂V₂ 簡化計算）`,
    known: known.concat(['求：加水量 = V₂ − V₁']), steps: [`V₁ = ${C2} × ${V2} ÷ ${a.c} = ${fmt(V1, 2)} L`, `加水 = ${V2} − ${fmt(V1, 2)} = <b>${fmt(W, 2)} L</b>`], check: '原液量 + 加水量 = 總量 ✔',
    answer: W, opts: numOptions(W, [{ v: V1, type: ERR.read, why: '這是原液量，題目問加水量。' }, { v: V2, type: ERR.concept, why: '總量包含原液，加水量要扣掉原液體積。' }, { v: V2 + V1, type: ERR.concept, why: '加水量 = 總量 − 原液量。' }], 2, 'L') };
};

const TPEL = [{ n: '甲苯', p: 100 }, { n: '二甲苯', p: 100 }, { n: '丙酮', p: 750 }, { n: '正己烷', p: 50 }, { n: '乙酸乙酯', p: 400 }, { n: '甲醇', p: 200 }];
G.tMix = () => {
  const cs = shuffle(TPEL.slice()).slice(0, pick([2, 3])).map(x => ({ ...x, c: Math.max(1, Math.round(x.p * R(10, 60) / 100)) }));
  const v = cs.reduce((s, x) => s + x.c / x.p, 0);
  return {
    unit: 'toxicK', level: 2, title: '毒化物｜混合物相加效應',
    stem: `某作業場所同時測得 ${cs.map(x => `${x.n} ${x.c} ppm（容許濃度 ${x.p} ppm）`).join('、')}，假設具相加效應。Σ(C/容許濃度) 為多少？`,
    known: cs.map(x => `${x.n}：${x.c} ÷ ${x.p} = ${f(x.c / x.p, 3)}`).concat(['求：Σ（C/PEL）']),
    formula: { expr: '相加效應 = Σ（Cᵢ ÷ PELᵢ）', vars: 'Cᵢ：實測濃度；PELᵢ：各物質容許濃度', cond: 'Σ > 1 即判定超過容許濃度。', plain: '每種物質各自用掉多少「額度」，全部加起來不能超過 1。', mnemonic: '「各除各的，加總不超過 1」' },
    steps: cs.map(x => `${x.c}/${x.p} = ${f(x.c / x.p, 3)}`).concat([`Σ = <b>${fmt(v, 2)}</b>　→ ${v > 1 ? '大於 1，超過容許濃度' : '不超過 1，未超過容許濃度'}`]),
    check: '比值沒有單位；判斷基準是 1 ✔',
    answer: v, opts: numOptions(v, [
      { v: cs.reduce((s, x) => s + x.c, 0) / cs.reduce((s, x) => s + x.p, 0), type: ERR.concept, why: '不能把濃度和容許濃度各自加總再相除。' },
      { v: Math.max(...cs.map(x => x.c / x.p)), type: ERR.concept, why: '相加效應要把每一項都加起來，不是取最大值。' },
      { v: v * 100, type: ERR.unit, why: '比值不用換成百分比。' }
    ], 2, ''),
    card: { [ERR.concept]: '具相同標的器官或毒性作用的物質才視為相加效應；本題數值為練習用，實際容許濃度請查最新標準。' }
  };
};

G.tVent = () => {

  return {
    unit: 'toxicK', level: 3, title: '毒化物｜洩漏後通風稀釋時間',
    stem: `某倉庫容積 ${V} m³ 發生有機溶劑洩漏，止漏後空氣中濃度 ${C0} ppm。以 ${Q} m³/min 全面換氣（完全混合、無新增逸散），濃度降到 ${C1} ppm 需多少分鐘？`,
    known: [`V = ${V} m³`, `Q = ${Q} m³/min`, `C₀ = ${C0} ppm → C = ${C1} ppm`, '求：t（min）'],
    formula: { expr: 't = (V ÷ Q) × ln(C₀ ÷ C)', vars: 'ln：自然對數', cond: '完全混合、無持續逸散；V/Q 為換氣一次所需時間。', plain: '換氣會讓濃度呈指數下降，降到目標濃度的時間要用自然對數算。', mnemonic: '「V 除 Q，乘 ln（起始除目標）」' },
    steps: [`V/Q = ${V} ÷ ${Q} = ${f(V / Q, 3)} min`, `ln(${C0}/${C1}) = ln(${f(C0 / C1, 2)}) = ${f(Math.log(C0 / C1), 4)}`, `t = ${f(V / Q, 3)} × ${f(Math.log(C0 / C1), 4)} = <b>${fmt(v, 1)} min</b>`],

  };
};

const TBASE = [{ n: '氫氧化鈉（NaOH）', m: 40, k: 1, eq: 'HCl + NaOH → NaCl + H₂O（1：1）' }, { n: '碳酸鈉（Na₂CO₃）', m: 106, k: 0.5, eq: '2HCl + Na₂CO₃ → 2NaCl + H₂O + CO₂（2：1）' }, { n: '氫氧化鈣（Ca(OH)₂）', m: 74, k: 0.5, eq: '2HCl + Ca(OH)₂ → CaCl₂ + 2H₂O（2：1）' }];
const HCLD = { 10: 1.05, 20: 1.10, 30: 1.15, 35: 1.17 };
G.tNeu = () => {
  const L = R(20, 200, 10), c = pick([10, 20, 30, 35]), rho = HCLD[c], b = pick(TBASE);
  const g = L * rho * 1000 * c / 100, mol = g / 36.5, v = mol * b.k * b.m / 1000;
  return {
    unit: 'toxicK', level: 4, title: '毒化物｜酸液外洩中和用量',
    stem: `${c}% 鹽酸（密度 ${rho} kg/L）外洩 ${L} L，以${b.n}中和，理論上需多少 kg？（HCl = 36.5，${b.n.match(/（(.+)）/)[1]} = ${b.m}）`,
    known: [`HCl 重量 = ${L} × ${rho} × ${c / 100} = ${fmt(g / 1000, 2)} kg`, `HCl 莫耳數 = ${fmt(g, 0)} g ÷ 36.5 = ${fmt(mol, 1)} mol`, b.eq, '求：中和劑 kg'],
    formula: { expr: '中和劑 = (V × ρ × 濃度 ÷ 36.5) × 化學計量比 × 分子量', vars: '化學計量比：每 1 mol HCl 需要幾 mol 中和劑', cond: '體積 × 密度 = 溶液重；× 濃度 = 純 HCl 重。', plain: '先算外洩了幾莫耳的酸，再依反應式算需要幾莫耳的鹼。', mnemonic: '「體積乘密度乘濃度，換莫耳、看係數」' },
    steps: [`HCl = ${L} × ${rho} × 1,000 × ${c / 100} = ${fmt(g, 0)} g → ${fmt(mol, 1)} mol`, `中和劑 = ${fmt(mol, 1)} × ${b.k} = ${fmt(mol * b.k, 1)} mol`, `× ${b.m} ÷ 1,000 = <b>${fmt(v, 2)} kg</b>`],
    check: '實務上中和劑會多備一些，並注意中和放熱與 CO₂ 產生 ✔',
    answer: v, opts: numOptions(v, [
      { v: mol * (b.k === 1 ? 0.5 : 1) * b.m / 1000, type: ERR.concept, why: `化學計量比錯了：${b.eq}。` },
      { v: L * 1000 * c / 100 / 36.5 * b.k * b.m / 1000, type: ERR.read, why: '漏乘密度；體積要先換成重量。' },
      { v: L * rho * 1000 / 36.5 * b.k * b.m / 1000, type: ERR.unit, why: `漏乘濃度 ${c}%，把溶液當成純 HCl。` }
    ], 2, 'kg'),
    card: { [ERR.concept]: '中和計算三步：①純物質重量 ②換莫耳 ③依反應式係數換算。強鹼中和強酸放熱劇烈，現場常用碳酸鈉、石灰等弱鹼性吸收中和劑。' }
  };
};

G.tQty = () => {
  const D = pick([2, 2.5, 3, 4]), H = R(15, 50) / 10, rho = pick([1.0, 1.1, 1.2, 1.5, 1.84]), c = pick([30, 50, 70, 98]);

    steps: [`V = π × ${D}² ÷ 4 × ${H} = ${fmt(vol, 2)} m³`, `溶液 = ${fmt(vol, 2)} × ${rho} = ${fmt(sol, 2)} t`, `純物質 = ${fmt(sol, 2)} × ${c / 100} = <b>${fmt(v, 2)} t</b>`],
    check: '純物質量 ≤ 溶液重量 ✔',
    answer: v, opts: numOptions(v, [

  { g: 'tCls', q: '有致腫瘤、生育能力受損、畸胎、遺傳因子突變或其他慢性疾病等作用者，屬於第幾類？', a: '第二類（慢毒性）', d: [['第一類（難分解）', ERR.law, '第一類重點在不易分解與生物蓄積。'], ['第三類（急毒性）', ERR.law, '第三類是暴露後立即危害。'], ['關注化學物質', ERR.law, '關注化學物質不屬毒性化學物質分類。']], ex: '第二類：慢毒性物質。' },
  { g: 'tCls', q: '化學物質經暴露，將立即危害人體健康或生物生命者，屬於第幾類？', a: '第三類（急毒性）', d: [['第二類（慢毒性）', ERR.law, '慢毒性是長期作用。'], ['第一類（難分解）', ERR.law, '難分解重點在環境持久性。'], ['第四類', ERR.law, '第四類為有污染環境或危害人體健康之虞者。']], ex: '第三類：急毒性物質，例如暴露後短時間即可能致死或嚴重傷害者。' },
  { g: 'tCls', q: '「關注化學物質」的定義為？', a: '毒性化學物質以外，經中央主管機關認定有污染環境或危害人體健康之虞的化學物質', d: [['所有列管的毒性化學物質', ERR.concept, '關注化學物質是毒性化學物質「以外」者。'], ['所有食品添加物', ERR.concept, '食品添加物另有法規管理。'], ['只限爆裂物', ERR.concept, '爆裂物先驅物等可能被列為關注化學物質，但不限於此。']], ex: '108 年修法新增「關注化學物質」，基於物質特性或民生消費議題（如可能被濫用）納管。' },

  { g: 'tOp', q: '第四類毒性化學物質之運作，應取得何種文件？', a: '核可文件', d: [['許可證', ERR.law, '許可證適用第一類至第三類的製造、輸入、販賣等。'], ['不需任何文件', ERR.law, '第四類仍須取得核可文件。'], ['營業登記即可', ERR.law, '營業登記不能取代毒化物運作文件。']], ex: '第一至三類：依運作行為與數量申請許可證或登記文件；第四類：核可文件。' },
  { g: 'tOp', q: '毒性化學物質運作人應於何時完成申報前一個月之運作紀錄？', a: '每月 10 日前', d: [['每年 1 月底前', ERR.law, '毒性化學物質是按月申報。'], ['每季結束後 30 日內', ERR.law, '每季申報是部分關注化學物質的頻率。'], ['運作量有變動才申報', ERR.law, '運作量無異動者仍應申報。']], ex: '毒性化學物質：每月 10 日前申報前一個月運作紀錄；運作量無異動仍應申報。關注化學物質依公告為每月、每季或半年申報。' },
  { g: 'tOp', q: '毒性化學物質運作紀錄依規定應逐日記錄，其紀錄應保存多久備查？', a: '3 年', d: [['1 年', ERR.law, '保存期間是 3 年。'], ['5 年', ERR.law, '保存期間是 3 年。'], ['不需保存', ERR.law, '應保存備查。']], ex: '運作紀錄、釋放量紀錄以書面或電子檔案保存 3 年備查。' },
  { g: 'tEmg', q: '毒性化學物質發生事故，運作人應於多久內報知當地主管機關？', a: '至遲 30 分鐘內', d: [['24 小時內', ERR.law, '事故應立即採取緊急防治措施，並於 30 分鐘內報知。'], ['3 日內', ERR.law, '3 日內是提報「速報」的期限。'], ['14 日內', ERR.law, '14 日內是提報「結報」的期限。']], ex: '事故：立即採取緊急防治措施，至遲 30 分鐘內報知；3 日內提速報、14 日內提結報。' },
  { g: 'tEmg', q: '毒性化學物質事故發生後，運作人應於多久內提報「總結事故調查處理結報」？', a: '14 日內', d: [['3 日內', ERR.law, '3 日內是初步速報。'], ['30 分鐘內', ERR.law, '30 分鐘內是事故報知。'], ['3 個月內', ERR.law, '期限是 14 日內。']], ex: '事故調查處理報告作業準則：3 日內速報、14 日內結報，報請事故所在地直轄市、縣（市）主管機關備查。' },
  { g: 'tEmg', q: '毒化物運作場所偵測及警報設備，偵測濃度達警報設定值時，應能於多久內自動發出警報？', a: '1 分鐘內', d: [['10 分鐘內', ERR.law, '規定是 1 分鐘內。'], ['30 分鐘內', ERR.law, '30 分鐘是事故報知期限。'], ['人工巡檢發現後', ERR.concept, '應自動發出燈示及聲響。']], ex: '偵測警報設備：備用電源、1 分鐘內自動發出警報燈示與聲響、多偵測端可辨別地點。' },

  { g: 'tEmg', q: '危害預防及應變計畫經主管機關備查後，應於多久內完整公開？', a: '15 日內', d: [['3 日內', ERR.law, '公開期限為 15 日內。'], ['30 日內', ERR.law, '公開期限為 15 日內。'], ['不需公開', ERR.law, '應依規定完整公開。']], ex: '危害預防及應變計畫備查後 15 日內完整公開，讓周界居民與應變單位知悉。' },
  { g: 'tGhs', q: 'GHS 化學品標示的「警示語」分為？', a: '「危險」與「警告」', d: [['「注意」與「小心」', ERR.law, 'GHS 警示語只有危險、警告兩種。'], ['「高」「中」「低」', ERR.concept, '不是警示語。'], ['「劇毒」與「有毒」', ERR.concept, '不是 GHS 警示語。']], ex: '「危險」用於較嚴重的危害級別，「警告」用於較輕微者。' },
  { g: 'tGhs', q: '安全資料表（SDS）共包含幾大項？', a: '16 項', d: [['8 項', ERR.law, 'GHS 格式 SDS 為 16 項。'], ['12 項', ERR.law, '為 16 項。'], ['20 項', ERR.law, '為 16 項。']], ex: 'SDS 16 項：化學品與廠商資料、危害辨識、成分、急救、滅火、洩漏處理、安全處置與儲存、暴露預防、物化性質、安定性及反應性、毒性、生態、廢棄處置、運送、法規、其他資料。' },
  { g: 'tGhs', q: 'GHS 危害圖式的外觀為？', a: '紅色框線的菱形，內為黑色符號、白色背景', d: [['黃色三角形', ERR.concept, '那是一般警告標誌樣式。'], ['藍色圓形', ERR.concept, '藍色圓形常見於指示（強制）標誌。'], ['綠色方形', ERR.concept, '綠色方形常見於安全逃生標誌。']], ex: 'GHS 共 9 種危害圖式，如骷髏頭（急毒性）、腐蝕、火焰、健康危害等。' },
  { g: 'tGhs', q: '下列何種 GHS 圖式代表「急毒性物質」（較高級別）？', a: '骷髏頭與交叉骨', d: [['火焰', ERR.concept, '火焰代表易燃。'], ['腐蝕（液體滴在手與金屬上）', ERR.concept, '代表腐蝕性。'], ['驚嘆號', ERR.concept, '驚嘆號代表較低級別的急毒性、刺激性等。']], ex: '骷髏頭：急毒性第 1～3 級；驚嘆號：急毒性第 4 級、刺激、敏感等。' }

  { g: 'aLaw', q: '已裝設連續自動監測設施（CEMS）並連線的固定源，是否還須就該項目定期檢驗申報？', a: '不需要，監測資料已即時連線申報', d: [['需要，每月一次', L_, 'CEMS 已即時連線，免定期檢驗。'], ['需要，與 CEMS 數據併用', L_, '監測項目已連線者免。'], ['需每日人工檢測', L_, '不需要。']], ex: '有 CEMS 即時連線者，該項目免定期檢驗申報；其餘污染源的定檢結果向地方主管機關申報。' },

  { g: 'aLaw', q: '主管機關命限期改善，改善期限原則上以幾日為限？', a: '90 日', d: [['30 日', L_, '原則上 90 日。'], ['180 日', L_, '原則上 90 日。'], ['1 年', L_, '1 年是經核准延長的上限。']], ex: '改善期限 90 日；逾期須於接獲通知 30 日內提具體計畫申請延長，最長 1 年，必要時再延 1 年。' },
  { g: 'aLaw', q: '工商廠場違反排放標準，依空污法的罰鍰範圍為？', a: '新臺幣 10 萬元以上 2,000 萬元以下', d: [['新臺幣 2 萬元以上 100 萬元以下', L_, '這是非工商廠場的範圍。'], ['新臺幣 1,200 元以上 10 萬元以下', L_, '這是違反禁止行為（非工商廠場）的範圍。'], ['新臺幣 20 萬元以上 100 萬元以下', L_, '這是規避檢查的罰鍰範圍。']], ex: '違反排放標準：一般 2 萬～100 萬；工商廠場 10 萬～2,000 萬元。' },

  { g: 'aLaw', q: '受害人或公益團體書面告知主管機關怠於執行職務後，主管機關多少日內仍未執行，得提起公民訴訟？', a: '60 日', d: [['30 日', L_, '是 60 日。'], ['90 日', L_, '是 60 日。'], ['15 日', L_, '是 60 日。']], ex: '公民訴訟：書面告知後 60 日內主管機關仍未依法執行，得向行政法院起訴。' },

  { g: 'aPermit', q: '改用低污染原燃料、拆除污染設施或增設防制設施，應於何時向審核機關申請異動？', a: '事實發生後 30 日內', d: [['事實發生前 90 日', L_, '這類有利排放的異動是事後 30 日內。'], ['下次展延時一併辦理', L_, '應於 30 日內辦理。'], ['不需辦理', L_, '須申請異動。']], ex: '有利排放之異動（改低污染原燃料、拆除停用設施、增設或提升防制設施）：事實發生後 30 日內申請。' },

  { g: 'aPermit', q: '空污許可電子化申請應使用哪一個系統？', a: '環境保護許可管理資訊系統（EMS）', d: [['CEMS 連線系統', C_, 'CEMS 是監測連線。'], ['事業廢棄物申報系統', C_, '那是廢棄物申報。'], ['財政部電子發票平台', D_, '無關。']], ex: '許可申請與佐證文件上傳：EMS；網路申請以完成上傳日期為收件日。' },
  { g: 'aPermit', q: '採用 BACT 的驗證，應於申請最大產量或原燃料使用量的多少以上條件進行試車或檢測？', a: '80%', d: [['50%', L_, '應達 80% 以上。'], ['100%', L_, '規定為 80% 以上。'], ['30%', L_, '應達 80% 以上。']], ex: 'BACT 驗證：於最大產量、原燃料用量 80% 以上條件試車或檢測，並符合公告排放濃度、削減率等。' },
  { g: 'aPermit', q: '空氣品質模式的三大類，下列何者正確？', a: '高斯類擴散模式、軌跡類模式、網格類模式', d: [['線性迴歸、類神經網路、決策樹', C_, '不是空品模式分類。'], ['點源、線源、面源', C_, '那是排放源分類。'], ['一級、二級、三級', C_, '那是防制區分級。']], ex: '空品模式三類：高斯擴散、軌跡、網格；排放量大者須以網格類模式模擬臭氧、PM2.5 等增量。' },

  { g: 'aPermit', q: '執行定期檢測前，應於何時以何種方式通知主管機關？', a: '執行前 7 日，以電子網路傳輸通知', d: [['執行前 1 日電話通知', L_, '應前 7 日網路通知。'], ['執行後 30 日內補報', L_, '應事前通知。'], ['執行前 30 日書面通知', L_, '是前 7 日網路通知。']], ex: '定檢前 7 日網路通知；完成檢測翌日起 30 日內申報（戴奧辛、重金屬可延長 30 日）。' },
  { g: 'aPermit', q: '5 根相同條件的排放管道可擇一代表檢測，依 X = ln N 計算，每次應檢測幾根？', a: '2 根', d: [['1 根', ERR.math, 'ln 5 ≈ 1.61，四捨五入為 2。'], ['5 根', D_, '可依公式減少檢測根數。'], ['3 根', ERR.math, 'ln 5 ≈ 1.61 → 2。']], ex: 'X = ln N（四捨五入）：N = 5 → ln5 = 1.61 → 2 根。' },
  { g: 'aPermit', q: '燃氣鍋爐 NOx 連續兩次定檢值皆低於排放標準 50%，且兩次差異小於 20%，可以？', a: '申請調整（降低）檢測頻率級數', d: [['免除所有定檢', L_, '只能調整頻率，不是免除。'], ['必須提高檢測頻率', C_, '表現良好可申請降低頻率。'], ['不能做任何調整', L_, '符合條件可申請調整。']], ex: '「好學生條款」：連續檢測值皆低於標準 50% 且差異 < 20%，得申請調整頻率級數。' },

  { g: 'aPermit', q: '已設立的第一至八批應申請許可固定源，自各批公告日起多久內應申請並取得操作許可證？', a: '2 年', d: [['6 個月', L_, '是 2 年。'], ['5 年', L_, '是 2 年。'], ['30 日', L_, '是 2 年。']], ex: '公告批次前已設立者，應依各批次公告日起 2 年內申請並取得操作許可。' },
  // 排放量與空污費申報
  { g: 'aFee', q: '空污費每季申報繳費的期限為？', a: '每年 4、7、10 月及次年 1 月底前', d: [['每月 10 日前', L_, '空污費按季申報。'], ['每年 5 月底前一次繳清', L_, '5 月底是碳費。'], ['每季結束後 15 日內', L_, '是季後月底前。']], ex: '空污費：每季申報，4、7、10 月及次年 1 月底前繳納後以網路傳輸申報。' },
  { g: 'aFee', q: '空污費逾期未繳，每逾 1 日加徵多少滯納金？', a: '0.5%', d: [['1%', L_, '是每日 0.5%。'], ['5%', L_, '是每日 0.5%。'], ['0.1%', L_, '是每日 0.5%。']], ex: '每逾 1 日加徵 0.5% 滯納金；逾 30 日仍未繳，工商廠場處 10 萬～100 萬元罰鍰並限期繳納，另加計利息。' },
  { g: 'aFee', q: '固定源當年度各季 SOx、NOx、VOCs、粒狀物核定排放量皆在多少以下，經同意可改為年申報？', a: '1 公噸', d: [['10 公斤', L_, '10 公斤以下是「免申報該項」的門檻。'], ['5 公噸', L_, '是 1 公噸。'], ['10 公噸', L_, '是 1 公噸。']], ex: '各季核定排放量皆 ≤ 1 公噸，經同意次年 1 月底前申報全年；當季單項 ≤ 10 公斤可免申報該項。' },
  { g: 'aFee', q: '固定源當季某項污染物總排放量在多少以下，得免申報該項？', a: '10 公斤', d: [['1 公噸', L_, '1 公噸是可改年申報的門檻。'], ['100 公斤', L_, '是 10 公斤。'], ['1 公斤', L_, '是 10 公斤。']], ex: '免申報：當季單項（SOx、NOx、VOCs 或粒狀物）≤ 10 公斤。' },
  { g: 'aFee', q: '空污費費額的計算方式為？', a: '個別污染物排放量 × 收費費率', d: [['產品產量 × 費率', C_, '依排放量，不是產量。'], ['員工人數 × 費率', D_, '無關。'], ['排放濃度 × 費率', C_, '要用排放量（kg），不是濃度。']], ex: '費額 = 排放量 × 費率；重金屬、戴奧辛同樣以季排放量 × 費率計算。' },
  { g: 'aFee', q: '排放量計量方式的優先順序，第一優先為？', a: '連續自動監測設施（CEMS）數據', d: [['公告排放係數', L_, '排放係數順位較後。'], ['質量平衡', L_, '順位在 CEMS 與自廠係數之後。'], ['業者自行估計', L_, '不是第一優先。']], ex: '計量順序：CEMS → VOCs 自廠係數 → 檢測結果、質量平衡或排放係數 → 其他。' },
  { g: 'aFee', q: '以排放係數估算 VOCs，與主管機關查核結果差異達多少時，次季起須改用質量平衡申報？', a: '差異 2 倍以上且達 7.5 公噸以上', d: [['差異 10% 以上', L_, '門檻是 2 倍以上且 7.5 公噸以上。'], ['差異 1 公噸以上', L_, '門檻是 2 倍以上且 7.5 公噸以上。'], ['任何差異都要改', L_, '有明確門檻。']], ex: 'VOCs 係數申報與查核差異 ≥ 2 倍且 ≥ 7.5 公噸 → 次季起改質量平衡。' },
  { g: 'aFee', q: '以偽造或不正當方式短報漏報空污費（營建工程以外的固定源），如何計費？', a: '以核算排放量的 2 倍計算，並可追溯 5 年', d: [['以原排放量計算，不加重', L_, '要以 2 倍計算。'], ['以 10 倍計算', L_, '是 2 倍。'], ['只追溯 1 年', L_, '可追溯 5 年。']], ex: '短漏報：固定源排放量 2 倍、移動源與營建工程費率 2 倍；並追溯 5 年。' },
  { g: 'aFee', q: '空污防制設備「購置成本」減免空污費的上限為？', a: '購置成本 30%，且不超過前一年度該污染物實繳費額 2 倍', d: [['購置成本 100%', L_, '上限 30%。'], ['購置成本 50%，無其他限制', L_, '上限 30% 且有費額限制。'], ['不得減免', L_, '可申請減免。']], ex: '購置減免：最高 30%，且 ≤ 前一年實繳費額 2 倍；分三階段核發 40%、40%、20%。' },
  { g: 'aFee', q: '防制設備購置成本減免額度的核發方式為？', a: '設置前 40%、驗收後 40%、正式操作 1 年後 20%', d: [['一次全部核發', L_, '分三階段（前一年度免繳者除外）。'], ['每年平均核發 20%，共 5 年', L_, '是 40%、40%、20%。'], ['驗收後 100%', L_, '是三階段。']], ex: '三階段：40%（設置前）、40%（驗收後）、20%（操作 1 年後）。' },
  { g: 'aFee', q: '耗材費用減免（VOCs），每季減免總額不得超過當季應繳 VOCs 費額的多少？', a: '50%', d: [['30%', L_, '30% 是購置成本減免上限。'], ['100%', L_, '上限 50%。'], ['10%', L_, '上限 50%。']], ex: '耗材減免：每年 1 月底前申請，每季 ≤ 當季 VOCs 費額 50%。' },
  { g: 'aFee', q: '燃燒過程排放濃度若無特別規定，含氧率校正以多少為基準？', a: '6%', d: [['11%', L_, '11% 常見於特定行業（如焚化爐）規定。'], ['21%', C_, '21% 是空氣中的氧濃度。'], ['0%', C_, '不以 0% 為基準。']], ex: '無特別規定：燃燒以 6% O₂ 校正；非燃燒以未稀釋乾燥排氣為基準；行業標準另有規定從其規定。' },
  { g: 'aFee', q: 'CEMS 數據無效或遺失時段的排放量，可如何替代計算？', a: '以當日有效小時數據前六大的平均值替代', d: [['以 0 計算', L_, '不能以 0 計。'], ['以當日最低值替代', L_, '要用前六大平均（保守估計）。'], ['不需計算', L_, '仍須計算排放量。']], ex: '無效或遺失時段：以當日有效 1 小時數據排序前六大的平均濃度與排氣量替代計算。' },
  { g: 'aFee', q: '應申報排放量的個別 VOCs 物種，下列何者「不屬之」？', a: '甲烷', d: [['苯', C_, '屬申報物種。'], ['甲苯', C_, '屬申報物種。'], ['氯乙烯', C_, '屬申報物種。']], ex: '個別物種含苯、甲苯、二甲苯、乙苯、苯乙烯、多種氯化烴、氯乙烯、1,3-丁二烯、丙烯腈等；甲烷不屬 VOCs。' },
  // 空污概論
  { g: 'aIntro', q: '懸浮微粒在呼吸道沉積的機轉，下列何者「不屬之」？', a: '化學中和', d: [['慣性衝擊', C_, '屬沉積機轉。'], ['重力沉降', C_, '屬沉積機轉。'], ['擴散', C_, '屬沉積機轉（細微粒）。']], ex: '沉積機轉：衝擊、重力沉積、擴散、攔截、靜電吸引。' },
  { g: 'aIntro', q: '依排放型態區分，道路上的汽機車排放屬於？', a: '線源', d: [['點源', C_, '點源是固定管道、煙囪。'], ['面源', C_, '面源是逸散性及非公路移動源。'], ['體源', C_, '體源是三維排放的面源。']], ex: '點源（煙囪）、線源（道路）、面源（逸散、非公路移動源）、體源（三維）。' },
  { g: 'aIntro', q: '大氣中污染物的傳輸作用，下列何者會「生成二次污染物」？', a: '轉化', d: [['平流', C_, '平流是隨風移動。'], ['擴散', C_, '擴散是因濃度梯度散開。'], ['移除', C_, '移除是沉降或被雨洗掉。']], ex: '四作用：平流、擴散、轉化（化學或光化學反應形成二次污染物）、移除。' },
  { g: 'aIntro', q: '夜間地面輻射冷卻造成的逆溫，日出後通常消失，稱為？', a: '輻射逆溫', d: [['沉降逆溫', C_, '沉降逆溫由高壓下沉壓縮造成，可持續數日。'], ['鋒面逆溫', C_, '由冷暖鋒交會造成。'], ['地形逆溫', C_, '由地形與海陸風造成。']], ex: '逆溫使污染物不易擴散；沉降逆溫可持續數日、易造成嚴重污染。' },
  { g: 'aIntro', q: '下列何者屬於固定污染源管制中的「經濟誘因」策略？', a: '空污費與排放交易制度', d: [['排放標準', C_, '排放標準是命令管制。'], ['許可制度', C_, '許可是行政管制。'], ['稽查告發', C_, '是行政執法。']], ex: '經濟誘因：空污費、補貼獎勵、排放交易、總量管制；依污染者付費原則促使業者主動減量。' },
  { g: 'aIntro', q: '下列何者「不屬於」施行細則列舉的有害空氣污染物？', a: '二氧化碳', d: [['戴奧辛及呋喃類', C_, '屬有害空氣污染物。'], ['石綿及含石綿之物質', C_, '屬有害空氣污染物。'], ['氯乙烯單體', C_, '屬有害空氣污染物。']], ex: '有害空污（14 項）含氟化物、氯氣、氨、硫化氫、甲醛、含重金屬氣體、酸氣、氯乙烯、PCBs、氰化氫、戴奧辛、PAHs、致癌 VOCs、石綿。' },
  { g: 'aIntro', q: '室內辦公室事務機（影印機、雷射印表機）主要可能釋放何種污染物？', a: '臭氧', d: [['石綿', C_, '石綿多來自舊建材。'], ['一氧化碳', C_, 'CO 主要來自燃燒源。'], ['氡氣', C_, '氡來自土壤岩石。']], ex: '室內污染源：燃燒（CO、NOx）、建材（甲醛、石綿）、塗料（VOCs）、事務機（臭氧）、生物性（黴菌、塵蟎）、人體（CO₂）。' },
  { g: 'aIntro', q: '袋式集塵器日常巡檢項目，下列何者「最不相關」？', a: '冷卻水塔的導電度', d: [['系統壓差', C_, '壓差反映濾餅與濾袋狀態，是重點。'], ['入口溫度', C_, '溫度過高會燒袋、過低會結露。'], ['濾袋逆洗壓力', C_, '關係清灰效果。']], ex: '袋濾巡檢：壓差、入出口溫度、不透光率、逆洗壓力、集灰斗溫度。' },
  { g: 'aIntro', q: 'SNCR 日常巡檢記錄參數，下列何者「不屬之」？', a: '觸媒床壓差', d: [['還原劑貯槽液位', C_, '屬 SNCR 巡檢項目。'], ['噴入點溫度（爐溫）', C_, 'SNCR 對溫度窗很敏感，是重點。'], ['煙囪氨氣濃度（氨逃逸）', C_, '屬巡檢項目。']], ex: 'SNCR 不使用觸媒；巡檢：還原劑存量與用量、稀釋水、霧化壓力、噴入點溫度、煙囪 NH₃ 與 NOx。' },
  // 粒狀物防制
  { g: 'aPM', q: '「氣動直徑」的定義為？', a: '與該微粒終端沉降速度相同、密度 1 g/cm³ 的圓球直徑', d: [['以顯微鏡量得的最長邊長', C_, '那是幾何尺寸。'], ['與微粒體積相同的圓球直徑', C_, '那是等體積直徑。'], ['微粒的質量除以體積', C_, '那是密度。']], ex: '氣動直徑以沉降行為定義，PM10、PM2.5 都以氣動直徑表示。' },
  { g: 'aPM', q: '選擇空污控制設備最常依據的三大類因素為？', a: '工程因素、經濟因素、空間因素', d: [['顏色、品牌、外觀', D_, '不是技術考量。'], ['政治、法律、社會', C_, '不是設備選擇的主要分類。'], ['溫度、壓力、濕度', C_, '這些屬工程因素的一部分。']], ex: '工程（風量、溫度、壓損、穩定性）、經濟（設置與操作成本）、空間（場地）。' },
  { g: 'aPM', q: '為何常在除塵設備前加裝溫度調理（冷卻）設備？', a: '使廢氣溫度落在設備適用範圍，避免燒袋或冷凝腐蝕', d: [['提高廢氣溫度以增加風量', C_, '目的是讓溫度合宜。'], ['為了降低噪音', D_, '與噪音無關。'], ['法規規定一律降到常溫', L_, '沒有一律降到常溫的規定。']], ex: '溫度過高→濾袋燒損、靜電效率下降；過低→冷凝腐蝕、堵塞。' },
  { g: 'aPM', q: '工業排氣源較常採用「局部排氣」而非整體換氣的原因為？', a: '在源頭捕集，效率高且可避免污染擴散', d: [['局部排氣不需風機', C_, '局部排氣也需要風機。'], ['整體換氣效率較高', C_, '整體換氣是稀釋，效率較低。'], ['局部排氣可完全免除防制設備', C_, '捕集後仍需處理。']], ex: '局部排氣以集氣罩在源頭捕集；整體換氣是稀釋整個空間。' },
  { g: 'aPM', q: '來自門窗、空調、作業動作而降低集氣罩捕集效率的氣流稱為？', a: '干擾氣流', d: [['捕捉風速', C_, '捕捉風速是罩口有效捕集所需風速。'], ['層流', C_, '層流是流動型態。'], ['逆溫層', C_, '與集氣罩無關。']], ex: '干擾氣流會改變罩口前氣流方向，使污染物逸散，設計時應避免。' },
  { g: 'aPM', q: '旋風集塵器入口氣流速度「過高」可能造成？', a: '粉塵再飛揚與磨蝕加劇', d: [['離心力不足', C_, '那是速度過低的問題。'], ['濾袋燒毀', C_, '旋風集塵器沒有濾袋。'], ['電暈放電減弱', C_, '那是靜電集塵器。']], ex: '旋風進氣速度：過低離心力不足、過高再飛揚與磨損。' },
  { g: 'aPM', q: '多筒式旋風集塵器相較單一大型旋風器的優點為？', a: '提升對細粒子的去除效率', d: [['完全沒有壓力損失', C_, '仍有壓損。'], ['可去除氣狀污染物', C_, '旋風只能去除粒狀物。'], ['不需集塵斗', C_, '仍需集塵斗。']], ex: '小直徑旋風器離心力較大，多筒並聯可提高細粒去除效率。' },
  { g: 'aPM', q: '旋風集塵器處理含濕粉塵易堵塞，常用對策為？', a: '加熱或保溫，使氣體溫度高於露點', d: [['噴水增濕', C_, '增濕會使堵塞更嚴重。'], ['提高粉塵濃度', C_, '無助防堵。'], ['降低溫度至露點以下', C_, '會冷凝附著。']], ex: '含濕粉塵：保溫或加熱（電熱、蒸汽）避免冷凝結餅。' },
  { g: 'aPM', q: '濕式洗滌器依壓降分類，「高能量」洗滌器的壓降約為？', a: '大於 6 cmH₂O 以上（文氏洗滌器常超過 100 cmH₂O）', d: [['小於 2 cmH₂O', C_, '那是低能量。'], ['2～6 cmH₂O', C_, '那是中能量。'], ['0 cmH₂O', C_, '洗滌器一定有壓降。']], ex: '低能量 < 2、中能量 2～6、高能量 > 6 cmH₂O；效率通常隨壓降增加而提升。' },
  { g: 'aPM', q: '文氏洗滌器喉部氣體速度約為？', a: '約 61～244 m/s', d: [['約 1～2 m/s', C_, '那太慢，無法霧化液體。'], ['約 0.01 m/s', C_, '太慢。'], ['約 1,000 m/s 以上', C_, '超過實際操作範圍。']], ex: '文氏喉部高速使液體霧化成細液滴，可去除至約 0.2 μm 微粒。' },
  { g: 'aPM', q: '濕式洗滌器對工廠的額外負擔，下列何者「不屬之」？', a: '濾袋需定期更換', d: [['易腐蝕，需耐蝕材質', C_, '屬負擔。'], ['產生廢水需處理', C_, '屬負擔。'], ['冬季白煙明顯', C_, '屬負擔。']], ex: '濕式洗滌：腐蝕、白煙、廢水、污泥處理；濾袋是袋式集塵器的耗材。' },
  { g: 'aPM', q: '袋式集塵器中，濾餅的角色為？', a: '提高過濾效率，但也使壓差增加', d: [['降低過濾效率', C_, '濾餅會提高效率。'], ['完全不影響壓差', C_, '濾餅變厚壓差上升。'], ['濾餅應完全避免形成', C_, '適度濾餅有助過濾，只是要適時清除。']], ex: '初期效率低，濾餅形成後接近 100%；過厚則壓損大，需清灰。' },
  { g: 'aPM', q: '脈衝噴氣式袋式集塵器通常搭配何種濾材與過濾方式？', a: '毛氈型濾材、外部過濾（需支撐籠）', d: [['織布型濾材、內部過濾', C_, '織布型多配振盪式、反洗空氣式。'], ['金屬網、無需清灰', C_, '不是。'], ['紙質濾材、一次性使用', C_, '不是。']], ex: '脈衝噴氣：不停機清灰、清洗力強，適用毛氈濾材與高過濾速度。' },
  { g: 'aPM', q: '下列濾材中，耐溫性最高（約 240～260°C）的是？', a: 'Teflon®（PTFE）、Fiberglass®', d: [['聚酯（PE/PET）', C_, '約 150°C。'], ['Ryton®', C_, '約 180°C。'], ['Nomex®', C_, '約 204°C。']], ex: '耐溫：聚酯 ~150°C、Ryton ~180°C（耐酸鹼佳）、Nomex ~204°C、P-84/Teflon/玻纖 ~240～260°C。' },
  { g: 'aPM', q: '袋式集塵器出口粉塵濃度突然升高，最可能原因為？', a: '濾袋破損或密封失效', d: [['濾餅太厚', C_, '濾餅厚會壓差高，但出口通常更乾淨。'], ['入口溫度略低', C_, '不是出口突然變髒的主因。'], ['清灰頻率太低', C_, '清灰不足主要造成壓差上升。']], ex: '出口高濃度：濾袋破損、安裝不良、密封失效、清灰過度致濾餅未形成；應停機檢查、氣密測試。' },
  { g: 'aPM', q: '靜電集塵器中，使粒子帶電的關鍵現象為？', a: '放電極周圍的電暈放電', d: [['重力沉降', C_, '與帶電無關。'], ['慣性衝擊', C_, '與帶電無關。'], ['水膜吸收', C_, '那是濕式洗滌。']], ex: '高壓使放電極周圍氣體電離（電暈、雪崩效應）產生陰離子，附著於粉塵使其帶電，再移向接地集塵板。' },
  { g: 'aPM', q: '靜電集塵器常見腐蝕的主要原因為？', a: '操作溫度低於酸露點，酸氣凝結', d: [['操作溫度太高', C_, '高溫不是腐蝕主因。'], ['電壓太低', C_, '電壓影響效率，非腐蝕主因。'], ['粉塵粒徑太大', C_, '與腐蝕無直接關係。']], ex: '改善：保溫加熱避免露點以下、耐蝕材料或塗層、控制廢氣溼度。' },
  { g: 'aPM', q: '靜電集塵器的優點，下列何者正確？', a: '壓損小、處理氣量大、可捕捉微細粒子', d: [['對低導電性粉塵效率特別高', C_, '低導電性（高比電阻）粉塵效率反而低。'], ['設置成本最低', C_, '初設與維護成本高。'], ['不受溼度與成分影響', C_, '易受溼度與成分影響。']], ex: '靜電集塵器：壓損低、可連續操作、細粒效率高；缺點是成本高、受粉塵性質影響大。' },
  // 粒狀物逸散控制
  { g: 'aFug', q: '堆置作業以防塵網或阻隔牆圍封，總高度應達堆置高度的幾倍以上？', a: '1.25 倍', d: [['1.0 倍', L_, '應達 1.25 倍以上。'], ['2 倍', L_, '是 1.25 倍。'], ['0.8 倍', L_, '是 1.25 倍。']], ex: '堆置防制：封閉建築、四周圍封（高度 ≥ 堆置高度 1.25 倍）、覆蓋或穩定劑（面積 ≥ 80%）、自動灑水等。' },
  { g: 'aFug', q: '堆置物覆蓋防塵布或噴灑化學穩定劑，一般區域覆蓋面積應達多少以上？', a: '80%（PM 三級防制區為 90%）', d: [['50%', L_, '應達 80% 以上。'], ['100%', L_, '一般為 80%，三級區 90%。'], ['30%', L_, '應達 80% 以上。']], ex: '覆蓋或穩定劑：≥ 80%；位於細懸浮微粒或懸浮微粒三級防制區者 ≥ 90%。' },
  { g: 'aFug', q: '堆置區設置自動灑水，建議物料含水率維持在多少以上？', a: '12%', d: [['1%', L_, '建議高於 12%。'], ['50%', L_, '建議高於 12%。'], ['不需考慮含水率', C_, '要保持濕潤。']], ex: '自動灑水適用不需乾燥且搬運頻繁的物料；雨天可不灑。' },
  { g: 'aFug', q: '運輸車輛防塵布邊緣應延伸至貨廂上緣以下至少多少？', a: '15 公分', d: [['5 公分', L_, '至少 15 公分。'], ['50 公分', L_, '至少 15 公分。'], ['不用延伸', L_, '須延伸並捆紮牢靠。']], ex: '運輸：密閉貨廂或防塵布延伸 15 公分以上；門口及延伸 10 公尺路面不得有帶出物。' },
  { g: 'aFug', q: '自動洗車設備的洗車台寬度應大於運輸車寬度的幾倍？', a: '1.2 倍', d: [['1.0 倍', L_, '應大於 1.2 倍。'], ['2 倍', L_, '是 1.2 倍。'], ['0.8 倍', L_, '是 1.2 倍。']], ex: '洗車台：跳動路面、寬 > 車寬 1.2 倍、長 > 車長；噴口間隔 ≤ 50 公分、加壓馬達 ≥ 15 馬力。' },
  { g: 'aFug', q: '自動洗車設備的噴口間隔與加壓馬達規格為？', a: '噴口間隔 50 公分以下，馬達 15 馬力以上', d: [['噴口間隔 1 公尺，馬達 5 馬力', L_, '間隔 ≤ 50 公分、≥ 15 馬力。'], ['只需一個噴口', L_, '兩側都要設噴水。'], ['噴口間隔 2 公尺，馬達 1 馬力', L_, '不符規定。']], ex: '噴水總長 > 洗車台長度；高低角度交錯，涵蓋車體；車輛通行期間持續噴水。' },
  { g: 'aFug', q: '粒狀物防制所稱「封閉式建築物」的條件為？', a: '有外牆及屋頂，除依法設置之通風口外，其餘開口隨時保持關閉', d: [['三面圍牆即可', L_, '需外牆與屋頂完整包覆。'], ['有屋頂即可', L_, '也需外牆。'], ['以防塵網搭建即可', L_, '防塵網不是封閉式建築。']], ex: '封閉式建築：外牆、屋頂包覆，非通風口開口保持關閉。' },
  { g: 'aFug', q: '洗街車噴水泵浦的壓力與流量規範為？', a: '壓力 ≥ 5 kg/cm²、流量 ≥ 300 L/min', d: [['壓力 ≥ 1 kg/cm²、流量 ≥ 50 L/min', L_, '規範為 5 kg/cm²、300 L/min。'], ['不需泵浦', L_, '需副引擎泵浦。'], ['壓力 ≥ 50 kg/cm²', L_, '規範為 5 kg/cm²。']], ex: '洗街車：副引擎泵浦（非 P.T.O.）、至少 4 個平扇噴嘴，並設水表與行車紀錄器或衛星定位。' },
  { g: 'aFug', q: '攝錄影監視系統（出入口與堆置區）的規範，下列何者正確？', a: '至少 2 支鏡頭，日間彩色、夜間具紅外線，並顯示日期時間', d: [['1 支黑白鏡頭即可', L_, '至少 2 支，日間彩色。'], ['只需夜間錄影', L_, '須全天且日夜可辨。'], ['不需顯示時間', L_, '須顯示錄製日期與時間。']], ex: '監視畫面須可辨識洗車設施、門口與延伸 10 公尺路面乾淨程度、貨廂覆蓋情形。' },
  { g: 'aFug', q: '裸露地的防制措施，下列何者「不屬之」？', a: '在裸露地上堆放更多物料', d: [['植生綠化', C_, '屬防制措施。'], ['鋪設混凝土或瀝青', C_, '屬防制措施。'], ['覆蓋防塵布', C_, '屬防制措施。']], ex: '裸露地：植生、覆蓋稻草蓆或碎木、鋪面、防塵布、粗級配加灑水、化學穩定劑、灑水。' },
  // 氣狀物防制
  { g: 'aGas', q: '揮發性有機物（VOCs）的定義為？', a: '1 大氣壓下沸點在 250°C 以下的有機化合物（排除甲烷、CO、CO₂ 等）', d: [['沸點在 25°C 以下的所有化合物', C_, '定義是 250°C 以下的有機化合物。'], ['所有含碳化合物', C_, 'CO、CO₂、碳酸鹽等被排除。'], ['所有有毒氣體', C_, '與毒性無關。']], ex: 'VOCs：沸點 ≤ 250°C（1 atm）有機化合物，排除甲烷、CO、CO₂、二硫化碳、碳酸鹽、氰化物等。' },
  { g: 'aGas', q: '工業製程逸散污染物的管制，應優先採用何種策略？', a: '源頭管制（設備維護、製程改善）', d: [['直接加裝管末處理設備', C_, '源頭管制無效才增設收集處理設備。'], ['加高煙囪', C_, '稀釋不是減量。'], ['只做排放量申報', C_, '申報不能減少排放。']], ex: '管制順序：源頭管制 → 操作規範 → 管末控制。' },
  { g: 'aGas', q: '化工廠閥、泵浦、壓縮機等設備元件逸散的主要管理計畫為？', a: '洩漏檢測及維修計畫（LDAR）', d: [['CEMS 連續監測', C_, '設備元件數量多，以 LDAR 管理。'], ['目測判煙', C_, '用於粒狀物不透光率。'], ['空品模式模擬', C_, '不是元件管理方法。']], ex: 'LDAR：以手提式 HC 偵測儀定期篩檢元件，洩漏立即維修並再檢測。' },
  { g: 'aGas', q: '選用 VOCs 處理設備時，最主要的考量因素為？', a: '廢氣風量與 VOCs 濃度', d: [['廢氣顏色', D_, '不是主要考量。'], ['廠區面積', C_, '是次要考量。'], ['員工人數', D_, '無關。']], ex: '高濃度小風量 → 冷凝、焚化；低濃度大風量 → 吸附濃縮後焚化等。' },
  { g: 'aGas', q: '可燃性混合氣體的濃度須介於何範圍才會燃燒？', a: '爆炸下限（LEL）與爆炸上限（UEL）之間', d: [['低於 LEL', C_, '太稀不會燃燒。'], ['高於 UEL', C_, '太濃（缺氧）不會燃燒。'], ['任何濃度都會燃燒', C_, '只在燃燒範圍內。']], ex: '燃燒範圍：LEL～UEL。焚化處理 VOCs 時常控制在 LEL 的 25% 以下以策安全。' },
  { g: 'aGas', q: '蓄熱式焚化爐（RTO）的熱回收率一般約為？', a: '90% 以上', d: [['約 30%', C_, '那太低。'], ['低於 70%', C_, '那是表面式熱交換器（熱回收型）的範圍。'], ['0%', C_, '蓄熱式就是為了回收熱。']], ex: '熱回收型（表面式熱交換器）< 70%；蓄熱型（陶瓷蓄熱材）≥ 90%。' },
  { g: 'aGas', q: '以水作為吸收劑處理 VOCs 時，何種物質較適合用吸收法？', a: '亨利常數較小（水溶性較佳）者', d: [['亨利常數較大者', C_, '亨利常數大代表水溶性差。'], ['完全不溶於水者', C_, '不溶於水無法以水吸收。'], ['與亨利常數無關', C_, '亨利常數決定溶解度。']], ex: '亨利常數愈小 → 愈易溶於水 → 愈適合水吸收；物理吸收低溫效果較佳。' },
  { g: 'aGas', q: '生物濾床法較「不適合」處理下列何種廢氣？', a: '高濃度含硫、氮、鹵素化合物', d: [['低濃度異味', C_, '生物濾床很適合。'], ['堆肥場排氣', C_, '常見應用。'], ['低濃度易生物分解 VOCs', C_, '適合。']], ex: '生物處理：生物濾床、生物滴濾塔、生物洗滌；高濃度硫、氮、鹵素化合物易使濾料酸化或抑制微生物。' },
  { g: 'aGas', q: '氮氧化物的三種生成機制為？', a: '熱生成、燃料生成、瞬時生成', d: [['光化學、生物、物理', C_, '不是 NOx 生成機制。'], ['氧化、還原、中和', C_, '不是。'], ['點源、線源、面源', C_, '那是排放源分類。']], ex: 'NOx 生成受火焰溫度、滯留時間、紊流強度、空氣過剩率影響。' },
  { g: 'aGas', q: '燃燒後排煙脫硫的方法分類為？', a: '濕式、半乾式、乾式', d: [['SCR、SNCR', C_, '那是脫硝方法。'], ['旋風、袋濾、靜電', C_, '那是除塵設備。'], ['RACT、BACT、LAER', C_, '那是控制技術等級。']], ex: '脫硫：濕式（石灰石石膏法）、半乾式（噴霧乾燥）、乾式（乾粉噴注）。' },
  { g: 'aGas', q: 'BACT 評估的第一步為？', a: '確認所有可能的控制技術', d: [['直接選最便宜的設備', C_, '要先列出所有技術再評估。'], ['決定 BACT', C_, '這是最後一步。'], ['衝擊性分析', C_, '在排序之後。']], ex: 'BACT 步驟：列出技術 → 技術可行性 → 效率排序 → 衝擊分析 → 決定 BACT。' },
  { g: 'aGas', q: '空污控制系統試車時，負載測試須涵蓋的條件，下列何者「不屬之」？', a: '零負載長期運轉 1 年', d: [['連續最大負荷（設計操作點）', C_, '屬負載測試條件。'], ['設計最大負荷', C_, '屬負載測試條件。'], ['設計最低負荷', C_, '屬負載測試條件。']], ex: '試車：單機、系統、負載運轉、參數調整、功能驗證；焚化廠連續運轉測試約 1～2 個月。' },
  { g: 'aGas', q: '高固型塗料的固型分與溶劑比例約為？', a: '固型分 > 60%、溶劑 < 40%', d: [['固型分 20～30%、溶劑 70～80%', C_, '那是一般塗料。'], ['固型分 5%、溶劑 95%', C_, '不是高固型。'], ['溶劑 10～15%，以水為主', C_, '那是水性塗料。']], ex: '改用高固型或水性塗料可從源頭減少 VOCs 排放。' },
  // 異味與 VOCs
  { g: 'aOdor', q: '「異味濃度」的意義為？', a: '將異味氣體稀釋至剛達異味閾值所需的稀釋倍數', d: [['異味物質的 ppm 濃度', C_, '異味濃度是稀釋倍數，無單位。'], ['聞到異味的人數', C_, '不是人數。'], ['異味強度 0～5 級', C_, '那是異味強度分級。']], ex: '異味濃度 = 稀釋倍數；官能測定（三點比較式嗅袋法）以稀釋到聞不出為止。' },
  { g: 'aOdor', q: '異味官能測定法（三點比較式嗅袋法）的作法，下列何者正確？', a: '6 位判定員，去除最敏感與最不敏感者，平均其餘 4 人', d: [['1 位判定員即可', L_, '需 6 位合格判定員。'], ['取所有判定員最高值', L_, '去頭尾後平均。'], ['以儀器量測 ppm', C_, '官能法靠人的嗅覺。']], ex: 'NIEA A201：3 袋一組（1 袋樣品、2 袋空氣），6 位判定員，去頭去尾平均 4 人稀釋倍數。' },
  { g: 'aOdor', q: '排放管道高度 18 公尺以下，異味濃度排放標準為？', a: '1,000', d: [['2,000', L_, '2,000 是 18～50 公尺。'], ['4,000', L_, '4,000 是 50～100 公尺。'], ['10', L_, '不是排放標準值。']], ex: '異味濃度標準：h ≤ 18 m：1,000；18～50 m：2,000；50～100 m：4,000；> 100 m 依模式推估。' },
  { g: 'aOdor', q: '一般異味污染物的共同特性，下列何者「不正確」？', a: '分子量大、不易揮發', d: [['揮發性高、蒸氣壓大', C_, '是共同特性。'], ['常含氮或含硫', C_, '是共同特性。'], ['多為低碳數不飽和或環狀化合物', C_, '是共同特性。']], ex: '異味物質：揮發性高、含氮硫、低碳數不飽和或環狀結構；閾值最低者如不飽和硫醇類。' },

  { g: 'wPermit', q: '水污染防治費的申報繳納期限為？', a: '每年 1 月 31 日前繳前一年 7～12 月；7 月 31 日前繳當年 1～6 月', d: [['每季結束後 15 日內', L_, '水污費是每半年。'], ['每年 5 月底前一次繳清', L_, '那是碳費。'], ['每月 10 日前', L_, '不是每月。']], ex: '水污費每半年申報繳納：1/31 前（前一年下半年）、7/31 前（當年上半年）。' },
  { g: 'wPermit', q: '原廢水含有害健康物質且二股以上混合時，該項目應於何處採樣？', a: '各股進入調勻設施前', d: [['放流口', L_, '原廢水採樣不是在放流口。'], ['調勻設施出口', L_, '有害物質須分股採樣。'], ['隨意位置', L_, '有規定位置。']], ex: '原廢水原則於調勻設施採樣；含有害健康物質之二股以上混合者，該項目於各股進入調勻前採樣。' },
  { g: 'wPermit', q: '下列何者「免」依規定辦理檢測申報？', a: '廢水全部納入公共污水下水道者', d: [['排放地面水體之電鍍廠', L_, '須申報。'], ['日排放 2,000 CMD 之食品廠', L_, '須申報。'], ['工業區專用下水道系統', L_, '須申報。']], ex: '免申報：未附設洗車場之加油站、營建工地、養豬未滿 200 頭、貯存系統、納入公共下水道者、洗腎診所等。' },
  { g: 'wPermit', q: '事業廢水納入工業區專用污水下水道，申報方式為？', a: '先向下水道管理機關申報，再由其彙整向地方主管機關申報', d: [['直接向環境部申報', L_, '先向下水道管理機關申報。'], ['不需申報', L_, '仍須申報。'], ['由地方主管機關代為申報', L_, '由下水道管理機關彙整。']], ex: '納管事業：先報下水道機關，由其彙整報直轄市、縣（市）主管機關。' },
  { g: 'wPermit', q: '受託處理他廠廢水，收受後應於多久內處理？', a: '24 小時內', d: [['7 日內', L_, '是 24 小時內。'], ['30 日內', L_, '30 日是停止受託或貯留的期限。'], ['不限時間', L_, '是 24 小時內。']], ex: '受託處理：同業別或同類型、不超過核准餘裕量、收受後 24 小時內處理、雙方設獨立累計水量計。' },
  { g: 'wPermit', q: '委託處理廢水的事業貯留廢水超過幾日仍未取得其他水措核准，應停止產生廢水？', a: '30 日', d: [['7 日', L_, '是 30 日。'], ['90 日', L_, '是 30 日。'], ['不需停止', L_, '超過 30 日應停止。']], ex: '受託者無法受託 > 30 日應辦變更；委託者貯留 > 30 日且無其他水措，應停止產生廢水。' },
  { g: 'wPermit', q: '經許可稀釋的廢水，稀釋混合地點應位於？', a: '前處理設施的調勻設施', d: [['放流口前', L_, '不得於放流口前稀釋。'], ['承受水體中', L_, '不得在水體中稀釋。'], ['任意位置', L_, '限調勻設施。']], ex: '稀釋限無替代方法者並經許可，於調勻設施混合並設獨立進流累計水量計。' },
  { g: 'wPermit', q: '自來水廠於豪雨特報期間可緊急排放的條件為原水懸浮固體或濁度超過？', a: '2,000 mg/L 或 2,000 NTU', d: [['200 mg/L', L_, '是 2,000。'], ['20,000 mg/L', L_, '是 2,000。'], ['只要下雨即可', L_, '有明確門檻。']], ex: '緊急排放：先淨空沉澱池與濃縮池、通知下游並通報主管機關、每日檢測紀錄保存 5 年。' },
  { g: 'wPermit', q: '工業區專用污水下水道自評報告應於何時提出？', a: '每年 6 月底前提出前一年度報告', d: [['每季提出', L_, '是每年。'], ['每年 1 月底前', L_, '是 6 月底前。'], ['不需提出', L_, '須提出。']], ex: '自評內容：處理水質、用藥用電污泥、事業家數、利用率與收費率、設備妥善率、受處分與改善等。' },
  { g: 'wPermit', q: '污水下水道緊急應變放流口排放後，應於多久內通報？', a: '1 小時內', d: [['24 小時內', L_, '是 1 小時內。'], ['3 日內', L_, '是 1 小時內。'], ['不需通報', L_, '須通報。']], ex: '下水道緊急放流：須經許可、設水量計與鉛封制水閥、1 小時內通報、紀錄保存 3 年；6 個月內使用 2 次以上須提改善計畫。' },
  // 水污費
  { g: 'wFee', q: '水污染防治費的徵收精神為？', a: '污染者付費', d: [['使用者付費', C_, '是污染者付費。'], ['受益者付費', C_, '是污染者付費。'], ['政府全額負擔', C_, '向排放者徵收。']], ex: '水污費依排放水質水量向排放地面水體之事業與下水道系統徵收。' },
  { g: 'wFee', q: '水污染防治費的費額公式為？', a: '費額 = Σ（費率 × 排放水質）× 排放水量', d: [['費額 = 用電量 × 費率', C_, '不依用電量。'], ['費額 = 員工數 × 費率', D_, '無關。'], ['費額 = 排放水量 × 固定金額', C_, '還要乘以水質與各項費率。']], ex: '徵收項目：COD、SS、鉛、鎳、銅、總汞、鎘、總鉻、砷、氰化物；燃煤海水脫硫廢水另徵 SOx。' },

  { g: 'wFee', q: '排放水質低於最大限值多少時，可免繳該期該項水污費？', a: '低於 10%', d: [['低於 50%', L_, '50% 以下仍有優惠但非免繳。'], ['低於 80%', L_, '是低於 10%。'], ['任何情況都不能免', L_, '可免繳。']], ex: '免繳：全量納管、濃度 < 最大限值 10%、當期應繳未達 50 元等。' },
  { g: 'wFee', q: '逾期 90 日仍未繳納水污費的事業，罰鍰為？', a: '新臺幣 6,000 元以上 30 萬元以下', d: [['新臺幣 6 萬元以上 2,000 萬元以下', L_, '那是違反放流水標準。'], ['新臺幣 1,500 元以上 3 萬元以下', L_, '那是家戶。'], ['不罰', L_, '會處罰。']], ex: '逾期加計郵政 1 年期定存利率利息；逾 90 日：事業 6,000～30 萬、家戶 1,500～3 萬元。' },
  { g: 'wFee', q: '計算水污費時，未有定檢資料者的排放水量原則以何者推估？', a: '許可每日核准量的 90%', d: [['許可每日核准量的 10%', L_, '是 90%。'], ['以 0 計', L_, '不能以 0 計。'], ['許可每日核准量的 200%', L_, '是 90%。']], ex: '水質依業別限值 90% 或定檢值；水量依核准量 90% 或定檢總量；有自動監測以傳輸數據。' },
  { g: 'wFee', q: '計算畜牧業水污費時，養豬每頭每日的廢水量以多少計？', a: '20 公升', d: [['2 公升', L_, '是 20 公升。'], ['200 公升', L_, '是 20 公升。'], ['不計水量', L_, '以在養頭數推估。']], ex: '畜牧業可依在養頭數推估：養豬每頭每日 20 公升。' },
  // 專責人員
  { g: 'wRole', q: '廢水產生量達每日多少立方公尺以上的事業，應設置專責單位？', a: '5,000 m³', d: [['500 m³', L_, '是 5,000 m³/日。'], ['2,000 m³', L_, '2,000～5,000 為甲級專責人員。'], ['100 m³', L_, '100～2,000 為乙級專責人員。']], ex: '專責單位：≥ 5,000 CMD，或 1,000～5,000 CMD 且原廢水含附表二 34 項物質之一超標。' },
  { g: 'wRole', q: '廢水產生量每日 2,000 至未滿 5,000 立方公尺的事業，應設？', a: '甲級專責人員', d: [['乙級專責人員', L_, '乙級是 100～2,000 CMD。'], ['專責單位', L_, '專責單位是 ≥ 5,000 CMD。'], ['不需設置', L_, '須設甲級。']], ex: '甲級：2,000～5,000 CMD，或 200～1,000 CMD 且含附表二物質超標；乙級：100～2,000 CMD。' },
  { g: 'wRole', q: '事業員工人數多少以下，負責人符合資格可兼任廢水專責人員？', a: '50 人以下', d: [['500 人以下', L_, '是 50 人以下。'], ['10 人以下', L_, '是 50 人以下。'], ['不得兼任', L_, '50 人以下可兼任。']], ex: '負責人兼任：員工 50 人以下；應設專責單位或負責人兼任者，代理人至少 2 名。' },
  { g: 'wRole', q: '社區專用污水下水道服務戶數多少以下可免設專責人員？', a: '500 戶以下', d: [['50 戶以下', L_, '是 500 戶以下。'], ['5,000 戶以下', L_, '是 500 戶以下。'], ['一律須設置', L_, '500 戶以下可免。']], ex: '服務 2,000 戶以上的社區專用下水道，專責人員須專職。' },
  { g: 'wRole', q: '廢水專責人員代理期間最長為？', a: '3 個月（非離職者經核准可延至 6 個月）', d: [['1 個月', L_, '是 3 個月。'], ['1 年', L_, '是 3 個月。'], ['無限期', L_, '有期限。']], ex: '離職：15 日內代理並報備，代理 ≤ 3 個月，期滿前 15 日內完成新人核定；專責人員本人 30 日內書面報備。' },
  { g: 'wRole', q: '廢水專責人員半年內累積超過多少日未到職（休假除外），不得續任？', a: '30 日', d: [['7 日', L_, '是 30 日。'], ['90 日', L_, '是 30 日。'], ['沒有規定', L_, '有規定。']], ex: '不得續任：半年內累積 > 30 日未到職，或 1 年內經查 3 次以上未常駐且無請假紀錄。' },

  { g: 'wRole', q: '廢水專責人員涉下列何種違規，罰鍰可達 5 萬元以上？', a: '繞流排放', d: [['未按時繳交水污費', C_, '那是事業的責任。'], ['請假一天', D_, '請假有紀錄不違規。'], ['參加在職訓練', D_, '不違規。']], ex: '專責人員違反第 18 條之 1 繞流排放規定，罰 5 萬元以上；有揭露、自首或稽查配合良好者可減輕。' },
  // 水質與概論（生物、化學、物理延伸）
  { g: 'wChem', q: '凱氏氮（TKN）的組成為？', a: '氨氮 + 有機氮', d: [['硝酸鹽氮 + 亞硝酸鹽氮', C_, '那是氧化態氮。'], ['總氮 − 氨氮', C_, '不對。'], ['只有有機氮', C_, '還包含氨氮。']], ex: '總氮 = 凱氏氮（氨氮 + 有機氮）+ 硝酸鹽氮 + 亞硝酸鹽氮。' },
  { g: 'wChem', q: '大腸菌類被用作糞便污染指標生物的原因，下列何者「不正確」？', a: '大腸菌類本身都是強烈病原菌', d: [['數量多、易檢出', C_, '正確敘述。'], ['糞便污染水中必然存在', C_, '正確敘述。'], ['潔淨水中通常沒有', C_, '正確敘述。']], ex: '大腸菌類一般無害，但與病原菌大致成比例，可指示糞便污染。' },
  { g: 'wChem', q: 'Fenton 氧化反應的最適 pH 範圍為？', a: '2～4', d: [['6～8', C_, '中性下鐵會沉澱，效果差。'], ['10～12', C_, '鹼性下效果差。'], ['任意 pH 皆可', C_, '酸性最佳。']], ex: 'Fenton：Fe²⁺ + H₂O₂ 產生 ·OH，pH 2～4 效果最好。' },
  { g: 'wChem', q: '硫酸鋁作為混凝劑，主要適用的 pH 範圍為？', a: '中性', d: [['強酸性（pH 2）', C_, '不適用。'], ['強鹼性（pH 12）', C_, '鋁會形成可溶性鋁酸根。'], ['不受 pH 影響', C_, '混凝效果受 pH 影響大。']], ex: '常見混凝劑：硫酸鋁、硫酸鐵、氯化鐵、PAC；混凝機制包括電雙層壓縮、電性中和、沉澱絆除、吸附架橋。' },
  { g: 'wChem', q: '混凝單元快混與慢混的操作時間約為？', a: '快混約 5 分鐘內，慢混約 20～30 分鐘', d: [['快混 30 分鐘、慢混 5 分鐘', C_, '順序與時間相反。'], ['兩者都只需 10 秒', C_, '慢混需較長時間形成膠羽。'], ['只需慢混，不需快混', C_, '快混用於破壞膠體穩定。']], ex: '快混：破壞膠體穩定；慢混：膠羽成長變大；慢混與沉澱池水位差以 10～15 cm 為原則。' },
  { g: 'wChem', q: '六價鉻還原為三價鉻時，pH 應控制在？', a: '小於 3.0', d: [['8～10', C_, '8～10 是三價鉻沉澱 pH。'], ['大於 11', C_, '鹼性下不利還原。'], ['約 7', C_, '中性還原效果差。']], ex: '六價鉻：pH < 3 還原 → 三價鉻：pH 7.5～10 形成 Cr(OH)₃ 沉澱。' },
  { g: 'wChem', q: '鳥糞石（可回收氮、磷）的化學式為？', a: 'MgNH₄PO₄·6H₂O', d: [['CaSO₄·2H₂O', C_, '那是石膏。'], ['CaCO₃', C_, '那是碳酸鈣。'], ['Fe(OH)₃', C_, '那是氫氧化鐵。']], ex: '鳥糞石結晶法可同時回收氨氮與磷酸鹽。' },
  { g: 'wChem', q: '離子交換樹脂「貫穿點」的出流濃度約為進流濃度的？', a: '0.05（5%）', d: [['0.5（50%）', C_, '50% 已遠超貫穿點。'], ['1.0（100%）', C_, '那是耗竭點（完全飽和）。'], ['0', C_, '0 代表尚未貫穿。']], ex: '貫穿點 C/C₀ ≈ 0.05，此時應準備再生；反洗可打散結團、移除細屑、重組床層。' },
  { g: 'wChem', q: '進入逆滲透（RO）前，進流水的 SDI 值應低於？', a: '約 2～3', d: [['約 20', C_, '太高會造成薄膜積垢。'], ['約 10', C_, '仍太高。'], ['不需控制', C_, 'SDI 是 RO 前處理重要指標。']], ex: 'SDI（淤積密度指數）< 2～3 才可進 RO；無法物理清洗去除者為不可逆積垢。' },
  { g: 'wChem', q: '脫氯（去除餘氯）常用的還原劑為？', a: '二氧化硫（或亞硫酸鹽）', d: [['次氯酸鈉', C_, '那是加氯消毒劑。'], ['臭氧', C_, '臭氧是氧化劑。'], ['過氧化氫', C_, '是氧化劑。']], ex: '常用氧化劑：氯系、臭氧、過氧化氫、高錳酸鉀；脫氯用 SO₂ 等還原劑。' },
  { g: 'wPhys', q: '調勻池的主要功能為？', a: '穩定水質與水量，使後續單元發揮效能', d: [['去除重金屬', C_, '調勻不去除污染物。'], ['殺菌消毒', C_, '那是消毒單元。'], ['使污泥脫水', C_, '那是污泥處理。']], ex: '調勻池同時調勻水量與水質，緩和負荷變動。' },
  { g: 'wPhys', q: '初沉池、化學沉澱池、二沉池中，表面溢流率設計最小的是？', a: '二沉池', d: [['初沉池', C_, '初沉池溢流率較高。'], ['化學沉澱池', C_, '化學膠羽較易沉降。'], ['三者相同', C_, '依污泥特性不同。']], ex: '生物污泥較輕、沉降慢，二沉池需較低溢流率。' },
