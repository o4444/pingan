<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--ink2:#3d4a66;--mute:#6b7690;--line:#e3e6ee;--bg:#f6f4ee;--card:#fff;--hi:#f2b705;--hi2:#fff4cc;--ok:#1f8a4c;--okbg:#e6f5ec;--ng:#c0392b;--ngbg:#fdecea;--blue:#2459c7;--bluebg:#eaf0fc}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.hwrap{max-width:880px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;cursor:pointer}
.logo .tag{background:var(--hi);color:var(--ink);font-size:12px;padding:2px 8px;border-radius:4px;font-weight:900}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:transparent;border:0;color:#c9d1e3;font:inherit;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on,nav button:hover{background:#ffffff1a;color:#fff}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--hi) 0 14px,var(--ink) 14px 28px)}
#fb{scroll-margin-top:80px}
main{max-width:880px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:26px;margin:4px 0 6px;font-weight:900}
h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font:inherit;color:inherit}
.ucard:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 18px #14213d14}
.ucard .ic{font-size:26px}
.ucard b{display:block;font-size:17px;margin:4px 0}
.ucard small{color:var(--mute)}
.bar{height:6px;background:#eef0f5;border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
.ucard.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.ucard.dark small{color:#c9d1e3}
.ucard.yel{background:var(--hi2);border-color:#f0d980}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bd{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef0f5;color:var(--ink2)}
.bd.lv{background:var(--ink);color:#fff}
.bd.var{background:var(--hi);color:var(--ink)}
.stem{font-size:18px;font-weight:500;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);transition:.12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:#eef0f5;display:grid;place-items:center;font-weight:900}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}.opt.ng .k{background:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.opt .num{font-family:"JetBrains Mono",monospace}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}
.btn.yel{background:var(--hi);border-color:var(--hi)}
.btn.ghost{border-color:var(--line)}
.btn:hover{filter:brightness(.95)}
.hint{margin-top:12px;background:var(--bluebg);border-radius:10px;padding:10px 14px;color:var(--blue);font-size:15px}
.verdict{border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;margin-bottom:14px}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.ng{background:var(--ngbg);color:var(--ng)}
.stage{border-left:4px solid var(--ink);padding:2px 0 2px 14px;margin:18px 0}
.stage h3{margin:0 0 8px;font-size:15px;letter-spacing:.03em;color:var(--ink2)}
.stage h3 span{background:var(--ink);color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px;font-size:12px}
.etype{display:inline-block;background:var(--ng);color:#fff;font-weight:700;padding:2px 10px;border-radius:6px;margin-bottom:6px}
.etype.okt{background:var(--ok)}
.sc{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.sc b.t{display:block;color:var(--ink2);font-size:14px;margin-bottom:4px}
.sc ul{margin:0;padding-left:20px}
.formula{font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:17px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;margin:6px 0;overflow-x:auto}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:3px 0;font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:15px}
.warn{background:var(--hi2);color:#8a5a00;padding:1px 6px;border-radius:4px;font-weight:700}
.card30{background:var(--hi2);border:2px dashed #e0b400;border-radius:12px;padding:14px 16px}
.card30 h4{margin:0 0 6px}
table.ut{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.ut td{border-bottom:1px solid #f0d980;padding:4px 6px}
.prog{height:8px;background:#e8e4d8;border-radius:4px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--hi)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{font-size:28px;font-weight:900;display:block}
.stat small{color:var(--mute)}
.lrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.lrow .bar{margin:0;height:10px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv summary{cursor:pointer;font-weight:500}
.foot{color:var(--mute);font-size:13px;margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--blue)}
.confirm{background:var(--ngbg);border-radius:10px;padding:12px;margin-top:10px}
@media(max-width:560px){.stem{font-size:16px}.lrow{grid-template-columns:96px 1fr 56px}h1{font-size:22px}}

/* v2 安安老師導引（v3.1 預設小尺寸，一進站即出現） */
.tutor{position:fixed;right:10px;bottom:0;z-index:20;display:flex;align-items:flex-end;pointer-events:none}
.tutor img{height:230px;width:auto;display:block;filter:drop-shadow(0 6px 14px #14213d40);pointer-events:auto;cursor:pointer}
.tutor img[data-p=think],.tutor img[data-p=pointup],.tutor img[data-p=face]{height:175px}
.tbub{pointer-events:auto;max-width:270px;background:#fff;border:2px solid var(--ink);border-radius:14px 14px 4px 14px;padding:10px 12px 8px;margin:0 -4px 140px 0;box-shadow:0 8px 22px #14213d26;font-size:14.5px;line-height:1.55;position:relative;animation:pop .25s ease}
.tbub b.nm{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.tbub .x{position:absolute;top:3px;right:7px;border:0;background:none;font-size:15px;color:var(--mute);cursor:pointer}
.tbub .act{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.tbub .act button{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--ink);background:var(--hi);border-radius:8px;padding:3px 9px;cursor:pointer}
.tutor.min .tbub{display:none}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
main{padding-bottom:250px}
@media(max-width:700px){.tutor{right:4px}.tutor img{height:140px}.tutor img[data-p=think],.tutor img[data-p=pointup],.tutor img[data-p=face]{height:125px}.tbub{max-width:min(230px,60vw);margin-bottom:84px;font-size:13.5px;padding:8px 10px 6px}main{padding-bottom:170px}}
.spon{background:linear-gradient(135deg,var(--hi2),#fff);border:2px solid #f0d980;border-radius:14px;padding:16px 18px;margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.spon p{margin:0;flex:1;min-width:200px}
.spon a{background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:10px}
.bd.dr{background:#7a3cd6;color:#fff}

/* v6 考試用計算機 */
.tutor.cxon img{opacity:.3;pointer-events:none}
.cxbox{margin-top:14px;border:2px solid var(--ink);border-radius:12px;background:#f3f5fa}
.cxbox summary{cursor:pointer;font-weight:700;padding:10px 14px;list-style:none}
.cxbox summary::-webkit-details-marker{display:none}
.cxbox summary small{color:var(--mute);font-weight:500}
.cxwrap{padding:0 12px 12px}
.cxhist{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--mute);text-align:right;min-height:18px;overflow-x:auto;white-space:nowrap}
.cxin{width:100%;box-sizing:border-box;font-family:"JetBrains Mono",monospace;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff;text-align:right}
.cxout{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;text-align:right;padding:6px 4px;color:var(--ink);overflow-x:auto;white-space:nowrap}
.cxkeys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cxk{font:inherit;font-weight:700;font-size:16px;min-height:44px;border:1px solid #c9cfdc;border-radius:8px;background:#e6e9f1;color:var(--ink);cursor:pointer}
.cxk.cxn{background:#fff}
.cxk.cxs{background:var(--ink);color:#fff;border-color:var(--ink)}
.cxk:active{transform:translateY(1px)}
.cxfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--mute)}
</style>
</head>

<main id="app"></main>

<script>
// ===== 職安乙級陪考：題目產生器（純邏輯，無 DOM） =====
const R = (a, b, s = 1) => a + s * Math.floor(Math.random() * (Math.floor((b - a) / s + 1e-9) + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const f = (v, d) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
const floorD = (v, d) => Math.floor(v * Math.pow(10, d) + 1e-9) / Math.pow(10, d);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const log10 = Math.log10;

const ERR = {
  concept: '觀念／公式錯誤',
  unit: '單位換算錯誤',
  math: '數學運算錯誤',
  law: '法規基準誤判',
  read: '題意判讀錯誤',
  express: '作答表達錯誤'
};

// 數值選項：正解 + 誘答（各自帶錯誤類型）
function numOptions(ans, dists, dec, unit) {
  const opts = [{ v: ans, text: f(ans, dec) + ' ' + unit, correct: true }];
  const ok = v => isFinite(v) && v > 0 && opts.every(o => o.text !== f(v, dec) + ' ' + unit && Math.abs(v - o.v) / Math.max(Math.abs(o.v), 1e-9) > 0.03);
  for (const d of dists) { if (opts.length >= 4) break; if (ok(d.v)) opts.push({ v: d.v, text: f(d.v, dec) + ' ' + unit, correct: false, type: d.type, why: d.why }); }
  const fillers = [1.5, 0.6, 2, 0.8, 1.25, 0.4, 3];
  for (const k of fillers) { if (opts.length >= 4) break; const v = ans * k; if (ok(v)) opts.push({ v, text: f(v, dec) + ' ' + unit, correct: false, type: ERR.math, why: '數值計算或位數處理有誤，請分段重算、每一步都寫下單位。' }); }
  return shuffle(opts);
}
function textOptions(correctText, dists) {
  const opts = [{ text: correctText, correct: true }];
  for (const d of dists) { if (opts.length >= 4) break; if (opts.every(o => o.text !== d.text)) opts.push({ text: d.text, correct: false, type: d.type, why: d.why }); }
  return shuffle(opts);
}

const SUBS = [
  { n: '甲苯', mw: 92.14 }, { n: '二甲苯', mw: 106.17 }, { n: '丙酮', mw: 58.08 },
  { n: '正己烷', mw: 86.18 }, { n: '苯乙烯', mw: 104.15 }, { n: '甲醇', mw: 32.04 }, { n: '乙酸乙酯', mw: 88.11 }
];

// ---------- 30 秒觀念卡（依錯誤類型） ----------
const UNIT_TABLE = [
  ['1 m³', '1,000 L'], ['1 m²', '10,000 cm²'], ['1 m', '100 cm'], ['1 hr', '60 min = 3,600 s'],
  ['m³/s → m³/min', '× 60'], ['m³/min → m³/hr', '× 60'], ['分鐘 → 小時', '÷ 60'],
  ['莫耳體積 25°C、1 atm', '24.45 L/mol'], ['莫耳體積 0°C、1 atm', '22.4 L/mol'], ['1 ppm', '百萬分之一（體積比）']
];
const GENERIC_CARD = {
  [ERR.math]: '計算機分段算：先算括號與指數 → 再乘除 → 最後加減。log 題先算 D/100 再按 log；2 的次方用 [x^y] 或 [^] 鍵，指數要加括號。每一段寫下中間值，最後才四捨五入。',
  [ERR.read]: '讀題三圈：①圈「求什麼、單位是什麼」②圈條件（溫度、有無日曬、時間單位）③刪掉用不到的干擾數據。先寫「求：＿＿（單位）」再動筆。',
  [ERR.express]: '作答四要素：公式 → 代入（含單位）→ 答案 → 單位與判定結論。術科漏寫單位或結論會被扣分。'
};

// ================== 產生器 ==================
const G = {};

// ---- 噪音：容許暴露時間 ----
G.noiseT = () => {
  const L = pick([92, 93, 94, 95, 96, 97, 98, 100, 102, 104, 105]);
  const ex = (L - 90) / 5, T = 8 / Math.pow(2, ex);
  return {
    unit: 'noise', level: 2, title: '噪音｜容許暴露時間',
    stem: `某作業場所為穩定性噪音 ${L} dBA，依 5 dB 交換率計算，勞工之容許暴露時間 T 為多少小時？`,
    known: [`L = ${L} dBA`, '基準：90 dBA 對應 8 小時', '交換率：5 dB', '求：T（小時）'],
    formula: { expr: 'T = 8 ÷ 2^((L − 90) ÷ 5)', vars: 'T：容許暴露時間（hr）；L：音壓級（dBA）', cond: '5 dB 交換率；L 以 dBA 計。', plain: '90 dBA 可以聽 8 小時；每多 5 dB，能聽的時間砍一半。', mnemonic: '「九十配八小時，多五分貝砍一半」' },
    steps: [`(L − 90) ÷ 5 = (${L} − 90) ÷ 5 = ${f(ex, 2)}`, `2^${f(ex, 2)} = ${f(Math.pow(2, ex), 4)}`, `T = 8 ÷ ${f(Math.pow(2, ex), 4)} = <b>${f(T, 2)} 小時</b>`],
    check: `${L} dBA 大於 90 dBA，T 應小於 8 小時 ✔（每 +5 dB 時間減半）`,
    answer: T, opts: numOptions(T, [
      { v: 8 / Math.pow(2, (L - 90) / 3), type: ERR.law, why: '用了 3 dB 交換率；本題（及台灣法規）採 5 dB 交換率。' },
      { v: 8 * Math.pow(2, ex), type: ERR.concept, why: '指數方向放反：音量越大，容許時間要越短，所以是「除以」2 的次方。' },
      { v: 8 / Math.pow(2, (L - 85) / 5), type: ERR.law, why: '基準值誤用 85 dBA；容許時間公式的基準是 90 dBA 對應 8 小時。' }
    ], 2, '小時'),
    card: { [ERR.concept]: '物理意義：噪音能量每增加一倍（約 +3 dB）就加倍傷害，台灣法規採較寬的 5 dB 交換率。「越吵 → 越短」，所以 T 必定隨 L 增加而變小。', [ERR.law]: '法規重點：職業安全衛生設施規則第 300 條採 90 dBA／8 小時、5 dB 交換率。85 dBA 是啟動聽力保護計畫的管理門檻，不是 T 公式的基準。（條文請以全國法規資料庫現行版為準）' }
  };
};

// ---- 噪音：劑量 ----
G.noiseDose = () => {
  const k = pick([2, 3]);
  const levels = shuffle([85, 88, 90, 92, 95, 97, 100]).slice(0, k).sort((a, b) => a - b);
  let units = []; let rest = 16;
  for (let i = 0; i < k - 1; i++) { const u = R(1, rest - (k - 1 - i)); units.push(u); rest -= u; }
  units.push(rest); units = shuffle(units);
  const segs = levels.map((L, i) => ({ L, h: units[i] / 2, T: 8 / Math.pow(2, (L - 90) / 5) }));
  const mi = R(0, k - 1); // 以分鐘表示的時段
  const D = segs.reduce((s, x) => s + x.h / x.T, 0) * 100;
  const desc = segs.map((s, i) => `${s.L} dBA ${i === mi ? (s.h * 60) + ' 分鐘' : s.h + ' 小時'}`).join('、');
  const dUnit = segs.reduce((s, x, i) => s + (i === mi ? x.h * 60 : x.h) / x.T, 0) * 100;
  const d3 = segs.reduce((s, x) => s + x.h / (8 / Math.pow(2, (x.L - 90) / 3)), 0) * 100;
  const dIgn = segs.filter(x => x.L >= 90).reduce((s, x) => s + x.h / x.T, 0) * 100;
  const Lavg = segs.reduce((s, x) => s + x.L * x.h, 0) / 8;
  const dAvg = 8 / (8 / Math.pow(2, (Lavg - 90) / 5)) * 100;
  const dists = [{ v: dUnit, type: ERR.unit, why: `把「${segs[mi].h * 60} 分鐘」直接當小時代入，忘了 ÷60。` }];
  if (segs.some(x => x.L < 90)) dists.push({ v: dIgn, type: ERR.law, why: '只算了 90 dBA 以上的時段；80 dBA 以上的噪音都要納入劑量計算。' });
  dists.push({ v: d3, type: ERR.law, why: '用了 3 dB 交換率計算各時段 T。' });
  dists.push({ v: dAvg, type: ERR.concept, why: 'dB 是對數量，不能先算時間加權的「平均 dB」再求劑量。' });
  return {
    unit: 'noise', level: 3, title: '噪音｜暴露劑量',
    stem: `某勞工一日 8 小時暴露情形為：${desc}。依 5 dB 交換率，其噪音暴露劑量 D 為多少 %？`,
    known: segs.map((s, i) => `L${i + 1} = ${s.L} dBA，t${i + 1} = ${i === mi ? (s.h * 60) + ' 分 = ' + s.h + ' hr' : s.h + ' hr'}`).concat(['求：D（%）']),
    formula: { expr: 'D = Σ(tᵢ ÷ Tᵢ) × 100%，Tᵢ = 8 ÷ 2^((Lᵢ − 90) ÷ 5)', vars: 'tᵢ：實際暴露時間（hr）；Tᵢ：該音壓級容許暴露時間（hr）', cond: '80 dBA 以上之時段皆納入；t 與 T 單位必須相同。', plain: '每一段「實際聽了多久 ÷ 最多能聽多久」加起來，就是今天用掉的耳朵額度。', mnemonic: '「實際除容許，段段加起來」' },
    steps: segs.map((s, i) => `T${i + 1} = 8 ÷ 2^((${s.L} − 90) ÷ 5) = ${f(s.T, 3)} hr → t${i + 1}/T${i + 1} = ${s.h} ÷ ${f(s.T, 3)} = ${f(s.h / s.T, 4)}`).concat([`<span class="warn">⚠ ${segs[mi].h * 60} 分鐘 = ${s2(segs[mi].h)} 小時</span>`, `D = (${segs.map(s => f(s.h / s.T, 4)).join(' + ')}) × 100% = <b>${f(D, 1)} %</b>`]),
    check: `D ${D > 100 ? '> 100%，表示超過容許暴露（TWA > 90 dBA）' : '≤ 100%，未超過 90 dBA 之 8 小時容許標準'}。`,
    answer: D, opts: numOptions(D, dists, 1, '%'),
    card: { [ERR.unit]: '劑量公式中 t 與 T 必須同單位。T 公式算出的是「小時」，所以分鐘要先 ÷60。', [ERR.law]: '80 dBA 以上噪音以 5 dB 交換率納入計算（職業安全衛生設施規則第 300 條，請以現行條文為準）。低於 90 dBA 的時段 T > 8 hr，貢獻較小但不能漏。', [ERR.concept]: 'dB 是對數尺度：90 + 100 dB 的平均不是 95 dB。一定要逐段換成「劑量」再相加。' }
  };
};
function s2(h) { return Number.isInteger(h) ? String(h) : String(h); }

// ---- 噪音：TWA ----
G.noiseTWA = () => {
  const D = R(60, 400, 5);
  const T = 16.61 * log10(D / 100) + 90;
  return {
    unit: 'noise', level: 3, title: '噪音｜八小時日時量平均音壓級',
    stem: `某勞工一日噪音暴露劑量 D = ${D}%，其八小時日時量平均音壓級 L_TWA 為多少 dBA？`,
    known: [`D = ${D}%`, '求：L_TWA（dBA）'],
    formula: { expr: 'L_TWA = 16.61 × log₁₀(D ÷ 100) + 90', vars: 'D：劑量（%）', cond: '5 dB 交換率、8 小時基準。', plain: '劑量 100% 剛好等於 90 dBA；劑量每翻倍，TWA 多 5 dB（16.61 × log2 ≈ 5）。', mnemonic: '「一六點六一，D 除一百取 log，再加九十」' },
    steps: [`D ÷ 100 = ${f(D / 100, 2)}`, `log₁₀(${f(D / 100, 2)}) = ${f(log10(D / 100), 4)}`, `16.61 × ${f(log10(D / 100), 4)} = ${f(16.61 * log10(D / 100), 2)}`, `L_TWA = ${f(16.61 * log10(D / 100), 2)} + 90 = <b>${f(T, 1)} dBA</b>`],
    check: `D ${D >= 100 ? '≥' : '<'} 100%，TWA 應${D >= 100 ? '≥' : '<'} 90 dBA ✔`,
    answer: T, opts: numOptions(T, [
      { v: 16.61 * log10(D) + 90, type: ERR.concept, why: '忘了 D ÷ 100：公式中是劑量的「倍數」，不是百分比數字。' },
      { v: 16.61 * Math.log(D / 100) + 90, type: ERR.math, why: '計算機按成 ln（自然對數），應使用 log（常用對數）。' },
      { v: 10 * log10(D / 100) + 90, type: ERR.concept, why: '係數用成 10；5 dB 交換率對應的係數是 16.61。' }
    ], 1, 'dBA'),
    card: { [ERR.concept]: '驗算技巧：D = 200% → TWA = 95 dBA；D = 50% → 85 dBA。用這兩個點檢查公式有沒有背對。' }
  };
};

    steps: [`<span class="warn">⚠ A = ${W/100} m × ${H/100} m = ${f(A, 4)} m²（cm² ÷ 10,000）</span>`, `Q = ${V} × ${f(A, 4)} = ${f(V * A, 4)} m³/s`, `<span class="warn">⚠ m³/s × 60 = m³/min</span>`, `Q = ${f(V * A, 4)} × 60 = <b>${f(Q, 2)} m³/min</b>`],
    check: '一般小型氣罩風量多在數 m³/min 至數十 m³/min 之間，數量級合理 ✔',

// ---- 化學：ppm ↔ mg/m³ ----
G.chemPPM = (o = {}) => {
  const s = pick(SUBS), cold = o.cold !== undefined ? o.cold : Math.random() < 0.3, Vm = cold ? 22.4 : 24.45, Vw = cold ? 24.45 : 22.4;
  const p2m = o.dir ? o.dir === 'p2m' : Math.random() < 0.5; const keep = { dir: p2m ? 'p2m' : 'm2p', cold };
  const tc = cold ? '0°C、1 atm' : '25°C、1 atm';
  if (p2m) {
    const ppm = R(10, 200, 5), mg = ppm * s.mw / Vm;
    return {
      unit: 'chem', level: 1, title: '化學｜ppm 換算 mg/m³', keep,
      stem: `${s.n}（分子量 ${s.mw}）蒸氣濃度 ${ppm} ppm，在 ${tc} 下相當於多少 mg/m³？`,
      known: [`C = ${ppm} ppm`, `M = ${s.mw} g/mol`, `條件 ${tc} → 莫耳體積 ${Vm} L`, '求：mg/m³'],
      formula: { expr: `mg/m³ = ppm × M ÷ ${Vm}`, vars: 'M：分子量；24.45（25°C）／22.4（0°C）：莫耳體積（L/mol）', cond: '僅適用氣體、蒸氣；必須先確認溫度壓力。', plain: '1 莫耳氣體佔 24.45 L（25°C），用分子量把「體積比」換成「重量」。', mnemonic: '「ppm 乘分子量，除以二四點四五」' },
      steps: [`<span class="warn">⚠ ${tc} → 用 ${Vm}</span>`, `mg/m³ = ${ppm} × ${s.mw} ÷ ${Vm} = <b>${f(mg, 1)} mg/m³</b>`],
      check: `分子量 ${s.mw} ${s.mw > Vm ? '>' : '<'} ${Vm}，所以 mg/m³ 應${s.mw > Vm ? '大於' : '小於'} ppm 數值 ✔`,
      answer: mg, opts: numOptions(mg, [
        { v: ppm * s.mw / Vw, type: ERR.read, why: `題目是 ${tc}，莫耳體積應用 ${Vm}，不是 ${Vw}。` },
        { v: ppm * Vm / s.mw, type: ERR.concept, why: '公式上下顛倒，這是 mg/m³ → ppm 的方向。' },
        { v: ppm * s.mw / Vm / 1000, type: ERR.unit, why: '多除了 1000；公式已整合 L 與 m³ 的換算。' }
      ], 1, 'mg/m³'),
      card: { [ERR.read]: '圈溫度！25°C → 24.45；0°C → 22.4；題目沒寫時依題目或考試慣例（多為 25°C）。', [ERR.concept]: '方向判斷：ppm → mg/m³ 乘分子量；mg/m³ → ppm 乘 24.45。' }
    };
  } else {
    const mg = R(20, 600, 5), ppm = mg * Vm / s.mw;
    return {
      unit: 'chem', level: 1, title: '化學｜mg/m³ 換算 ppm', keep,
      stem: `${s.n}（分子量 ${s.mw}）濃度 ${mg} mg/m³，在 ${tc} 下相當於多少 ppm？`,
      known: [`C = ${mg} mg/m³`, `M = ${s.mw}`, `條件 ${tc} → ${Vm} L/mol`, '求：ppm'],
      formula: { expr: `ppm = mg/m³ × ${Vm} ÷ M`, vars: 'M：分子量', cond: '氣體、蒸氣；確認溫度壓力。', plain: '把重量濃度換回體積比。', mnemonic: '「mg 回 ppm，乘二四點四五除分子量」' },
      steps: [`<span class="warn">⚠ ${tc} → 用 ${Vm}</span>`, `ppm = ${mg} × ${Vm} ÷ ${s.mw} = <b>${f(ppm, 1)} ppm</b>`],
      check: '換算回去：ppm × M ÷ Vm 應等於原 mg/m³ ✔',
      answer: ppm, opts: numOptions(ppm, [
        { v: mg * Vw / s.mw, type: ERR.read, why: `${tc} 應使用 ${Vm}。` },
        { v: mg * s.mw / Vm, type: ERR.concept, why: '方向做反了，這是 ppm → mg/m³ 的公式。' },
        { v: mg / s.mw, type: ERR.concept, why: '漏乘莫耳體積。' }
      ], 1, 'ppm'),
      card: { [ERR.read]: '圈溫度！25°C → 24.45；0°C → 22.4。', [ERR.concept]: '方向判斷：mg/m³ → ppm 乘莫耳體積、除分子量。' }
    };
  }
};

// ---- 化學：混合物相加效應 ----
G.chemMix = () => {
  let items, sum;
  do {
    const k = pick([2, 3]);
    items = shuffle(SUBS.slice()).slice(0, k).map(s => { const pel = pick([20, 50, 100, 200, 400]); return { n: s.n, pel, c: Math.max(1, Math.round(pel * R(10, 70) / 100)) }; });
    sum = items.reduce((a, x) => a + x.c / x.pel, 0);
  } while (Math.abs(sum - 1) < 0.08);
  const judge = v => v > 1 ? '超過容許濃度' : '未超過容許濃度';
  const ratioMax = Math.max(...items.map(x => x.c / x.pel));
  const sc = items.reduce((a, x) => a + x.c, 0), sp = items.reduce((a, x) => a + x.pel, 0);
  const ct = `Σ = ${f(sum, 2)}，${judge(sum)}`;
  return {
    unit: 'chem', level: 3, title: '化學｜混合物容許濃度（相加效應）',
    stem: `某作業場所同時測得 ${items.map(x => `${x.n} ${x.c} ppm（題目給定容許濃度 ${x.pel} ppm）`).join('、')}，假設各成分具相加效應，下列判定何者正確？`,
    known: items.map(x => `${x.n}：C = ${x.c} ppm，PEL = ${x.pel} ppm`).concat(['求：Σ(C/PEL) 與判定']),
    formula: { expr: 'Σ(Cᵢ ÷ PELᵢ) ≤ 1 → 未超過；> 1 → 超過', vars: 'Cᵢ：實測濃度；PELᵢ：該物質容許濃度（同單位）', cond: '成分具相加效應（作用於相同器官）時使用。', plain: '每個成分「用掉幾成額度」加起來，超過一整份就超標。', mnemonic: '「各除各的、加總比一」' },
    steps: items.map(x => `${x.n}：${x.c} ÷ ${x.pel} = ${f(x.c / x.pel, 3)}`).concat([`Σ = ${items.map(x => f(x.c / x.pel, 3)).join(' + ')} = <b>${f(sum, 2)}</b>`, `${f(sum, 2)} ${sum > 1 ? '> 1 → 超過' : '≤ 1 → 未超過'}容許濃度`]),
    check: '即使每一項單獨都未超標，總和仍可能大於 1 ✔',
    answer: null, opts: textOptions(ct, [
      { text: `Σ = ${f(sum, 2)}，${judge(sum > 1 ? 0 : 2)}`, type: ERR.law, why: '判定基準弄反：總和 > 1 才算超過，≤ 1 為未超過。' },
      { text: `Σ = ${f(sc / sp, 2)}，${judge(sc / sp)}`, type: ERR.concept, why: '用「總濃度 ÷ 總容許濃度」計算；應各自算 C/PEL 再相加。' },
      { text: `最大單項 = ${f(ratioMax, 2)}，${judge(ratioMax)}`, type: ERR.read, why: '只看單一物質；相加效應要把所有成分加總。' },
      { text: `Σ = ${f(sum * 1.4, 2)}，${judge(sum * 1.4)}`, type: ERR.math, why: '分項計算有誤，請逐項重算 C/PEL。' }
    ]),
    card: { [ERR.law]: '判定：Σ ≤ 1 合格、Σ > 1 超標。容許濃度數值依「勞工作業場所容許暴露標準」附表，考題會給。', [ERR.concept]: '相加效應要「各除各的」，因為各物質毒性不同，不能直接濃度相加。' }
  };
};

    known: [`流量 ${flow} L/min`, `時間 ${t} min`, `重量差 = ${f(post, 3)} − ${f(pre, 3)} = ${f(gain, 3)} mg`, '求：C（mg/m³）'],

    steps: [`重量差 = ${f(gain, 3)} mg`, `<span class="warn">⚠ 體積 = ${flow} × ${t} = ${f(flow * t, 0)} L = ${f(vol, 3)} m³（÷1000）</span>`, `C = ${f(gain, 3)} ÷ ${f(vol, 3)} = <b>${f(C, 2)} mg/m³</b>`],
    check: '作業場所粉塵多為每立方公尺數毫克以下的數量級 ✔',
    answer: C, opts: numOptions(C, [

    ], 2, 'mg/m³'),
    card: { [ERR.read]: '「前重、後重」出現 → 一定是相減。' }
  };
};

// ---- 職災統計：FR ----
G.statFR = () => {

  return {

    stem: `某事業單位勞工 ${N} 人，全年工作 ${days} 日、每日 ${hr} 小時，全年發生失能傷害 ${n} 人次，其失能傷害頻率 FR 為何？（取至小數點第二位，以下不計）`,
    known: [`N = ${N} 人`, `${days} 日 × ${hr} hr`, `失能傷害 ${n} 人次`, '求：FR'],
    formula: { expr: 'FR = 失能傷害次數 × 10⁶ ÷ 總經歷工時', vars: '總經歷工時 = 人數 × 日數 × 每日工時', cond: '官方統計 FR 取至小數第二位（第三位以下不計）。', plain: '每一百萬工時會發生幾次失能傷害。', mnemonic: '「頻率看次數，百萬工時當分母」' },
    steps: [`總經歷工時 = ${N} × ${days} × ${hr} = ${H.toLocaleString()} 小時`, `FR = ${n} × 1,000,000 ÷ ${H.toLocaleString()} = ${f(n * 1e6 / H, 4)}`, `取至小數第二位（以下不計）→ <b>${FR.toFixed(2)}</b>`],
    check: '台灣近年整體 FR 約在 1～3 之間，單一事業單位可能較高 ✔',
    answer: FR, opts: numOptions(FR, [

      { v: n * 1e6 / (N * hr * 25 * 12) , type: ERR.read, why: '自行假設每月 25 日，未依題目給定之工作日數。' },
      { v: n * 1e6 / (N * days), type: ERR.read, why: '總經歷工時漏乘每日工時。' }

// ---- 職災統計：FSI ----
G.statFSI = () => {
  const N = R(100, 800, 10), days = pick([250, 280, 300]), hr = 8, n = R(2, 8), lost = R(40, 900, 5);
  const H = N * days * hr, FR = floorD(n * 1e6 / H, 2), SR = Math.floor(lost * 1e6 / H + 1e-9);
  const FSI = floorD(Math.sqrt(FR * SR / 1000), 2);
  return {
    unit: 'stat', level: 3, title: '職災統計｜總合傷害指數 FSI',
    stem: `某事業單位勞工 ${N} 人，全年工作 ${days} 日、每日 ${hr} 小時，全年失能傷害 ${n} 人次，總損失工作日數 ${lost} 日，其總合傷害指數 FSI 為何？`,
    known: [`總經歷工時 = ${N} × ${days} × ${hr}`, `失能傷害 ${n} 人次`, `損失日數 ${lost} 日`, '求：FSI'],
    formula: { expr: 'FSI = √(FR × SR ÷ 1000)', vars: 'FR = 次數×10⁶÷工時；SR = 損失日數×10⁶÷工時', cond: 'FR 取至小數第二位、SR 取整數（以下不計）；FSI 本工具取至小數第二位，實際依題目要求。', plain: '把「多常發生」與「多嚴重」合成一個指標。', mnemonic: '「頻率乘嚴重，除千再開根」' },
    steps: [`總經歷工時 = ${H.toLocaleString()} 小時`, `FR = ${n} × 10⁶ ÷ ${H.toLocaleString()} = ${f(n * 1e6 / H, 4)} → ${FR.toFixed(2)}`, `SR = ${lost} × 10⁶ ÷ ${H.toLocaleString()} = ${f(lost * 1e6 / H, 2)} → ${SR}`, `FSI = √(${FR.toFixed(2)} × ${SR} ÷ 1000) = √${f(FR * SR / 1000, 4)} = <b>${FSI.toFixed(2)}</b>`],
    check: 'FSI 通常是小於 FR 的小數 ✔',
    answer: FSI, opts: numOptions(FSI, [
      { v: Math.sqrt(FR * SR), type: ERR.concept, why: '漏了 ÷ 1000。' },
      { v: FR * SR / 1000, type: ERR.concept, why: '忘了開根號。' },
      { v: Math.sqrt((n * 1e5 / H) * (lost * 1e5 / H) / 1000), type: ERR.concept, why: 'FR、SR 用了 10⁵，應為每百萬工時 10⁶。' }
    ], 2, ''),
    card: { [ERR.concept]: '順序：先算總經歷工時 → FR（二位小數）→ SR（整數）→ FSI。' }
  };
};

// ---- 噪音：音壓級合成 ----
G.noiseAdd = () => {
  const k = pick([2, 3]); const Ls = []; while (Ls.length < k) { const x = R(80, 100); if (!Ls.includes(x)) Ls.push(x); }
  const sum = Ls.reduce((a, L) => a + Math.pow(10, L / 10), 0), Lt = 10 * log10(sum), mx = Math.max(...Ls);
  return {
    unit: 'noise', level: 2, title: '噪音｜音壓級合成',
    stem: `某作業場所有 ${k} 部機器同時運轉，單獨運轉時在同一測點之音壓級分別為 ${Ls.join('、')} dBA，同時運轉時該點之合成音壓級約為多少 dBA？`,
    known: Ls.map((L, i) => `L${i + 1} = ${L} dBA`).concat(['求：合成音壓級 L（dBA）']),
    formula: { expr: 'L = 10 × log₁₀( Σ 10^(Lᵢ ÷ 10) )', vars: 'Lᵢ：各音源音壓級（dBA）', cond: '各音源互不相干（一般機器噪音）。', plain: 'dB 不能直接相加，要先還原成「能量」相加，再換回 dB。', mnemonic: '「先除十取十次方，加總再取 log 乘十」' },
    steps: Ls.map((L, i) => `10^(${L}/10) = ${(Math.pow(10, L / 10)).toExponential(3)}`).concat([`Σ = ${sum.toExponential(3)}`, `L = 10 × log₁₀(${sum.toExponential(3)}) = <b>${f(Lt, 1)} dBA</b>`]),
    check: `合成值應比最大的 ${mx} dBA 大，但最多大約 +${f(10 * log10(k), 1)} dB（${k} 個相同音源時）✔`,
    answer: Lt, opts: numOptions(Lt, [
      { v: Ls.reduce((a, b) => a + b, 0), type: ERR.concept, why: 'dB 是對數單位，不能直接算術相加。' },
      { v: Ls.reduce((a, b) => a + b, 0) / k, type: ERR.concept, why: '合成音壓級不是平均值，多一部機器只會更吵。' },
      { v: mx + 3 * (k - 1), type: ERR.concept, why: '「+3 dB」只適用於兩個「相同」音壓級的音源相加。' }
    ], 1, 'dBA'),
    card: { [ERR.concept]: '速記：兩音源相差 0 dB → 大的 +3；差 3 → +1.8；差 6 → +1；差 10 以上 → 幾乎不增加。' }
  };
};

// ---- 通風：外裝式氣罩控制風量 ----

    known: [`A = ${W / 100} × ${H / 100} = ${f(A, 4)} m²`, `X = ${Xm} m`, `V = ${V} m/s`, fl ? '有凸緣：係數 0.75' : '無凸緣：係數 1', '求：Q（m³/min）'],
    formula: { expr: fl ? 'Q = 60 × 0.75 × V × (10X² + A)' : 'Q = 60 × V × (10X² + A)', vars: 'V：控制風速（m/s）；X：控制點距離（m）；A：開口面積（m²）', cond: '外裝式氣罩、開口長寬比不太懸殊；凸緣可省約 25% 風量。', plain: '控制點離氣罩越遠，風量要越大，而且是距離「平方」放大。', mnemonic: '「十 X 平方加 A，凸緣打七五折」' },
    steps: [`<span class="warn">⚠ X = ${X} cm = ${Xm} m；A = ${f(A, 4)} m²</span>`, `10X² + A = 10 × ${Xm}² + ${f(A, 4)} = ${f(10 * Xm * Xm + A, 4)}`, `Q = 60 × ${k} × ${V} × ${f(10 * Xm * Xm + A, 4)} = <b>${f(Q, 2)} m³/min</b>`],
    check: '距離項 10X² 通常比開口面積 A 大很多，是風量的主因 ✔',
    answer: Q, opts: numOptions(Q, [
      { v: 60 * k * V * A, type: ERR.concept, why: '只算了 V×A（開口面風量），漏了控制點距離項 10X²。' },
      { v: 60 * (fl ? 1 : 0.75) * V * (10 * Xm * Xm + A), type: ERR.read, why: `題目是${fl ? '有凸緣，要乘 0.75' : '無凸緣，不乘 0.75'}。` },
      { v: k * V * (10 * Xm * Xm + A), type: ERR.unit, why: '算出的是 m³/s，還要 × 60。' },

    card: { [ERR.concept]: '外裝式氣罩風量隨距離平方增加：距離加倍，風量約變 4 倍。所以氣罩要盡量靠近發生源。' }
  };

// ---- 通風：每人新鮮空氣量（設施規則） ----
G.ventFresh = () => {
  const tiers = [[0, 5.7, 0.6], [5.7, 14.2, 0.4], [14.2, 28.3, 0.3], [28.3, 1e9, 0.14]];
  let N, Vol, per, ti;
  do { N = R(5, 60); Vol = R(60, 1200, 10); per = Vol / N; ti = tiers.findIndex(t => per >= t[0] && per < t[1]); }
  while (tiers.some(t => Math.abs(per - t[0]) < 0.4 && t[0] > 0));
  const rate = tiers[ti][2], Q = rate * N;
  const adj = tiers[ti + 1] ? tiers[ti + 1][2] : tiers[ti - 1][2];
  return {
    unit: 'vent', level: 3, title: '通風｜每人所需新鮮空氣量（法規）',
    stem: `某工作場所以機械通風換氣，室內氣積 ${Vol} m³，勞工 ${N} 人，依職業安全衛生設施規則，該場所每分鐘應供應之新鮮空氣量至少為多少 m³/min？`,
    known: [`氣積 ${Vol} m³`, `勞工 ${N} 人`, `每人佔有氣積 = ${Vol} ÷ ${N} = ${f(per, 2)} m³`, '求：總新鮮空氣量（m³/min）'],
    formula: { expr: '總量 = 每人所需新鮮空氣量 × 人數', vars: '每人佔有氣積：未滿 5.7 → 0.6；5.7～未滿 14.2 → 0.4；14.2～未滿 28.3 → 0.3；28.3 以上 → 0.14（m³/min·人）', cond: '職業安全衛生設施規則第 312 條（機械通風）；先算「每人佔有氣積」再查表。', plain: '人擠在小空間，每個人要分到更多新鮮空氣。', mnemonic: '「五七、十四二、二八三；零六、零四、零三、零一四」' },
    steps: [`每人氣積 = ${Vol} ÷ ${N} = ${f(per, 2)} m³ → 查表 ${rate} m³/min·人`, `總量 = ${rate} × ${N} = <b>${f(Q, 2)} m³/min</b>`],
    check: '每人佔有空間越大，每人所需新鮮空氣量越小 ✔',
    answer: Q, opts: numOptions(Q, [
      { v: adj * N, type: ERR.law, why: `查表級距錯了：每人氣積 ${f(per, 2)} m³ 對應 ${rate}，不是 ${adj}。` },
      { v: rate * N * 60, type: ERR.unit, why: '題目要每分鐘的量，不用 × 60。' },
      { v: rate, type: ERR.read, why: '只寫了每人的量，忘了乘人數。' }
    ], 2, 'm³/min'),
    card: { [ERR.law]: '表格順序是看「每人佔有氣積」，不是總氣積。先除人數再查表。（條文以現行版為準）' }
  };
};

// ---- 有機溶劑容許消費量 ----
G.solventAllow = () => {
  const kind = pick([1, 2, 3]), cf = { 1: [1, 15], 2: [2, 5], 3: [3, 2] }[kind];
  const L = R(4, 12), Wd = R(3, 8), H = pick([3, 3.5, 4, 5, 6]);
  const raw = L * Wd * H, eff = L * Wd * Math.min(H, 4), cap = Math.min(eff, 150);
  const W = cap * cf[0] / cf[1];
  const kn = ['', '一', '二', '三'][kind];
  const others = [1, 2, 3].filter(x => x !== kind).map(x => ({ x, c: { 1: [1, 15], 2: [2, 5], 3: [3, 2] }[x] }));
  return {
    unit: 'chem', level: 3, title: '化學｜有機溶劑容許消費量（法規）',
    stem: `某室內作業場所長 ${L} m、寬 ${Wd} m、高 ${H} m，使用第${kn}種有機溶劑，依有機溶劑中毒預防規則，其每小時容許消費量為多少公克？`,
    known: [`空間 ${L} × ${Wd} × ${H} m`, `第${kn}種有機溶劑：係數 ${cf[0]}/${cf[1]}`, '求：容許消費量（g）'],
    formula: { expr: `容許消費量（g）= ${cf[0]}/${cf[1]} × 作業場所氣積（m³）`, vars: '第一種 1/15；第二種 2/5；第三種 3/2', cond: '氣積不含地面 4 m 以上空間；超過 150 m³ 以 150 m³ 計（附表二）。', plain: '越毒的溶劑，同樣空間能用的量越少。', mnemonic: '「十五分之一、五分之二、二分之三；高四米、頂一五零」' },
    steps: [`<span class="warn">⚠ 高度 ${H} m ${H > 4 ? '> 4 m，只算到 4 m' : '≤ 4 m，全算'}</span>：氣積 = ${L} × ${Wd} × ${Math.min(H, 4)} = ${f(eff, 1)} m³`, `<span class="warn">⚠ ${eff > 150 ? '超過 150 m³，以 150 m³ 計' : '未超過 150 m³'}</span> → ${f(cap, 1)} m³`, `容許消費量 = ${cf[0]}/${cf[1]} × ${f(cap, 1)} = <b>${f(W, 2)} g</b>`],
    check: '一小時作業時間內消費量不超過容許消費量時，才可能適用免設置控制設備的規定 ✔',
    answer: W, opts: numOptions(W, [
      { v: Math.min(raw, 150) * cf[0] / cf[1], type: ERR.law, why: '地面 4 m 以上的空間不計入氣積。' },
      { v: eff * cf[0] / cf[1], type: ERR.law, why: '氣積超過 150 m³ 時，概以 150 m³ 計算。' },
      { v: cap * others[0].c[0] / others[0].c[1], type: ERR.law, why: `係數用成第${['', '一', '二', '三'][others[0].x]}種的 ${others[0].c[0]}/${others[0].c[1]}。` },
      { v: cap * others[1].c[0] / others[1].c[1], type: ERR.law, why: `係數用成第${['', '一', '二', '三'][others[1].x]}種的 ${others[1].c[0]}/${others[1].c[1]}。` }
    ], 2, 'g'),
    card: { [ERR.law]: '有機溶劑中毒預防規則附表二：①氣積不含地面 4 m 以上 ②超過 150 m³ 以 150 m³ 計 ③第一種 1/15、第二種 2/5、第三種 3/2。' }
  };
};

// ---- 化學：八小時日時量平均濃度 ----
G.chemTWA = () => {
  const s = pick(SUBS), total = pick([8, 8, 7, 6]);
  const k = 3; let units = [], rest = total * 2;
  for (let i = 0; i < k - 1; i++) { const u = R(1, rest - (k - 1 - i)); units.push(u); rest -= u; } units.push(rest);
  const seg = units.map(u => ({ h: u / 2, c: R(10, 150, 5) }));
  const sumCT = seg.reduce((a, x) => a + x.c * x.h, 0), TWA = sumCT / 8;
  const dists = [];
  if (total < 8) dists.push({ v: sumCT / total, type: ERR.read, why: `應除以 8 小時；未暴露的 ${8 - total} 小時濃度視為 0。` });
  dists.push({ v: seg.reduce((a, x) => a + x.c, 0) / k, type: ERR.concept, why: '各時段時間不同，要用時間加權，不能直接平均濃度。' });
  dists.push({ v: sumCT, type: ERR.concept, why: '漏了 ÷ 8：Σ(C×t) 的單位是 ppm·hr。' });
  return {
    unit: 'chem', level: 3, title: '化學｜八小時日時量平均濃度',
    stem: `某勞工一日暴露於${s.n}之情形為：${seg.map(x => `${x.c} ppm ${x.h} 小時`).join('、')}${total < 8 ? `，其餘 ${8 - total} 小時未暴露` : ''}。其八小時日時量平均濃度為多少 ppm？`,
    known: seg.map((x, i) => `C${i + 1} = ${x.c} ppm，t${i + 1} = ${x.h} hr`).concat(total < 8 ? [`未暴露 ${8 - total} hr（C = 0）`] : []).concat(['求：TWA（ppm）']),
    formula: { expr: 'TWA = Σ(Cᵢ × tᵢ) ÷ 8', vars: 'Cᵢ：各時段濃度；tᵢ：時間（hr）', cond: '八小時日時量平均，分母固定 8 小時。', plain: '把每段「濃度 × 時間」加起來，攤平到 8 小時。', mnemonic: '「濃度乘時間，加總除以八」' },
    steps: seg.map((x, i) => `C${i + 1}t${i + 1} = ${x.c} × ${x.h} = ${f(x.c * x.h, 1)}`).concat([`Σ = ${f(sumCT, 1)} ppm·hr`, `<span class="warn">⚠ 分母用 8 小時</span>`, `TWA = ${f(sumCT, 1)} ÷ 8 = <b>${f(TWA, 1)} ppm</b>`]),
    check: 'TWA 應介於最低與最高時段濃度之間（有未暴露時段時可更低）✔',
    answer: TWA, opts: numOptions(TWA, dists, 1, 'ppm'),
    card: { [ERR.read]: '「八小時日時量平均」分母一律 8；只工作 6 小時也除 8（其餘時間濃度為 0）。' }
  };
};

// ---- 溫熱：時量平均 WBGT ----
G.heatTWA = () => {
  const k = pick([2, 3]); let mins = [], rest = 60;
  for (let i = 0; i < k - 1; i++) { const m = R(10, rest - 10 * (k - 1 - i), 5); mins.push(m); rest -= m; } mins.push(rest);
  const w = mins.map(() => R(250, 330) / 10);
  const ans = w.reduce((a, x, i) => a + x * mins[i], 0) / 60;
  const swapped = w.reduce((a, x, i) => a + x * mins[(i + 1) % k], 0) / 60;
  return {
    unit: 'heat', level: 3, title: '溫熱｜時量平均 WBGT',
    stem: `某勞工一小時內在不同地點作業：${w.map((x, i) => `WBGT ${f(x, 1)}°C 處 ${mins[i]} 分鐘`).join('、')}，其時量平均 WBGT 為多少 °C？`,
    known: w.map((x, i) => `WBGT${i + 1} = ${f(x, 1)}°C，t${i + 1} = ${mins[i]} min`).concat(['求：時量平均 WBGT']),
    formula: { expr: 'WBGTₐᵥ = Σ(WBGTᵢ × tᵢ) ÷ Σtᵢ', vars: 'tᵢ：在各處停留時間', cond: '依時間加權平均；分母為總時間。', plain: '在熱的地方待越久，平均越接近那個溫度。', mnemonic: '「溫度乘分鐘，加總除總分鐘」' },
    steps: w.map((x, i) => `${f(x, 1)} × ${mins[i]} = ${f(x * mins[i], 1)}`).concat([`Σ = ${f(ans * 60, 1)}`, `÷ 60 = <b>${f(ans, 1)} °C</b>`]),
    check: '平均值介於最低與最高 WBGT 之間 ✔',
    answer: ans, opts: numOptions(ans, [
      { v: w.reduce((a, b) => a + b, 0) / k, type: ERR.concept, why: '停留時間不同，要時間加權，不能直接平均。' },
      { v: swapped, type: ERR.read, why: '溫度與時間配錯對了，請逐項對照題目。' },
      { v: ans * 60 / 8, type: ERR.read, why: '這題是一小時內的時量平均，分母是總分鐘數 60，不是 8。' }
    ], 1, '°C'),
    card: { [ERR.concept]: '所有「時量平均」都是同一個模式：Σ(值 × 時間) ÷ 總時間。' }
  };
};

// ---- 職災統計：SR ----

    unit: 'stat', level: 2, title: '職災統計｜失能傷害嚴重率 SR',
    stem: `某事業單位勞工 ${N} 人，全年工作 ${days} 日、每日 ${hr} 小時，全年失能傷害總損失工作日數 ${lost} 日，其失能傷害嚴重率 SR 為何？（小數點以下不計）`,
    known: [`總經歷工時 = ${N} × ${days} × ${hr}`, `總損失日數 = ${lost} 日`, '求：SR'],
    formula: { expr: 'SR = 總損失工作日數 × 10⁶ ÷ 總經歷工時', vars: '單位：日／百萬工時', cond: 'SR 小數點以下不計。', plain: '每一百萬工時損失了幾天工作日。', mnemonic: '「嚴重看天數」' },
    steps: [`總經歷工時 = ${H.toLocaleString()}`, `SR = ${lost} × 10⁶ ÷ ${H.toLocaleString()} = ${f(lost * 1e6 / H, 3)}`, `小數點以下不計 → <b>${SR}</b>`],
    check: 'SR 通常是比 FR 大很多的整數 ✔',
    answer: SR, opts: numOptions(SR, [
      { v: Math.floor(lost * 1e5 / H), type: ERR.concept, why: '要 × 10⁶（每百萬工時）。' },
      { v: Math.floor(lost * 1e6 / (N * days)), type: ERR.read, why: '總經歷工時漏乘每日工時。' },
      { v: Math.round(lost * 1e6 / H) === SR ? SR + 1 : Math.round(lost * 1e6 / H), type: ERR.express, why: 'SR 規定小數點以下不計（直接捨去），不是四捨五入。' }
    ], 0, ''),
    card: { [ERR.express]: '官方統計：FR 小數點以下三位不計（留 2 位）、SR 小數點以下不計，都是直接捨去。' }
  };
};

G.liftSling = () => {
  const W = pick([1, 1.5, 2, 3, 4, 5]), n = pick([2, 2, 4]), th = pick([30, 60, 90, 120]);
  const T = W / (n * Math.cos(th / 2 * Math.PI / 180));
  return {
    unit: 'mech', level: 3, title: '吊掛｜吊角與吊索張力',
    stem: `以 ${n} 條吊索等長對稱吊掛重 ${W} 公噸之物件，吊索夾角（吊角）為 ${th}°，每條吊索承受之張力約為多少公噸？`,
    known: [`W = ${W} t`, `n = ${n} 條`, `吊角 θ = ${th}°（兩吊索間的夾角）`, '求：每條吊索張力 T'],
    formula: { expr: 'T = W ÷ (n × cos(θ/2))', vars: 'θ：吊索間夾角（吊角）；若題目給吊索與水平面夾角 α，則 T = W ÷ (n × sin α)', cond: '對稱吊掛、各吊索平均受力；4 條吊索實務上常只以 2 條受力估算（依題目）。', plain: '吊索張得越開，斜拉的力越大，每條要出的力就越多。', mnemonic: '「重量除條數，再除 cos 半吊角」' },
    steps: [`θ/2 = ${th / 2}°，cos ${th / 2}° = ${f(Math.cos(th / 2 * Math.PI / 180), 4)}`, `T = ${W} ÷ (${n} × ${f(Math.cos(th / 2 * Math.PI / 180), 4)}) = <b>${f(T, 2)} t</b>`],
    check: `吊角 ${th}° 時每條張力是「平分重量」${f(W / n, 2)} t 的 ${f(1 / Math.cos(th / 2 * Math.PI / 180), 2)} 倍；吊角越大倍數越高（120° 時為 2 倍）✔`,
    answer: T, opts: numOptions(T, [
      { v: W / n, type: ERR.concept, why: '只把重量平分，沒有考慮吊角造成的斜拉增加。' },
      { v: Math.cos(th * Math.PI / 180) > 0.2 ? W / (n * Math.cos(th * Math.PI / 180)) : W / (n * Math.sin(th / 2 * Math.PI / 180)), type: ERR.concept, why: '要用「半吊角」θ/2，不是整個吊角。' },
      { v: W / (n * Math.sin(th / 2 * Math.PI / 180)), type: ERR.math, why: 'θ/2 是和「鉛直線」的夾角，要用 cos，不是 sin。' },
      { v: W * Math.cos(th / 2 * Math.PI / 180) / n, type: ERR.concept, why: '應該「除以」cos，張力一定大於平分重量。' }
    ], 2, 't'),
    card: { [ERR.concept]: '吊角 60° → ×1.15；90° → ×1.41；120° → ×2。吊角越大越危險，實務上吊角宜控制在 60° 以內（依現場吊掛作業規定）。' }
  };
};

G.craneBoom = () => {
  const L = pick([20, 25, 30, 35, 40]), th = pick([50, 55, 60, 65, 70, 75]), h0 = pick([1.5, 2, 2.5]);
  const rad = th * Math.PI / 180, H = h0 + L * Math.sin(rad), Rr = L * Math.cos(rad);
  const kv = pick(['11.4', '22.8']), safe = pick([3, 4, 5]);
  const line = Math.round((H + pick([1, 2, 2.5, 3.5, 5, 7])) * 2) / 2;
  const clr = line - H;
  const ok = clr >= safe;
  const ct = `吊桿頂端高約 ${f(H, 1)} m，距電線 ${f(clr, 1)} m，${ok ? '符合' : '不足'}安全距離`;
  return {
    unit: 'mech', level: 4, title: '起重機｜吊桿仰角與高壓線距離',
    stem: `移動式起重機吊桿長 ${L} m，吊桿底部支點離地 ${h0} m，以仰角 ${th}° 作業（全伸吊桿）。吊桿頂端正上方有 ${kv} kV 架空高壓線，離地 ${f(line, 1)} m，題目給定應保持安全距離 ${safe} m。下列判斷何者正確？`,
    known: [`L = ${L} m，仰角 θ = ${th}°`, `支點高 h₀ = ${h0} m`, `電線高 ${f(line, 1)} m`, `應保持 ${safe} m（題目給定）`, '求：吊桿頂端高度、與電線距離、是否足夠'],
    formula: { expr: '頂端高度 H = h₀ + L × sin θ；作業半徑 R = L × cos θ；淨距 = 電線高度 − H', vars: 'θ：吊桿與水平面夾角（仰角）', cond: '未計鋼索、吊鉤與吊物擺動，實際淨距更小；安全距離依台電與法規要求。', plain: '仰角越大，吊桿越直、頂端越高，越靠近上方電線；仰角小則伸得遠但半徑大、容量下降。', mnemonic: '「高看 sin、遠看 cos」' },
    steps: [`sin ${th}° = ${f(Math.sin(rad), 4)} → L × sin θ = ${f(L * Math.sin(rad), 2)} m`, `H = ${h0} + ${f(L * Math.sin(rad), 2)} = ${f(H, 2)} m`, `淨距 = ${f(line, 1)} − ${f(H, 2)} = ${f(clr, 2)} m ${ok ? '≥' : '<'} ${safe} m → <b>${ok ? '符合' : '不足'}</b>`, `（作業半徑 R = ${L} × cos ${th}° = ${f(Rr, 1)} m）`],
    check: `${ok ? '即使距離足夠，仍應派監視人員並考慮吊物擺動' : '距離不足：應降低仰角／改變位置、申請停電或裝設防護線管，並派監視人員'} ✔`,
    answer: null, opts: textOptions(ct, [
      { text: `吊桿頂端高約 ${f(L * Math.sin(rad), 1)} m，距電線 ${f(line - L * Math.sin(rad), 1)} m，${line - L * Math.sin(rad) >= safe ? '符合' : '不足'}安全距離`, type: ERR.read, why: '漏加吊桿底部支點離地高度 h₀。' },
      { text: `吊桿頂端高約 ${f(h0 + L * Math.cos(rad), 1)} m，距電線 ${f(line - h0 - L * Math.cos(rad), 1)} m，${line - h0 - L * Math.cos(rad) >= safe ? '符合' : '不足'}安全距離`, type: ERR.concept, why: '高度要用 sin θ；L × cos θ 是作業半徑（水平距離）。' },
      { text: `吊桿頂端高約 ${f(H, 1)} m，距電線 ${f(clr, 1)} m，${ok ? '不足' : '符合'}安全距離`, type: ERR.law, why: `淨距 ${f(clr, 1)} m 與安全距離 ${safe} m 比較判斷錯誤。` },
      { text: `吊桿頂端高約 ${f(H * 1.2, 1)} m，距電線 ${f(line - H * 1.2, 1)} m，${line - H * 1.2 >= safe ? '符合' : '不足'}安全距離`, type: ERR.math, why: '三角函數計算有誤，確認計算機在「度（DEG）」模式。' }
    ]),
    card: { [ERR.concept]: '仰角 θ：高度 = L sin θ、半徑 = L cos θ。仰角越高越接近上方電線，仰角越低則作業半徑越大、額定荷重越小。', [ERR.math]: '計算機要切到 DEG（度），不是 RAD（弧度）。' }
  };
};

G.shock = (o = {}) => {
  const cases = [
    { v: 110, label: '單相 110 V 漏電外殼', phase: false },
    { v: 220, label: '220 V 電動機具漏電', phase: false },
    { v: 11400, label: '11.4 kV 架空線（三相，線電壓）', phase: true },
    { v: 22800, label: '22.8 kV 架空線（三相，線電壓）', phase: true }
  ];
  const c = pick(o.phase !== undefined ? cases.filter(x => x.phase === o.phase) : cases), Rb = pick([500, 1000, 2000, 3000]);
  const Vg = c.phase ? c.v / Math.sqrt(3) : c.v, I = Vg / Rb * 1000;
  const lvl = I >= 100 ? '可能引起心室顫動（致命）' : I >= 23 ? '呼吸困難' : I >= 16 ? '肌肉無法自由活動、難以脫離' : I >= 1 ? '有刺痛感' : '幾乎無感';
  const dists = [
    { v: c.v / Rb, type: ERR.unit, why: 'V ÷ Ω 算出的是安培（A），要 × 1000 才是 mA。' },
    { v: c.v * Rb / 1000, type: ERR.concept, why: '歐姆定律是 I = V ÷ R，不是 V × R。' }
  ];
  if (c.phase) dists.unshift({ v: c.v / Rb * 1000, type: ERR.concept, why: '人站在地面接觸單一相線，承受的是「對地電壓」＝線電壓 ÷ √3，不是線電壓。' });
  else dists.push({ v: Vg / (Rb * 2) * 1000, type: ERR.math, why: '電阻代入有誤，請直接以題目給的人體電阻計算。' });
  return {
    unit: 'mech', level: c.phase ? 3 : 2, title: '電氣｜感電通過人體電流', keep: { phase: c.phase },
    stem: `勞工站在地面，因${c.label}而感電，假設人體電阻（含接觸電阻）為 ${Rb} Ω，通過人體之電流約為多少 mA？`,
    known: [`電壓 ${c.v.toLocaleString()} V${c.phase ? `（三相線電壓，對地電壓 = ${c.v.toLocaleString()} ÷ √3 = ${f(Vg, 0)} V）` : '（對地）'}`, `人體電阻 R = ${Rb} Ω`, '求：I（mA）'],
    formula: { expr: 'I = V ÷ R（三相系統接觸單一相：V = 線電壓 ÷ √3）', vars: 'I：安培（×1000 = mA）；R：人體＋接觸電阻（Ω）', cond: '簡化估算；實際電流受鞋、地面、接觸面積與潮濕程度影響，潮濕時電阻大幅下降。', plain: '電壓越高、身體越濕（電阻越低），通過的電流越大。', mnemonic: '「電流＝電壓除電阻，A 換 mA 乘一千」' },
    steps: (c.phase ? [`<span class="warn">⚠ 對地電壓 = ${c.v.toLocaleString()} ÷ 1.732 = ${f(Vg, 0)} V</span>`] : []).concat([`I = ${f(Vg, 0)} ÷ ${Rb} = ${f(Vg / Rb, 3)} A`, `<span class="warn">⚠ × 1000 → mA</span>`, `I ≈ <b>${f(I, 0)} mA</b> → ${lvl}`]),
    check: `參考：約 1 mA 有刺痛感、約 16 mA 肌肉無法自由活動、約 23 mA 呼吸困難、約 100 mA 可能心室顫動（60 Hz、成年男性參考值）。本題 ${f(I, 0)} mA → ${lvl} ✔`,
    answer: I, opts: numOptions(I, dists, 0, 'mA'),
    card: { [ERR.concept]: '三相系統：人站在地上碰到一條相線，承受「相電壓（對地電壓）」＝ 線電壓 ÷ √3。22.8 kV → 約 13.2 kV；11.4 kV → 約 6.6 kV。', [ERR.unit]: '1 A = 1000 mA。感電門檻多以 mA 表示，漏電斷路器高敏感度型為 30 mA 以下、0.1 秒內動作。' }
  };
};

  { q: '依職業安全衛生設施規則，「高壓」係指何種電壓範圍？', a: '超過 600 伏特至 22,800 伏特', d: [['超過 220 伏特至 600 伏特', ERR.law, '600 V 以下為低壓。'], ['超過 22,800 伏特', ERR.law, '超過 22,800 V 為特高壓。'], ['超過 110 伏特至 11,400 伏特', ERR.law, '非法規定義。']], ex: '設施規則第 3 條：特高壓超過 22,800 V；高壓超過 600 V 至 22,800 V；低壓 600 V 以下。' },
  { q: '移動式起重機在架空高壓線附近吊掛作業，下列措施何者最優先、最根本？', a: '協調台電停電或移置架空電路', d: [['作業人員戴絕緣手套即可', ERR.concept, '個人防護具是最後一道防線。'], ['加快作業速度縮短暴露時間', ERR.concept, '趕工反而增加誤觸風險。'], ['請吊車司機自行注意', ERR.concept, '司機視線受限，應派監視人員。']], ex: '控制層級：消除（停電、移線）優先；其次裝設防護線管（向台電申請）、設置屏障護圍與警告標示、限制吊桿仰角與作業範圍，並派監視人員；最後才是絕緣防護具。' },
  { q: '吊車吊桿誤觸高壓線時，車上的操作手最適當的做法是？', a: '留在駕駛室內，設法使吊桿脫離電線，並警告他人勿靠近車體', d: [['立刻跳下車跑開', ERR.concept, '若必須離開，應雙腳併攏跳離、不可同時接觸車體與地面，並以小步跳躍遠離（跨步電壓）。'], ['下車用手推開吊鉤', ERR.concept, '車體與吊鉤都帶電，接觸即感電。'], ['請地面人員扶住車體穩定', ERR.concept, '地面人員接觸車體會成為電流路徑。']], ex: '車體帶電時留在車內相對安全；地面人員應遠離車體及吊物、通知台電斷電。若因起火須離開，雙腳併攏跳離，落地後以小步或單腳跳離，避免跨步電壓。' },
  { q: '60 Hz 交流電通過成年男性人體時，約多少電流就可能引起心室顫動？', a: '約 100 mA', d: [['約 1 mA', ERR.concept, '約 1 mA 只是刺痛感。'], ['約 16 mA', ERR.concept, '約 16 mA 是肌肉無法自由活動。'], ['約 10 A', ERR.concept, '遠低於此值就可能致命。']], ex: '參考值：約 1 mA 刺痛、16 mA 肌肉無法自由活動、23 mA 呼吸困難、100 mA 可能心室顫動。' },
  { q: '雙吊索對稱吊掛同一物件，吊角由 60° 增加為 120° 時，每條吊索張力約變為原來的幾倍？', a: '約 1.73 倍', d: [['不變', ERR.concept, '吊角越大，張力越大。'], ['2 倍', ERR.math, '120° 時是「平分重量」的 2 倍；60° 時是 1.155 倍，比值約 1.73。'], ['約 0.58 倍', ERR.concept, '方向相反。']], ex: 'T = W ÷ (n cos(θ/2))：60° → W/(2×0.866)；120° → W/(2×0.5)；比值 0.866/0.5 ≈ 1.73。' }

  { q: '失能傷害嚴重率（SR）的分子為何？', a: '總損失工作日數', d: [['失能傷害次數', ERR.concept, '次數是 FR 的分子。'], ['職業災害人數', ERR.concept, '人數用於年千人率。'], ['總經歷工時', ERR.concept, '總經歷工時是分母。']], ex: 'SR = 總損失工作日數 × 10⁶ ÷ 總經歷工時；FR = 失能傷害次數 × 10⁶ ÷ 總經歷工時。' },
  { q: '控制從固定點源逸散的高毒性有害物，下列何者最適當？', a: '局部排氣裝置', d: [['整體換氣（稀釋通風）', ERR.concept, '整體換氣適合低毒性、發生量小且分散的情況。'], ['打開窗戶自然通風', ERR.concept, '自然通風無法穩定控制。'], ['只發給口罩', ERR.concept, '個人防護具是最後一道防線。']], ex: '高毒性、點源、發生量大 → 局部排氣；低毒性、分散、發生量小 → 整體換氣。' },

const KEY = 'oshB_tutor_v1';
const SPONSOR = 'https://portaly.cc/o4444/support';
let S = load();
function blank() { return { units: {}, gens: {}, errs: {}, variant: { n: 0, c: 0 }, total: { n: 0, c: 0 }, drill: { n: 0, c: 0 } }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.units) { s.drill = s.drill || { n: 0, c: 0 }; return s; } } catch (e) { } return blank(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function rec(q, ok, type, flags) {
  flags = flags || {};
  const u = S.units[q.unit] = S.units[q.unit] || { n: 0, c: 0 }; u.n++; if (ok) u.c++;
  const g = S.gens[q.gen] = S.gens[q.gen] || { n: 0, c: 0, w: 0, st: 0, t: q.title, et: {} };
  g.n++; g.t = q.title; g.et = g.et || {};
  if (ok) { g.c++; g.st = (g.st || 0) + 1; } else { g.w = (g.w || 0) + 1; g.st = 0; if (type) g.et[type] = (g.et[type] || 0) + 1; }
  S.total.n++; if (ok) S.total.c++;
  if (!ok && type) S.errs[type] = (S.errs[type] || 0) + 1;
  if (flags.variant) { S.variant.n++; if (ok) S.variant.c++; }
  if (flags.drill) { S.drill.n++; if (ok) S.drill.c++; }
  save();
}
const $ = s => document.querySelector(s);
const L = 'ABCD';
let cur = null, curUnit = null, isVariant = false, mock = null, drill = null;

// 每個考點會出現的錯誤類型（抽樣建立）
const TYPEMAP = {};
for (const g of Object.keys(G)) { const set = new Set(); for (let i = 0; i < 12; i++) G[g]().opts.forEach(o => o.type && set.add(o.type)); TYPEMAP[g] = set; }
const ALLGENS = Object.values(UNITS).flatMap(u => u.gens);
const genTitle = g => (S.gens[g] && S.gens[g].t) || G[g]().title;

// ---------- 安安老師 ----------
let tutorMin = false;
// v3.1：每次進站都顯示安安老師與對話框（不沿用上次收合狀態）
function say(pose, html, acts) {
  const t = $('#tutor'), img = $('#timg'); t.classList.remove('cxon');
  if (IMG[pose] && img.dataset.p !== pose) { img.src = IMG[pose]; img.dataset.p = pose; }
  $('#tbub').innerHTML = `<button class="x" onclick="tutorToggle()" aria-label="收合">×</button><b class="nm">安安老師</b>${html}${acts && acts.length ? `<div class="act">${acts.map(a => `<button onclick="${a[1]}">${a[0]}</button>`).join('')}</div>` : ''}`;
  $('#tbub').style.animation = 'none'; void $('#tbub').offsetWidth; $('#tbub').style.animation = '';
  t.classList.toggle('min', tutorMin);
  clearTimeout(say._t);
  if (!tutorMin && window.innerWidth < 700) say._t = setTimeout(() => t.classList.add('min'), 12000);
}
function tutorToggle() { clearTimeout(say._t); tutorMin = !$('#tutor').classList.contains('min'); $('#tutor').classList.toggle('min', tutorMin); }
document.addEventListener('DOMContentLoaded', () => { }); // placeholder
setTimeout(() => { const im = $('#timg'); if (im) im.onclick = tutorToggle; }, 0);

function setNav(v) { document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function go(v) { mock = null; drill = null; if (v === 'home') home(); else if (v === 'rec') records(); else if (v === 'tools') { toolsView(); return; } window.scrollTo(0, 0); }
function pct(o) { return o && o.n ? Math.round(o.c / o.n * 100) : null; }

function weakGens() {
  return Object.entries(S.gens).filter(([k, g]) => G[k] && g.w > 0 && (g.st || 0) < 2)
    .sort((a, b) => (b[1].w - (b[1].st || 0)) - (a[1].w - (a[1].st || 0)) || a[1].c / a[1].n - b[1].c / b[1].n).map(x => x[0]);
}
function topErr() { const es = Object.entries(S.errs).sort((a, b) => b[1] - a[1]); return es.length ? es[0] : null; }
function sponsor() { return `<div class="spon"><p>☕ <b>覺得好用？請作者喝杯咖啡</b><br><small style="color:var(--mute)">這個陪考網頁免費使用，贊助能支持持續新增題目與功能。</small></p><a href="${SPONSOR}" target="_blank" rel="noopener noreferrer sponsored">贊助支持</a></div>`; }

function home() {
  setNav('home');
  const wk = weakGens(), nGen = ALLGENS.length, nCon = CONCEPTS.length;
  let h = `<h1>今天想練哪一單元？</h1><p class="sub">${nGen} 種題型（計算題數據每次隨機、觀念題 ${nCon} 題）。答錯會找出錯在哪，再出一題同考點的變形題給你驗證。</p><div class="grid">`;
  if (wk.length) h += `<button class="ucard" style="border:2px solid #7a3cd6" onclick="startDrill()"><span class="ic">🎯</span><b>錯題特訓</b><small>${wk.length} 個考點待加強 · 連續答對 2 次才算精熟</small></button>`;

function buildDrill(gens, label) {

  for (let r = 0; r < 2; r++) for (const g of base) q.push(g);
  if (q.length < 6) while (q.length < 6 && base.length) q.push(pick(base));
  return { queue: q, i: 0, ok: 0, n: 0, label, start: {} };
}
function startDrill(gens) {

  mock = null; drill = buildDrill(gens, '錯題特訓'); drillQ();
}
function startDrillType(type) {

  const gens = shuffle(cand.slice()).sort((a, b) => sc(b) - sc(a)).slice(0, 5);

}

}

  h += `<div class="row">${weakGens().length ? `<button class="btn pri" onclick="startDrill()">再來一回特訓</button>` : ''}<button class="btn" onclick="startMock()">模擬考</button><button class="btn ghost" onclick="go('home')">回首頁</button></div>` + sponsor() + foot();

// ---------- 考試用計算機（v6，計算題下方） ----------
function cxAway() { const t = document.getElementById('tutor'); if (t) { t.classList.add('min', 'cxon'); clearTimeout(say._t); } }
let CX = { ans: 0, deg: true, hist: '' };
const CX_TOUCH = (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
function cxEval(src) {
  const s = src.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-').replace(/√/g, 'sqrt').replace(/π/g, 'pi').replace(/\s+/g, '');
  const toks = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    const m = /^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/.exec(s.slice(i));
    if (m) { toks.push({ t: 'n', v: parseFloat(m[0].replace('E', 'e')) }); i += m[0].length; continue; }
    const w = /^(sqrt|sin|cos|tan|log|ln|pi|Ans)/.exec(s.slice(i));
    if (w) { const n = w[0]; if (n === 'pi') toks.push({ t: 'n', v: Math.PI }); else if (n === 'Ans') toks.push({ t: 'n', v: CX.ans }); else toks.push({ t: 'f', v: n }); i += n.length; continue; }
    if ('+-*/^()'.includes(c)) { toks.push({ t: c }); i++; continue; }
    throw new Error('bad');
  }
  // 隱含乘法：2π、2(3)、)(、3sin(
  const T = [];
  toks.forEach((k, j) => { const p = T[T.length - 1]; if (p && (p.t === 'n' || p.t === ')') && (k.t === 'n' || k.t === '(' || k.t === 'f')) T.push({ t: '*' }); T.push(k); });
  let depth = 0; T.forEach(k => { if (k.t === '(') depth++; if (k.t === ')') depth--; }); while (depth-- > 0) T.push({ t: ')' });
  let p = 0; const peek = () => T[p], eat = t => { if (!T[p] || T[p].t !== t) throw new Error('bad'); p++; };
  const rad = x => CX.deg ? x * Math.PI / 180 : x;
  const F = { sqrt: Math.sqrt, sin: x => Math.sin(rad(x)), cos: x => Math.cos(rad(x)), tan: x => Math.tan(rad(x)), log: Math.log10, ln: Math.log };
  function expr() { let v = term(); while (peek() && (peek().t === '+' || peek().t === '-')) { const o = T[p++].t; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function term() { let v = unary(); while (peek() && (peek().t === '*' || peek().t === '/')) { const o = T[p++].t; const r = unary(); v = o === '*' ? v * r : v / r; } return v; }
  function unary() { if (peek() && peek().t === '-') { p++; return -unary(); } if (peek() && peek().t === '+') { p++; return unary(); } return power(); }
  function power() { const b = primary(); if (peek() && peek().t === '^') { p++; return Math.pow(b, unary()); } return b; }
  function primary() { const k = peek(); if (!k) throw new Error('bad'); if (k.t === 'n') { p++; return k.v; } if (k.t === 'f') { p++; eat('('); const v = expr(); eat(')'); return F[k.v](v); } if (k.t === '(') { p++; const v = expr(); eat(')'); return v; } throw new Error('bad'); }
