<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WordUnlock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d4ed8">
<title>WordUnlock｜每日解鎖英文</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--text:#111827;--sub:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-ink:#fff;--good:#16a34a;--bad:#dc2626;--chip:#eef2ff;
  --radius:16px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  body[data-theme="auto"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#9ca3af;--line:#2c2c2e;--accent:#4f9dff;--chip:#1e2a44}
}
body[data-theme="minimalWhite"]{--bg:#fafafa;--card:#fff;--text:#111;--sub:#777;--line:#eee;--accent:#111;--accent-ink:#fff;--chip:#f1f1f1}
body[data-theme="darkTech"]{--bg:#070b14;--card:#0f1726;--text:#e8f1ff;--sub:#8ea3c2;--line:#1d2a40;--accent:#4cd9ff;--accent-ink:#00121a;--chip:#13233a}
body[data-theme="blackGold"]{--bg:#0b0b0b;--card:#161616;--text:#eecd80;--sub:#a3a3a3;--line:#2a2a2a;--accent:#d4a94a;--accent-ink:#111;--chip:#241f14}
body[data-theme="lightReading"]{--bg:#f6f1e3;--card:#fbf7ec;--text:#33291f;--sub:#76675a;--line:#e6dcc5;--accent:#8c5a26;--accent-ink:#fff;--chip:#efe5cf}
body[data-theme="blueStudy"]{--bg:#eaf1ff;--card:#fff;--text:#0f2a5c;--sub:#5470a0;--line:#d5e2fb;--accent:#1d4ed8;--accent-ink:#fff;--chip:#dce8ff}
body[data-theme="translucent"]{--bg:linear-gradient(160deg,#dfe9f3,#f7f3ff);--card:rgba(255,255,255,.55);--text:#1f2937;--sub:#6b7280;--line:rgba(0,0,0,.08);--accent:#4f46e5;--accent-ink:#fff;--chip:rgba(255,255,255,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding-bottom:84px}
body[data-theme="translucent"] .card{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
header{padding:18px 18px 6px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px;margin:0;letter-spacing:.2px}
header .sync{font-size:11px;color:var(--sub)}
main{padding:6px 14px 20px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:10px 0;border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--sub);font-size:13px}
.small{font-size:12px}
button{font-family:inherit;font-size:15px;border:0;border-radius:12px;padding:11px 14px;background:var(--chip);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button.icon{padding:8px 10px;font-size:14px}
button:active{transform:scale(.97)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.grow>button{flex:1}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px;margin:2px 4px 2px 0;color:var(--text)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.word-big{font-size:34px;font-weight:800;letter-spacing:.3px;line-height:1.1;word-break:break-word}
.ipa{color:var(--sub);font-size:14px;margin-top:4px}
.zh{font-size:18px;margin-top:8px}
.ex{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:14px;line-height:1.5}
.ex i{display:block}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);gap:10px}
.list-item:last-child{border-bottom:0}
.list-item .w{font-weight:700;font-size:16px}
.list-item .z{color:var(--sub);font-size:13px;margin-top:2px}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.badge.now{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:18px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--chip);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .bar>div{width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.bars .bar>span{font-size:10px;color:var(--sub)}
.lockprev{border-radius:20px;padding:14px;background:linear-gradient(160deg,#1f2937,#0f172a);color:#fff;text-align:center}
.lockprev .t{font-size:44px;font-weight:300;letter-spacing:1px}
.lockprev .d{font-size:13px;opacity:.8}
.lockprev .w{margin:12px auto 0;max-width:260px;text-align:left;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 12px}
.lockprev .w b{font-size:16px}
.lockprev .w div{font-size:12px;opacity:.9}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;background:transparent;padding:6px 0;font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:14px}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff}
select,input[type=time],textarea{font-family:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
textarea{width:100%;min-height:90px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.setrow:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.wall img{width:100%;border-radius:18px;display:block;border:1px solid var(--line)}
.note{font-size:13px;line-height:1.6;color:var(--sub)}
.note b{color:var(--text)}
.hide{display:none!important}
.center{text-align:center}
</style>
</head>

const WORDS = RAW.map(r=>({id:r[0],w:r[0],pos:r[1],ipa:r[2],ipaUK:r[3],kk:r[4],zh:r[5],defEn:r[6],defZh:r[7],ex:r[8],exZh:r[9],syn:r[10],ant:r[11],lv:r[12],t:r[13]}));
const BY_ID = Object.fromEntries(WORDS.map(w=>[w.id,w]));
const POS = {noun:["Noun","名詞"],verb:["Verb","動詞"],adjective:["Adjective","形容詞"],adverb:["Adverb","副詞"],phrase:["Phrase","片語"],phrasalVerb:["Phrasal Verb","動詞片語"]};
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const LEVEL_NAMES = {A1:"初級入門",A2:"基礎英文",B1:"中級英文",B2:"中高級英文",C1:"高級英文",C2:"精通英文"};
const TOPICS = {daily:"日常生活",business:"商業英文",travel:"旅遊英文",workplace:"職場英文",technology:"科技英文",medical:"醫療英文",dining:"餐飲英文",emotion:"情緒與心理",academic:"學術英文",toeic:"TOEIC 多益",ielts:"IELTS 雅思",toefl:"TOEFL 托福",gre:"GRE 進階",phrases:"常見片語",businessConversation:"商務會話"};
const THEMES = {auto:"跟隨系統",minimalWhite:"極簡白色",darkTech:"深色科技風",blackGold:"黑金質感",lightReading:"淺色閱讀風",blueStudy:"藍色學習風",translucent:"透明感簡約風"};
const ROTATIONS = {daily:["每日更新",0],m30:["每 30 分鐘",1800],h1:["每小時",3600],h3:["每 3 小時",10800],manual:["手動切換",0]};

/* ====================== 狀態與儲存 ====================== */
const LS_KEY = "wordunlock.v1";
function defaultState(){return {v:1,onboarded:false,level:"B1",topics:[],goal:5,accent:"en-US",slow:false,theme:"auto",rotation:"h1",manualOffset:0,cards:{},plans:{},daily:{},updatedAt:0};}
let S = defaultState();
function sanitize(o){
  const d = defaultState(); if(!o || typeof o!=="object") return d;
  const s = Object.assign(d, o);
  if(!LEVELS.includes(s.level)) s.level="B1";
  if(!THEMES[s.theme]) s.theme="auto";
  if(!ROTATIONS[s.rotation]) s.rotation="h1";
  if(!["en-US","en-GB"].includes(s.accent)) s.accent="en-US";
  s.topics = Array.isArray(s.topics)? s.topics.filter(t=>TOPICS[t]) : [];
  s.goal = [3,5,10].includes(+s.goal)? +s.goal : 5;
  for(const k of ["cards","plans","daily"]) if(!s[k]||typeof s[k]!=="object") s[k]={};
  for(const id of Object.keys(s.cards)) if(!BY_ID[id]) delete s.cards[id];
  return s;
}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(j&&j.v===1) S=sanitize(j);}catch(e){}}
let saveTimer=null; const cloud={ref:null,writing:false,pending:false};
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(pushCloud,1200);
}
async function pushCloud(){
  if(!cloud.ref) return;
  if(cloud.writing){cloud.pending=true;return;}
  cloud.writing=true;
  try{await cloud.ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt}); setSync("已雲端備份");}
  catch(e){ setSync(e&&e.code==="quota_exceeded"?"雲端空間已滿，資料存於此裝置":"雲端暫時無法同步，資料存於此裝置"); }
  cloud.writing=false;
  if(cloud.pending){cloud.pending=false;pushCloud();}
}
function setSync(t){document.getElementById("sync").textContent=t;}
async function initCloud(){
  if(!(window.claude && typeof window.claude.use==="function")){setSync("儲存在此裝置");return;}
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){setSync("儲存在此裝置");return;}
    const id=await user.id(); if(!id){setSync("儲存在此裝置");return;}
    cloud.ref=db.doc("data/users/"+id+"/state");
    const snap=await Promise.race([cloud.ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
    if(snap.exists){
      const d=snap.data()||{};
      if((d.updatedAt||0)>S.updatedAt){
        try{S=sanitize(JSON.parse(d.json)); localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
        applyTheme(); render();
      }else if(S.updatedAt>(d.updatedAt||0)) pushCloud();
    }else if(S.onboarded) pushCloud();
    setSync("已雲端備份");
  }catch(e){setSync("雲端暫時無法連線，資料存於此裝置");}
}

/* ====================== 工具 ====================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
function dayKey(d=new Date()){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function keyToDate(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(key,n){const [y,m,d]=key.split("-").map(Number);const t=new Date(y,m-1,d+n);return dayKey(t);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200);}
function posEn(w){return (POS[w.pos]||[w.pos])[0];}
function posZh(w){return (POS[w.pos]||[,w.pos])[1];}
function stat(key=dayKey()){return S.daily[key]||(S.daily[key]={n:0,r:0,c:0});}

/* ====================== 今日單字安排 ====================== */
function todayWords(){
  const key=dayKey();
  if(Array.isArray(S.plans[key])){
    const ws=S.plans[key].map(id=>BY_ID[id]).filter(Boolean);
    if(ws.length) return ws;
  }
  const lv=LEVELS.indexOf(S.level);
  let pool=WORDS.filter(w=>!S.topics.length||w.t.some(t=>S.topics.includes(t)));
  if(!pool.length) pool=WORDS.slice();
  const fresh=pool.filter(w=>!isLearned(w.id)).sort((a,b)=>{
    const da=Math.abs(LEVELS.indexOf(a.lv)-lv), db=Math.abs(LEVELS.indexOf(b.lv)-lv);
    return da!==db? da-db : hash(a.id+key)-hash(b.id+key);
  });
  let pick=fresh.slice(0,S.goal);
  if(pick.length<S.goal){
    const rest=pool.filter(w=>!pick.includes(w)).sort((a,b)=>(S.cards[a.id]?.last||0)-(S.cards[b.id]?.last||0));
    pick=pick.concat(rest.slice(0,S.goal-pick.length));
  }
  S.plans[key]=pick.map(w=>w.id);
  const cutoff=addDays(key,-60);
  for(const k of Object.keys(S.plans)) if(k<cutoff) delete S.plans[k];
  save();
  return pick;
}
function resetTodayPlanIfUntouched(){
  const key=dayKey(), ids=S.plans[key]||[];
  if(!ids.some(id=>S.cards[id]&&S.cards[id].first===key)) delete S.plans[key];
}
function rotationIndex(count,date=new Date()){
  if(!count) return 0;
  const step=ROTATIONS[S.rotation][1];
  let base=0;
  if(step){const sod=new Date(date);sod.setHours(0,0,0,0);base=Math.floor((date-sod)/1000/step);}
  const r=(base+S.manualOffset)%count; return r<0?r+count:r;
}

/* ====================== SM-2 間隔重複 ====================== */
const RATINGS={again:0,hard:3,good:4,easy:5};
function sm2(c,rating){
  const q=RATINGS[rating];
  if(rating==="again"){c.rep=0;c.iv=1;c.lap=(c.lap||0)+1;}
  else{ c.iv = c.rep===0?1 : c.rep===1?6 : Math.round(c.iv*c.ef); c.rep+=1; }
  c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  c.st = c.iv>=21?"mastered": c.rep>=2?"review":"learning";
  return c;
}
function rate(id,rating){
  const key=dayKey(); let c=S.cards[id]; const st=stat(key);
  if(!c||!c.first){const fav=!!(c&&c.fav);c=S.cards[id]={ef:2.5,iv:0,rep:0,lap:0,due:key,first:key,last:0,fav,wrong:0,st:"learning"}; st.n++;}
  else st.r++;
  sm2(c,rating);
  if(rating==="again") c.wrong=(c.wrong||0)+1; else st.c++;
  c.due=addDays(key,c.iv); c.last=Date.now();
  save();
}
function toggleFav(id){
  let c=S.cards[id];
  if(!c){ // 收藏但尚未學習：建立卡片但不計入學習數
    c=S.cards[id]={ef:2.5,iv:0,rep:0,lap:0,due:dayKey(),first:null,last:0,fav:false,wrong:0,st:"new"};
  }
  c.fav=!c.fav; save(); toast(c.fav?"已加入收藏 ★":"已取消收藏");
  return c.fav;
}
const isLearned=id=>S.cards[id]&&S.cards[id].first;
function dueList(){const key=dayKey();return Object.entries(S.cards).filter(([id,c])=>c.first&&c.due<=key).map(([id])=>BY_ID[id]).filter(Boolean);}
function streak(){
  let k=dayKey(), n=0;
  const active=key=>{const d=S.daily[key];return d&&(d.n+d.r)>0;};
  if(!active(k)) k=addDays(k,-1);
  while(active(k)){n++;k=addDays(k,-1);}
  return n;
}

/* ====================== 發音（Web Speech） ====================== */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices();}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(lang){
  const list=voices.filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang.toLowerCase()));
  return list.find(v=>/premium|enhanced|natural/i.test(v.name))||list.find(v=>/samantha|daniel|karen|serena|ava|google/i.test(v.name))||list[0]||null;
}
let speakTimer=null;
function speak(text,accent,slow){
  const synth=window.speechSynthesis;
  if(!synth||typeof SpeechSynthesisUtterance==="undefined"){toast("這個瀏覽器不支援語音，請用 Safari 開啟");return;}
  if(!voices.length) loadVoices();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=accent||S.accent; const v=pickVoice(u.lang); if(v) u.voice=v;
  u.rate=(slow??S.slow)?0.6:0.95; u.volume=1; u.pitch=1;
  let started=false;
  u.onstart=()=>{started=true;clearTimeout(speakTimer);};
  u.onerror=e=>{const er=e&&e.error; if(er&&er!=="interrupted"&&er!=="canceled") toast("語音播放失敗（"+er+"）");};
  clearTimeout(speakTimer);
  speakTimer=setTimeout(()=>{if(!started) toast("沒聲音？請關掉 iPhone 左側靜音鍵、調高音量，並用 Safari 開啟");},2500);
  try{
    // Safari 在 cancel() 後立刻 speak() 常常沒聲音，所以只在正在播放時才取消，並稍等一下
    if(synth.speaking||synth.pending){synth.cancel();setTimeout(()=>synth.speak(u),120);}
    else synth.speak(u);
    if(synth.paused) synth.resume();
  }catch(e){toast("語音播放失敗");}
}
function soundCheck(){
  const ok=("speechSynthesis" in window);
  const n=ok?speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).length:0;
  return ok?`可用（找到 ${n} 個英文語音${n?"":"，第一次播放後才會載入"}）`:"不支援，請用 Safari 開啟";
}

let downloadsApi=null, wallCanvas=null;
function wallColors(){
  const t=S.theme==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"darkTech":"blueStudy"):S.theme;
  return ({
    minimalWhite:[["#ffffff","#f1f1f1"],"#111111","#666666"],
    darkTech:[["#050914","#0d1b33"],"#e8f1ff","#4cd9ff"],
    blackGold:[["#080808","#1a160c"],"#eecd80","#a8a29e"],
    lightReading:[["#f8f2e3","#ece2c8"],"#33291f","#8c5a26"],
    blueStudy:[["#1e4fc9","#0b2a6f"],"#ffffff","#cfe0ff"],
    translucent:[["#c9d6ff","#f3e7ff"],"#1f2937","#4f46e5"]
  })[t];
}
function wrapText(ctx,text,maxW){
  const out=[]; let line="";
  for(const ch of text.split(/(\s+)/)){ // 英文以單字斷行
    const test=line+ch;
    if(ctx.measureText(test).width>maxW && line){out.push(line.trim());line=ch.trimStart();}
    else line=test;
  }
  if(line.trim()) out.push(line.trim());
  // 中文長句再以字元斷行
  return out.flatMap(l=>{ if(ctx.measureText(l).width<=maxW) return [l]; const r=[];let s="";for(const c of l){if(ctx.measureText(s+c).width>maxW){r.push(s);s=c;}else s+=c;} if(s)r.push(s); return r;});
}
function drawWallpaper(){
  const dpr=Math.min(3,window.devicePixelRatio||2);
  let W=Math.round((screen.width||390)*dpr), H=Math.round((screen.height||844)*dpr);
  if(W>H) [W,H]=[H,W];
  const c=wallCanvas=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d"); const [bg,fg,sub]=wallColors();
  const g=ctx.createLinearGradient(0,0,W*0.4,H); g.addColorStop(0,bg[0]); g.addColorStop(1,bg[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const F='-apple-system,"PingFang TC","Noto Sans TC",sans-serif';
  const u=W/100, x=8*u, maxW=W-16*u;
  const ws=todayWords(); const w=ws[rotationIndex(ws.length)];
  let y=H*0.50;
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  const text=(s,size,weight,color,lh=1.3)=>{ctx.font=`${weight} ${size}px ${F}`;ctx.fillStyle=color;for(const l of wrapText(ctx,s,maxW)){y+=size*lh;ctx.fillText(l,x,y);} };
  if(wallMode==="five"){
    text("TODAY'S WORDS · "+dayKey(),3.4*u,"600",sub);
    y+=2*u;
    for(const it of ws){ text(it.w,7*u,"800",fg,1.25); text(it.zh+"　"+posZh(it),3.8*u,"400",sub,1.35); y+=1.6*u; }
  }else{
    text(w.lv+" · "+posEn(w),3.6*u,"600",sub);
    text(w.w,(w.w.length>11?10:13)*u,"800",fg,1.15);
    text(w.ipa+"   "+w.kk,4*u,"400",sub,1.6);
    text(w.zh,6*u,"600",fg,1.5);
    if(wallMode==="full"){ y+=3*u; text(w.ex,4.2*u,"italic 400",fg,1.4); text(w.exZh,3.8*u,"400",sub,1.45); }
  }
  ctx.font=`500 ${2.8*u}px ${F}`; ctx.fillStyle=sub; ctx.globalAlpha=.7; ctx.fillText("WordUnlock",x,H*0.88); ctx.globalAlpha=1;
  const img=$("#wallImg"); if(img) img.src=c.toDataURL("image/png");
}
async function saveWallpaper(){
  if(!wallCanvas) return;
  const name=`WordUnlock-${dayKey()}.png`;
  const blob=await new Promise(r=>wallCanvas.toBlob(r,"image/png"));
  if(downloadsApi){
    try{await downloadsApi.save({filename:name,data:blob}); toast("已送出儲存");}
    catch(e){ if(e&&e.code!=="declined") toast("無法儲存，請改用長按圖片儲存"); }
    return;
  }
  // iPhone Safari：用分享選單，裡面有「儲存影像」
  try{
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}
  }catch(e){ if(e&&e.name==="AbortError") return; }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("已下載；也可以長按圖片儲存");}
  catch(e){toast("請長按圖片 →「儲存到照片」");}
}

/* ====================== 事件 ====================== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-open],[data-topic],[data-obtopic],[data-blv],[data-flip]"); if(!t) return;
  const d=t.dataset;
  if(d.tab){go(d.tab);return;}
  if(d.go){go(d.go);return;}
  if(d.close!==undefined){closeSheet();if(tab!=="settings")render();return;}
  if(d.say){speak(d.say,d.accent,d.slow?true:undefined);return;}
  if(d.open){openWord(d.open);return;}
  if(d.fav){toggleFav(d.fav);openWord(d.fav);return;}
  if(d.learned){rate(d.learned,"good");toast("已加入學習，會自動排入複習");openWord(d.learned);return;}
  if(d.flip!==undefined && !flash.flipped){flash.flipped=true;paintFlash();return;}
  if(d.rate){const ws=todayWords();rate(ws[flash.i].id,d.rate);flash.i=(flash.i+1)%ws.length;flash.flipped=false;
    if(stat().n>=S.goal&&flash.i===0) toast("今日目標達成！🎉"); paintFlash(); return;}
  if(d.blv){browseLv=browseLv===d.blv?null:d.blv;render();return;}
  if(d.topic){const i=S.topics.indexOf(d.topic);i>=0?S.topics.splice(i,1):S.topics.push(d.topic);resetTodayPlanIfUntouched();save();render();return;}
  if(d.ans){const w=quiz.items[quiz.i];quiz.answered=d.ans;const ok=d.ans===w.id;if(ok)quiz.score++;
    if(!quiz.practice) rate(w.id,ok?"good":"again"); else if(!ok){S.cards[w.id].wrong=(S.cards[w.id].wrong||0)+1;save();}
    paintQuiz();return;}
  if(d.wall){wallMode=d.wall;openWallpaper();return;}
  // onboarding
  if(d.oblv){S.level=d.oblv;ob.step="topics";paintOnboarding();return;}
  if(d.obans!==undefined){ob.ans.push(d.obans==="1");ob.opts=null;paintOnboarding();return;}
  if(d.obtopic){const i=S.topics.indexOf(d.obtopic);i>=0?S.topics.splice(i,1):S.topics.push(d.obtopic);paintOnboarding();return;}
  if(d.obgoal){S.goal=+d.obgoal;paintOnboarding();return;}
  switch(d.act){
    case "next": S.manualOffset++; save(); render(); break;
    case "wallpaper": openWallpaper(); break;
    case "savewall": saveWallpaper(); break;
    case "prev": {const n=todayWords().length;flash.i=(flash.i-1+n)%n;flash.flipped=false;paintFlash();break;}
    case "skip": flash.i=(flash.i+1)%todayWords().length;flash.flipped=false;paintFlash();break;
    case "quiz": newQuiz(false);paintQuiz();break;
    case "practice": newQuiz(true);paintQuiz();break;
    case "qnext": quiz.i++;quiz.answered=null;quiz.opts=null;paintQuiz();break;
    case "quizdone": quiz=null;render();break;
    case "obtest": ob.step="test";ob.ans=[];ob.opts=null;paintOnboarding();break;
    case "obback": ob.step=0;paintOnboarding();break;
    case "obdone": S.onboarded=true;resetTodayPlanIfUntouched();save();closeSheet();go("today");break;
    case "test": S.onboarded=false;render();break;
    case "export":{
      const code=JSON.stringify(S);
      try{await navigator.clipboard.writeText(code);toast("備份碼已複製，請貼到記事本保存");}
      catch(err){sheet(`<h3>備份碼</h3><p class="muted small">請全選複製後保存</p><textarea readonly>${esc(code)}</textarea><button class="opt" data-close>關閉</button>`);}
      break;}
    case "import":
      sheet(`<h3>貼上備份碼還原</h3><textarea id="importBox" placeholder="貼上之前複製的備份碼"></textarea><div class="btns grow" style="margin-top:10px"><button data-close>取消</button><button class="primary" data-act="doimport">還原</button></div>`);break;
    case "doimport":
      try{const o=JSON.parse($("#importBox").value);if(o.v!==1) throw 0;S=sanitize(o);save();applyTheme();closeSheet();toast("已還原");render();}
      catch(err){toast("備份碼格式不正確");}
      break;
    case "reset":
      sheet(`<h3>確定清除所有學習紀錄？</h3><p class="muted">此動作無法復原，建議先複製備份碼。</p><div class="btns grow"><button data-close>取消</button><button class="primary" style="background:var(--bad)" data-act="doreset">清除</button></div>`);break;
    case "doreset": S=defaultState();save();applyTheme();closeSheet();render();break;
  }
});
document.addEventListener("change",e=>{
  const k=e.target.dataset.set; if(!k) return;
  let v=e.target.value;
  if(k==="goal") v=+v; if(k==="slow") v=v==="1";
  S[k]=v;
  if(k==="level"||k==="goal") resetTodayPlanIfUntouched();
  if(k==="rotation") S.manualOffset=0;
  save(); applyTheme(); toast("已儲存");
});
function applyTheme(){document.body.dataset.theme=S.theme;}

/* 主畫面圖示（加入主畫面時使用） */
function makeIcon(){
  try{
    const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
    const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#2563eb");g.addColorStop(1,"#1e3a8a");x.fillStyle=g;x.fillRect(0,0,180,180);
    x.fillStyle="#fff";x.font='800 92px -apple-system,sans-serif';x.textAlign="center";x.textBaseline="middle";x.fillText("W",90,84);
    x.font='600 22px -apple-system,sans-serif';x.fillText("UNLOCK",90,142);
    const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l);
  }catch(e){}
}

/* 啟動 */
loadLocal(); applyTheme(); render(); initCloud();
if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
// 跨過午夜或回到前景時更新畫面
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.onboarded&&!$("#sheetBg").classList.contains("show")) render();});
setInterval(()=>{if(tab==="today"&&S.onboarded&&!document.hidden&&!$("#sheetBg").classList.contains("show")) render();},60000);
</script>
