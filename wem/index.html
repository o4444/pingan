<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e3a4a;--ink2:#3d4a66;--mute:#6b7690;--line:#e3e6ee;--bg:#f6f4ee;--card:#fff;--hi:#4cc9b0;--hi2:#e3f7f2;--ok:#1f8a4c;--okbg:#e6f5ec;--ng:#c0392b;--ngbg:#fdecea;--blue:#2459c7;--bluebg:#eaf0fc}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.hwrap{max-width:880px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;cursor:pointer}
.logo .tag{background:var(--hi);color:var(--ink);font-size:12px;padding:2px 8px;border-radius:4px;font-weight:900}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:transparent;border:0;color:#c9d1e3;font:inherit;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on,nav button:hover{background:#ffffff1a;color:#fff}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--hi) 0 14px,var(--ink) 14px 28px)}
#fb{scroll-margin-top:80px}
main{max-width:880px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:26px;margin:4px 0 6px;font-weight:900}
h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font:inherit;color:inherit}
.ucard:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 18px #14213d14}
.ucard .ic{font-size:26px}
.ucard b{display:block;font-size:17px;margin:4px 0}
.ucard small{color:var(--mute)}
.bar{height:6px;background:#eef0f5;border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
.ucard.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.ucard.dark small{color:#c9d1e3}
.ucard.yel{background:var(--hi2);border-color:#9fe0cf}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bd{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef0f5;color:var(--ink2)}
.bd.lv{background:var(--ink);color:#fff}
.bd.var{background:var(--hi);color:var(--ink)}
.stem{font-size:18px;font-weight:500;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);transition:.12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:#eef0f5;display:grid;place-items:center;font-weight:900}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}.opt.ng .k{background:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.opt .num{font-family:"JetBrains Mono",monospace}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}
.btn.yel{background:var(--hi);border-color:var(--hi)}
.btn.ghost{border-color:var(--line)}
.btn:hover{filter:brightness(.95)}
.hint{margin-top:12px;background:var(--bluebg);border-radius:10px;padding:10px 14px;color:var(--blue);font-size:15px}
.verdict{border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;margin-bottom:14px}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.ng{background:var(--ngbg);color:var(--ng)}
.stage{border-left:4px solid var(--ink);padding:2px 0 2px 14px;margin:18px 0}
.stage h3{margin:0 0 8px;font-size:15px;letter-spacing:.03em;color:var(--ink2)}
.stage h3 span{background:var(--ink);color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px;font-size:12px}
.etype{display:inline-block;background:var(--ng);color:#fff;font-weight:700;padding:2px 10px;border-radius:6px;margin-bottom:6px}
.etype.okt{background:var(--ok)}
.sc{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.sc b.t{display:block;color:var(--ink2);font-size:14px;margin-bottom:4px}
.sc ul{margin:0;padding-left:20px}
.formula{font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:17px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;margin:6px 0;overflow-x:auto}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:3px 0;font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:15px}
.warn{background:var(--hi2);color:#0b6b57;padding:1px 6px;border-radius:4px;font-weight:700}
.card30{background:var(--hi2);border:2px dashed #3fb39a;border-radius:12px;padding:14px 16px}
.card30 h4{margin:0 0 6px}
table.ut{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.ut td{border-bottom:1px solid #9fe0cf;padding:4px 6px}
.prog{height:8px;background:#e8e4d8;border-radius:4px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--hi)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{font-size:28px;font-weight:900;display:block}
.stat small{color:var(--mute)}
.lrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.lrow .bar{margin:0;height:10px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv summary{cursor:pointer;font-weight:500}
.foot{color:var(--mute);font-size:13px;margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--blue)}
.confirm{background:var(--ngbg);border-radius:10px;padding:12px;margin-top:10px}
@media(max-width:560px){.stem{font-size:16px}.lrow{grid-template-columns:96px 1fr 56px}h1{font-size:22px}}

/* v2 安安老師導引（v3.1 預設小尺寸，一進站即出現） */
.tutor{position:fixed;right:10px;bottom:0;z-index:20;display:flex;align-items:flex-end;pointer-events:none}
.tutor img{height:230px;width:auto;display:block;filter:drop-shadow(0 6px 14px #14213d40);pointer-events:auto;cursor:pointer}

.tbub{pointer-events:auto;max-width:270px;background:#fff;border:2px solid var(--ink);border-radius:14px 14px 4px 14px;padding:10px 12px 8px;margin:0 -4px 140px 0;box-shadow:0 8px 22px #14213d26;font-size:14.5px;line-height:1.55;position:relative;animation:pop .25s ease}
.tbub b.nm{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.tbub .x{position:absolute;top:3px;right:7px;border:0;background:none;font-size:15px;color:var(--mute);cursor:pointer}
.tbub .act{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.tbub .act button{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--ink);background:var(--hi);border-radius:8px;padding:3px 9px;cursor:pointer}
.tutor.min .tbub{display:none}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
main{padding-bottom:250px}
@media(max-width:700px){.tutor{right:4px}.tutor img{height:140px}.tbub{max-width:min(230px,60vw);margin-bottom:84px;font-size:13.5px;padding:8px 10px 6px}main{padding-bottom:170px}}
.spon{background:linear-gradient(135deg,var(--hi2),#fff);border:2px solid #9fe0cf;border-radius:14px;padding:16px 18px;margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.spon p{margin:0;flex:1;min-width:200px}
.spon a{background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:10px}
.bd.dr{background:#7a3cd6;color:#fff}

/* v6 考試用計算機 */
.tutor.cxon img{opacity:.3;pointer-events:none}
.cxbox{margin-top:14px;border:2px solid var(--ink);border-radius:12px;background:#f3f5fa}
.cxbox summary{cursor:pointer;font-weight:700;padding:10px 14px;list-style:none}
.cxbox summary::-webkit-details-marker{display:none}
.cxbox summary small{color:var(--mute);font-weight:500}
.cxwrap{padding:0 12px 12px}
.cxhist{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--mute);text-align:right;min-height:18px;overflow-x:auto;white-space:nowrap}
.cxin{width:100%;box-sizing:border-box;font-family:"JetBrains Mono",monospace;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff;text-align:right}
.cxout{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;text-align:right;padding:6px 4px;color:var(--ink);overflow-x:auto;white-space:nowrap}
.cxkeys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cxk{font:inherit;font-weight:700;font-size:16px;min-height:44px;border:1px solid #c9cfdc;border-radius:8px;background:#e6e9f1;color:var(--ink);cursor:pointer}
.cxk.cxn{background:#fff}
.cxk.cxs{background:var(--ink);color:#fff;border-color:var(--ink)}
.cxk:active{transform:translateY(1px)}
.cxfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--mute)}
.tcol{display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.tsw{display:flex;gap:2px;margin:2px 0 6px;background:#fff;border:1px solid #cfd8cf;border-radius:999px;padding:2px;box-shadow:0 2px 6px #0002}
.tsw button{border:0;background:transparent;font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;color:#456}
.tsw button.on{background:var(--ink);color:#fff;font-weight:700}
.cert{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.cert button{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.cert button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cert button:hover:not(.on){border-color:var(--ink)}
@media(max-width:560px){.cert{gap:4px}.cert button{padding:5px 9px;font-size:14px}}
</style>
</head>

<script>
// ===== 作業環境監測乙級（化學性／物理性）陪考：題目產生器（純邏輯，無 DOM） =====
const R = (a, b, s = 1) => a + s * Math.floor(Math.random() * (Math.floor((b - a) / s + 1e-9) + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const f = (v, d) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
const fmt = (v, d = 0) => Number(f(v, d)).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const log10 = Math.log10;

const ERR = {
  concept: '觀念／公式錯誤',
  unit: '單位換算錯誤',
  math: '數學運算錯誤',
  law: '法規／標準誤判',
  read: '題意判讀錯誤',
  express: '作答表達錯誤'
};

// 數值選項：正解 + 誘答（各自帶錯誤類型）
function numOptions(ans, dists, dec, unit) {
  const show = v => fmt(v, dec) + (unit ? ' ' + unit : '');
  const opts = [{ v: ans, text: show(ans), correct: true }];
  const ok = v => isFinite(v) && v > 0 && opts.every(o => o.text !== show(v) && Math.abs(v - o.v) / Math.max(Math.abs(o.v), 1e-9) > 0.02);
  for (const d of dists) { if (opts.length >= 4) break; if (ok(d.v)) opts.push({ v: d.v, text: show(d.v), correct: false, type: d.type, why: d.why }); }
  const fillers = [1.5, 0.6, 2, 0.8, 1.25, 0.4, 3, 1.1, 0.9];
  for (const k of fillers) { if (opts.length >= 4) break; const v = ans * k; if (ok(v)) opts.push({ v, text: show(v), correct: false, type: ERR.math, why: '數值計算或位數處理有誤，請分段重算、每一步都寫下單位。' }); }
  return shuffle(opts);
}
// 分貝等「加減幾 dB」的題目，誘答用絕對差距
function dbOptions(ans, dists, dec = 1, unit = 'dB') {
  const show = v => fmt(v, dec) + ' ' + unit;
  const opts = [{ v: ans, text: show(ans), correct: true }];
  const ok = v => isFinite(v) && v > 0 && opts.every(o => o.text !== show(v) && Math.abs(v - o.v) >= 0.5);
  for (const d of dists) { if (opts.length >= 4) break; if (ok(d.v)) opts.push({ v: d.v, text: show(d.v), correct: false, type: d.type, why: d.why }); }
  for (const k of [3, -3, 6, -2, 2, 10, -6]) { if (opts.length >= 4) break; const v = ans + k; if (ok(v)) opts.push({ v, text: show(v), correct: false, type: ERR.math, why: '對數運算有誤：分貝要先換成 10^(L/10) 再加減，最後取 10 log。' }); }
  return shuffle(opts);
}
function textOptions(correctText, dists) {
  const opts = [{ text: correctText, correct: true }];
  for (const d of dists) { if (opts.length >= 4) break; if (opts.every(o => o.text !== d.text)) opts.push({ text: d.text, correct: false, type: d.type, why: d.why }); }
  return shuffle(opts);
}

// ---------- 30 秒觀念卡 ----------
const UNIT_TABLE = [
  ['ppm → mg/m³（25°C、1 atm）', '× 分子量 ÷ 24.45'], ['mg/m³ → ppm', '× 24.45 ÷ 分子量'], ['1 μg/L', '= 1 mg/m³'],
  ['1 m³', '= 1,000 L'], ['1 L', '= 1,000 mL'], ['1 mg', '= 1,000 μg'], ['°C → K', '+ 273'],
  ['採樣體積 V（L）', '= 流率（L/min）× 時間（min）'], ['1 hr', '= 60 min'], ['% → 小數', '÷ 100'],
  ['10 log 2', '≈ 3 dB'], ['20 log 2', '≈ 6 dB'], ['16.61', '= 5 ÷ log 2（5 dB 交換率）']
];
const GENERIC_CARD = {
  [ERR.math]: '計算機分段算：先乘除後加減，有百分比先換成小數。分貝題記得先 10^(L/10) 再相加，最後才取 10 log；每一段寫下中間值和單位。',
  [ERR.read]: '讀題三圈：①圈「求什麼、單位是什麼」（ppm 還是 mg/m³？% 還是小數？）②圈條件（25°C 還是其他溫度、有沒有空白值、脫附效率）③刪掉用不到的干擾數據。',
  [ERR.express]: '作答四要素：公式 → 代入（含單位）→ 答案 → 單位。濃度寫清楚 ppm 或 mg/m³，噪音寫 dBA 或 %。'
};

const G = {};

// =====================================================
// 化學性因子：計算題
// =====================================================
const SOLV = [
  { n: '甲苯', m: 92.14 }, { n: '二甲苯', m: 106.17 }, { n: '丙酮', m: 58.08 }, { n: '正己烷', m: 86.18 },
  { n: '苯', m: 78.11 }, { n: '甲醇', m: 32.04 }, { n: '二氯甲烷', m: 84.93 }, { n: '乙酸乙酯', m: 88.11 },
  { n: '異丙醇', m: 60.1 }, { n: '苯乙烯', m: 104.15 }, { n: '丁酮', m: 72.11 }, { n: '三氯乙烯', m: 131.39 }
];
const PPM_CARD = { [ERR.concept]: '25°C、1 atm 下 1 mol 氣體體積 24.45 L。ppm（體積比）→ mg/m³（質量濃度）要乘分子量、除 24.45；反過來就乘 24.45、除分子量。', [ERR.unit]: '作業環境（勞工作業場所容許暴露標準）用 25°C、1 atm 的 24.45；22.4 是 0°C 標準狀態，用在煙道排放（Nm³）。' };

G.cPpm = (o = {}) => {
  const dir = o.dir || pick(['p2m', 'm2p']), s = pick(SOLV);
  const formula = { expr: 'mg/m³ = ppm × M ÷ 24.45', vars: 'M：分子量（g/mol）；24.45：25°C、1 atm 下 1 mol 氣體體積（L）', cond: '作業環境監測以 25°C、1 atm 為準；溫度壓力不同要另外校正。', plain: 'ppm 是體積比，mg/m³ 是重量濃度，靠分子量和莫耳體積互換。', mnemonic: '「ppm 變 mg，乘 M 除 24.45」' };
  if (dir === 'p2m') {
    const p = pick([5, 10, 20, 25, 50, 100, 200, 500]), v = p * s.m / 24.45;
    return { unit: 'chemK', level: 1, keep: { dir }, title: '化學｜ppm 換算 mg/m³', formula, card: PPM_CARD,
      stem: `作業場所空氣中${s.n}（分子量 ${s.m}）濃度為 ${p} ppm，換算成 25°C、1 大氣壓下之濃度為多少 mg/m³？`,
      known: [`C = ${p} ppm`, `M = ${s.m} g/mol`, '25°C、1 atm → 莫耳體積 24.45 L', '求：mg/m³'],
      steps: [`mg/m³ = ${p} × ${s.m} ÷ 24.45`, `= <b>${fmt(v, 1)} mg/m³</b>`],
      check: s.m > 24.45 ? '分子量大於 24.45，mg/m³ 數值會大於 ppm ✔' : '分子量小於 24.45，mg/m³ 數值會小於 ppm ✔',
      answer: v, opts: numOptions(v, [
        { v: p * s.m / 22.4, type: ERR.unit, why: '用了 22.4（0°C 標準狀態）；作業環境要用 25°C 的 24.45。' },
        { v: p * 24.45 / s.m, type: ERR.concept, why: '乘除顛倒：ppm → mg/m³ 是乘分子量、除 24.45。' },
        { v: p * s.m / 1000, type: ERR.unit, why: '沒有除以莫耳體積，單位不對。' }
      ], 1, 'mg/m³') };
  }
  const mg = pick([10, 20, 50, 100, 150, 200, 300, 500]), v = mg * 24.45 / s.m;
  return { unit: 'chemK', level: 1, keep: { dir }, title: '化學｜mg/m³ 換算 ppm', formula, card: PPM_CARD,
    stem: `某作業場所測得${s.n}（分子量 ${s.m}）濃度為 ${mg} mg/m³（25°C、1 atm），相當於多少 ppm？`,
    known: [`C = ${mg} mg/m³`, `M = ${s.m} g/mol`, '莫耳體積 24.45 L', '求：ppm'],

G.cTWA = (o = {}) => {
  const s = pick(SOLV), pel = pick([50, 100, 200]);
  const n = o.n || pick([3, 4]); let left = 8; const seg = [];
  for (let i = 0; i < n; i++) { const t = i === n - 1 ? left : R(1, Math.max(1, left - (n - i - 1)), 1); left -= t; seg.push({ t, c: R(Math.round(pel * 0.3), Math.round(pel * 1.3), 5) }); }
  const sum = seg.reduce((a, x) => a + x.c * x.t, 0), twa = sum / 8, avg = seg.reduce((a, x) => a + x.c, 0) / n;
  const over = twa > pel;
  return { unit: 'chemK', level: 2, keep: { n }, title: '化學｜相當 8 小時日時量平均濃度',
    stem: `某勞工一日作業 8 小時暴露於${s.n}，各時段測定結果：${seg.map(x => `${x.c} ppm 共 ${x.t} 小時`).join('、')}。該勞工相當 8 小時日時量平均濃度為多少 ppm？`,
    known: seg.map((x, i) => `時段 ${i + 1}：C${i + 1} = ${x.c} ppm、t${i + 1} = ${x.t} hr`).concat([`參考：${s.n}之 8 小時日時量平均容許濃度設為 ${pel} ppm`, '求：TWA（ppm）']),
    formula: { expr: 'TWA = (C₁t₁ + C₂t₂ + … + Cₙtₙ) ÷ 8', vars: 'Cᵢ：各時段濃度；tᵢ：各時段時間（hr）', cond: '分母固定除以 8 小時；沒有暴露的時段濃度以 0 計。', plain: '每段濃度乘上暴露時間加總，再平均到 8 小時，算出「整天下來相當於多少」。', mnemonic: '「濃度乘時間，加總除以 8」' },
    steps: [`Σ Cᵢtᵢ = ${seg.map(x => `${x.c}×${x.t}`).join(' + ')} = ${fmt(sum)} ppm·hr`, `TWA = ${fmt(sum)} ÷ 8 = <b>${fmt(twa, 1)} ppm</b>`, `與容許濃度 ${pel} ppm 比較：${over ? '超過容許濃度' : '未超過容許濃度'}`],
    check: '時量平均值一定介於最低與最高時段濃度之間 ✔',
    answer: twa, opts: numOptions(twa, [
      { v: avg, type: ERR.concept, why: '直接把各時段濃度平均，沒有用時間加權。' },
      { v: sum, type: ERR.read, why: '只算到濃度 × 時間的總和，忘了除以 8。' },
      { v: sum / 8 * 1.25, type: ERR.law, why: '把短時間時量平均的變量係數混進來了，TWA 不用乘係數。' }
    ], 1, 'ppm'),
    card: { [ERR.concept]: '時量平均是「時間加權」平均：長時間的那段影響比較大。若勞工只作業 6 小時，其餘 2 小時沒有暴露，仍是除以 8。' } };
};

G.cMix = () => {
  const pool = shuffle(SOLV.slice()).slice(0, pick([2, 3]));
  const items = pool.map(s => { const pel = pick([50, 100, 200, 400]); return { s, pel, c: R(Math.round(pel * 0.15), Math.round(pel * 0.6), 5) }; });
  const r = items.reduce((a, x) => a + x.c / x.pel, 0), over = r > 1;
  return { unit: 'chemK', level: 2, title: '化學｜混合物相加效應',
    stem: `某作業場所同時存在 ${items.length} 種具相加效應之有機溶劑，8 小時日時量平均濃度與容許濃度如下：${items.map(x => `${x.s.n} ${x.c} ppm（容許 ${x.pel} ppm）`).join('；')}。其總和效應指數 Σ(C/PEL) 為多少？`,
    known: items.map(x => `${x.s.n}：C/PEL = ${x.c}/${x.pel} = ${f(x.c / x.pel, 3)}`).concat(['判定：總和大於 1 即超過容許濃度']),
    formula: { expr: 'Σ = C₁/PEL₁ + C₂/PEL₂ + … + Cₙ/PELₙ', vars: 'Cᵢ：各物質濃度；PELᵢ：各物質容許濃度', cond: '適用於作用於同一器官、具相加效應的物質；Σ > 1 即判定超過。', plain: '每一種物質各自用掉容許濃度的幾成，加起來超過一整份（1）就超標。', mnemonic: '「各自除容許，相加不過一」' },
    steps: [`Σ = ${items.map(x => `${x.c}/${x.pel}`).join(' + ')}`, `= ${items.map(x => f(x.c / x.pel, 3)).join(' + ')} = <b>${fmt(r, 2)}</b>`, over ? '大於 1 → 超過容許濃度' : '不大於 1 → 未超過容許濃度'],
    check: '即使每一種物質單獨都沒超標，相加後仍可能超過 1 ✔',
    answer: r, opts: numOptions(r, [
      { v: items.reduce((a, x) => a + x.c, 0) / items.reduce((a, x) => a + x.pel, 0), type: ERR.concept, why: '把濃度總和除以容許濃度總和，這不是相加效應的算法；要各自相除再加總。' },
      { v: Math.max(...items.map(x => x.c / x.pel)), type: ERR.read, why: '只看了最高的那一種，沒有加總。' },
      { v: items.reduce((a, x) => a + x.pel / x.c, 0), type: ERR.concept, why: '分子分母顛倒，應為 C / PEL。' }
    ], 2, ''),
    card: { [ERR.concept]: '勞工作業場所容許暴露標準：二種以上有害物且具相加效應時，Σ(C/PEL) 大於 1 即屬超過容許濃度。' } };
};

const VF = [[1, 3], [10, 2], [100, 1.5], [1000, 1.25], [Infinity, 1]];
const vfOf = p => VF.find(x => p < x[0])[1];
G.cSTEL = () => {
  const p = pick([0.1, 0.5, 2, 5, 20, 50, 100, 200, 750, 1000, 5000]), k = vfOf(p), st = p * k;
  const wrong = [3, 2, 1.5, 1.25, 1].filter(x => x !== k);
  return { unit: 'chemK', level: 2, title: '化學｜短時間時量平均容許濃度',
    stem: `某有害物之 8 小時日時量平均容許濃度為 ${p} ppm，依勞工作業場所容許暴露標準之變量係數，其短時間時量平均容許濃度為多少 ppm？`,
    known: [`PEL-TWA = ${p} ppm`, '變量係數：未滿 1 →3；1～未滿 10 →2；10～未滿 100 →1.5；100～未滿 1,000 →1.25；1,000 以上 →1', '求：PEL-STEL'],
    formula: { expr: 'PEL-STEL = PEL-TWA × 變量係數', vars: '變量係數依容許濃度大小分級（ppm 或 mg/m³）', cond: '短時間時量平均指任何一次連續 15 分鐘內的時量平均。', plain: '容許濃度越小（毒性越強）可容許的短時間波動倍數反而越大，1,000 以上就不能再放寬。', mnemonic: '「一、十、百、千 → 3、2、1.5、1.25、1」' },
    steps: [`${p} ppm 落在「${p < 1 ? '未滿 1' : p < 10 ? '1 以上未滿 10' : p < 100 ? '10 以上未滿 100' : p < 1000 ? '100 以上未滿 1,000' : '1,000 以上'}」→ 變量係數 ${k}`, `STEL = ${p} × ${k} = <b>${fmt(st, 2)} ppm</b>`],
    check: '變量係數最小是 1，所以 STEL 不會小於 TWA ✔',
    answer: st, opts: numOptions(st, wrong.map(w => ({ v: p * w, type: ERR.law, why: `變量係數用錯了，${p} 應用 ${k}，不是 ${w}。` })), 2, 'ppm'),
    card: { [ERR.law]: '變量係數：容許濃度 <1 → 3；1≦ <10 → 2；10≦ <100 → 1.5；100≦ <1,000 → 1.25；≧1,000 → 1。標有「C」（最高容許濃度）者任何時間都不得超過。' } };
};

G.cTube = (o = {}) => {
  const s = pick(SOLV.slice(0, 8)), q = pick([0.05, 0.1, 0.15, 0.2]), t = pick([240, 300, 360, 400, 480]), V = q * t;
  const front = R(300, 3000, 10), back = R(Math.round(front * 0.01), Math.round(front * 0.07), 1), blank = R(0, 5), de = pick([0.85, 0.9, 0.92, 0.95, 0.98]);
  const mass = (front + back - blank) / de, C = mass / V;
  return { unit: 'chemK', level: 3, title: '化學｜活性碳管採樣濃度',
    stem: `以活性碳管採集${s.n}，採樣流率 ${q} L/min、採樣 ${t} 分鐘。分析結果前段 ${front} μg、後段 ${back} μg，現場空白樣本 ${blank} μg，脫附效率 ${de * 100}%。空氣中${s.n}濃度為多少 mg/m³？`,
    known: [`V = ${q} × ${t} = ${fmt(V, 1)} L`, `前段 + 後段 = ${front + back} μg（後段/前段 = ${f(back / front * 100, 1)}%，未超過 10%，無破出）`, `空白 = ${blank} μg`, `DE = ${de}`, '提示：1 μg/L = 1 mg/m³'],
    formula: { expr: 'C = (W前 + W後 − W空白) ÷ DE ÷ V', vars: 'W：分析質量（μg）；DE：脫附效率；V：採樣體積（L）', cond: '前後段都要加；扣空白；除以脫附效率還原真正採到的量。後段超過前段 10% 視為破出。', plain: '先算出管子裡真正抓到多少污染物，再除以抽過的空氣量。', mnemonic: '「前後相加扣空白，除脫附再除體積」' },
    steps: [`採樣體積 V = ${q} L/min × ${t} min = ${fmt(V, 1)} L`, `淨質量 = (${front} + ${back} − ${blank}) ÷ ${de} = ${fmt(mass, 1)} μg`, `C = ${fmt(mass, 1)} μg ÷ ${fmt(V, 1)} L = <b>${fmt(C, 2)} mg/m³</b>`],
    check: '脫附效率小於 1，校正後濃度會比未校正的大 ✔',
    answer: C, opts: numOptions(C, [
      { v: (front - blank) / de / V, type: ERR.read, why: '漏了後段的量；前後段都要加起來。' },
      { v: (front + back - blank) * de / V, type: ERR.concept, why: '脫附效率要「除」，不是「乘」。' },
      { v: (front + back - blank) / de / V / 1000, type: ERR.unit, why: 'μg/L 就等於 mg/m³，不用再除 1,000。' },
      { v: (front + back) / de / V, type: ERR.read, why: '忘了扣除現場空白。' }
    ], 2, 'mg/m³'),
    card: { [ERR.concept]: '活性碳管前段 100 mg、後段 50 mg；分析時前後段分開脫附（常用二硫化碳），後段量超過前段 10% 表示可能破出，採樣結果會低估。' } };
};

G.cBreak = () => {
  const front = R(500, 4000, 10), pctv = pick([3, 5, 8, 12, 15, 25]), back = Math.round(front * pctv / 100), r = back / front * 100, brk = r > 10;

    stem: `活性碳管樣本分析結果前段 ${front} μg、後段 ${back} μg。後段占前段之百分比為多少？`,
    known: [`前段 = ${front} μg`, `後段 = ${back} μg`, '判定：後段 > 前段 10% → 破出'],
    formula: { expr: '破出比 = 後段 ÷ 前段 × 100%', vars: '前段 100 mg、後段 50 mg 活性碳', cond: '比的是「前段」，不是前後段總和。', plain: '後段是備援，抓到太多代表前段已經飽和、有污染物跑掉了。', mnemonic: '「後段過一成，就算破出」' },
    steps: [`${back} ÷ ${front} × 100% = <b>${fmt(r, 1)}%</b>`, brk ? '超過 10% → 判定破出，樣本可能低估，應縮短採樣時間或降低流率重採' : '未超過 10% → 未破出，前後段相加計算濃度'],
    check: '比例一定小於 100%（後段比前段少）✔',
    answer: r, opts: numOptions(r, [
      { v: back / (front + back) * 100, type: ERR.concept, why: '分母用了前後段總和；破出判定是後段 ÷ 前段。' },
      { v: front / back, type: ERR.concept, why: '分子分母顛倒了。' },
      { v: back / front, type: ERR.unit, why: '這是小數，題目問百分比要 × 100%。' }
    ], 1, '%'),
    card: { [ERR.concept]: '破出（breakthrough）：後段 > 前段 10%。改善方法：降低採樣流率、縮短採樣時間（分成多個樣本）或改用較大容量的採樣管。' } };
};

G.cDust = (o = {}) => {

};

G.cGrav = () => {

    formula: { expr: 'C = [(W₂ − W₁) − ΔW空白] ÷ V', vars: 'W₁、W₂：採樣前後濾紙重；ΔW空白：空白濾紙增重；V：m³', cond: '體積要換成 m³（L ÷ 1,000）；濾紙稱重前要恆溫恆濕平衡。', plain: '濾紙多出來的重量（扣掉環境造成的變化）就是抓到的粉塵。', mnemonic: '「後減前、扣空白，除以立方米」' },
    steps: [`淨重 = ${f(dw, 3)} − ${f(b, 3)} = ${f(net, 3)} mg`, `V = ${fmt(q * t)} L ÷ 1,000 = ${f(V, 3)} m³`, `C = ${f(net, 3)} ÷ ${f(V, 3)} = <b>${fmt(C, 2)} mg/m³</b>`],
    check: '採樣幾百公升、增重不到 2 mg，濃度通常落在 0.x～數 mg/m³ ✔',
    answer: C, opts: numOptions(C, [
      { v: dw / V, type: ERR.read, why: '沒有扣除空白濾紙的重量變化。' },
      { v: net / (q * t), type: ERR.unit, why: '體積用了 L 沒換成 m³，數值差 1,000 倍。' },
      { v: w2 / V, type: ERR.concept, why: '要用增重，不是採樣後總重。' }
    ], 2, 'mg/m³'),
    card: { [ERR.unit]: 'mg/m³ 的分母是立方公尺：L ÷ 1,000 = m³。1.7 L/min × 480 min = 816 L = 0.816 m³。' } };

G.cVol = () => {

    steps: [`P 比 = ${P} ÷ 760 = ${f(P / 760, 4)}`, `T 比 = 298 ÷ ${T + 273} = ${f(298 / (273 + T), 4)}`, `V₂₅ = ${V} × ${f(P / 760, 4)} × ${f(298 / (273 + T), 4)} = <b>${fmt(V25, 1)} L</b>`],
    check: T > 25 ? '現場比 25°C 熱，校正後體積應略小 ✔' : '現場比 25°C 冷，校正後體積應略大 ✔',
    answer: V25, opts: numOptions(V25, [

    ], 1, 'L'),

G.pLux = () => {

  const E = I * Math.cos(th * Math.PI / 180) / (d * d);
  return { unit: 'physK', level: 2, title: '物理｜點光源照度',
    stem: `一點光源光度為 ${I} 燭光（cd），距工作面 ${d} m${th ? `，光線入射角（與法線夾角）為 ${th}°` : '，垂直照射'}。工作面照度為多少 lux？`,
    known: [`I = ${I} cd`, `d = ${d} m`, `θ = ${th}°（cos θ = ${f(Math.cos(th * Math.PI / 180), 3)}）`],
    formula: { expr: 'E = I × cos θ ÷ d²', vars: 'I：光度（cd）；d：距離（m）；θ：入射角', cond: '點光源照度與距離平方成反比（逆平方定律）。', plain: '距離加倍、照度剩 1/4；斜射時要乘 cos θ。', mnemonic: '「光度乘餘弦，除距離平方」' },
    steps: [`d² = ${f(d * d, 2)}`, `E = ${I} × ${f(Math.cos(th * Math.PI / 180), 3)} ÷ ${f(d * d, 2)} = <b>${fmt(E, 1)} lux</b>`],
    check: '距離越遠、斜射角越大，照度越低 ✔',
    answer: E, opts: numOptions(E, [
      { v: I * Math.cos(th * Math.PI / 180) / d, type: ERR.concept, why: '要除以距離「平方」。' },
      { v: I / (d * d), type: th ? ERR.read : ERR.math, why: '斜射要乘 cos θ。' },
      { v: I * Math.sin(th * Math.PI / 180 || 0.5236) / (d * d), type: ERR.concept, why: '入射角對法線，要用 cos 不是 sin。' }
    ], 1, 'lux'),
    card: { [ERR.concept]: '照度單位 lux = lm/m²。照度計受光器要做餘弦修正與色修正（視感度修正），量測前先暴露於光源數分鐘使其穩定。' } };
};

  { g: 'mLaw', q: '持有「化學性因子作業環境監測乙級技術士證」者，可擔任何種監測人員？', a: '乙級化學性因子監測人員', d: [['甲級化學性因子監測人員', L_, '甲級須甲級技術士證或職業衛生技師。'], ['乙級物理性因子監測人員', C_, '化學性與物理性分開認定。'], ['職業衛生技師', L_, '技師須經高考及格。']], ex: '監測人員分甲、乙級及化學性、物理性；乙級化學性人員須領有化學性因子作業環境監測乙級技術士證。' },
  { g: 'mLaw', q: '作業環境監測計畫中「相似暴露族群（SEG）」之建立，屬於監測計畫哪一部分？', a: '採樣策略規劃的基礎', d: [['樣本分析的品管程序', C_, 'SEG 是採樣前的分組。'], ['監測結果公告方式', C_, '與公告無關。'], ['監測機構認可要件', C_, '與機構認可無關。']], ex: '監測計畫：危害辨識及資料收集 → 建立相似暴露族群 → 採樣策略規劃與執行 → 樣本分析 → 數據分析與評估。' },
  // 容許暴露標準
  { g: 'mPel', q: '「8 小時日時量平均容許濃度」之意義為？', a: '勞工每天工作 8 小時，一般勞工重複暴露此濃度以下，不致有不良反應者', d: [['任何時間都不得超過的濃度', C_, '那是最高容許濃度（標示 C）。'], ['任何 15 分鐘平均不得超過的濃度', C_, '那是短時間時量平均容許濃度。'], ['所有勞工都絕對安全的濃度', C_, '容許濃度不是安全與危險的明確界線，敏感者仍可能受影響。']], ex: 'PEL-TWA：8 小時、一般勞工、重複暴露不致有不良反應。不是絕對安全界線。' },
  { g: 'mPel', q: '「短時間時量平均容許濃度」是以多長時間之時量平均濃度判定？', a: '任何一次連續 15 分鐘', d: [['任何一次連續 30 分鐘', L_, '是 15 分鐘。'], ['任何一次連續 1 小時', L_, '是 15 分鐘。'], ['任何瞬間', L_, '瞬間不得超過的是最高容許濃度。']], ex: 'PEL-STEL：任何一次連續 15 分鐘時量平均；且勞工暴露在 TWA 與 STEL 之間，每次不得超過 15 分鐘、每日不得超過 4 次、兩次間隔至少 60 分鐘。' },
  { g: 'mPel', q: '容許暴露標準附表中，化學物質註記「皮」者，代表何意？', a: '該物質易從皮膚、黏膜滲入體內', d: [['只會造成皮膚過敏', C_, '「皮」是指經皮吸收途徑。'], ['可用皮膚接觸測試濃度', C_, '與量測方法無關。'], ['不需呼吸防護', C_, '仍需呼吸防護，另需皮膚防護。']], ex: '標示「皮」：經皮膚吸收，即使空氣濃度未超標，仍可能因皮膚接觸過量暴露，應使用防護手套、衣物。' },
  { g: 'mPel', q: '容許暴露標準附表中標示「瘤」者，代表何意？', a: '該物質為致癌物', d: [['該物質會造成腫脹', C_, '「瘤」是致癌性標示。'], ['該物質會致敏', C_, '致敏另有標示。'], ['該物質為窒息性氣體', C_, '與窒息無關。']], ex: '「瘤」：致癌物；「皮」：經皮吸收；「高」或 C：最高容許濃度。' },
  { g: 'mPel', q: '依容許暴露標準，下列何者「可以」作為容許濃度之用途？', a: '評估勞工作業場所空氣中有害物濃度是否符合規定', d: [['以兩種物質容許濃度比值作為毒性相對指標', C_, '法規明文不得作此用途。'], ['作為工作場所以外之空氣污染指標', C_, '法規明文不得作此用途。'], ['作為職業疾病鑑定之唯一依據', C_, '法規明文不得作此用途。']], ex: '容許濃度不得作為：①兩物質毒性比較指標；②工作場所以外空氣污染指標；③職業病鑑定唯一依據。' },
  { g: 'mPel', q: '容許暴露標準中 ppm 之定義為？', a: '溫度 25°C、一大氣壓下，每立方公尺空氣中氣狀有害物之立方公分數', d: [['0°C、一大氣壓下，每公升水中之毫克數', U_, '那是水中濃度且溫度條件也不對。'], ['每立方公尺空氣中有害物之毫克數', U_, '那是 mg/m³。'], ['每公斤空氣中有害物之克數', U_, '不是質量比。']], ex: 'ppm（作業環境）：25°C、1 atm，每 m³ 空氣中有害物之 cm³ 數（體積比百萬分之一）。' },
  { g: 'mPel', q: '二氧化碳之 8 小時日時量平均容許濃度為多少 ppm？', a: '5,000 ppm', d: [['1,000 ppm', L_, '1,000 ppm 是室內空氣品質標準。'], ['50 ppm', L_, '是 5,000 ppm。'], ['10,000 ppm', L_, '是 5,000 ppm。']], ex: '勞工作業場所 CO₂ 容許濃度 5,000 ppm；室內空氣品質標準 CO₂ 8 小時值 1,000 ppm。' },
  { g: 'mPel', q: '第一種粉塵之定義為？', a: '含結晶型游離二氧化矽 10% 以上之礦物性粉塵', d: [['含結晶型游離二氧化矽未滿 10% 之礦物性粉塵', L_, '那是第二種粉塵。'], ['石綿纖維', L_, '石綿是第三種粉塵。'], ['厭惡性粉塵', L_, '那是第四種粉塵。']], ex: '第一種：SiO₂ ≧10%（公式計算）；第二種：<10%；第三種：石綿；第四種：厭惡性粉塵。' },
  { g: 'mPel', q: '石綿纖維之 8 小時日時量平均容許濃度為？', a: '0.15 f/cc', d: [['1 f/cc', L_, '是 0.15 f/cc。'], ['0.15 mg/m³', U_, '石綿以纖維數計（f/cc），不是重量。'], ['5 f/cc', L_, '是 0.15 f/cc。']], ex: '石綿（第三種粉塵）以每立方公分纖維根數計：0.15 f/cc。' },
  { g: 'mPel', q: '第四種粉塵（厭惡性粉塵）之可呼吸性粉塵容許濃度為多少？', a: '5 mg/m³', d: [['10 mg/m³', L_, '10 mg/m³ 是總粉塵。'], ['1 mg/m³', L_, '1 mg/m³ 是第二種粉塵可呼吸性。'], ['0.15 mg/m³', L_, '不是。']], ex: '厭惡性粉塵：可呼吸性 5 mg/m³、總粉塵 10 mg/m³。' },
  { g: 'mPel', q: '容許濃度 200 ppm 之物質，其變量係數為？', a: '1.25', d: [['1.5', L_, '1.5 適用 10 以上未滿 100。'], ['2', L_, '2 適用 1 以上未滿 10。'], ['1', L_, '1 適用 1,000 以上。']], ex: '變量係數：<1 →3；1≦<10 →2；10≦<100 →1.5；100≦<1,000 →1.25；≧1,000 →1。' },
  { g: 'mPel', q: '勞工暴露濃度介於 8 小時 TWA 容許濃度與短時間容許濃度之間時，每次暴露不得超過多久？', a: '15 分鐘', d: [['30 分鐘', L_, '是 15 分鐘。'], ['60 分鐘', L_, '60 分鐘是兩次暴露的最小間隔。'], ['4 小時', L_, '每日最多 4 次，不是 4 小時。']], ex: 'TWA～STEL 之間：每次 ≦15 分鐘、每日 ≦4 次、間隔 ≧60 分鐘。' },
  // 危害預防法規
  { g: 'mReg', q: '依有機溶劑中毒預防規則，第一種有機溶劑容器之區分色為？', a: '紅色', d: [['黃色', L_, '黃色是第二種。'], ['藍色', L_, '藍色是第三種。'], ['綠色', L_, '沒有綠色。']], ex: '有機溶劑區分色：第一種紅、第二種黃、第三種藍（毒性由高至低）。' },
  { g: 'mReg', q: '依有機溶劑中毒預防規則，第二種有機溶劑之區分色為？', a: '黃色', d: [['紅色', L_, '紅色是第一種。'], ['藍色', L_, '藍色是第三種。'], ['白色', L_, '沒有白色。']], ex: '紅 → 黃 → 藍：第一、二、三種有機溶劑。甲苯、二甲苯、丙酮等常見溶劑多屬第二種。' },
  { g: 'mReg', q: '依特定化學物質危害預防標準，甲類物質原則上之管理方式為？', a: '禁止製造、輸入、供應或使用（試驗研究經許可者除外）', d: [['設置局部排氣即可使用', L_, '甲類原則禁止。'], ['只需標示即可', L_, '甲類原則禁止。'], ['須經許可方可製造', L_, '須經許可製造的是乙類。']], ex: '甲類（如聯苯胺、黃磷火柴等）原則禁用；乙類須經許可製造；丙類、丁類依規定設置控制設備等。' },
  { g: 'mReg', q: '依缺氧症預防規則，「缺氧」係指空氣中氧氣濃度未滿多少之狀態？', a: '18%', d: [['21%', C_, '21% 是正常空氣含氧量。'], ['16%', L_, '法定缺氧門檻是未滿 18%。'], ['19.5%', L_, '19.5% 是部分國外標準，我國是 18%。']], ex: '缺氧：氧氣濃度未滿 18%。缺氧危險作業應測定氧氣濃度、通風換氣並配置監視人員。' },
  { g: 'mReg', q: '依特定化學物質危害預防標準，「特別管理物質」之相關紀錄應保存多久？', a: '30 年', d: [['3 年', L_, '一般紀錄 3 年，特別管理物質 30 年。'], ['10 年', L_, '是 30 年。'], ['5 年', L_, '是 30 年。']], ex: '特別管理物質多為致癌物，勞工作業紀錄、監測紀錄等保存 30 年。' },
  { g: 'mReg', q: '依粉塵危害預防標準，特定粉塵發生源原則上應採取之控制措施為？', a: '密閉設備、局部排氣裝置或濕式作業等', d: [['僅發給勞工口罩', C_, '防護具是最後手段，應先採工程控制。'], ['加強照明', C_, '與粉塵控制無關。'], ['縮短休息時間', C_, '與粉塵控制無關。']], ex: '控制優先順序：消除／取代 → 工程控制（密閉、局部排氣、濕式）→ 行政管理 → 個人防護具。' },
  // 採樣策略
  { g: 'mStrat', q: '評估勞工個人暴露時，採樣口應置於何處？', a: '勞工呼吸帶（以口鼻為中心、半徑約 30 cm 範圍）', d: [['作業場所中央固定位置', C_, '那是區域採樣，無法代表個人暴露。'], ['排氣口出口', C_, '那是排放濃度，不是暴露濃度。'], ['勞工腳邊', C_, '離呼吸區太遠。']], ex: '個人採樣：採樣器配戴於勞工身上、採樣口在呼吸帶（衣領附近），最能代表吸入量。' },
  { g: 'mStrat', q: '下列哪一種採樣方式最能準確評估 8 小時日時量平均暴露？', a: '全程多樣本連續採樣', d: [['部分時段單一樣本', C_, '未涵蓋全程，需推估，誤差大。'], ['隨機瞬間採樣（抓樣）', C_, '代表性最差。'], ['只在濃度最高時採樣', C_, '會高估 TWA。']], ex: '採樣準確性：全程多樣本連續 > 全程單一樣本 > 部分時段連續 > 瞬間（抓樣）。' },
  { g: 'mStrat', q: '作業環境監測數據通常呈現何種統計分布？', a: '對數常態分布', d: [['常態分布', C_, '濃度不會小於 0 且右偏，通常用對數常態。'], ['均勻分布', C_, '不是。'], ['二項分布', C_, '二項分布用於成功／失敗次數。']], ex: '暴露濃度呈右偏的對數常態分布，以幾何平均（GM）與幾何標準差（GSD）描述。' },
  { g: 'mStrat', q: '「相似暴露族群（SEG）」之意義為？', a: '暴露狀況相似、可由部分人員代表整群暴露的一群勞工', d: [['同一部門所有員工', D_, '同部門暴露未必相似，要依作業內容分。'], ['同一年齡層的勞工', C_, '與年齡無關。'], ['同一班別的勞工', C_, '班別相同不代表暴露相似。']], ex: 'SEG 依製程、作業內容、使用物質與頻率分群，從各群中抽樣即可推估整群暴露，節省成本。' },
  { g: 'mStrat', q: '選擇採樣對象時，優先選擇「最大暴露危險群」勞工的目的是？', a: '若最高暴露者都符合標準，可推論同群其他人也符合', d: [['為了節省採樣經費而隨便挑', C_, '是有統計意義的選擇。'], ['因為他們年資最淺', C_, '與年資無關。'], ['法規規定只能採主管', C_, '沒有這種規定。']], ex: '最大暴露危險勞工：距發生源最近、作業時間最長者；其暴露代表上限。' },
  { g: 'mStrat', q: '區域採樣（定點採樣）主要適用於？', a: '評估發生源、控制設備效果或濃度分布', d: [['評估勞工個人 8 小時暴露', C_, '個人暴露應用個人採樣。'], ['職業病鑑定', C_, '不適用。'], ['判定勞工是否須特殊健檢', C_, '不是區域採樣的主要用途。']], ex: '區域採樣：了解發生源、濃度分布、工程控制改善前後成效；個人採樣：評估暴露。' },
  // 採樣介質與設備
  { g: 'mSamp', q: '一般活性碳管之前段與後段活性碳量分別為？', a: '前段 100 mg、後段 50 mg', d: [['前段 50 mg、後段 100 mg', C_, '前段量較大。'], ['前後段各 100 mg', C_, '後段 50 mg。'], ['前段 400 mg、後段 200 mg', C_, '那是大容量管，一般為 100/50 mg。']], ex: '標準活性碳管：前段 100 mg、後段 50 mg，中間以 PU 泡棉隔開，分開分析判斷破出。' },
  { g: 'mSamp', q: '活性碳管後段分析量超過前段多少比例時，一般判定為破出？', a: '10%', d: [['50%', C_, '是 10%。'], ['1%', C_, '是 10%。'], ['100%', C_, '是 10%。']], ex: '後段 > 前段 10% → 破出，採樣結果可能低估。' },
  { g: 'mSamp', q: '極性有機物（如醇類、胺類）通常較適合以何種固體吸附管採樣？', a: '矽膠管', d: [['活性碳管', C_, '活性碳對非極性物質吸附較好，極性物質脫附效率差。'], ['PVC 濾紙', C_, '濾紙用於粒狀物。'], ['MCE 濾紙', C_, '濾紙用於粒狀物。']], ex: '活性碳管：非極性有機溶劑（甲苯、二甲苯）；矽膠管：極性物質（醇、胺、無機酸）。' },
  { g: 'mSamp', q: '金屬燻煙（如鉛）採樣，常用何種濾紙？', a: '混合纖維素酯（MCE）濾紙，孔徑 0.8 μm', d: [['PVC 濾紙，孔徑 5 μm', C_, 'PVC 用於粉塵重量分析。'], ['玻璃纖維濾紙', C_, '不是金屬採樣的常用介質。'], ['活性碳管', C_, '活性碳管採氣狀有機物。']], ex: 'MCE 濾紙易於酸消化，適合金屬（AAS/ICP 分析）及石綿（PCM 計數）。' },
  { g: 'mSamp', q: '粉塵重量分析採樣常使用 PVC 濾紙，主要原因是？', a: '吸濕性低，重量較穩定', d: [['價格最便宜', C_, '主因是低吸濕。'], ['可溶於酸', C_, '易酸消化的是 MCE。'], ['孔徑最小', C_, 'PVC 常用 5 μm，不是最小。']], ex: 'PVC 濾紙吸濕性低，稱重誤差小，適合重量分析與游離二氧化矽分析。' },
  { g: 'mSamp', q: '採集可呼吸性粉塵時，常用之粒徑分選器為？', a: '10 mm 尼龍旋風分離器', d: [['衝擊瓶', C_, '衝擊瓶用吸收液採氣體。'], ['活性碳管', C_, '用於有機蒸氣。'], ['檢知管', C_, '檢知管是直讀式。']], ex: '旋風分離器利用離心力去除大顆粒，讓可呼吸性粉塵到達濾紙；流率需依規格設定（10 mm 尼龍旋風常用 1.7 L/min）。' },

let tGender = (() => { try { return localStorage.getItem('wem_teacher') || 'f'; } catch (e) { return 'f'; } })();
let IMG = tGender === 'm' ? IMG_M : IMG_F;
// ================= UI =================
const KEY = 'wem_tutor_v1';
const SPONSOR = 'https://portaly.cc/o4444/support';
let S = load();
function blank() { return { units: {}, gens: {}, errs: {}, variant: { n: 0, c: 0 }, total: { n: 0, c: 0 }, drill: { n: 0, c: 0 } }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.units) { s.drill = s.drill || { n: 0, c: 0 }; return s; } } catch (e) { } return blank(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function rec(q, ok, type, flags) {
  flags = flags || {};
  const u = S.units[q.unit] = S.units[q.unit] || { n: 0, c: 0 }; u.n++; if (ok) u.c++;
  const g = S.gens[q.gen] = S.gens[q.gen] || { n: 0, c: 0, w: 0, st: 0, t: q.title, et: {} };
  g.n++; g.t = q.isCon ? UNITS[q.unit].name : q.title; g.et = g.et || {};
  if (ok) { g.c++; g.st = (g.st || 0) + 1; } else { g.w = (g.w || 0) + 1; g.st = 0; if (type) g.et[type] = (g.et[type] || 0) + 1; }
  S.total.n++; if (ok) S.total.c++;
  if (!ok && type) S.errs[type] = (S.errs[type] || 0) + 1;
  if (flags.variant) { S.variant.n++; if (ok) S.variant.c++; }
  if (flags.drill) { S.drill.n++; if (ok) S.drill.c++; }

function mockAns(i) {
  const q = mock.list[mock.i]; if (q.chosen != null) return; q.chosen = i; rec(q, q.opts[i].correct, q.opts[i].type);
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (j === i) b.style.borderColor = 'var(--ink)'; });
  setTimeout(() => { mock.i++; mock.i < 10 ? mockQ() : mockEnd(); }, 250);

function mockEnd() {
  const l = mock.list, sc = l.filter(q => q.opts[q.chosen].correct).length; const et = {};
  const wrongGens = [...new Set(l.filter(q => !q.opts[q.chosen].correct).map(q => q.gen))];
  l.forEach(q => { const o = q.opts[q.chosen]; if (!o.correct) et[o.type] = (et[o.type] || 0) + 1; });

  h += `<div class="stat"><div><b>${sc}/10</b><small>答對題數</small></div>${Object.entries(et).map(([k, v]) => `<div><b>${v}</b><small>${k}</small></div>`).join('')}</div>`;

  h += `<div class="panel">`;
  l.forEach((q, n) => { const o = q.opts[q.chosen]; h += `<details class="rv"><summary>${o.correct ? '✔' : '✘'} 第 ${n + 1} 題｜${q.title}${o.correct ? '' : `<span class="bd" style="margin-left:6px;background:var(--ngbg);color:var(--ng)">${o.type}</span>`}</summary><div style="margin-top:10px">${qHead(q)}${feedback(q, q.chosen)}<button class="btn yel" onclick="startGen('${q.gen}')">▶ 練這個考點的變形題</button></div></details>`; });

  $('#app').innerHTML = h; mock = null; window.scrollTo(0, 0);
  if (wrongGens.length) say('desk', `${sc * 10} 分！錯最多的是<b>${UNITS[wuS[0][0]].name}</b>。我幫你把錯的 ${wrongGens.length} 個考點排成特訓，要現在練嗎？`, [['🎯 開始特訓', `startDrill(${JSON.stringify(wrongGens).replace(/"/g, '&quot;')})`]]);
  else say('clap', '滿分！太厲害了 🎉 換一組題目再考一次確認穩定度？', [['📝 再考一次', 'startMock()']]);
}

// ---------- 考試用計算機（v6，計算題下方） ----------
function cxAway() { const t = document.getElementById('tutor'); if (t) { t.classList.add('min', 'cxon'); clearTimeout(say._t); } }
let CX = { ans: 0, deg: true, hist: '' };
const CX_TOUCH = (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
function cxEval(src) {
  const s = src.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-').replace(/√/g, 'sqrt').replace(/π/g, 'pi').replace(/\s+/g, '');
  const toks = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    const m = /^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/.exec(s.slice(i));
    if (m) { toks.push({ t: 'n', v: parseFloat(m[0].replace('E', 'e')) }); i += m[0].length; continue; }
    const w = /^(sqrt|sin|cos|tan|log|ln|pi|Ans)/.exec(s.slice(i));
    if (w) { const n = w[0]; if (n === 'pi') toks.push({ t: 'n', v: Math.PI }); else if (n === 'Ans') toks.push({ t: 'n', v: CX.ans }); else toks.push({ t: 'f', v: n }); i += n.length; continue; }
    if ('+-*/^()'.includes(c)) { toks.push({ t: c }); i++; continue; }
    throw new Error('bad');
  }
  // 隱含乘法：2π、2(3)、)(、3sin(
  const T = [];
  toks.forEach((k, j) => { const p = T[T.length - 1]; if (p && (p.t === 'n' || p.t === ')') && (k.t === 'n' || k.t === '(' || k.t === 'f')) T.push({ t: '*' }); T.push(k); });
  let depth = 0; T.forEach(k => { if (k.t === '(') depth++; if (k.t === ')') depth--; }); while (depth-- > 0) T.push({ t: ')' });
  let p = 0; const peek = () => T[p], eat = t => { if (!T[p] || T[p].t !== t) throw new Error('bad'); p++; };
  const rad = x => CX.deg ? x * Math.PI / 180 : x;
  const F = { sqrt: Math.sqrt, sin: x => Math.sin(rad(x)), cos: x => Math.cos(rad(x)), tan: x => Math.tan(rad(x)), log: Math.log10, ln: Math.log };
  function expr() { let v = term(); while (peek() && (peek().t === '+' || peek().t === '-')) { const o = T[p++].t; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function term() { let v = unary(); while (peek() && (peek().t === '*' || peek().t === '/')) { const o = T[p++].t; const r = unary(); v = o === '*' ? v * r : v / r; } return v; }
  function unary() { if (peek() && peek().t === '-') { p++; return -unary(); } if (peek() && peek().t === '+') { p++; return unary(); } return power(); }
  function power() { const b = primary(); if (peek() && peek().t === '^') { p++; return Math.pow(b, unary()); } return b; }
  function primary() { const k = peek(); if (!k) throw new Error('bad'); if (k.t === 'n') { p++; return k.v; } if (k.t === 'f') { p++; eat('('); const v = expr(); eat(')'); return F[k.v](v); } if (k.t === '(') { p++; const v = expr(); eat(')'); return v; } throw new Error('bad'); }
  const v = expr(); if (p !== T.length) throw new Error('bad'); return v;
}
function cxFmt(v) { if (!isFinite(v)) return '錯誤'; if (v === 0) return '0'; const a = Math.abs(v); if (a >= 1e10 || a < 1e-6) return v.toExponential(6).replace('e', ' × 10^'); return String(parseFloat(v.toPrecision(10))); }
function calcBox() {

  const lab = { 'sin(': 'sin', 'cos(': 'cos', 'tan(': 'tan', 'log(': 'log', 'ln(': 'ln', '√(': '√', '^': 'xʸ', 'E': '×10ⁿ' };
  return `<details class="cxbox" open><summary>🧮 考試用計算機 <small>（${CX.deg ? 'DEG 度' : 'RAD 弧度'}）</small></summary>
  <div class="cxwrap"><div class="cxhist" id="cxh">${CX.hist || '&nbsp;'}</div>
  <input id="cx" class="cxin" type="text" autocomplete="off" spellcheck="false" ${CX_TOUCH ? 'inputmode="none" readonly' : ''} placeholder="例：120*(21-6)/(21-12) 或 300*64/22.4" onfocus="cxAway()" onkeydown="if(event.key==='Enter'){event.preventDefault();cxKey('=')}">

  <div class="cxfoot"><button type="button" class="cxk" style="width:auto;padding:4px 10px" onclick="CX.deg=!CX.deg;this.closest('details').querySelector('summary small').textContent='（'+(CX.deg?'DEG 度':'RAD 弧度')+'）';this.textContent=CX.deg?'切換成 RAD':'切換成 DEG'">${CX.deg ? '切換成 RAD' : '切換成 DEG'}</button><small>${CX_TOUCH ? '用上方按鍵輸入（不會跳出手機鍵盤）' : '可直接用鍵盤輸入，Enter 計算'}；log＝常用對數、ln＝自然對數</small></div></div></details>`;

function cxKey(k) {

  if (k === '⌫') { el.value = el.value.slice(0, -1); return; }
  if (k === '=') {
    if (!el.value.trim()) return;
    try { const v = cxEval(el.value); CX.ans = v; CX.hist = el.value + ' ='; document.getElementById('cxh').textContent = CX.hist; document.getElementById('cxo').textContent = '= ' + cxFmt(v); el.value = ''; el.placeholder = 'Ans = ' + cxFmt(v); }

    : `<label style="display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)">${lab}${u ? `（${u}）` : ''}<input id="${id}" type="number" step="any" inputmode="decimal" value="${d}" oninput="calcRun()" style="font:inherit;padding:8px;border:2px solid var(--line);border-radius:8px"></label>`).join('');
  return `<div class="panel" id="tools"><h2>🧮 計算工具</h2><p style="margin:0 0 10px;color:var(--mute);font-size:14px">輸入現場或題目的數字，馬上算出結果。結果僅供學習與初步評估，正式判定請以法規及專業評估為準。</p>
  <label style="display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2);margin-bottom:12px">選擇工具<select onchange="curTool=this.value;$('#tools').outerHTML=toolsHtml();calcRun()" style="font:inherit;font-weight:700;padding:10px;border:2px solid var(--ink);border-radius:10px;background:#fff">${Object.entries(TOOLS).map(([k, v]) => `<option value="${k}"${k === curTool ? ' selected' : ''}>${v.name}</option>`).join('')}</select></label>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">${fields}</div>
  <div id="calcOut" class="card30" style="margin-top:12px;line-height:1.8"></div>
  <h2 style="margin-top:20px">📎 官方資料</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px">${LINKS.map(l => `<a href="${l[1]}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:var(--ink);background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:10px 12px"><b>${l[0]}</b><br><small style="color:var(--mute)">${l[2]}</small></a>`).join('')}</div></div>`;
}
function calcRun() { const o = document.getElementById('calcOut'); if (!o) return; try { o.innerHTML = TOOLS[curTool].run(); } catch (e) { o.innerHTML = '請確認輸入的數字。'; } }
function toolsView() { mock = null; drill = null; setNav('tools'); $('#app').innerHTML = `<h1>計算工具</h1><p class="sub">練習題算完想驗證，或現場想快速估算時量平均、活性碳管濃度、噪音劑量、WBGT，都可以用這裡。</p>` + toolsHtml() + sponsor() + foot(); calcRun(); window.scrollTo(0, 0); say('present', '選一個工具、輸入數字就會即時算出來。下面有技能檢定中心、職安署和全國法規資料庫的連結，法規數值以現行條文為準。'); }

// ---------- 學習紀錄 ----------
let confirmReset = false;
function records() {
  setNav('rec'); const t = S.total, v = S.variant, d = S.drill;
  let h = `<h1>學習紀錄</h1><p class="sub">紀錄只存在這台裝置的瀏覽器裡，換手機或清除瀏覽資料就會歸零。</p>
  <div class="stat"><div><b>${t.n}</b><small>總作答題數</small></div><div><b>${pct(t) ?? '—'}${t.n ? '%' : ''}</b><small>整體正確率</small></div><div><b>${pct(v) ?? '—'}${v.n ? '%' : ''}</b><small>變形題正確率（${v.n} 題）</small></div><div><b>${pct(d) ?? '—'}${d.n ? '%' : ''}</b><small>特訓正確率（${d.n} 題）</small></div></div>`;
  h += `<div class="panel"><h2>各單元掌握度</h2>${Object.entries(UNITS).map(([k, u]) => { const p = pct(S.units[k]); return `<div class="lrow"><span>${u.icon} ${u.name}</span><div class="bar"><i style="width:${p || 0}%;background:${p === null ? '#ccc' : p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--hi)' : 'var(--ng)'}"></i></div><span>${p === null ? '未練習' : p + '%'}</span></div>`; }).join('')}</div>`;
  const es = Object.entries(S.errs).sort((a, b) => b[1] - a[1]);
  h += `<div class="panel"><h2>常犯錯誤類型</h2>${es.length ? es.map(([k, n]) => `<div class="lrow" style="grid-template-columns:130px 1fr 56px 74px"><span>${k}</span><div class="bar"><i style="width:${n / es[0][1] * 100}%;background:var(--ng)"></i></div><span>${n} 次</span><button class="btn ghost" style="padding:3px 8px;font-size:13px" onclick="startDrillType('${k}')">特訓</button></div>`).join('') : '<p>還沒有錯誤紀錄。</p>'}</div>`;
  const gs = Object.entries(S.gens).filter(([k]) => G[k]).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n);
  if (gs.length) h += `<div class="panel"><h2>各考點明細</h2>${gs.map(([k, g]) => `<div class="lrow"><span style="font-size:13px">${(g.st || 0) >= 2 ? '✔ ' : g.w ? '⏳ ' : ''}${g.t}</span><div class="bar"><i style="width:${g.c / g.n * 100}%"></i></div><span>${g.c}/${g.n}</span></div>`).join('')}<p style="font-size:13px;color:var(--mute)">✔ 連續答對 2 次（精熟）　⏳ 有錯誤紀錄、尚未精熟</p><div class="row">${weakGens().length ? `<button class="btn yel" onclick="startDrill()">🎯 錯題特訓（${weakGens().length} 個考點）</button>` : ''}</div></div>`;
  h += `<div class="panel"><button class="btn ghost" onclick="confirmReset=true;records()">清除所有紀錄</button>${confirmReset ? `<div class="confirm">確定要清除嗎？清除後無法復原。<div class="row"><button class="btn" style="border-color:var(--ng);color:var(--ng)" onclick="S=blank();save();confirmReset=false;records()">確定清除</button><button class="btn ghost" onclick="confirmReset=false;records()">取消</button></div></div>` : ''}</div>` + sponsor() + foot();
  $('#app').innerHTML = h;
  const te = topErr();
  say('present', t.n ? `你已經練了 <b>${t.n}</b> 題，正確率 ${pct(t)}%。${te ? `最該加強的是「<b>${te[0]}</b>」。` : ''}` : '還沒有紀錄喔，先去練幾題吧！', te ? [['🎯 針對特訓', `startDrillType('${te[0]}')`]] : []);
}
function foot() { return `<div class="foot">題目由程式依公式隨機產生並依技能檢定範圍改寫，作為練習用途，並非技能檢定中心官方學科題庫；正式題庫請至<a href="https://www.wdasec.gov.tw/" target="_blank" rel="noopener">技能檢定中心</a>查詢。勞工作業環境監測實施辦法已於 115 年 6 月修正（部分條文 116 年 1 月 1 日施行），法規數值請以<a href="https://law.moj.gov.tw/" target="_blank" rel="noopener">全國法規資料庫</a>現行條文為準。快捷鍵：作答時可按 1–4 或 A–D。　<a href="${SPONSOR}" target="_blank" rel="noopener noreferrer sponsored">☕ 贊助作者</a></div>`; }

document.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input,select,textarea')) return;
  const m = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()]; if (m === undefined || !cur) return;
  if (mock && cur.chosen == null) mockAns(m); else if (!mock && document.querySelector('.opt:not(:disabled)')) answer(m);
});
home();

</script>
</body>
</html>
